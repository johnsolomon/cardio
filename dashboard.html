<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardiac PET Reporting Assistant</title>
<style>
  html,body{margin:0;padding:0;background:#e9ebee;max-width:100%;overflow-x:hidden;}
  #root{min-height:100vh;}
  *{box-sizing:border-box;}
  /* iOS: keep the notch area the same colour as the header */
  @supports(padding:max(0px)){
    body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);}
  }

  /* ---------- desktop: worksheet left, live report pinned right ---------- */
  .ps-main{
    display:grid;
    grid-template-columns:minmax(0,1fr) 430px;
    gap:10px;padding:10px;align-items:start;
  }
  .ps-report{position:sticky;top:58px;}
  .ps-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .ps-maps{display:flex;gap:6px;}
  .ps-perf{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;}

  /* ---------- phones and narrow windows ----------
     The interface is drawn at desktop density: 8-11px labels and chips with
     2.5px of vertical padding. That is legible with a mouse and a 24-inch
     screen, and neither legible nor reliably tappable with a thumb. Rather
     than patching individual elements, the whole control layer is scaled up
     here so proportions stay intact. */
  @media (max-width:820px){
    .ps-main{grid-template-columns:minmax(0,1fr);gap:8px;padding:8px;}
    .ps-report{position:static;}
    .ps-pair{grid-template-columns:minmax(0,1fr);}
    .ps-perf{grid-template-columns:minmax(0,1fr);gap:8px;}

    /* Two 205px bullseyes overflow a 393px phone. Stacking them rather than
       shrinking keeps each segment large enough to hit accurately — at half
       width the narrowest apical slice falls to about 24px, well under the
       44px touch minimum, and mis-taps on the polar map are the most costly
       error in the whole interface. */
    .ps-maps{flex-direction:column;gap:10px;align-items:center;}
    .ps-maps > div{width:100%;max-width:320px;}
    .ps-maps svg{max-width:100% !important;width:100% !important;}

    /* Buttons and toggles: 44px is the Apple HIG minimum for a touch target.
       Font is raised so the label is readable at arm's length. */
    button{
      min-height:44px;
      font-size:14px !important;
      padding:8px 12px !important;
      margin-right:6px !important;margin-bottom:6px !important;
      border-radius:6px !important;
    }
    /* header buttons stay compact so the bar does not eat the screen */
    .ps-head button{min-height:38px;font-size:13px !important;padding:7px 12px !important;}

    /* Inputs: 16px is the threshold below which iOS Safari zooms on focus,
       which leaves the page scrolled sideways with no way back. */
    input,select,textarea{
      font-size:16px !important;
      min-height:40px;
      padding:6px 4px !important;
    }
    .ps-in{max-width:100%;}
    .ps-sel{max-width:100% !important;}
    input[type=date]{max-width:100%;}

    /* Field labels are 8.5px by default — raise them to a readable size and
       let each label sit on its own line so rows do not become a jumble. */
    .ps-main span{font-size:12px !important;letter-spacing:.2px !important;}
    .ps-main b{font-size:13px !important;}

    /* Cards get more breathing room and a bigger title. */
    section{margin-bottom:12px !important;border-radius:8px !important;}
    section > header{padding:10px 12px !important;}
    section > header span{font-size:13px !important;}
    section > div{padding:10px 12px 12px !important;}

    /* Rows wrap generously rather than cramming. */
    .ps-main label,.ps-main > div > section div{line-height:1.6;}

    /* The live report is the output; give it a readable size and let it grow. */
    pre{font-size:13px !important;line-height:1.55 !important;max-height:none !important;padding:12px !important;}
  }

  /* ---------- very narrow phones ---------- */
  @media (max-width:400px){
    .ps-main{padding:6px;}
    button{font-size:13px !important;padding:8px 10px !important;}
    pre{font-size:12px !important;}
  }

  /* ---------- touch devices of any width ----------
     A tablet is wide enough for the two-column layout but still has no
     hover, so the pointer query catches it where a width query would not. */
  @media (pointer:coarse){
    button{min-height:40px;}
    input,select,textarea{min-height:38px;font-size:16px !important;}
    /* hover dimming on the polar maps is meaningless without a pointer */
    .ps-maps > div{opacity:1 !important;}
  }

  @media print{
    body{background:#fff;}
    button,select{display:none !important;}
    .ps-main{grid-template-columns:1fr;}
    .ps-report{position:static;}
    pre{font-size:10px !important;}
  }
</style>
</head>
<body>
<div id="root"></div>
