.ca-foot{font-size:var(--fs-sm);color:var(--muted);line-height:var(--lh-body);margin:var(--sp-2) 0 0;}
.ca-empty{font-size:var(--fs-base);color:var(--muted);font-style:italic;margin:0;}
@media print{.ca-panel{break-inside:avoid;}}


/* ===== Evidence / therapy gaps / teaching ===== */
.ev-gap,.ev-over{border:1px solid var(--line);border-radius:var(--r-md);margin:var(--sp-2) 0;overflow:hidden;background:var(--panel);}
.ev-gap.p-high{border-left:var(--bw-accent) solid var(--accent2);}
.ev-gap.p-moderate{border-left:var(--bw-accent) solid var(--amber-9-vivid);}
.ev-gap.p-low{border-left:var(--bw-accent) solid var(--slate-10-vivid);}
.ev-gap.deprescribe{border-left:var(--bw-accent) solid var(--blue-11);}
.ev-over{border-left:var(--bw-accent) solid var(--blue-11);}
.ev-gap-h{display:flex;align-items:baseline;gap:var(--sp-2);flex-wrap:wrap;padding:var(--sp-2) var(--sp-3);
  background:var(--slate-2);border-bottom:1px solid var(--slate-4);font-size:var(--fs-md);}
.ev-gap-b{padding:var(--sp-2) var(--sp-3) var(--sp-3);}
.ev-nnt{display:inline-flex;align-items:baseline;gap:var(--sp-1);background:var(--okBg);color:var(--ok);
  border-radius:var(--r-md);padding:var(--sp-h) var(--sp-2);font-size:var(--fs-sm);}
.ev-nnt b{font-size:var(--fs-base);font-weight:700;}
.ev-nnt i{font-style:normal;opacity:.8;}
.ev-nnt.none{background:var(--slate-3-vivid);color:var(--muted);}
.ev-str{font-size:var(--fs-micro);font-weight:700;text-transform:uppercase;letter-spacing:var(--ls-wide);
  padding:var(--sp-h) 6px;border-radius:var(--r-md);}
.ev-str.s-strong{background:var(--okBg);color:var(--ok);}
.ev-str.s-moderate{background:var(--warnBg);color:var(--warn);}
.ev-str.s-weak{background:var(--errBg);color:var(--err);}
.ev-pop{font-size:var(--fs-sm);color:var(--muted);margin-top:var(--sp-1);line-height:var(--lh-body);}
.ev-src{font-size:var(--fs-sm);color:var(--muted);margin-top:var(--sp-1);font-style:italic;}
.ev-caveat{font-size:var(--fs-base);line-height:var(--lh-body);color:var(--amber-12);background:var(--warnBg);
  border-radius:var(--r-sm);padding:var(--sp-2) var(--sp-2);margin-top:var(--sp-2);}
.ev-teach{margin-top:var(--sp-2);border-left:var(--bw-accent) solid var(--accent);background:var(--slate-3);
  border-radius:0 var(--r-sm) var(--r-sm) 0;padding:var(--sp-2) var(--sp-3);}
.ev-teach-l{font-size:var(--fs-micro);font-weight:700;text-transform:uppercase;letter-spacing:var(--ls-caps);color:var(--accent);}
.ev-teach p{margin:var(--sp-1) 0 0;font-size:var(--fs-base);line-height:var(--lh-body);color:var(--slate-14);}
.ev-teachcard{border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);margin:var(--sp-2) 0;background:var(--slate-1);}
.ev-teachcard p{margin:var(--sp-1) 0 0;font-size:var(--fs-base);line-height:var(--lh-body);color:var(--slate-14);}


/* ===== Research Program ===== */
.rs-hyp{border:1px solid var(--line);border-radius:var(--r-md);margin:var(--sp-2) 0;overflow:hidden;background:var(--panel);}
.rs-hyp.contributes{border-left:var(--bw-accent) solid var(--green-10-vivid);}
.rs-hyp.blocked{border-left:var(--bw-accent) solid var(--amber-9-vivid);}
.rs-hyp.registry{border-left:var(--bw-accent) solid var(--slate-10-vivid);}
.rs-hyp-h{display:flex;align-items:baseline;gap:var(--sp-2);flex-wrap:wrap;padding:var(--sp-2) var(--sp-3);
  background:var(--slate-2);border-bottom:1px solid var(--slate-4);font-size:var(--fs-md);}
.rs-state{font-size:var(--fs-micro);font-weight:700;text-transform:uppercase;letter-spacing:var(--ls-caps);
  padding:var(--sp-h) 6px;border-radius:var(--r-md);}
.rs-state.s-contributes{background:var(--okBg);color:var(--ok);}
.rs-state.s-blocked{background:var(--warnBg);color:var(--warn);}
.rs-state.s-registry{background:var(--chip);color:var(--muted);}
.rs-body{padding:var(--sp-2) var(--sp-3) var(--sp-3);}
.rs-q{margin:0 0 var(--sp-2);font-size:var(--fs-md);line-height:var(--lh-body);color:var(--slate-14);font-weight:600;}
.rs-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:var(--sp-2);margin-bottom:var(--sp-2);}
.rs-meta>div{border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--sp-1) var(--sp-2);background:var(--slate-1);font-size:var(--fs-base);}
.rs-meta .ca-lbl{display:block;margin-bottom:0;}
.rs-why{border-left:var(--bw-accent) solid var(--accent);background:var(--slate-3);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:var(--sp-2) var(--sp-3);margin:var(--sp-2) 0;}
.rs-why p{margin:var(--sp-1) 0 0;font-size:var(--fs-base);line-height:var(--lh-body);color:var(--slate-14);}
.rs-pit ul{margin:var(--sp-1) 0 0;padding-left:var(--sp-4);font-size:var(--fs-base);line-height:var(--lh-body);color:var(--amber-12);}
.rs-miss{margin-top:var(--sp-2);font-size:var(--fs-base);background:var(--warnBg);color:var(--warn);
  border-radius:var(--r-sm);padding:var(--sp-2) var(--sp-2);}
.rs-gap{border:1px solid var(--line);border-radius:var(--r-md);margin:var(--sp-2) 0;overflow:hidden;background:var(--panel);
  border-left:var(--bw-accent) solid var(--accent);}
.rs-rank{width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--panel);
  font-size:var(--fs-sm);font-weight:700;display:inline-flex;align-items:center;justify-content:center;}
.rs-score{font-size:var(--fs-tiny);font-weight:700;background:var(--chip);color:var(--muted);
  padding:var(--sp-h) 6px;border-radius:var(--r-md);}
.rs-cost{font-size:var(--fs-micro);font-weight:700;text-transform:uppercase;letter-spacing:var(--ls-wide);
  padding:var(--sp-h) 6px;border-radius:var(--r-md);}
.rs-cost.c-low{background:var(--okBg);color:var(--ok);}
.rs-cost.c-moderate{background:var(--warnBg);color:var(--warn);}
.rs-cost.c-high{background:var(--errBg);color:var(--err);}
.rs-gov{margin:0;padding-left:var(--sp-4);font-size:var(--fs-base);line-height:var(--lh-body);color:var(--slate-14);}
.rs-gov li{margin-bottom:var(--sp-2);}


/* ===== Predictive / therapy-gating ===== */
.rs-hyp.predictive{border-left:var(--bw-accent) solid var(--violet-12);}
.rs-state.s-predictive{background:var(--violet-4);color:var(--violet-13);}
.pr-intro p{margin:0 0 var(--sp-2);font-size:var(--fs-base);line-height:var(--lh-body);color:var(--slate-14);}
.pr-calc{border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);margin:var(--sp-2) 0;background:var(--violet-2);}
.pr-calc-h{display:flex;align-items:baseline;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-2);font-size:var(--fs-md);}
.pr-note{font-size:var(--fs-base);line-height:var(--lh-body);color:var(--slate-14);margin:var(--sp-2) 0 0;}
.pr-assume{margin-top:var(--sp-2);font-size:var(--fs-sm);color:var(--muted);
  border-top:1px dashed var(--line);padding-top:var(--sp-2);line-height:var(--lh-body);}
.pr-assume .ca-lbl{display:block;margin-bottom:var(--sp-1);}


/* ===== Presentation: purpose headers, glance strip, folding, modality ===== */
.ca-purpose{margin:0 0 var(--sp-3);}
.ca-purpose h2{margin:0 0 var(--sp-1);font-size:var(--fs-xl);font-weight:700;color:var(--head);letter-spacing:var(--ls-tight);}
.ca-purpose p{margin:0 0 var(--sp-1);font-size:var(--fs-md);line-height:var(--lh-body);color:var(--slate-13);max-width:74ch;}
.ca-purpose-n{font-size:var(--fs-sm)!important;color:var(--muted)!important;}
.ca-glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(188px,1fr));gap:var(--sp-2);margin-bottom:var(--sp-3);}
.gl-cell{border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);background:var(--panel);border-top:var(--bw-accent) solid var(--line);}
.gl-cell.t-ok{border-top-color:var(--green-10-vivid);} .gl-cell.t-warn{border-top-color:var(--amber-9-vivid);}
.gl-cell.t-bad{border-top-color:var(--accent2);} .gl-cell.t-neutral{border-top-color:var(--slate-7-vivid);}
.gl-k{font-size:var(--fs-tiny);text-transform:uppercase;letter-spacing:var(--ls-caps);color:var(--muted);font-weight:700;}
.gl-v{font-size:var(--fs-md);font-weight:700;color:var(--ink);margin:var(--sp-1) 0 0;line-height:var(--lh-tight);}
.gl-s{font-size:var(--fs-sm);color:var(--muted);}
.ca-panel>header{cursor:pointer;user-select:none;}
.ca-caret{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;
  border-radius:var(--r-xs);background:var(--chip);color:var(--muted);font-size:var(--fs-md);font-weight:700;line-height:1;}
.ca-panel.folded>header{background:var(--slate-2);}
.ca-panel.folded>header h3{color:var(--muted);font-weight:600;}
.tab-hint{margin-left:auto;font-size:var(--fs-sm);color:var(--headtx);opacity:.72;align-self:center;
  padding-right:var(--sp-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
@media(max-width:860px){.tab-hint{display:none;}}
.md-lead{font-size:var(--fs-base);line-height:var(--lh-body);color:var(--slate-14);margin:0 0 var(--sp-2);}
.md-table td.md-c{text-align:center;font-size:var(--fs-md);}
.md-table tr.md-pet-only td{background:var(--slate-3-vivid);}
.md-table tr.md-echo-only td{background:var(--vermilion-2);}
.md-table tr.md-pet td{background:var(--slate-2);}
.md-claim{border:1px solid var(--line);border-radius:var(--r-md);margin-top:var(--sp-3);overflow:hidden;background:var(--slate-1);}
.md-claim-h{display:flex;align-items:baseline;gap:var(--sp-2);flex-wrap:wrap;padding:var(--sp-2) var(--sp-3);
  background:var(--slate-3);border-bottom:1px solid var(--slate-4);font-size:var(--fs-md);}
.md-for,.md-against,.md-verdict{padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--slate-3-vivid);}
.md-for{border-left:var(--bw-accent) solid var(--green-10-vivid);} .md-against{border-left:var(--bw-accent) solid var(--accent2);}
.md-verdict{border-left:var(--bw-accent) solid var(--accent);background:var(--slate-2);}
.md-for p,.md-against p,.md-verdict p{margin:var(--sp-1) 0 0;font-size:var(--fs-base);line-height:var(--lh-body);color:var(--slate-14);}


/* ===== Fast segment scoring ===== */
.score-bar{display:flex;flex-wrap:wrap;gap:var(--sp-4);align-items:center;width:100%;box-sizing:border-box;
  background:var(--slate-3);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);margin-bottom:var(--sp-2);}
.sb-grp{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;}
.sb-lbl{font-size:var(--fs-micro);font-weight:700;text-transform:uppercase;letter-spacing:var(--ls-caps);color:var(--muted);}
.sb-hint{font-size:var(--fs-sm);color:var(--muted);}
.seg-modes{display:flex;gap:var(--sp-1);}
.brushes{display:flex;gap:var(--sp-1);}
.brush{width:28px;height:28px;border:var(--bw-rule) solid transparent;border-radius:var(--r-sm);cursor:pointer;
  font-size:var(--fs-base);font-weight:700;line-height:1;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);}
.brush.on{border-color:var(--head);box-shadow:0 0 0 2px rgba(0,0,0,.18),inset 0 0 0 1px rgba(0,0,0,.12);}
.map-row{display:flex;gap:var(--sp-3);flex-wrap:wrap;align-items:flex-start;justify-content:center;width:100%;}
.pmseg{cursor:pointer;}
.score-tally{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-2);margin-top:var(--sp-2);width:100%;}
@media(max-width:560px){.score-tally{grid-template-columns:repeat(2,1fr);}}
.tl-cell{border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--sp-1) var(--sp-2);background:var(--slate-1);text-align:center;}
.tl-k{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:var(--ls-caps);color:var(--muted);font-weight:700;}
.tl-v{font-size:var(--fs-xl);font-weight:700;color:var(--ink);line-height:var(--lh-tight);}
.tl-t{font-size:var(--fs-tiny);color:var(--muted);}


/* ===== Bayesian probability panel ===== */
.bx-chain{margin-bottom:var(--sp-3);}
.bx-step{display:grid;grid-template-columns:188px 76px 1fr;gap:var(--sp-2);align-items:baseline;
  border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--sp-2) var(--sp-3);background:var(--slate-1);}
@media(max-width:640px){.bx-step{grid-template-columns:1fr;gap:var(--sp-1);}}
.bx-op{font-size:var(--fs-base);font-weight:700;color:var(--head);}
.bx-val{font-size:var(--fs-lg);font-weight:700;color:var(--accent);}
.bx-note{font-size:var(--fs-sm);color:var(--muted);line-height:var(--lh-body);}
.bx-arrow{text-align:center;color:var(--muted);font-size:var(--fs-md);line-height:var(--lh-body);}
.bx-head{border-radius:var(--r-md);padding:var(--sp-3) var(--sp-3);margin:var(--sp-3) 0;border:1px solid var(--line);border-left:var(--bw-accent) solid var(--line);}
.bx-head.t-ok{border-left-color:var(--green-10-vivid);background:var(--green-2-soft);}
.bx-head.t-warn{border-left-color:var(--amber-9-vivid);background:var(--amber-2);}
.bx-head.t-bad{border-left-color:var(--accent2);background:var(--vermilion-3);}
.bx-h-l{font-size:var(--fs-tiny);text-transform:uppercase;letter-spacing:var(--ls-caps);color:var(--muted);font-weight:700;}
.bx-h-v{font-size:var(--fs-num);font-weight:700;color:var(--ink);line-height:var(--lh-tight);margin:0 0 var(--sp-1);}
.bx-h-s{font-size:var(--fs-base);color:var(--slate-13);line-height:var(--lh-body);}
.bx-barwrap{margin:var(--sp-3) 0 var(--sp-3);}
.bx-bar{position:relative;display:flex;height:12px;border-radius:var(--r-sm);overflow:visible;
  background:var(--slate-4);margin-bottom:calc(5*var(--u));}
.bx-zone{display:block;height:100%;}
.bx-zone.z1{background:var(--slate-5);border-radius:var(--r-sm) 0 0 var(--r-md);}
.bx-zone.z2{background:var(--amber-5-vivid);}
.bx-zone.z3{background:var(--vermilion-6-vivid);border-radius:0 var(--r-md) var(--r-md) 0;}
.bx-mark{position:absolute;top:calc(-1*var(--u));transform:translateX(-50%);font-size:var(--fs-micro);font-weight:700;
  padding:0 var(--sp-1);border-radius:var(--r-md);white-space:nowrap;}
.bx-mark.pre{background:var(--muted);color:var(--panel);}
.bx-mark.post{background:var(--head);color:var(--panel);top:var(--sp-4);}
.bx-scale{display:flex;justify-content:space-between;font-size:var(--fs-tiny);color:var(--muted);}
.bx-src{margin-top:var(--sp-3);border-top:1px dashed var(--line);padding-top:var(--sp-2);}
.bx-src-i{margin-top:var(--sp-2);font-size:var(--fs-base);}
.bx-src-i p{margin:0 0 0;font-size:var(--fs-sm);color:var(--muted);line-height:var(--lh-body);}
/* prelim vs final */
.rd-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:var(--sp-2);margin-top:var(--sp-2);}
.rd-stat{border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--sp-2) var(--sp-2);background:var(--slate-1);}
.rd-stat.changed{border-color:var(--accent2);background:var(--vermilion-3);}
.rd-stat b{display:block;font-size:var(--fs-md);margin-top:0;}


.rd-sep{font-size:var(--fs-micro);font-weight:700;text-transform:uppercase;letter-spacing:var(--ls-caps);
  color:var(--muted);margin:var(--sp-3) 0 var(--sp-1);padding-bottom:var(--sp-1);border-bottom:1px solid var(--line);}


/* ===== Uniform surface rhythm =====
   Every panel-like surface (Comprehensive, Evidence, Research, Bayes, Revasc)
   shares one header treatment, one body padding and one left-accent width, so
   the four tabs read as one application rather than five bolted together. */
.ca-panel,.rs-hyp,.ev-gap,.ev-over,.ca-rec,.md-claim,.pr-calc,.rs-gap,.ev-teachcard,.ca-dx{
  border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);}
.ca-panel>header,.rs-hyp-h,.ev-gap-h,.ca-rec-h,.md-claim-h,.pr-calc-h{
  padding:var(--sp-2) var(--sp-3);background:var(--slate-3);border-bottom:1px solid var(--line);
  font-size:var(--fs-md);}
.ca-body,.rs-body,.ev-gap-b,.ca-rec-b{padding:var(--sp-2) var(--sp-3) var(--sp-3);}
.ca-panel,.rs-hyp,.ev-gap,.ev-over,.ca-rec,.rs-gap,.ev-teachcard,.ca-dx{margin:var(--sp-2) 0;}
/* left accent: one width everywhere */
.ev-gap,.ev-over,.ca-rec,.rs-hyp{border-left-width:var(--bw-accent);border-left-style:solid;}
.bx-head,.ca-hero{border-left-width:var(--bw-accent);border-left-style:solid;}
/* eyebrow labels: one treatment */
.ca-lbl,.gl-k,.ca-k,.sb-lbl,.rd-sep,.ev-teach-l,.bx-h-l,.tl-k{
  font-size:var(--fs-micro);font-weight:700;text-transform:uppercase;
  letter-spacing:var(--ls-caps);color:var(--muted);}
/* body prose: one treatment */
.ca-item p,.ev-teach p,.ev-teachcard p,.rs-why p,.md-for p,.md-against p,.md-verdict p,
.bx-h-s,.pr-note,.ca-note{font-size:var(--fs-base);line-height:var(--lh-body);color:var(--slate-14);}
/* secondary/source prose */
.ca-n,.ev-pop,.ev-src,.bx-note,.ca-foot,.rs-miss,.gl-s,.tl-t,.sb-hint,.bx-src-i p{
  font-size:var(--fs-sm);line-height:var(--lh-body);color:var(--muted);}
/* tables: one treatment */
.ca-table th{font-size:var(--fs-tiny);text-transform:uppercase;letter-spacing:var(--ls-caps);
  color:var(--muted);font-weight:700;background:var(--slate-3);padding:var(--sp-1) var(--sp-2);}
.ca-table td{font-size:var(--fs-base);padding:var(--sp-1) var(--sp-2);}
/* caveats: one treatment wherever they appear */
.ev-caveat,.ca-caveat{font-size:var(--fs-base);line-height:var(--lh-body);
  background:var(--warnBg);color:var(--warn);border-radius:var(--r-sm);
  padding:var(--sp-2) var(--sp-2);margin-top:var(--sp-2);}
/* keep numbers optically aligned wherever they carry meaning */
.gl-v,.tl-v,.bx-h-v,.bx-val,.ca-v,.ca-table td{font-variant-numeric:tabular-nums;}
/* tooltip affordance: anything with a title gets a subtle cue */
[title]:not(button):not(input):not(select):not(textarea){cursor:help;}
button[title],input[title],select[title]{cursor:pointer;}


/* ===== Control system =====
   One height, one padding rhythm, one focus treatment for every interactive
   control, so a button in the Research tab is visually the same object as a
   button in the worksheet. Three families only:
     .btn     action        (ghost default, .on = primary, .sm = compact)
     .chip    toggle        (pill, .on = selected, .sub = secondary/dashed)
     .seg     exclusive set (segmented control, one choice)
   Anything that is none of these should become one of these, not a new idiom. */

.btn,.seg .segbtn,.seg>button{
  height:var(--ctl-h);padding:var(--ctl-pad);font-size:var(--fs-sm);
  font-family:inherit;line-height:1;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;}
.btn{background:var(--chip);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--ink);}
.btn.on{background:var(--accent);color:var(--panel);border-color:var(--accent);}
.btn.sm{height:var(--ctl-h-sm);padding:var(--ctl-pad-sm);font-size:var(--fs-sm);}
.btn:disabled,.btn[disabled]{opacity:.45;cursor:not-allowed;}
/* segmented: style the element, not a class, so every builder gets it */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);
  overflow:hidden;background:var(--panel);height:var(--ctl-h);}
.seg .segbtn,.seg>button{background:var(--panel);border:none;border-right:1px solid var(--line);
  border-radius:0;color:var(--ink);height:100%;}
.seg .segbtn:last-child,.seg>button:last-child{border-right:none;}
.seg .segbtn.on,.seg>button.on{background:var(--accent);color:var(--panel);}
.chip{height:var(--ctl-h);padding:0 10px;line-height:1;}
.chip.sub{height:var(--ctl-h-sm);padding:0 var(--sp-2);}
.brush{height:var(--ctl-h);width:28px;border-radius:var(--r-sm);}
/* one focus ring everywhere */
.btn:focus-visible,.chip:focus-visible,.seg>button:focus-visible,.brush:focus-visible,
input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:var(--bw-rule) solid var(--accent);outline-offset:1px;}
/* inputs share the control height */
input[type=text],input[type=number],input[type=date],select{
  height:var(--ctl-h);font-size:var(--fs-base);font-family:inherit;}


/* ===== Automation surface ===== */
.ready{font-size:var(--fs-micro);font-weight:700;text-transform:uppercase;letter-spacing:var(--ls-caps);
  padding:var(--sp-h) var(--sp-2);border-radius:var(--r-pill);white-space:nowrap;}
.ready.ok{background:var(--green-12);color:var(--green-4-vivid);}
.ready.pending{background:var(--amber-12);color:var(--amber-5-vivid);}
.auto-row{display:flex;gap:var(--sp-2);align-items:flex-start;justify-content:space-between;
  border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--sp-2) var(--sp-2);
  margin-bottom:var(--sp-1);background:var(--slate-1);}
.auto-txt{flex:1;min-width:0;font-size:var(--fs-base);}
.auto-txt p{margin:var(--sp-1) 0 0;font-size:var(--fs-sm);color:var(--muted);line-height:var(--lh-body);}
.auto-sup{margin-top:var(--sp-2);border-left:var(--bw-accent) solid var(--line);padding-left:var(--sp-2);}
.auto-sup ul{margin:var(--sp-1) 0 0;padding-left:var(--sp-4);font-size:var(--fs-sm);color:var(--muted);
  line-height:var(--lh-body);}
.auto-sup li{cursor:help;}
.col{display:flex;flex-direction:column;}


/* ===== Critical communication draft ===== */
.comm-msg{width:100%;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:var(--fs-base);line-height:var(--lh-body);padding:var(--sp-2);
  border:1px solid var(--line);border-radius:var(--r-sm);background:var(--slate-1);
  resize:vertical;min-height:260px;white-space:pre-wrap;}
.comm-msg:focus{outline:var(--bw-rule) solid var(--accent);outline-offset:1px;background:var(--panel);}


/* ===== Compact numeric fields =====
   BP, HR, EF, MBF, calcium and dose take 2-4 characters. Sizing the box to the
   content keeps related values visually grouped instead of strung across the row. */
.w-hr input,.w-bp input,.w-fn input,.w-mm input,.cac-box input{text-align:center;}
.w-fn{flex:0 0 72px;}
.w-mm{flex:0 0 56px;}
.w-hr{flex:0 0 52px;}
.cac-box input{max-width:72px;width:100%;}
.w-ht input,.w-wt input{max-width:76px;}
.fl-cell input{max-width:64px;text-align:center;}
.age-derived{display:inline-flex;align-items:center;justify-content:flex-start;
  min-height:var(--ctl-h);width:100%;padding:0 var(--sp-2);border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--slate-3);color:var(--muted);font-size:var(--fs-base);font-variant-numeric:tabular-nums;
  cursor:help;}


/* ===== Compact numeric boxes =====
   MFR and calcium were already correctly sized; these match them. */
.w-fn input,.w-hr input,.w-bp input,.w-mm input{max-width:64px;text-align:center;}
.w-bp{flex:0 0 116px;}
.w-hr{flex:0 0 60px;}
.w-vol{flex:0 0 72px;}
.w-vol input{max-width:64px;text-align:center;}
.fl-in{max-width:64px;text-align:center;}
.unit-wrap{display:inline-flex;align-items:center;gap:var(--sp-1);}
.unit-wrap input{flex:1 1 auto;min-width:0;}
.unit-suffix{font-size:var(--fs-sm);color:var(--muted);white-space:nowrap;}


/* Data tables sized to their content rather than stretched to the card.
   A four-column numeric table spread across 1000px reads as empty space. */
table.rev{width:auto;min-width:min(100%,520px);}
table.rev td,table.rev th{padding:var(--sp-1) var(--sp-2);}
table.rev td:first-child,table.rev th:first-child{white-space:nowrap;}
.map-legend{margin-top:var(--sp-2);}


/* ===== Narrow viewports =====
   The tab bar was wider than a phone screen, so the whole document scrolled
   sideways. Tabs now scroll on their own axis and the page does not. */
.ps-tabs{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;}
.ps-tabs::-webkit-scrollbar{height:4px;}
.ps-tabs button{flex:0 0 auto;}
html{overflow-x:hidden;} body{overflow-x:clip;}
@media(max-width:560px){
  .ps-head{padding:var(--sp-1) var(--sp-2);gap:var(--sp-1);}
  .ps-head .brand{font-size:var(--fs-md);}
  .ps-tabs{padding:0 var(--sp-2);}
  .ps-tabs button{padding:var(--sp-2) 10px;font-size:var(--fs-sm);}
  /* two short fields share a row instead of one per screen */
  .fld.w-age,.fld.w-sex,.fld.w-hr,.fld.w-mm,.fld.w-vol,.fld.w-fn,.fld.w-echo{flex:0 0 auto;}
  .grid-auto{display:flex;flex-wrap:wrap;gap:var(--sp-2);}
  .fld.w-fname,.fld.w-lname{flex:1 1 46%;min-width:0;}
  .fld.w-mrn,.fld.w-acc,.fld.w-dob,.fld.w-date{flex:1 1 46%;}
  .card > .body{padding:var(--sp-2);}
}


/* ===== Compactness =====
   Fields flow and fill the row rather than each claiming a line. Cards tighten
   so more of the study is visible at once. */
.card > .body{padding:var(--sp-2) var(--sp-3) var(--sp-3);}
.card > header{padding:var(--sp-1) var(--sp-3);}
.grid-auto{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-2);align-items:flex-end;}
.fld{margin:0;min-width:0;}
.fld > label{margin-bottom:0;display:block;line-height:var(--lh-tight);}
.chipgrp{gap:var(--sp-1);row-gap:var(--sp-1);}
.chip{margin:0;}
.w-egfr{flex:0 0 116px;}
.w-dial{flex:0 0 auto;}
.w-ptp{flex:0 0 108px;}
/* text fields grow to fill the remaining row instead of leaving a gap */
.w-dx,.w-ref,.w-comm,.w-res{flex:1 1 200px;}
.fld.w-name,.fld.w-fname,.fld.w-lname{flex:1 1 140px;}
.card{margin-bottom:var(--sp-2);}


/* Any remaining fixed-column grid flows instead of reserving empty cells. */
.ps-tri,.ps-pair{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-2);align-items:flex-end;}
.ps-tri > *,.ps-pair > *{flex:1 1 148px;min-width:0;}
.ps-tri > div:empty,.ps-pair > div:empty{display:none;}
/* free text should share its row rather than claim it */
.fld.w-other,.fld.w-artother{flex:1 1 260px;}




/* ===== Control refinement =====
   Two goals: nothing changes SIZE when it is selected, and the controls read as
   quiet surfaces rather than a wall of heavy pills.

   The size bug: `.segbtn.on{font-weight:600}` made the selected label wider, so
   tapping a segmented control shifted its neighbours and, in one case, wrapped
   the whole control onto a second line. Selection is now carried entirely by
   colour. Where emphasis is still wanted the bold width is RESERVED up front
   with a hidden pseudo-element, so the box is identical in both states. */
.seg .segbtn,.seg>button,.chip,.btn{
  font-weight:400;
  transition:background-color .13s ease, border-color .13s ease, color .13s ease;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  user-select:none;
}

/* reserve the bold width so emphasis never reflows */
.seg .segbtn::after,.chip::after{
  content:attr(data-label);
  display:block;height:0;overflow:hidden;visibility:hidden;
  font-weight:700;pointer-events:none;
}

/* --- segmented control: one quiet track, clear selected cell --- */
.seg{
  background:var(--slate-3-vivid);
  border:1px solid var(--line);
  border-radius:var(--r-sm);
  padding:calc(var(--sp-h) - var(--bw-hair));
  gap:0;
  overflow:hidden;
}
.seg .segbtn,.seg>button{
  background:transparent;border:none;border-radius:calc(var(--r-sm) - 1px);
  color:var(--slate-13-vivid);
}
.seg .segbtn.on,.seg>button.on{
  background:var(--accent);color:var(--panel);
  box-shadow:0 1px 2px rgba(0,0,0,.18);
}

/* --- chips: light by default, filled when selected --- */
.chip{
  background:var(--panel);
  border:1px solid var(--slate-6-vivid);
  color:var(--slate-13-vivid);
  border-radius:var(--r-sm);
}
.chip.on{
  background:var(--chipOn);border-color:var(--chipOn);color:var(--panel);
  box-shadow:0 1px 2px rgba(0,0,0,.18);
}
.chip.sub{background:var(--panel);border-style:dashed;border-color:var(--slate-6-vivid);}
.chip.sub.on{border-style:solid;}
.chip.neg{background:var(--red-3-soft);border-color:var(--red-7-soft);color:var(--red-13);}
.chip.amber{border-color:var(--amber-8-vivid);background:var(--amber-2);box-shadow:none;}
.chip.amber.on{background:var(--warn);border-color:var(--warn);color:var(--panel);}

/* --- buttons --- */
.btn{background:var(--panel);border:1px solid var(--slate-6-vivid);color:var(--slate-13-vivid);}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--panel);}

/* pressed state: colour only, never transform or size */
.chip:active:not(.on),.btn:active:not(.on),.seg .segbtn:active:not(.on){background:var(--slate-4-vivid);}

/* header controls sit on the dark bar and need their own treatment */
.ps-head .btn{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.22);color:var(--slate-3-vivid);}
.ps-head .btn.on{background:var(--accent);border-color:var(--accent);color:var(--panel);}

/* Narrow-width overrides last, so they win over the control system above. */
/* ===== Narrow-width overrides (must come after the control system, whose
   fixed .seg height would otherwise clip its own labels on touch sizes) ===== */
@media(max-width:560px){
  /* A segmented control that WRAPS reads as a broken track — the enclosing
     border no longer describes one row of choices. At phone width it degrades
     to a button group: each cell carries its own border, so wrapping looks
     deliberate and matches the chips beside it. */
  .seg{height:auto;min-height:var(--ctl-h);flex-wrap:wrap;align-items:stretch;
       background:transparent;border:none;padding:0;gap:var(--sp-1);overflow:visible;}
  .seg .segbtn,.seg>button{height:auto;min-height:var(--tap);white-space:nowrap;
       border:1px solid var(--slate-6-vivid);background:var(--panel);border-radius:var(--r-sm);}
  .seg .segbtn.on,.seg>button.on{background:var(--accent);border-color:var(--accent);color:var(--panel);}
  .fld.w-bp,.fld.w-hr{flex:0 1 auto;}
  .fld.w-bp input{max-width:56px;}
  .chipgrp{gap:var(--sp-1);}
  /* nested option groups read better stacked than in a half-width column */
  .w-amino{flex:1 1 100%;}
}


/* ===== Control geometry (authoritative) =====
   Placed last so nothing above can override it.

   Two defects this replaces:
   1. `.seg .segbtn{height:100%}` \u2014 a percentage height against a flex parent
      whose own height resolved to auto collapsed the button to its line box:
      11.5px tall on desktop and iPad. Percentage heights are banned here; every
      control is sized by min-height plus padding.
   2. A `.fld` holding a chip group computed `flex:0 0 auto`, so it grew to
      max-content (830px inside a 317px row) and the chips never wrapped. Fields
      are now shrinkable with min-width:0, which is what lets wrapping happen.

   Touch sizing applies to iPad as well as iPhone \u2014 a 26px target is not usable
   with a finger on either.
   ============================================= */


.grid-auto > .fld,.ps-tri > .fld,.ps-pair > .fld{flex:1 1 auto;min-width:0;}
.chipgrp{display:flex;flex-wrap:wrap;min-width:0;max-width:100%;}
.chip,.btn,.seg{max-width:100%;}

/* every control: sized by min-height, never by percentage */
.btn,.chip,.seg .segbtn,.seg>button,.brush{
  height:auto;
  min-height:var(--ctl-h);
  display:inline-flex;align-items:center;justify-content:center;
  line-height:var(--lh-tight);
  box-sizing:border-box;
}
/* --ctl-h-sm was 22px, below the 26px floor every other control keeps.
   A compact button is still a click target. */
.btn.sm{min-height:var(--ctl-h);height:auto;padding:0 var(--sp-2);}
.seg{
  display:inline-flex;align-items:stretch;
  height:auto;min-height:calc(var(--ctl-h) + var(--sp-1));
}
.seg .segbtn,.seg>button{min-height:var(--ctl-h);}

/* A control must never be shrunk below its own label. Toolbars wrap instead:
   at iPad width the report toolbar was squeezing "Normal study" to 16px of
   content, so the text was clipped even though nothing overflowed. */
.report-tools,.readout-head,.chipgrp,.row,.seg-modes,.score-bar{flex-wrap:wrap;}
.report-tools > *,.readout-head > *,.chipgrp > *,.seg-modes > *{flex:0 0 auto;}
.chip,.btn,.seg{flex-shrink:0;}
.seg .segbtn,.seg>button{flex:0 0 auto;}

/* touch devices: iPhone AND iPad */
/* ===== Button hierarchy (increment 37) =====
   primary — the one action a surface is for; default — outlined; quiet — text
   only, for rows of small tools so they never compete with data-entry chips;
   danger — red text, red tint on hover. Menus keep every option one tap away. */
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);}
.btn.quiet{background:transparent;border-color:var(--line);color:var(--accent);}
.btn.quiet.muted{color:var(--muted);}
.btn.danger{color:var(--err);}
details.menu{position:relative;display:inline-flex;}
details.menu>summary{list-style:none;display:inline-flex;align-items:center;gap:var(--sp-1);cursor:pointer;user-select:none;}
details.menu>summary::-webkit-details-marker{display:none;}
details.menu>summary .caret{font-size:var(--fs-tiny);line-height:1;}
details.menu[open]>summary{background:var(--slate-5-vivid);}
.ps-head details.menu[open]>summary{background:rgba(255,255,255,.22);}
.menu-list{position:absolute;top:calc(100% + var(--sp-1));right:0;z-index:60;text-align:left;
  min-width:calc(60*var(--u));max-width:calc(84*var(--u));padding:var(--sp-1);
  background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:0 8px 24px rgba(0,0,0,.14);}
details.menu.menu-left .menu-list{right:auto;left:0;}
.menu-head{font-size:var(--fs-micro);font-weight:700;text-transform:uppercase;letter-spacing:var(--ls-caps);color:var(--muted);padding:var(--sp-1) var(--sp-2) 0;}
.menu-item{display:flex;flex-direction:column;align-items:flex-start;width:100%;min-height:var(--ctl-h);
  padding:var(--sp-1) var(--sp-2);border:none;border-radius:var(--r-sm);background:transparent;color:var(--ink);
  font:inherit;font-size:var(--fs-base);line-height:var(--lh-tight);text-align:left;cursor:pointer;white-space:nowrap;}
.menu-item .mi-hint{font-size:var(--fs-tiny);color:var(--muted);white-space:normal;}
.menu-item.danger{color:var(--err);}
.menu-sep{border-top:1px solid var(--line);margin:var(--sp-1) 0 calc(var(--sp-1) - var(--bw-hair));}
.split{display:inline-flex;align-items:stretch;}
.split>.btn:first-child{border-top-right-radius:0;border-bottom-right-radius:0;}
.split>details.menu>summary{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:calc(0px - var(--bw-hair));padding:0 var(--sp-2);}
.mapctl{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-1);width:100%;margin-top:var(--sp-1);flex-wrap:wrap;}
.mapctl .mc-wide{flex:1 1 100%;justify-content:flex-start;order:1;}
.score-bar{justify-content:space-between;background:transparent;border:none;padding:0;margin:0 0 var(--sp-2);}
.score-bar .sb-grp{flex:1 1 auto;}
/* menu items inside the dark header are list rows, not header buttons */
.ps-head .menu-list .menu-item{background:transparent;color:var(--ink);border:none;min-height:var(--ctl-h);padding:var(--sp-1) var(--sp-2);}
.ps-head .menu-list .menu-item.danger{color:var(--err);}
.tab-short{display:none;}
@media(max-width:1024px),(pointer:coarse){
  .menu-item,.ps-head .menu-list .menu-item{min-height:var(--tap);}
  details.menu>summary{min-height:var(--tap);}
  .report-tools .split{flex:1 1 100%;} .report-tools .split>.btn:first-child{flex:1 1 auto;}
}
@media(max-width:1024px), (pointer:coarse){
  :root{--head-h:0px; --tabs-h:var(--tap); --card-head-h:var(--tap);}
  .ps-head{position:static;}
  .btn,.chip,.seg .segbtn,.seg>button,
  .ps-head button,.ps-tabs button{min-height:var(--tap);padding-left:var(--sp-3);padding-right:var(--sp-3);}
  .ps-tabs button{min-height:var(--tap);}
  .btn.sm{min-height:var(--tap);}   /* a small button is still a finger target */
  .seg{min-height:calc(var(--tap) + var(--sp-1));}
  .seg .segbtn,.seg>button{min-height:var(--tap);}
  input,select,textarea{min-height:var(--tap);}
  .brush{min-height:var(--tap);width:var(--tap);}
}


/* ===== Collapsible optional cards ===== */
.card-head-toggle{cursor:pointer;display:flex;align-items:center;gap:var(--sp-2);
  user-select:none;-webkit-tap-highlight-color:transparent;}
.card-caret{display:inline-flex;align-items:center;justify-content:center;
  width:16px;height:16px;flex:0 0 16px;border-radius:var(--r-xs);
  background:var(--slate-4-vivid);color:var(--muted);font-size:var(--fs-md);line-height:1;font-weight:700;}
.card-caret.open{background:var(--accent);color:var(--panel);}
/* One line with an ellipsis meant the text to the right of a card title was
   always cut off — and it is the part that says what is inside a collapsed
   card. It wraps to two lines instead (increment 68). */
.card-summary{margin-left:auto;font-size:var(--fs-sm);color:var(--muted);
  text-align:right;max-width:60%;line-height:var(--lh-tight);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-summary.has{color:var(--accent);font-weight:600;}
.card.collapsed > header{border-bottom:none;}
@media(max-width:1024px),(pointer:coarse){
  .card-head-toggle{min-height:var(--tap);}
  .card-caret{width:24px;height:24px;flex:0 0 24px;}
}


/* ===== Ischemic burden vs revascularization benefit (teaching) =====
   Built from the existing tokens so it inherits any later theme change.
   Colours are declared as variables at the top so a dark theme only has to
   redefine this block rather than every rule. */
/* Declared at :root, not on .ib — the chart is reusable and may be mounted
   without the wrapper, and SVG fills resolving to nothing render black. One
   place to redefine for a dark theme. */

.ib{ font-size:var(--fs-base);color:var(--ib-ink); }
.ib-caution{background:var(--warnBg);color:var(--warn);border-left:var(--bw-accent) solid var(--warn);
  border-radius:var(--r-sm);padding:var(--sp-2) var(--sp-2);margin-bottom:var(--sp-2);
  font-size:var(--fs-base);line-height:var(--lh-body);}
.ib-controls{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-3);align-items:flex-end;margin-bottom:var(--sp-2);}
.ib-row{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;}
.ib-range{width:188px;max-width:100%;accent-color:var(--ib-pt);height:auto;min-height:0;}
.ib-num{width:84px;}
.ib-w-burden{flex:1 1 320px;} .ib-w-scar{flex:1 1 220px;}

.ib-chart{width:100%;overflow:hidden;background:var(--ib-surface);
  border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-1);}
.ib-svg{width:100%;height:auto;display:block;}
.ib-band{opacity:.13;}
.ib-ok{fill:var(--ib-ok);} .ib-ok2{fill:var(--ib-ok2);}
.ib-warn{fill:var(--ib-warn);} .ib-bad{fill:var(--ib-bad);}
.ib-cross{fill:var(--ib-warn);opacity:.20;}
.ib-cross-t{font-size:var(--fs-micro);fill:var(--amber-12);font-weight:700;letter-spacing:var(--ls-wide);}
.ib-axis{stroke:var(--ib-grid);stroke-width:1;}
.ib-tick{stroke:var(--ib-grid);stroke-width:1;}
.ib-tick-t{font-size:var(--fs-tiny);fill:var(--muted);font-variant-numeric:tabular-nums;}
.ib-axis-t{font-size:var(--fs-sm);fill:var(--muted);font-weight:600;}
.ib-zero{stroke:var(--slate-11-vivid);stroke-width:1.25;stroke-dasharray:5 4;}
.ib-zero-t{font-size:var(--fs-micro);fill:var(--muted);font-weight:600;}
.ib-zero-chip{fill:var(--ib-surface);opacity:.85;}
.ib-dir{font-size:var(--fs-micro);fill:var(--muted);font-style:italic;}
.ib-curve{fill:none;stroke:var(--ib-curve);stroke-width:2.6;stroke-linecap:round;}
.ib-curve.conceptual{stroke-dasharray:9 5;}
.ib-curve-band{fill:var(--ib-curve);opacity:.13;stroke:none;}
.ib-marker{stroke:var(--ib-pt);stroke-width:1.5;stroke-dasharray:4 3;}
.ib-dot{fill:var(--ib-pt);stroke:var(--panel);stroke-width:2;}
.ib-dot-t{font-size:var(--fs-tiny);fill:var(--ib-pt);font-weight:700;font-variant-numeric:tabular-nums;}
.ib-scar-bar{fill:var(--amber-11);opacity:.35;rx:2;}
.ib-scar-dot{fill:var(--amber-11);stroke:var(--panel);stroke-width:1.5;}
.ib-scar-t{font-size:var(--fs-tiny);fill:var(--amber-11);font-weight:600;}
.ib-scar-track{stroke:var(--ib-grid);stroke-width:1;stroke-dasharray:3 3;}
.ib-yaxis-t{font-size:var(--fs-tiny);fill:var(--muted);font-weight:600;}
.ib-capture{cursor:crosshair;}
.ib-hline{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3;}
.ib-hdot{fill:var(--muted);}
.ib-hbox{fill:var(--slate-14-vivid);opacity:.94;}
.ib-ht1{font-size:var(--fs-tiny);fill:var(--panel);font-weight:600;}
.ib-ht2{font-size:var(--fs-micro);fill:var(--slate-7-vivid);}

.ib-legend{display:flex;flex-wrap:wrap;gap:var(--sp-1) var(--sp-3);margin:var(--sp-2) 0;}
.ib-leg{display:inline-flex;align-items:center;gap:var(--sp-1);font-size:var(--fs-sm);color:var(--muted);cursor:help;}
.ib-sw{width:12px;height:8px;border-radius:var(--r-xs);display:inline-block;}
.ib-sw.ib-ok{background:var(--ib-ok);opacity:.45;} .ib-sw.ib-ok2{background:var(--ib-ok2);opacity:.45;}
.ib-sw.ib-warn{background:var(--ib-warn);opacity:.5;} .ib-sw.ib-bad{background:var(--ib-bad);opacity:.45;}
.ib-sw.ib-line{background:transparent;border-top:var(--bw-rule) dashed var(--slate-11-vivid);height:0;width:16px;}
.ib-sw.ib-pt{background:var(--ib-pt);border-radius:50%;width:8px;height:8px;}
.ib-sw.ib-scar{background:var(--amber-11);border-radius:50%;width:8px;height:8px;}

.ib-readout{border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--ib-surface2);padding:var(--sp-2);margin-top:var(--sp-2);}
.ib-ro-head{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-2);}
.ib-ro-v{font-size:var(--fs-num);font-weight:700;font-variant-numeric:tabular-nums;line-height:1;}
.ib-ro-k{font-size:var(--fs-sm);color:var(--muted);}
.ib-ro-row{display:grid;grid-template-columns:148px 1fr;gap:var(--sp-2);padding:var(--sp-1) 0;
  border-top:1px solid var(--line);font-size:var(--fs-base);line-height:var(--lh-body);}
.ib-ro-row:first-of-type{border-top:none;}

.ib-mode-note{margin-top:var(--sp-2);border-left:var(--bw-accent) solid var(--accent);
  padding:var(--sp-2) var(--sp-2);background:var(--slate-3);border-radius:var(--r-sm);}
.ib-mode-h{font-size:var(--fs-md);font-weight:600;display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;}
.ib-tag{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:var(--ls-caps);
  padding:var(--sp-h) var(--sp-2);border-radius:var(--r-pill);font-weight:700;}
.ib-tag.con{background:var(--warnBg);color:var(--warn);}
.ib-tag.rct{background:var(--okBg);color:var(--ok);}
.ib-mode-note p{margin:var(--sp-1) 0 0;font-size:var(--fs-base);line-height:var(--lh-body);}
.ib-limit{color:var(--warn);}

.ib-disc{margin-top:var(--sp-2);border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--ib-surface);}
.ib-disc-h{display:flex;align-items:center;gap:var(--sp-2);width:100%;text-align:left;
  background:transparent;border:none;padding:var(--sp-2) var(--sp-2);cursor:pointer;
  font-size:var(--fs-md);font-weight:600;color:var(--ink);font-family:inherit;}
.ib-disc-b{padding:0 var(--sp-2) var(--sp-2);}
.ib-disc-b p{font-size:var(--fs-base);line-height:var(--lh-body);margin:0 0 var(--sp-2);}
.ib-disclaim{background:var(--warnBg);color:var(--warn);border-radius:var(--r-sm);
  padding:var(--sp-2) var(--sp-2);font-size:var(--fs-sm);line-height:var(--lh-body);}
.ib-flow{margin:0;padding-left:calc(5*var(--u));}
.ib-flow li{font-size:var(--fs-base);line-height:var(--lh-body);padding:var(--sp-1) 0;}

.ib-refs{margin-top:var(--sp-2);border-top:1px solid var(--line);padding-top:var(--sp-2);}
.ib-ref{margin-top:var(--sp-2);font-size:var(--fs-sm);line-height:var(--lh-body);}
.ib-ref p{margin:0 0 0;color:var(--muted);}
.ib-ref-caution{color:var(--warn)!important;}

@media(max-width:1024px),(pointer:coarse){
  .ib-range{min-height:var(--tap);}
  .ib-ro-row{grid-template-columns:1fr;gap:0;}
  .ib-disc-h{min-height:var(--tap);}
}
@media(max-width:560px){ .ib-range{width:100%;} .ib-w-burden,.ib-w-scar{flex:1 1 100%;} }
@media(max-width:560px){
  .tab-long{display:none;} .tab-short{display:inline;}
  .ps-tabs button{padding:0 var(--sp-2);}
  .ps-head .brand small{display:none;}
}


/* ===== Worklist strip ===== */
.wl-bar{display:flex;align-items:center;gap:var(--sp-2);background:var(--slate-4-vivid);min-height:var(--wl-h);
  border-bottom:1px solid var(--line);padding:var(--sp-1) var(--sp-3);
  position:sticky;top:calc(var(--head-h) + var(--tabs-h));z-index:38;overflow-x:auto;}
.wl-title{font-size:var(--fs-micro);font-weight:700;text-transform:uppercase;
  letter-spacing:var(--ls-caps);color:var(--muted);flex:0 0 auto;}
.wl-strip{display:flex;align-items:center;gap:var(--sp-1);flex:1 1 auto;}
.wl-slot{position:relative;display:inline-flex;flex:0 0 auto;}
.wl-case{display:inline-flex;align-items:center;gap:var(--sp-2);
  background:var(--panel);border:1px solid var(--slate-6-vivid);border-radius:var(--r-sm);
  padding:0 var(--sp-6) 0 var(--sp-2);min-height:var(--ctl-h);cursor:pointer;
  font-size:var(--fs-sm);font-family:inherit;color:var(--slate-13-vivid);white-space:nowrap;
  transition:background-color .13s ease,border-color .13s ease,color .13s ease;}
.wl-case.on{background:var(--accent);border-color:var(--accent);color:var(--panel);
  box-shadow:0 1px 2px rgba(0,0,0,.2);}
.wl-n{display:inline-flex;align-items:center;justify-content:center;
  min-width:16px;height:16px;border-radius:var(--r-xs);background:var(--slate-4-vivid);
  color:var(--muted);font-size:var(--fs-micro);font-weight:700;}
.wl-case.on .wl-n{background:rgba(255,255,255,.22);color:var(--panel);}
.wl-lab{font-weight:400;}
.wl-dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;}
.wl-dot.ok{background:var(--green-12-vivid);} .wl-dot.pending{background:var(--amber-10-vivid);}
.wl-dot.empty{background:var(--slate-7-vivid);}
.wl-case.on .wl-dot.pending{background:var(--amber-6-vivid);} .wl-case.on .wl-dot.ok{background:var(--green-7-vivid);}
.wl-x{position:absolute;right:0;top:50%;transform:translateY(-50%);
  width:var(--ctl-h);height:var(--ctl-h);border:none;background:transparent;cursor:pointer;
  color:var(--slate-9-vivid);font-size:var(--fs-md);line-height:1;border-radius:var(--r-xs);
  display:inline-flex;align-items:center;justify-content:center;padding:0;}
.wl-case.on ~ .wl-x{color:rgba(255,255,255,.7);}
/* The worklist bar moved onto the header's dark band in increment 68, and this
   button kept its dark ink — legible on the old light strip, nearly invisible
   on this one. */
.wl-add,.wl-more{flex:0 0 auto;background:transparent;border:1px dashed var(--slate-8-vivid);
  border-radius:var(--r-sm);min-height:var(--ctl-h);padding:var(--ctl-pad);cursor:pointer;
  font-size:var(--fs-sm);font-family:inherit;color:var(--slate-5-vivid);white-space:nowrap;}
@media (hover:hover){ .wl-add:hover,.wl-more:hover{border-color:var(--panel);color:var(--panel);} }
@media(max-width:1024px),(pointer:coarse){
  .wl-bar{top:auto;position:static;min-height:calc(var(--tap) + var(--sp-3));}
  .wl-case{min-height:var(--tap);padding-right:calc(var(--tap) + var(--sp-1));}
  .wl-add,.wl-more{min-height:var(--tap);}
  .wl-x{width:var(--tap);height:var(--tap);}
}
@media print{ .wl-bar{display:none!important;} }


/* ===== Header bar (increment 41) =====
   One row, always, above the phone breakpoint. What gives way, in order:
     1. the subtitle — decoration, gone on any touch width;
     2. the brand title — truncates with an ellipsis, keeping the app's name;
     3. nothing else. The two verbs and the menu hold their size, because a
        control that moves between visits is worse than a shortened title.
   The bar must not wrap: the tab bar below it is sticky, so a second header
   row slides under the tabs the moment the page scrolls. */
@media(max-width:1024px){ .ps-head .brand small{display:none;} }
@media(min-width:561px){
  .ps-head{flex-wrap:nowrap;}
  .ps-head .brand{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;}
  .ps-head button,.ps-head details.menu,.ps-savestate,#readySlot{flex:0 0 auto;}
  .ps-head .sp{flex:1 1 0;min-width:0;}
}
/* Phone: one row cannot fit, so it wraps on purpose and in one place. The
   title line carries the state that goes with it — "unsaved · 6 to complete" —
   and every control sits together on the line below. The spacer becomes the
   line break rather than being deleted, so the order of the DOM still reads. */
@media(max-width:560px){
  .ps-head .brand{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;}
  .ps-savestate,#readySlot{order:0;}
  .ps-head .sp{order:1;flex:1 1 100%;height:0;}
  .ps-head button,.ps-head details.menu{order:2;}
}

/* the derived age reads as a disabled field, so it is sized as one — at 28 px
   in a row of 44 px fields its label sat half a line low and looked as though
   it overlapped the date of birth (increment 41) */
@media(max-width:1024px),(pointer:coarse){
  .age-derived{min-height:var(--tap);font-size:var(--fs-field);}
}

/* ===== One shape, one size (increment 39) =====
   A control you press is a rectangle at --r-sm; a token you only read keeps the
   pill. Chips were the only pressable pill, and the only control that changed
   font size on touch — both are now in line with every other control. */
.chip,.btn,.btn.sm,.seg .segbtn,.seg>button,.wl-case,.wl-add,.wl-more,details.menu>summary{
  font-size:var(--fs-sm);border-radius:var(--r-sm);}
.chip{min-height:var(--ctl-h);padding:0 var(--sp-2);line-height:var(--lh-tight);}
/* a flex line stretches its items by default, so one taller neighbour (the
   "+N more" button) was making the chips beside it taller than the rest */
.chipgrp{align-items:flex-start;}
.deck-more{margin:0 var(--sp-1) var(--sp-1) 0;}
.chip-pair{display:contents;}
@media(max-width:1024px),(pointer:coarse){
  /* this block sits after the older touch rules, so it must restate the tap
     target it would otherwise override — cascade order is load-bearing here */
  /* 44 px is the tap target, not a style: the label grows into it rather than
     the box shrinking. At --fs-base the text filled 0.28 of its box against
     iOS's own 0.39. --fs-lg brings it to 0.36, matches the type inside the
     inputs beside it, and costs no wrapping and 2% of page height. */
  .chip,.btn,.btn.sm,.seg .segbtn,.seg>button,.wl-case,.wl-add,.wl-more,details.menu>summary{
    font-size:var(--fs-lg);min-height:var(--tap);}
  .menu-item{font-size:var(--fs-md);}
  /* iOS Safari zooms the whole page when a field under 16px takes focus — which
     is what pushed the layout past the right edge mid-typing. The field type is
     pinned to the platform floor; the box is unchanged. */
  input,select,textarea,input[type=text],input[type=number],input[type=date]{font-size:var(--fs-field);}
  .seg{padding:0;gap:var(--sp-1);background:transparent;border:none;min-height:var(--tap);height:auto;}
  .seg .segbtn,.seg>button{min-height:var(--tap);height:auto;}
}
/* the last column of the territorial table used to be cut off by the panel's
   overflow:hidden — the table scrolls inside its own body instead */
@media(max-width:900px){
  .ca-body{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .bull{width:auto;max-width:100%;}
  .bull svg{max-width:100%;height:auto;}
}

/* Centring every row was tried in increment 43 and reverted in 44: with the
   labels centred too, a card read as a poster rather than a form, and a form is
   scanned down its left edge. Rows are left-aligned again. The one thing kept
   from that pass is the segment border below — that was a defect, not a taste. */

/* The segmented control degrades to a button group on touch (§39), where each
   cell owns its border — but the joined-track rule that removes the last
   cell's right border still applied, so every last option was open on the
   right. */
@media(max-width:1024px),(pointer:coarse){
  .seg .segbtn:last-child,.seg>button:last-child{border-right:1px solid var(--slate-6-vivid);}
  .seg .segbtn.on:last-child,.seg>button.on:last-child{border-right-color:var(--accent);}
}

/* provenance: whose tool this is, and what it is for */
.byline{font-size:var(--fs-tiny);color:var(--slate-7-vivid);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;min-width:0;margin-left:var(--sp-1);}
@media(max-width:1199px){ .byline{display:none;} }
.colophon{margin:var(--sp-4) 0 var(--sp-2);padding:var(--sp-3);border-top:1px solid var(--line);
  font-size:var(--fs-sm);color:var(--muted);line-height:var(--lh-body);text-align:center;}
.colophon strong{color:var(--ink);font-weight:600;}
@media print{ .colophon{border-top:none;text-align:left;padding-left:0;} }

/* ===== A box is as wide as what goes in it (increment 45) =====
   Widths are stated in characters. `ch` is the width of a digit in the
   element's own font, so a field that holds ten digits is ten digits wide on
   every device and follows the type size instead of needing a px value per
   breakpoint. Text fields that hold sentences — name, diagnosis, referrer —
   still flex; only bounded values are pinned. */
.fld.w-acc{flex:0 0 auto;} .fld.w-acc input,.fld.w-acc select,.fld.w-acc .age-derived{width:calc(14ch + var(--sp-4) + 2*var(--bw-hair));box-sizing:border-box;}
.fld.w-age{flex:0 0 auto;} .fld.w-age input,.fld.w-age select,.fld.w-age .age-derived{width:calc(3ch + var(--sp-4) + 2*var(--bw-hair));box-sizing:border-box;}
.fld.w-amino{flex:0 0 auto;} .fld.w-amino input,.fld.w-amino select,.fld.w-amino .age-derived{width:calc(4ch + var(--sp-4) + 2*var(--bw-hair));box-sizing:border-box;}
.fld.w-cr{flex:0 0 auto;} .fld.w-cr input,.fld.w-cr select,.fld.w-cr .age-derived{width:calc(4ch + var(--sp-4) + 2*var(--bw-hair));box-sizing:border-box;}
.fld.w-date{flex:0 0 auto;} .fld.w-date input,.fld.w-date select,.fld.w-date .age-derived{width:calc(11ch + var(--sp-4) + 2*var(--bw-hair));box-sizing:border-box;}
.fld.w-dose{flex:0 0 auto;} .fld.w-dose input,.fld.w-dose select,.fld.w-dose .age-derived{width:calc(3ch + var(--sp-4) + 2*var(--bw-hair));box-sizing:border-box;}
.fld.w-echo{flex:0 0 auto;} .fld.w-echo input,.fld.w-echo select,.fld.w-echo .age-derived{width:calc(11ch + var(--sp-4) + 2*var(--bw-hair));box-sizing:border-box;}
.fld.w-egfr{flex:0 0 auto;} .fld.w-egfr input,.fld.w-egfr select,.fld.w-egfr .age-derived{width:calc(4ch + var(--sp-4) + 2*var(--bw-hair));box-sizing:border-box;}
.fld.w-fn{flex:0 0 auto;} .fld.w-fn input,.fld.w-fn select,.fld.w-fn .age-derived{width:calc(4ch + var(--sp-4) + 2*var(--bw-hair));box-sizing:border-box;}
.fld.w-hisp{flex:0 0 auto;} .fld.w-hisp input,.fld.w-hisp select,.fld.w-hisp .age-derived{width:calc(8ch + var(--sp-4) + 2*var(--bw-hair));box-sizing:border-box;}
.fld.w-hr{flex:0 0 auto;} .fld.w-hr input,.fld.w-hr select,.fld.w-hr .age-derived{width:calc(3ch + var(--sp-4) + 2*var(--bw-hair));box-sizing:border-box;}
.fld.w-ht{flex:0 0 auto;} .fld.w-ht input,.fld.w-ht select,.fld.w-ht .age-derived{width:calc(4ch + var(--sp-4) + 2*var(--bw-hair));box-sizing:border-box;}
.fld.w-mm{flex:0 0 auto;} .fld.w-mm input,.fld.w-mm select,.fld.w-mm .age-derived{width:calc(3ch + var(--sp-4) + 2*var(--bw-hair));box-sizing:border-box;}
.fld.w-mrn{flex:0 0 auto;} .fld.w-mrn input,.fld.w-mrn select,.fld.w-mrn .age-derived{width:calc(10ch + var(--sp-4) + 2*var(--bw-hair));box-sizing:border-box;}
.fld.w-over{flex:0 0 auto;} .fld.w-over input,.fld.w-over select,.fld.w-over .age-derived{width:calc(2ch + var(--sp-4) + 2*var(--bw-hair));box-sizing:border-box;}
.fld.w-ptp{flex:0 0 auto;} .fld.w-ptp input,.fld.w-ptp select,.fld.w-ptp .age-derived{width:calc(3ch + var(--sp-4) + 2*var(--bw-hair));box-sizing:border-box;}
.fld.w-race{flex:0 0 auto;} .fld.w-race input,.fld.w-race select,.fld.w-race .age-derived{width:calc(25ch + var(--sp-4) + 2*var(--bw-hair));box-sizing:border-box;}
.fld.w-sex{flex:0 0 auto;} .fld.w-sex input,.fld.w-sex select,.fld.w-sex .age-derived{width:calc(8ch + var(--sp-4) + 2*var(--bw-hair));box-sizing:border-box;}
.fld.w-time{flex:0 0 auto;} .fld.w-time input,.fld.w-time select,.fld.w-time .age-derived{width:calc(6ch + var(--sp-4) + 2*var(--bw-hair));box-sizing:border-box;}
.fld.w-unit{flex:0 0 auto;} .fld.w-unit input,.fld.w-unit select,.fld.w-unit .age-derived{width:calc(12ch + var(--sp-4) + 2*var(--bw-hair));box-sizing:border-box;}
.fld.w-vol{flex:0 0 auto;} .fld.w-vol input,.fld.w-vol select,.fld.w-vol .age-derived{width:calc(4ch + var(--sp-4) + 2*var(--bw-hair));box-sizing:border-box;}
.fld.w-wt{flex:0 0 auto;} .fld.w-wt input,.fld.w-wt select,.fld.w-wt .age-derived{width:calc(4ch + var(--sp-4) + 2*var(--bw-hair));box-sizing:border-box;}
/* the date input carries a picker glyph the text does not account for */
.fld.w-date input{width:calc(11ch + var(--sp-4) + 2*var(--bw-hair) + 1.6em);}
.fld.w-dob{flex:0 0 auto;} .fld.w-dob input{width:calc(10ch + var(--sp-4) + 2*var(--bw-hair) + 1.6em);box-sizing:border-box;}
.fld.w-init{flex:0 0 auto;} .fld.w-init input{width:calc(4ch + var(--sp-4) + 2*var(--bw-hair));box-sizing:border-box;}
.fld.w-bp{flex:0 0 auto;} .fld.w-bp input{width:calc(3ch + var(--sp-2) + 2*var(--bw-hair));}
/* creatinine in, eGFR out — the derived box reads as a field, not a badge */
.ckd-warn{margin:var(--sp-2) 0 0;padding:var(--sp-2) var(--sp-3);border:1px solid var(--warn);
  border-left:var(--bw-accent) solid var(--warn);border-radius:var(--r-sm);
  background:var(--warnBg);color:var(--warn);font-size:var(--fs-sm);line-height:var(--lh-body);}
.ckd-warn strong{color:var(--err);}
.age-derived.alarm{background:var(--errBg);color:var(--err);border-color:var(--err);font-weight:600;}
/* flow, shaped like the calcium card rather than a table in a card */
.flow-grid{display:flex;flex-direction:column;gap:var(--sp-2);}
.flow-terr{display:grid;grid-template-columns:calc(8ch + var(--sp-2)) repeat(3,minmax(0,1fr));
  align-items:end;gap:var(--sp-2);}
@media(max-width:560px){ .flow-terr{grid-template-columns:max-content repeat(3,minmax(0,1fr));gap:var(--sp-1);} }
/* "GLOBAL" in caps with letter-spacing is wider than 7ch of the digit width
   that ch measures, so the column is sized to the word instead */
.flow-lbl{flex:0 0 max-content;min-width:calc(8ch);font-weight:600;font-size:var(--fs-sm);
  color:var(--muted);text-transform:uppercase;letter-spacing:var(--ls-caps);padding-bottom:var(--sp-2);}
.flow-terr .cac-box{min-width:0;} .flow-terr .cac-box input,.flow-terr .age-derived{width:100%;box-sizing:border-box;}
/* the first row's labels head the columns; repeating them four times is noise */
.flow-grid .flow-terr:not(:first-child) .cac-box label{display:none;}
.cac-box.derived .age-derived{justify-content:center;}

/* The study date sits in the card header as a statement that can be corrected,
   not as a field being asked for (increment 46). */
.studydate{display:inline-flex;align-items:center;gap:var(--sp-1);}
.sd-lbl{font-size:var(--fs-tiny);text-transform:uppercase;letter-spacing:var(--ls-caps);color:var(--muted);}
input.date-quiet{border-color:transparent;background:transparent;color:var(--muted);
  width:calc(11ch + var(--sp-3) + 1.6em);padding:0 var(--sp-1);min-height:var(--ctl-h);}
input.date-quiet:focus{border-color:var(--line);background:var(--panel);color:var(--ink);}
@media (hover:hover){ input.date-quiet:hover{border-color:var(--line);background:var(--panel);color:var(--ink);} }
@media(max-width:1024px),(pointer:coarse){ input.date-quiet{min-height:var(--tap);} }

/* An import card is one action and its explanation, side by side on a wide
   screen and stacked on a narrow one (increment 47). */
.import-row{display:flex;align-items:flex-start;gap:var(--sp-3);flex-wrap:wrap;}
.import-row .btn{flex:0 0 auto;}
.import-row .hint{flex:1 1 calc(40*var(--u));min-width:calc(40*var(--u));margin:0;}
@media(max-width:560px){ .import-row .hint{flex:1 1 100%;min-width:0;} }

/* A probability and a burden are results, so they are set like the score
   tiles rather than like fields (increment 50). */
.ptp-row{display:flex;align-items:flex-end;gap:var(--sp-3);flex-wrap:wrap;}
/* The scoring tally is four equal columns because it always has four cells.
   These have one or two, so a four-column grid stretched them into slabs —
   they size to their content instead. */
.ptp-tally{margin:0;grid-template-columns:max-content;width:auto;}
.ptp-tally .tl-cell{min-width:calc(32*var(--u));}
.burden-box{margin-bottom:var(--sp-3);}
.burden-box .score-tally{margin:0;width:auto;
  grid-template-columns:repeat(auto-fit,minmax(calc(24*var(--u)),max-content));justify-content:start;}
.burden-box .tl-cell{min-width:calc(24*var(--u));}
@media(max-width:560px){
  .ptp-tally,.burden-box .score-tally{grid-template-columns:minmax(0,1fr);width:100%;}
  .ptp-tally .tl-cell,.burden-box .tl-cell{min-width:0;}
}
.score-tally{align-items:flex-start;}
.verdict-cell{margin-top:var(--sp-2);padding:var(--sp-2) var(--sp-3);border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--slate-2);display:flex;flex-direction:column;gap:var(--sp-h);}
.verdict-cell .tl-k{font-size:var(--fs-micro);font-weight:700;text-transform:uppercase;
  letter-spacing:var(--ls-caps);color:var(--muted);}
.verdict-cell .vd-line{font-size:var(--fs-sm);color:var(--muted);line-height:var(--lh-body);}
.tl-cell .tl-word{font-size:var(--fs-lg);}
.tl-cell.tl-wide .tl-t{white-space:normal;line-height:var(--lh-body);color:var(--muted);}
.verdict-cell.good .tl-word{color:var(--ok);}
.verdict-cell.warn .tl-word{color:var(--warn);}
.verdict-cell.muted .tl-word{color:var(--ink);}

/* A stepped field: the input and its two arrows share one border, so it reads
   as a single control while each arrow stays a real, full-height button
   (increment 55). */
.stepper{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--panel);overflow:hidden;width:calc(9ch + var(--sp-4) + 2*var(--bw-hair));box-sizing:border-box;}
.stepper input{border:none;background:transparent;min-width:0;flex:1 1 auto;width:auto;padding:0 var(--sp-2);}
.stepper input:focus{outline:none;}
.stepper:focus-within{border-color:var(--accent);}
.stp{flex:0 0 auto;width:calc(3ch);border:none;border-left:1px solid var(--line);background:var(--slate-2);
  color:var(--muted);font-size:var(--fs-base);line-height:1;cursor:pointer;padding:0;}
@media (hover:hover){ .stp:hover{background:var(--chip);color:var(--ink);} }
.fld.w-cr .stepper{width:calc(9ch + var(--sp-4) + 2*var(--bw-hair));}
.fld.w-cr input{width:auto;}

/* the score key prints its number inside the color it names */
.legend-sw{display:inline-flex;align-items:center;justify-content:center;
  font-size:var(--fs-micro);font-weight:700;}
.legend-item{display:inline-flex;align-items:center;gap:var(--sp-1);}

/* the stress vitals are a two-by-two table, aligned in columns like the MBF card */
/* one grid for the whole table, not one per row, or the columns cannot line
   up across rows — the header sat over the wrong box */
.vit-grid{display:grid;grid-template-columns:calc(9ch) max-content max-content;
  align-items:center;gap:var(--sp-1) var(--sp-2);margin-top:var(--sp-2);}
.vit-row{display:contents;}
.vit-hr input{width:calc(3ch + var(--sp-4) + 2*var(--bw-hair));text-align:center;box-sizing:border-box;}
.vit-lbl{font-size:var(--fs-sm);font-weight:600;color:var(--muted);text-transform:uppercase;
  letter-spacing:var(--ls-caps);}
.vit-head .vit-cell{font-size:var(--fs-micro);font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:var(--ls-caps);}
.vit-head{margin-bottom:calc(0px - var(--sp-h));}

/* the outline layer must never intercept a click meant for a wedge */
.pm-edges{pointer-events:none;}
.terrlbl{font-size:var(--fs-micro);font-weight:700;letter-spacing:var(--ls-caps);text-anchor:middle;
  dominant-baseline:middle;}

/* the mark sits with the title and never competes with it */
.mark{display:inline-flex;align-items:center;flex:0 0 auto;}
.mark svg{display:block;}
@media(max-width:560px){ .mark svg{width:calc(6*var(--u));height:calc(6*var(--u));} }
@media print{ .mark{display:none;} }

/* A term that can teach: a dotted underline and nothing more. The page must
   look the same to a reader who never asks (increment 60). */
.teach{border-bottom:1px dotted var(--slate-8-vivid);cursor:pointer;}
@media (hover:hover){ .teach:hover{border-bottom-color:var(--accent);color:var(--accent);} }
.teach-modal{max-width:calc(160*var(--u));}
.teach-body{max-height:60vh;overflow-y:auto;padding-right:var(--sp-2);}
.teach-lead{font-size:var(--fs-md);color:var(--ink);line-height:var(--lh-body);margin:0 0 var(--sp-3);}
.teach-body h4{font-size:var(--fs-sm);text-transform:uppercase;letter-spacing:var(--ls-caps);
  color:var(--muted);margin:var(--sp-4) 0 var(--sp-1);}
.teach-body p{font-size:var(--fs-base);line-height:var(--lh-body);margin:0 0 var(--sp-2);color:var(--ink);}
.teach-see{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;margin-top:var(--sp-4);
  padding-top:var(--sp-2);border-top:1px solid var(--line);}
.teach-see>span{font-size:var(--fs-micro);font-weight:700;text-transform:uppercase;
  letter-spacing:var(--ls-caps);color:var(--muted);}

/* ===== The active tab belongs to the page below it (increment 60) =====
   A tab bar that only underlines its selection leaves the panel below looking
   unrelated to it. The active tab takes the page's own background, rounds its
   top corners and drops its bottom edge, so the two read as one surface — the
   browser-tab idiom. The accent moves to the tab's top edge, where it marks
   the selection without drawing a line between the tab and its content. */
.ps-tabs{border-bottom:none;}
.ps-tabs button.on{background:var(--bg);color:var(--ink);
  border-radius:var(--r-sm) var(--r-sm) 0 0;border-bottom-color:transparent;
  box-shadow:inset 0 var(--bw-accent) 0 var(--accent2);}
@media (hover:hover){ .ps-tabs button:not(.on):hover{background:var(--slate-13-vivid);color:var(--panel);} }
/* The worklist now sits between the header and the tabs, so the two sticky
   offsets swap with them: the worklist parks under the header, the tabs park
   under the worklist. Left as they were, both claimed the same top and they
   drew on top of each other with a 40 px hole above them. */
.wl-bar{background:var(--head);border-bottom:none;top:var(--head-h);}
.ps-tabs{top:calc(var(--head-h) + var(--wl-h));}
.wl-bar .wl-lbl{color:var(--slate-7-vivid);}
/* everything that parks below the tabs gains the worklist's height too */
.ps-report{top:calc(var(--head-h) + var(--wl-h) + var(--tabs-h) + var(--sp-2));}
.splitter{top:calc(var(--head-h) + var(--wl-h) + var(--tabs-h) + var(--sp-2));
  height:calc(100vh - var(--head-h) - var(--wl-h) - var(--tabs-h) - var(--sp-2) - var(--sp-4));}

/* two import sources side by side, each with what it fills (increment 64) */
.imp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(64*var(--u)),1fr));gap:var(--sp-3);}
.imp-source{display:flex;flex-direction:column;gap:var(--sp-2);align-items:flex-start;}
.imp-what{font-size:var(--fs-sm);line-height:var(--lh-body);}
.imp-line{color:var(--ink);}
.imp-fills{color:var(--muted);}

/* ===== Phone and tablet (increment 68) =====
   The tab bar is sticky, and below 1024 px the header collapses to zero
   height — so the tabs docked at the top of the viewport with nothing above
   them and read as a toolbar floating over the page. Nothing floats now. */
@media(max-width:1024px),(pointer:coarse){
  .ps-tabs{position:static;top:auto;}
  /* WORKLIST kept dark ink from when this strip was light */
  .wl-title{color:var(--slate-6-vivid);}
  /* A menu hangs from the RIGHT edge of its button, which puts a 240 px panel
     off the left of a phone when the button sits at x=137. Left-anchoring
     fixes the phone and breaks the tablet, where the same button sits near the
     right. So the header's panel is pinned to the VIEWPORT instead of to the
     button, and can then never leave the screen at any width. */
  .ps-head details.menu>.menu-list{position:fixed;top:calc(var(--tap) + var(--sp-2));
    right:var(--sp-2);left:auto;min-width:calc(56*var(--u));
    max-width:calc(100vw - 4*var(--u));}
  details.menu>.menu-list{max-width:calc(100vw - 4*var(--u));}
  /* two import sources stack rather than squeezing into half a phone */
  .imp-grid{grid-template-columns:minmax(0,1fr);}
  /* a card summary has room to wrap on a narrow screen */
  .card-summary{max-width:100%;text-align:left;}
}
@media(max-width:560px){
  /* the header's byline is the first thing to give up its space */
  .byline{display:none;}
}

/* ===== Hover belongs to pointers (increment 38) =====
   iOS applies :hover on tap and keeps it until something else is tapped, so a
   chip, a menu row or a map segment stayed painted after the finger left.
   Every hover rule in the app is gathered here, behind the capability query.
   Placed after the narrow-width block and before print, so cascade order is
   unchanged for the pointer case. */
@media (hover:hover){
  .ps-head button:hover{background:var(--slate-12-vivid);}
  .ps-head button.danger:hover{background:var(--red-13);border-color:var(--red-13);}
  .splitter:hover{background:rgba(0,0,0,.06);}
  .splitter:hover .splitter-grip{background:var(--accent);height:80px;}
  .pmseg:hover{filter:brightness(1.05) drop-shadow(0 1px 3px rgba(0,0,0,.25));}
  .seg .segbtn:hover:not(.on){background:var(--chip);}
  .btn:hover{background:var(--slate-5-vivid);}
  .ca-panel>header:hover{background:var(--slate-3-vivid);}
  .brush:hover{border-color:var(--muted);}
  .btn:hover{background:var(--slate-5-vivid);}
  .btn.on:hover{background:var(--blue-13);}
  .seg .segbtn:hover:not(.on),.seg>button:hover:not(.on){background:var(--chip);}
  .seg .segbtn:hover:not(.on),.seg>button:hover:not(.on){background:var(--slate-4-vivid);}
  .chip:hover:not(.on){background:var(--slate-3);border-color:var(--slate-7-vivid);}
  .btn:hover:not(.on){background:var(--slate-3);border-color:var(--slate-7-vivid);}
  .btn.on:hover{background:var(--blue-13);}
  .ps-head .btn:hover:not(.on){background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.34);}
  .btn.primary:hover{background:var(--blue-13);border-color:var(--blue-13);}
  .btn.quiet:hover{background:var(--chip);border-color:var(--slate-7-vivid);}
  .btn.quiet.muted:hover{color:var(--ink);}
  .btn.danger:hover{background:var(--errBg);border-color:var(--red-7-soft);}
  .menu-item:hover,.menu-item:focus-visible{background:var(--chip);}
  .menu-item.danger:hover{background:var(--errBg);}
  .ps-head .menu-list .menu-item:hover,.ps-head .menu-list .menu-item:focus-visible{background:var(--chip);}
  .ps-head .menu-list .menu-item.danger:hover{background:var(--errBg);}
  .card-head-toggle:hover{background:var(--slate-3-vivid);}
  .ib-disc-h:hover{background:var(--slate-3-vivid);}
  .wl-case:hover:not(.on){background:var(--slate-3);border-color:var(--slate-7-vivid);}
  .wl-x:hover{background:var(--red-5);color:var(--err);}
  .wl-case.on ~ .wl-x:hover{background:rgba(255,255,255,.2);color:var(--panel);}
  .wl-add:hover,.wl-more:hover{background:var(--slate-3);border-color:var(--accent);color:var(--accent);}
  .ps-head button.primary:hover{background:var(--blue-13);border-color:var(--blue-13);}
}
@media(max-width:560px) and (hover:hover){
  .seg .segbtn:hover:not(.on),.seg>button:hover:not(.on){background:var(--slate-3);border-color:var(--slate-7-vivid);}
}
/* touch: no hover, so the gesture is the affordance. An annotation invites a tap;
   a control's tip waits for a long press and marks its anchor while open. */
@media (hover:none){
  [title]:not(button):not(input):not(select):not(textarea),
  [data-tip]:not(button):not(input):not(select):not(textarea){cursor:default;}
  .btn,.chip,.segbtn,.wl-case,summary{-webkit-touch-callout:none;}
}
.tip-open{outline:var(--bw-rule) solid var(--accent);outline-offset:var(--sp-h);border-radius:var(--r-sm);}
.fast-tip{pointer-events:none;}
@media print{
  body{background:var(--panel);} .ps-head,.ps-tabs,.report-tools,.no-print{display:none!important;}
  .ps-main{grid-template-columns:1fr;} .ps-report{position:static;}
  pre.report{border:none;max-height:none;font-size:var(--fs-tiny);}
}
