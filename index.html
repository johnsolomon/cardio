<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Myotrace — cardiac PET/CT read-out</title>
<style>
:root{
  /* LATTICE — generated by design_lattice.py; edit the generator, not this block */
  /* space: u = 4px. --sp-n = n·u for n in 1,2,3,4,6,8 */
  --u:4px; --sp-h:2px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  /* type: s_k = 12.5px · 2^(k/6) — one ratio, doubles every six steps */
  --fs-micro:8.84px; --fs-tiny:9.92px; --fs-sm:11.14px; --fs-base:12.5px; --fs-md:14.03px; --fs-lg:15.75px; --fs-xl:19.84px; --fs-num:25px;
  /* not a scale step: iOS Safari zooms the page when a focused field is
     under 16px, so form fields on touch are pinned to this floor */
  --fs-field:16px;
  /* line height: snapped up to u by round() below; unitless fallback first */
  --lh-body:1.6; --lh-tight:1.28;
  --ls-tight:-.02em; --ls-wide:.04em; --ls-caps:.08em;
  /* radius: u/2, u, 2u */
  --r-xs:2px; --r-sm:4px; --r-md:8px; --r-pill:999px;
  /* controls and chrome: every height is n·u; sticky offsets are sums of them */
  --ctl-h:28px; --ctl-h-sm:24px; --tap:44px; --ctl-pad:0 var(--sp-2); --ctl-pad-sm:0 var(--sp-1);
  --head-h:44px; --tabs-h:40px; --wl-h:40px; --card-head-h:calc(var(--ctl-h) + var(--sp-2));
  --bw-hair:1px; --bw-rule:2px; --bw-accent:4px;
  /* color: OKLCH lattice. L_k = 1-(k/17)^2, C_j = 0.16·2^(-j/2), hue per ramp. */
  /* slate/blue 240°, red 25°, vermilion 40°, amber 80°, green 155°, teal 185°, violet 305° */
  --slate-1:#fcfeff; --slate-2:#f8fbfd; --slate-3:#f3f5f7; --slate-3-vivid:#f1f5f9; --slate-4:#ebedef; --slate-4-vivid:#e9edf1; --slate-5:#e0e3e4; --slate-5-vivid:#dee3e7; --slate-6:#d4d6d8; --slate-6-vivid:#d2d7da; --slate-7-vivid:#c2c8cd; --slate-8-vivid:#afb8bf; --slate-9-vivid:#9da6ad; --slate-10-vivid:#86929c; --slate-11-vivid:#707d86; --slate-12-vivid:#556673; --slate-13:#454d53; --slate-13-vivid:#3e4e5a; --slate-14:#2d343a; --slate-14-soft:#303437; --slate-14-vivid:#263540; --slate-15-soft:#181b1e;
  --blue-7-vivid:#a7cde9; --blue-11:#5c8099; --blue-13:#1a5173;
  --red-3:#fef1f0; --red-3-soft:#f9f3f2; --red-4-soft:#f3eae9; --red-5:#f5dcd9; --red-7-soft:#d9c1be; --red-8:#e6a39d; --red-12:#ac3131; --red-13:#8f0d18;
  --vermilion-2:#fff9f7; --vermilion-3:#fef2ee; --vermilion-6-vivid:#f8caba; --vermilion-11:#b26145;
  --amber-1:#fffefb; --amber-2:#fefaf3; --amber-3:#faf4ea; --amber-3-vivid:#fff3e0; --amber-4:#f2ece2; --amber-4-vivid:#f7ebd8; --amber-5-vivid:#f1e0c5; --amber-6-vivid:#ead3ad; --amber-7-vivid:#e3c28c; --amber-8-vivid:#ddaf5d; --amber-9:#b7a17d; --amber-9-vivid:#ca9c4a; --amber-10:#aa8b56; --amber-10-vivid:#b48834; --amber-11:#947541; --amber-12:#7c5e29; --amber-13:#62460c; --amber-14-soft:#3e311b;
  --green-2-soft:#f8fbf9; --green-4-vivid:#e3f1e7; --green-7-vivid:#abd3b8; --green-10-vivid:#50a571; --green-11:#60856c; --green-12:#3b714f; --green-12-vivid:#1a7646;
  --violet-2:#fbf9fe; --violet-4:#efeaf5; --violet-12:#735197; --violet-13:#5a397c;
  /* semantic roles, each a lattice point */
  --bg:#ebedef; --panel:#fff; --ink:#151c21; --muted:#5d656b; --line:#d4d6d8; --head:#263540; --headtx:#f3f5f7; --accent:#34698d; --accent2:#c65123; --chip:#f3f5f7; --chipOn:#34698d; --chipOnTx:#fff; --warn:#7c5e29; --warnBg:#fff3e0; --err:#8f0d18; --errBg:#fef1f0; --ok:#215838; --okBg:#f0f7f2;
}
@supports (line-height: round(up, 1em, 4px)){
  :root{--lh-body:round(up,1.35em,var(--u));--lh-tight:round(up,1.1em,var(--u));}
}
:root{ --ib-ok:var(--green-11); --ib-ok2:var(--green-10-vivid); --ib-warn:var(--amber-9-vivid); --ib-bad:var(--red-12); --ib-ink:var(--slate-14); --ib-grid:var(--slate-6); --ib-curve:var(--accent); --ib-pt:var(--accent2); --ib-surface:var(--panel); --ib-surface2:var(--slate-2); }


html{overflow-x:hidden;}
body{overflow-x:clip;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);max-width:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:var(--fs-base);}
*{box-sizing:border-box;line-height:var(--lh-tight);}
#root{min-height:100vh;}
@supports(padding:max(0px)){body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);}}

.ps-head{position:sticky;top:0;z-index:40;background:var(--head);color:var(--headtx);min-height:var(--head-h);
  display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;padding:var(--sp-2) var(--sp-3);box-shadow:0 1px 4px rgba(0,0,0,.18);}
.ps-head .brand{font-weight:700;letter-spacing:var(--ls-wide);font-size:var(--fs-md);margin-right:var(--sp-1);white-space:nowrap;}
.ps-head .brand small{font-weight:400;opacity:.7;font-size:var(--fs-sm);margin-left:var(--sp-1);}
.ps-head .sp{flex:1;}
.ps-head button{background:var(--slate-13-vivid);color:var(--headtx);border:1px solid var(--slate-13-vivid);border-radius:var(--r-sm);
  min-height:var(--ctl-h);padding:0 var(--sp-2);font-size:var(--fs-base);cursor:pointer;}
.ps-head button.primary{background:var(--accent);border-color:var(--accent);}
.ps-savestate{font-size:var(--fs-sm);opacity:.85;margin-left:0;white-space:nowrap;}

.ps-tabs{display:flex;gap:0;background:var(--head);padding:0 var(--sp-3);position:sticky;top:var(--head-h);z-index:39;min-height:var(--tabs-h);}
.ps-tabs button{background:transparent;color:var(--slate-7-vivid);border:none;border-bottom:var(--bw-rule) solid transparent;
  min-height:var(--tabs-h);padding:0 var(--sp-3);font-size:var(--fs-base);font-weight:600;cursor:pointer;}
.ps-tabs button.on{color:var(--panel);border-bottom-color:var(--accent2);}

.ps-main{display:grid;grid-template-columns:minmax(0,1fr) var(--sp-4) 440px;gap:0;padding:var(--sp-2);align-items:start;}
/* worksheet cards flow into columns to fill available width (no dead white space) */
#worksheet{column-gap:var(--sp-2);column-width:340px;}
#worksheet > .card{break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid;display:inline-block;width:100%;overflow:hidden;}
#worksheet .grid-auto{max-width:100%;}
#worksheet .seg{flex-wrap:wrap;height:auto;}
#worksheet .chipgrp,#worksheet .grid-auto{min-width:0;}
.ps-report{position:sticky;top:calc(var(--head-h) + var(--tabs-h) + var(--sp-2));padding-left:var(--sp-2);}
.splitter{align-self:stretch;position:sticky;top:calc(var(--head-h) + var(--tabs-h) + var(--sp-2));height:calc(100vh - var(--head-h) - var(--tabs-h) - var(--sp-2) - var(--sp-4));cursor:col-resize;display:flex;align-items:center;justify-content:center;}
.splitter-grip{width:4px;height:60px;border-radius:var(--r-xs);background:var(--line);transition:background .15s,height .15s;position:relative;}
.splitter-grip::before,.splitter-grip::after{content:"";position:absolute;left:0;width:4px;height:4px;border-radius:50%;background:var(--panel);}
.splitter-grip::before{top:var(--sp-3);box-shadow:0 8px 0 var(--panel),0 16px 0 var(--panel);}
.ps-pair{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2);}
.ps-tri{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--sp-2);}
.ps-maps{display:flex;flex-direction:column;gap:var(--sp-3);align-items:stretch;}
.dirlbl{font-size:var(--fs-micro);font-weight:700;fill:var(--slate-10-vivid);letter-spacing:var(--ls-wide);text-anchor:middle;dominant-baseline:middle;pointer-events:none;}
.pmseg{cursor:pointer;transition:filter .1s;}
.pmseg.defect{filter:drop-shadow(0 1px 2px rgba(0,0,0,.28));}

section.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:var(--sp-2);overflow:hidden;}
section.card > header{background:var(--slate-2);border-bottom:1px solid var(--line);padding:var(--sp-2) var(--sp-3) calc(var(--sp-2) - var(--bw-hair));min-height:var(--card-head-h);
  display:flex;align-items:center;gap:var(--sp-2);}
section.card > header .t{font-weight:700;font-size:var(--fs-base);color:var(--head);}
section.card > header .h{font-size:var(--fs-tiny);color:var(--muted);font-weight:400;}
section.card > .body{padding:var(--sp-2) var(--sp-3) var(--sp-3);}

.fld{display:flex;flex-direction:column;gap:0;margin-bottom:var(--sp-2);}
.fld > label{font-size:var(--fs-tiny);color:var(--muted);font-weight:600;text-transform:uppercase;}
/* Opt out where letter case is itself clinical information. eGFR uppercased to
   EGFR reads as epidermal growth factor receptor — a gene — which in a cancer
   center is a genuinely dangerous collision. */
.fld > label.nocaps,.nocaps{text-transform:none!important;}
input,select,textarea{font-family:inherit;font-size:var(--fs-base);color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r-xs);padding:var(--sp-1) 6px;width:100%;}
input:focus,select:focus,textarea:focus{outline:var(--bw-rule) solid var(--accent);outline-offset:-1px;border-color:var(--accent);}
textarea{resize:vertical;min-height:36px;}
.row{display:flex;gap:var(--sp-1);flex-wrap:wrap;align-items:center;}
.prov{border-color:var(--accent)!important;background:var(--slate-3-vivid)!important;}
.prov-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:var(--sp-1);vertical-align:middle;}

.chip{display:inline-flex;align-items:center;gap:var(--sp-1);background:var(--chip);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:var(--sp-h) var(--sp-2);font-size:var(--fs-sm);cursor:pointer;user-select:none;margin:0 var(--sp-1) var(--sp-1) 0;line-height:var(--lh-body);}
.chip.on{background:var(--chipOn);border-color:var(--chipOn);color:var(--chipOnTx);}
.chip.neg{background:var(--red-4-soft);border-color:var(--red-7-soft);color:var(--red-13);}
.chip.amber{border-color:var(--amber-8-vivid);box-shadow:inset 0 0 0 1px var(--amber-7-vivid);}
.chipgrp{display:flex;flex-wrap:wrap;}
.chip.sub{background:var(--panel);border-style:dashed;font-size:var(--fs-sm);padding:var(--sp-h) var(--sp-2);}
.chip.sub.on{background:var(--accent);border-color:var(--accent);color:var(--panel);border-style:solid;}

/* auto-sizing field row: fields size to content, wrap as needed */
.grid-auto{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:flex-start;}
.grid-auto > .fld{margin-bottom:0;flex:0 0 auto;}
.fld.w-fname{flex:1 1 128px;min-width:108px;}
.w-lname{flex:1 1 128px;min-width:108px;}
/* a name box only needs to hold a name, not the row's spare space, so MRN,
   sex and date of birth fit on the line with them (increment 50) */
.fld.w-fname,.fld.w-lname{flex:1 1 calc(14ch + var(--sp-4));min-width:calc(10ch + var(--sp-4));max-width:calc(20ch + var(--sp-4));}
.w-dob{flex:0 0 140px;} .fld.w-mrn{flex:0 0 96px;}
.fld.w-age{flex:0 0 48px;} .fld.w-sex{flex:0 0 84px;} .fld.w-date{flex:0 0 148px;}
.fld.w-dx{flex:1 1 200px;min-width:148px;} .fld.w-ref{flex:1 1 180px;min-width:148px;}
.fld.w-race{flex:0 0 128px;} .fld.w-hisp{flex:0 0 108px;}
.fld.w-ht{flex:0 0 108px;} .fld.w-wt{flex:0 0 88px;} .fld.w-unit{flex:0 0 120px;}
.fld.w-echo{flex:0 0 76px;} .fld.w-out{flex:0 0 128px;}
.fld.w-comm{flex:1 1 220px;} .fld.w-time{flex:0 0 80px;} .fld.w-res{flex:1 1 160px;}
.fld.w-agent{flex:0 0 148px;} .fld.w-dose{flex:0 0 76px;} .fld.w-over{flex:0 0 84px;}
.fld .fld.w-hr input{width:52px;text-align:center;} .fld.w-bp{flex:0 0 auto;} .fld.w-amino{flex:0 0 200px;} .fld
.fld.w-cmp{flex:1 1 200px;}
/* segmented controls and their fields size to content (no trailing empty space) */
.fld > .seg{align-self:flex-start;width:auto;}
.grid-auto > .fld{width:auto;}
.grid-auto{margin-bottom:var(--sp-1);}
.map-legend{width:100%;margin-top:var(--sp-2);padding-top:var(--sp-2);border-top:1px solid var(--line);}
.legend-row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-1);font-size:var(--fs-tiny);color:var(--ink);}
.legend-lbl{font-size:var(--fs-micro);font-weight:700;text-transform:uppercase;color:var(--muted);min-width:56px;}
.legend-item{display:inline-flex;align-items:center;gap:var(--sp-1);}
.legend-sw{width:12px;height:12px;border-radius:var(--r-xs);display:inline-block;}
.race-note{font-size:var(--fs-micro);color:var(--muted);font-style:italic;margin-top:var(--sp-1);cursor:help;}
.fld.w-acc{flex:0 0 120px;}
.med-alert{margin-top:var(--sp-2);border:1px solid var(--amber-8-vivid);background:var(--amber-3-vivid);border-radius:var(--r-sm);padding:var(--sp-2) var(--sp-2);}
.med-alert-hd{font-size:var(--fs-sm);font-weight:700;color:var(--warn);margin-bottom:var(--sp-1);}
.med-alert-list{margin:0;padding-left:var(--sp-4);font-size:var(--fs-sm);color:var(--amber-13);line-height:var(--lh-body);}
.med-alert-list li{margin-bottom:var(--sp-1);}
.fast-tip{position:fixed;z-index:9999;display:none;max-width:280px;background:var(--slate-14-vivid);color:var(--panel);
  font-size:var(--fs-sm);line-height:var(--lh-tight);padding:var(--sp-1) var(--sp-2);border-radius:var(--r-sm);box-shadow:0 4px 14px rgba(0,0,0,.28);pointer-events:none;}
.fld.w-age input{width:56px;text-align:center;} .fld.w-age input.ro{background:var(--chip);color:var(--muted);cursor:default;}
input.ro{background:var(--chip);color:var(--muted);cursor:default;}

/* segmented control (mutually exclusive tabs) */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--panel);}
.seg .segbtn{background:var(--panel);border:none;border-right:1px solid var(--line);padding:var(--sp-1) 10px;font-size:var(--fs-sm);
  cursor:pointer;color:var(--ink);white-space:nowrap;}
.seg .segbtn:last-child{border-right:none;}
.seg .segbtn.on{background:var(--accent);color:var(--panel);}

/* calcium one-line row */
/* four vessels plus a total do not fit one line in a narrow column */
.cac-row{display:flex;gap:var(--sp-2);flex-wrap:wrap;}
.cac-box{flex:0 0 84px;display:flex;flex-direction:column;gap:0;align-items:center;}
.cac-box > label{font-size:var(--fs-tiny);color:var(--muted);font-weight:600;text-transform:uppercase;text-align:center;}
.cac-box input{text-align:center;}

/* diabetes submeds */
.submeds{margin-top:var(--sp-2);padding-top:var(--sp-2);border-top:1px dashed var(--line);}
.submeds-lbl{font-size:var(--fs-tiny);color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:var(--sp-1);}

/* correlation per-study detail */
.correl-detail{margin-top:var(--sp-1);padding:var(--sp-2);background:var(--slate-2);border:1px solid var(--line);border-radius:var(--r-sm);}

/* aminophylline preset row */
.amino-dose{display:flex;gap:var(--sp-1);align-items:center;}
.amino-dose .segbtn{border:1px solid var(--line);border-radius:var(--r-xs);background:var(--panel);padding:var(--sp-1) var(--sp-2);font-size:var(--fs-sm);cursor:pointer;}
.amino-dose .segbtn.on{background:var(--accent);color:var(--panel);border-color:var(--accent);}

/* read-out block styled like editable resident notes */
.readout-block{background:var(--amber-1);border:1px solid var(--amber-6-vivid);border-radius:var(--r-md);margin-bottom:var(--sp-2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--panel),0 1px 2px rgba(0,0,0,.04);}
.readout-head{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-1) var(--sp-2) calc(var(--sp-1) - var(--bw-hair));min-height:var(--card-head-h);background:var(--amber-4-vivid);border-bottom:1px solid var(--amber-6-vivid);}
.readout-title{font-weight:700;font-size:var(--fs-base);color:var(--amber-12);letter-spacing:var(--ls-wide);}
.readout-title::before{content:"\270e  ";}
.readout-sub{font-size:var(--fs-tiny);color:var(--amber-10);font-style:italic;}
.readout-text{width:100%;box-sizing:border-box;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:var(--fs-sm);
  line-height:var(--lh-body);border:none;border-radius:0;padding:var(--sp-3) var(--sp-3);resize:none;overflow:hidden;color:var(--amber-14-soft);
  background:linear-gradient(transparent calc(100% - var(--bw-hair)),var(--amber-5-vivid) calc(100% - var(--bw-hair))) 0 var(--sp-3) / 100% var(--lh-body) repeat-y local var(--amber-1);}
.readout-text:focus{outline:none;box-shadow:inset var(--bw-accent) 0 0 var(--amber-8-vivid);}
.readout-text::placeholder{color:var(--amber-9);}

.btn{background:var(--chip);border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--sp-1) 10px;font-size:var(--fs-sm);cursor:pointer;}
.btn.sm{padding:var(--sp-h) 6px;font-size:var(--fs-sm);}
.btn.on{background:var(--accent);color:var(--panel);border-color:var(--accent);}

pre.report{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-3);
  font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:var(--fs-sm);line-height:var(--lh-body);
  white-space:pre-wrap;word-break:break-word;max-height:calc(100vh - var(--head-h) - var(--tabs-h) - var(--sp-6));overflow:auto;color:var(--slate-15-soft);}
.report-tools{display:flex;gap:var(--sp-1);flex-wrap:wrap;margin-bottom:var(--sp-2);align-items:center;}

.banner{border-radius:var(--r-sm);padding:var(--sp-2) var(--sp-2);font-size:var(--fs-sm);margin-bottom:var(--sp-2);line-height:var(--lh-tight);}
.banner.warn{background:var(--warnBg);color:var(--warn);border:1px solid var(--amber-7-vivid);}
.banner.err{background:var(--errBg);color:var(--err);border:1px solid var(--red-8);}
.banner.ok{background:var(--okBg);color:var(--ok);border:1px solid var(--green-7-vivid);}
.banner.info{background:var(--slate-3-vivid);color:var(--blue-13);border:1px solid var(--blue-7-vivid);}

.qc-list{list-style:none;margin:var(--sp-1) 0 0;padding:0;}
.qc-list li{padding:var(--sp-1) var(--sp-2);border-radius:var(--r-xs);margin-bottom:var(--sp-1);font-size:var(--fs-sm);line-height:var(--lh-tight);}
.qc-list li.warn{background:var(--warnBg);color:var(--warn);}
.qc-list li.err{background:var(--errBg);color:var(--err);}

table.rev{width:100%;border-collapse:collapse;font-size:var(--fs-sm);margin-top:var(--sp-1);}
table.rev th,table.rev td{border:1px solid var(--line);padding:var(--sp-1) 6px;text-align:center;vertical-align:middle;}
table.rev td input,table.rev td select{text-align:center;width:100%;min-width:0;padding:var(--sp-1) var(--sp-h);}
table.rev th{background:var(--slate-2);font-size:var(--fs-tiny);text-transform:uppercase;color:var(--muted);}
.fld
table.rev td.mine{background:var(--slate-3-vivid);}
table.rev td.xml{background:var(--amber-3);}
.rev-pick{display:flex;gap:var(--sp-1);}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:var(--sp-4);}
.modal{background:var(--panel);border-radius:var(--r-md);max-width:760px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.3);}
.modal header{padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--line);display:flex;align-items:center;}
.modal header .t{font-weight:700;font-size:var(--fs-md);}
.modal .body{padding:var(--sp-3) var(--sp-4);}
.modal footer{padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--line);display:flex;gap:var(--sp-2);justify-content:flex-end;}

.ext-sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:var(--sp-2);}
.ext-sec > header{padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--line);background:var(--slate-2);font-weight:700;font-size:var(--fs-base);color:var(--head);cursor:pointer;display:flex;align-items:center;gap:var(--sp-2);}
.ext-sec > header .tier{font-size:var(--fs-micro);font-weight:600;padding:0 6px;border-radius:var(--r-md);text-transform:uppercase;letter-spacing:var(--ls-wide);}
.tier-a{background:var(--okBg);color:var(--ok);} .tier-b{background:var(--slate-3-vivid);color:var(--blue-13);} .tier-c{background:var(--amber-4);color:var(--amber-12);}
.ext-sec > .body{padding:var(--sp-2) var(--sp-3);font-size:var(--fs-sm);line-height:var(--lh-body);}
.ext-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2);}
 
.bull{width:240px;display:flex;flex-direction:column;align-items:center;position:relative;} .bull svg{display:block;}
/* the segment name lives in the corner a circular diagram cannot reach, so
   it never covers the thing being pointed at (increment 53) */
.seg-name{position:absolute;top:0;left:0;z-index:2;pointer-events:none;
  font-size:var(--fs-sm);font-weight:600;color:var(--accent);line-height:var(--lh-tight);
  max-width:calc(24*var(--u));min-height:var(--lh-tight);}
.pmseg{cursor:pointer;}
.seglbl{font-size:var(--fs-micro);fill:var(--slate-14-soft);pointer-events:none;text-anchor:middle;dominant-baseline:middle;font-weight:600;}
.mapttl{font-size:var(--fs-sm);font-weight:700;text-align:center;margin-bottom:var(--sp-1);color:var(--head);}

.hidden{display:none!important;}

/* ---- Extended teaching sections ---- */
.xs-sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:var(--sp-3);overflow:hidden;}
.xs-head{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3);background:var(--slate-2);border-bottom:1px solid var(--line);}
.xs-title{font-weight:700;font-size:var(--fs-md);color:var(--head);}
.xs-tag{margin-left:auto;font-size:var(--fs-micro);font-weight:700;letter-spacing:var(--ls-wide);text-transform:uppercase;padding:var(--sp-h) var(--sp-2);border-radius:var(--r-md);cursor:help;}
.tg-guide{background:var(--okBg);color:var(--ok);} .tg-lit{background:var(--slate-3-vivid);color:var(--blue-13);} .tg-model{background:var(--amber-4);color:var(--amber-12);}
.xs-body{padding:var(--sp-3) var(--sp-3);font-size:var(--fs-base);line-height:var(--lh-body);}
.xs-body.xs-grey{background:var(--slate-2);color:var(--slate-12-vivid);}
.xs-value{font-size:var(--fs-md);margin-bottom:var(--sp-2);}
.xs-big{font-size:var(--fs-num);font-weight:700;color:var(--head);letter-spacing:var(--ls-tight);}
.xs-body.xs-grey .xs-big{color:var(--slate-8-vivid);}
.xs-band{font-size:var(--fs-base);color:var(--muted);font-weight:600;}
.xs-na{font-style:italic;color:var(--slate-9-vivid);font-size:var(--fs-base);}
.xs-lbl{display:inline-block;font-size:var(--fs-micro);font-weight:700;text-transform:uppercase;letter-spacing:var(--ls-wide);color:var(--muted);margin-right:var(--sp-1);vertical-align:middle;}
.xs-formula{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:var(--fs-sm);background:var(--slate-3);border-radius:var(--r-xs);padding:var(--sp-1) var(--sp-2);margin:var(--sp-1) 0;color:var(--head);}
.xs-body.xs-grey .xs-formula{background:var(--slate-4);}
.xs-formula b{color:var(--accent);font-weight:700;}
.xs-inputs{margin:var(--sp-1) 0;display:flex;flex-wrap:wrap;gap:var(--sp-1) var(--sp-3);align-items:baseline;}
.xs-inp{font-size:var(--fs-sm);}
.xs-ik{color:var(--muted);}
.xs-blank{color:var(--vermilion-11);}
.xs-requires{margin:var(--sp-1) 0;font-size:var(--fs-sm);color:var(--amber-12);background:var(--amber-3);border-radius:var(--r-xs);padding:var(--sp-1) var(--sp-2);}
.xs-interp{margin:var(--sp-2) 0 var(--sp-1);font-size:var(--fs-sm);color:var(--slate-13-vivid);line-height:var(--lh-body);}
.xs-cites{margin-top:var(--sp-2);padding-top:var(--sp-2);border-top:1px dashed var(--line);}
.xs-cite{font-size:var(--fs-tiny);color:var(--muted);line-height:var(--lh-body);margin-bottom:0;}
.xs-caveat{margin-top:var(--sp-2);font-size:var(--fs-tiny);color:var(--amber-12);font-style:italic;}
.xs-legend{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);margin-bottom:var(--sp-3);font-size:var(--fs-sm);display:flex;gap:var(--sp-4);flex-wrap:wrap;align-items:center;}
.xs-legend .k{display:inline-flex;align-items:center;gap:var(--sp-1);}
.xs-legend .swatch{width:12px;height:12px;border-radius:var(--r-xs);display:inline-block;}

/* ===== Responsive: desktop >1200, laptop 900-1200, iPad mini 700-900, iPhone <700 ===== */
/* Laptop: narrow the sticky report column so the worksheet keeps room */
@media (max-width:1200px){
  .ps-main{grid-template-columns:minmax(0,1fr) var(--sp-4) 400px;}
}
/* iPad mini portrait (~768px) and small tablets: single column, report un-sticks */
@media (max-width:900px){
  .ps-main{grid-template-columns:minmax(0,1fr);gap:var(--sp-2);} #splitter{display:none;} .ps-report{padding-left:0;}
  .ps-report{position:static;top:auto;}
  .ps-pair,.ps-tri{grid-template-columns:1fr 1fr;}
  .ps-maps{justify-content:center;}
  .readout-text{min-height:168px;}
}
/* iPhone and narrow phones: everything stacks, touch-sized controls, 16px to stop iOS zoom */
@media (max-width:700px){
  .ps-head{flex-wrap:wrap;gap:var(--sp-1);padding:var(--sp-1) var(--sp-2);}
  .ps-head .title{font-size:var(--fs-md);}
  .ps-head button,.btn{min-height:36px;padding:6px 10px;}
  .ps-main{padding:var(--sp-2) var(--sp-2);}
  .ps-pair,.ps-tri{flex-wrap:wrap;}
  /* Was `flex:1 1 100%` — one field per row, so a three-character dose box sat
     alone on a 390px line with 280px of white to its right. Two per row by
     default; short numerics size to content and pack several per row. */
  .grid-auto > .fld{flex:1 1 46%;min-width:0;}
  .fld.w-age{flex:0 0 72px;} .fld.w-sex{flex:0 0 96px;} .fld.w-mrn{flex:1 1 140px;}
  .fld.w-race,.fld.w-hisp,.fld.w-ht,.fld.w-wt,.fld.w-unit{flex:1 1 46%;}
  .fld.w-dose,.fld.w-over,.fld.w-mm,.fld.w-hr,.fld.w-fn,.fld.w-vol,.fld.w-echo,
  .fld.w-time,.fld.w-egfr,.fld.w-ptp,.fld.w-dial{flex:0 1 auto;}
  .fld.w-dose input,.fld.w-over input,.fld.w-mm input,.fld.w-hr input,
  .fld.w-fn input,.fld.w-vol input,.fld.w-echo input{max-width:84px;}
  /* genuinely long text still earns a full row */
  .fld.w-dx,.fld.w-ref,.fld.w-comm,.fld.w-res,.fld.w-other,.fld.w-artother,
  .fld.w-agent,.fld.w-cmp{flex:1 1 100%;}
  input,select,textarea{font-size:var(--fs-lg);min-height:var(--tap);}
  /* a fixed-height seg clipped its own labels once buttons grew for touch */
  .seg{height:auto;min-height:var(--ctl-h);flex-wrap:wrap;}
  .seg .segbtn{padding:var(--sp-2) var(--sp-3);font-size:var(--fs-md);min-height:var(--tap);}
  .chip{font-size:var(--fs-md);padding:6px var(--sp-3);min-height:32px;}
  .cac-row{flex-wrap:wrap;} .cac-box{flex:1 1 44%;}
  .ps-maps{flex-direction:column;align-items:center;}
  .bull svg{width:min(78vw,260px);height:auto;}
  pre.report{max-height:none;font-size:var(--fs-md);}
  .readout-text{font-size:var(--fs-md);min-height:148px;}
  .amino-dose{flex-wrap:wrap;}
}

/* ===== Comprehensive Assessment ===== */
.ca-hero{background:linear-gradient(180deg,var(--slate-2),var(--slate-3-vivid));border:1px solid var(--line);
  border-left:var(--bw-accent) solid var(--accent);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);margin:var(--sp-2) 0;}
.ca-hero.attention{border-left-color:var(--amber-10-vivid);}
.ca-hero.critical{border-left-color:var(--accent2);background:linear-gradient(180deg,var(--vermilion-2),var(--vermilion-3));}
.ca-hero-l{font-size:var(--fs-sm);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--muted);font-weight:700;}
.ca-hero-t{font-size:var(--fs-xl);font-weight:700;color:var(--ink);margin:0 0 var(--sp-1);line-height:var(--lh-tight);}
.ca-hero p{margin:var(--sp-2) 0 var(--sp-1);font-size:var(--fs-md);line-height:var(--lh-body);color:var(--slate-14);}
.ca-caveat{border-left:var(--bw-accent) solid var(--amber-10-vivid);padding-left:var(--sp-2);background:var(--amber-2);}
.ca-panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);margin:var(--sp-2) 0;overflow:hidden;}
.ca-panel>header{display:flex;align-items:baseline;gap:var(--sp-2);flex-wrap:wrap;
  padding:var(--sp-2) var(--sp-3);background:var(--slate-3);border-bottom:1px solid var(--line);}
.ca-panel>header h3{margin:0;font-size:var(--fs-md);font-weight:700;color:var(--head);}
.ca-sub{font-size:var(--fs-sm);color:var(--muted);}
.ca-body{padding:var(--sp-3) var(--sp-3);}
.ca-grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--sp-2);}
.ca-stat{border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);background:var(--slate-1);border-top:var(--bw-accent) solid var(--line);}
.ca-stat.f-ok{border-top-color:var(--green-10-vivid);} .ca-stat.f-attention{border-top-color:var(--amber-9-vivid);}
.ca-stat.f-high{border-top-color:var(--accent2);} .ca-stat.f-none{border-top-color:var(--slate-7-vivid);}
.ca-k{font-size:var(--fs-tiny);text-transform:uppercase;letter-spacing:var(--ls-caps);color:var(--muted);font-weight:700;}
.ca-v{font-size:var(--fs-lg);font-weight:700;color:var(--ink);margin:var(--sp-1) 0 0;line-height:var(--lh-tight);}
.ca-n{font-size:var(--fs-sm);color:var(--muted);line-height:var(--lh-tight);}
.ca-item{border-left:var(--bw-accent) solid var(--slate-7-vivid);padding:var(--sp-2) 0 var(--sp-2) var(--sp-3);margin:var(--sp-2) 0;}
.ca-item.f-ok{border-left-color:var(--green-10-vivid);} .ca-item.f-attention{border-left-color:var(--amber-9-vivid);}
.ca-item.f-high{border-left-color:var(--accent2);}
.ca-item-h{display:flex;align-items:baseline;gap:var(--sp-2);flex-wrap:wrap;font-size:var(--fs-md);}
.ca-item-v{color:var(--accent);font-weight:700;}
.ca-item p{margin:var(--sp-1) 0 0;font-size:var(--fs-base);line-height:var(--lh-body);color:var(--slate-13);}
.ca-cite{font-size:var(--fs-tiny);color:var(--muted);border:1px solid var(--line);border-radius:var(--r-xs);
  padding:0 var(--sp-1);cursor:help;white-space:nowrap;background:var(--slate-2);}
.ca-conf{font-size:var(--fs-tiny);font-weight:700;text-transform:uppercase;letter-spacing:var(--ls-wide);
  padding:var(--sp-h) 6px;border-radius:var(--r-md);}
.ca-conf.c-high{background:var(--okBg);color:var(--ok);}
.ca-conf.c-moderate{background:var(--warnBg);color:var(--warn);}
.ca-conf.c-low,.ca-conf.c-insufficient{background:var(--errBg);color:var(--err);}
.ca-rec{border:1px solid var(--line);border-radius:var(--r-md);margin:var(--sp-2) 0;overflow:hidden;}
.ca-rec.p-high{border-left:var(--bw-accent) solid var(--accent2);}
.ca-rec.p-moderate{border-left:var(--bw-accent) solid var(--amber-9-vivid);}
.ca-rec.p-low{border-left:var(--bw-accent) solid var(--slate-10-vivid);}
.ca-rec-h{display:flex;align-items:baseline;gap:var(--sp-2);flex-wrap:wrap;padding:var(--sp-2) var(--sp-3);background:var(--slate-2);font-size:var(--fs-md);}
.ca-pri{font-size:var(--fs-micro);font-weight:700;text-transform:uppercase;letter-spacing:var(--ls-caps);
  background:var(--head);color:var(--headtx);padding:var(--sp-h) 6px;border-radius:var(--r-md);}
.ca-rec-b{padding:var(--sp-2) var(--sp-3) var(--sp-3);}
.ca-rec-row{display:grid;grid-template-columns:76px 1fr;gap:var(--sp-2);margin:var(--sp-1) 0;font-size:var(--fs-base);line-height:var(--lh-body);}
.ca-lbl{font-size:var(--fs-tiny);text-transform:uppercase;letter-spacing:var(--ls-caps);color:var(--muted);font-weight:700;padding-top:0;}
.ca-table{width:100%;border-collapse:collapse;font-size:var(--fs-base);}
.ca-table th{background:var(--slate-3);text-align:left;padding:var(--sp-1) var(--sp-2);border-bottom:1px solid var(--line);
  font-size:var(--fs-tiny);text-transform:uppercase;letter-spacing:var(--ls-wide);color:var(--muted);}
.ca-table td{padding:var(--sp-1) var(--sp-2);border-bottom:1px solid var(--slate-4);}
.ca-table tr.cc-concordant td{background:var(--red-3);}
.ca-table tr.cc-defect-only td{background:var(--amber-2);}
.ca-table tr.cc-flow-only td{background:var(--amber-3);}
.ca-note{font-size:var(--fs-base);line-height:var(--lh-body);color:var(--slate-13);margin:var(--sp-2) 0 0;
  border-left:var(--bw-accent) solid var(--amber-9-vivid);padding-left:var(--sp-2);}
.ca-verdict{font-size:var(--fs-md);font-weight:700;padding:var(--sp-2) var(--sp-3);border-radius:var(--r-sm);margin-bottom:var(--sp-2);}
.ca-verdict.v-high{background:var(--okBg);color:var(--ok);}
.ca-verdict.v-moderate{background:var(--warnBg);color:var(--warn);}
.ca-verdict.v-low,.ca-verdict.v-insufficient{background:var(--errBg);color:var(--err);}
.ca-flags{font-size:var(--fs-base);color:var(--err);background:var(--errBg);padding:var(--sp-2) var(--sp-2);border-radius:var(--r-sm);margin-top:var(--sp-2);}
.ca-exp{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:var(--sp-2);margin-bottom:var(--sp-2);}
.ca-exp-i{border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--sp-2) var(--sp-2);background:var(--slate-1);font-size:var(--fs-base);}
.ca-exp-i .ca-lbl{display:block;margin-bottom:0;}
.ca-dx{border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);margin:var(--sp-2) 0;background:var(--slate-1);}
.ca-dx-h{display:flex;align-items:baseline;gap:var(--sp-2);flex-wrap:wrap;font-size:var(--fs-md);margin-bottom:var(--sp-1);}
.ca-rank{width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--panel);
  font-size:var(--fs-sm);font-weight:700;display:inline-flex;align-items:center;justify-content:center;}
.ca-dx-b{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);}
@media(max-width:720px){.ca-dx-b{grid-template-columns:1fr;}}
.ca-dx-b ul{margin:var(--sp-1) 0 0;padding-left:var(--sp-4);font-size:var(--fs-base);line-height:var(--lh-body);}
.ca-for ul li{color:var(--ok);} .ca-against ul li{color:var(--err);}
.ca-tag{font-size:var(--fs-micro);font-weight:700;text-transform:uppercase;letter-spacing:var(--ls-wide);
  background:var(--warnBg);color:var(--warn);padding:var(--sp-h) 6px;border-radius:var(--r-md);}
.ca-grps{display:grid;grid-template-columns:repeat(auto-fit,minmax(216px,1fr));gap:var(--sp-2);}
.ca-grp{border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--sp-2) var(--sp-2);background:var(--slate-1);}
.ca-grp-h{display:flex;justify-content:space-between;font-size:var(--fs-base);margin-bottom:var(--sp-1);}
.ca-bar{height:4px;background:var(--slate-4-vivid);border-radius:var(--r-xs);overflow:hidden;}
.ca-bar i{display:block;height:100%;background:var(--accent);}
