/* ================= XML IMPORT ================= */
function parseXml(xmlText){
  // Defensive 4DM XML parse. Returns {fields:{path:{value,confident,reason}}, raw}
  var out={fields:{},qc:[],raw:xmlText};
  var doc;
  try{ doc=new DOMParser().parseFromString(xmlText,"application/xml"); }
  catch(e){ out.qc.push({level:"err",msg:"XML could not be parsed: "+e.message}); return out; }
  if(doc.querySelector("parsererror")){ out.qc.push({level:"err",msg:"Malformed XML \u2014 review before applying."}); }
  function grabNum(selList){ for(var i=0;i<selList.length;i++){ var n=doc.querySelector(selList[i]); if(n&&n.textContent!=null){ var v=parseFloat(n.textContent); if(!isNaN(v))return v; } } return null; }
  function grabText(selList){ for(var i=0;i<selList.length;i++){ var n=doc.querySelector(selList[i]); if(n&&n.textContent)return n.textContent.trim(); } return null; }
  function put(path,value,confident,reason){ out.fields[path]={value:value,confident:confident!==false,reason:reason||""}; }

  // EF
  var efR=grabNum(["EF_REST","REST_EF","GATED_REST EF","EJECTION_FRACTION_REST"]);
  var efS=grabNum(["EF_STRESS","STRESS_EF","GATED_STRESS EF","EJECTION_FRACTION_STRESS"]);
  if(efR!=null) put("ef.rest", clampPct(efR), inRange(efR,10,90), rangeReason(efR,10,90,"EF"));
  if(efS!=null) put("ef.stress", clampPct(efS), inRange(efS,10,90), rangeReason(efS,10,90,"EF"));
  // volumes/mass
  var esv=grabNum(["ESV_REST","REST_ESV","END_SYSTOLIC_VOLUME_REST"]);
  var edv=grabNum(["EDV_REST","REST_EDV","END_DIASTOLIC_VOLUME_REST"]);
  var mass=grabNum(["LV_MASS","MYOCARDIAL_MASS","MASS_REST"]);
  if(esv!=null)put("esvRest",esv,inRange(esv,10,400),rangeReason(esv,10,400,"ESV"));
  if(edv!=null)put("edvRest",edv,inRange(edv,20,500),rangeReason(edv,20,500,"EDV"));
  if(mass!=null)put("massRest",mass,inRange(mass,50,400),rangeReason(mass,50,400,"LV mass"));
  // TID ratio (import ratio only, toggle stays manual)
  var tid=grabNum(["TID_RATIO","TID","SHR"]);
  if(tid!=null)put("tid.ratio",tid,inRange(tid,0.7,1.6),rangeReason(tid,0.7,1.6,"TID ratio"));
  // SSS/SRS -> derive scores? we import segment scores if present
  var segNodes=doc.querySelectorAll("SEGMENT, SEG, MYO_SEGMENT");
  var stress={},rest={},haveSeg=false;
  segNodes.forEach(function(node){
    var id=parseInt(node.getAttribute("id")||node.getAttribute("index")||node.getAttribute("num")||"",10);
    if(!id||id<1||id>17)return;
    var s=node.getAttribute("stress")||node.getAttribute("stress_score");
    var r=node.getAttribute("rest")||node.getAttribute("rest_score");
    if(s!=null){var sv=parseInt(s,10); if(!isNaN(sv)){stress[id]=Math.max(0,Math.min(4,sv));haveSeg=true;}}
    if(r!=null){var rv=parseInt(r,10); if(!isNaN(rv)){rest[id]=Math.max(0,Math.min(4,rv));}}
  });
  if(haveSeg){ put("stress",stress,true,""); put("rest",rest,true,""); }
  // flow (LAD/LCX/RCA/Global) — element paths INFERRED; flagged for confirmation when present
  ["LAD","LCX","RCA","GLOBAL"].forEach(function(terr){
    var ms=grabNum([terr+"_STRESS_MBF",terr+" STRESS_FLOW","STRESS_"+terr+"_MBF"]);
    var mr=grabNum([terr+"_REST_MBF",terr+" REST_FLOW","REST_"+terr+"_MBF"]);
    var key=terr==="GLOBAL"?"Global":terr;
    if(ms!=null)put("flow."+key+".stress",ms,false,"flow element path inferred \u2014 confirm");
    if(mr!=null)put("flow."+key+".rest",mr,false,"flow element path inferred \u2014 confirm");
  });
  // calcium
  ["LM","LAD","LCX","RCA"].forEach(function(v){
    var c=grabNum([v+"_CALCIUM",v+"_AGATSTON","CAC_"+v]);
    if(c!=null)put("calcium."+v,c,inRange(c,0,5000),rangeReason(c,0,5000,"CAC"));
  });
  // doses / study date / hemodynamics
  var rd=grabNum(["REST_DOSE","INJECTION_REST_DOSE"]), sd=grabNum(["STRESS_DOSE","INJECTION_STRESS_DOSE"]);
  if(rd!=null)put("rx.restDose",rd,false,"confirm injected activity");
  if(sd!=null)put("rx.stressDose",sd,false,"confirm injected activity");
  var age=grabNum(["AGE","PATIENT_AGE"]); if(age!=null)put("pt.age",age,inRange(age,18,110),rangeReason(age,18,110,"age"));
  var hr=grabNum(["REST_HR","BASELINE_HR"]); if(hr!=null)put("stressData.restHR",hr,inRange(hr,30,140),rangeReason(hr,30,140,"HR"));
  var sbp=grabNum(["REST_SBP","BASELINE_SBP"]); if(sbp!=null)put("stressData.restSBP",sbp,inRange(sbp,70,220),rangeReason(sbp,70,220,"SBP"));

  // QC checks on parsed data
  runImportQC(out);
  return out;
}
function clampPct(v){ return v; }
function inRange(v,lo,hi){ return v>=lo&&v<=hi; }
function rangeReason(v,lo,hi,label){ return (v<lo||v>hi)?(label+" "+v+" is outside the expected range "+lo+"\u2013"+hi):""; }
function runImportQC(out){
  var f=out.fields;
  // rest-worse-than-stress across imported segments
  if(f.stress&&f.rest){
    var worse=0; for(var i=1;i<=17;i++){ if((f.rest.value[i]||0)>(f.stress.value[i]||0))worse++; }
    if(worse>=3)out.qc.push({level:"warn",msg:"Rest scores exceed stress in "+worse+" segments (reverse redistribution pattern) \u2014 verify rest processing."});
  }
  // implausible SUV / scale
  for(var k in f){ if(/mbf|flow/i.test(k) && f[k].value>10){ out.qc.push({level:"warn",msg:k+" = "+f[k].value+" mL/min/g is implausibly high (possible SUV scale error)."}); } }
}

function processXml(xmlText){
  var parsed = window.Parse4DM ? window.Parse4DM.parse(xmlText) : parseXml(xmlText);
  S._rawXml=xmlText;
  // normalize qc shape ({level,code,msg} from new parser) for renderReview
  var qc = (parsed.qc||[]).map(function(q){ return {level:q.level==="err"?"err":q.level==="info"?"warn":q.level, msg:q.msg||q}; });
  // partition: confident + no-conflict apply silently; uncertain OR conflicting go to review
  var toReview=[], applied=0;
  for(var path in parsed.fields){
    var fld=parsed.fields[path];
    var cur=getPath(path);
    var conflict = isConflict(path,cur,fld.value);
    if(fld.confident && !conflict){ applyField(path,fld.value); applied++; }
    else { toReview.push({path:path,value:fld.value,cur:cur,confident:fld.confident,reason:fld.reason,conflict:conflict}); }
  }
  renderReview(toReview,qc,applied);
  renderWorksheet(); scheduleReport();
}
function isConflict(path,cur,incoming){
  if(path==="stress"||path==="rest"){ // object compare: conflict if any manual nonzero differs
    var anyManual=false; for(var i=1;i<=17;i++){ if((cur&&cur[i])>0){anyManual=true;break;} }
    return anyManual;
  }
  if(cur==null||cur==="")return false;
  return String(cur)!==String(incoming);
}
function applyField(path,value){
  if(path==="stress"||path==="rest"){ for(var i=1;i<=17;i++){ if(value[i]!=null)S[path][i]=value[i]; } }
  else if(path==="motion"){ WALLS.forEach(function(w){ if(value[w]!=null)S.motion[w]=value[w]; }); }
  else if(path==="thickening"){ WALLS.forEach(function(w){ if(value[w]!=null)S.thickening[w]=value[w]; }); }
  else if(path==="pt.hispanic"){ S.pt.hispanic = (value===true||value==="yes")?"yes":(value===false||value==="no")?"no":""; }
  else setPath(path,value);
  S._prov[path]=true;
}
function renderReview(toReview,qc,applied){
  var area=$("#reviewArea"); if(!area)return; area.innerHTML="";
  area.appendChild(el("div",{class:"banner ok"},[applied+" field(s) applied automatically."]));
  if(qc.length){
    var ul=el("ul",{class:"qc-list"},qc.map(function(q){ return el("li",{class:q.level},[q.msg]); }));
    area.appendChild(el("div",null,[el("div",{style:"font-weight:700;margin:var(--sp-1) 0 0;font-size:var(--fs-sm);"},["Data-quality flags (worksheet + Extended tab)"]),ul]));
  }
  if(!toReview.length){ area.appendChild(el("div",{class:"banner info"},["Nothing left to review. Close this dialog."])); return; }
  var tbl=el("table",{class:"rev"},[]);
  tbl.appendChild(el("tr",null,[el("th",null,["Field"]),el("th",null,["Your value"]),el("th",null,["XML value"]),el("th",null,["Reason"]),el("th",null,["Choose"])]));
  toReview.forEach(function(item){
    var picked={v:item.conflict?null:item.value}; // conflicts require explicit choice
    var mineTd=el("td",{class:"mine"},[fmtVal(item.cur)]);
    var xmlTd=el("td",{class:"xml"},[fmtVal(item.value)]);
    var pick=el("div",{class:"rev-pick"},[
      el("button",{class:"btn sm",onclick:function(e){ setPick(e,"mine"); picked.v=item.cur; }},["Keep mine"]),
      el("button",{class:"btn sm on",onclick:function(e){ setPick(e,"xml"); picked.v=item.value; applyField(item.path,item.value); renderWorksheet(); scheduleReport(); }},["Use XML"])
    ]);
    if(!item.conflict){ // uncertain but no conflict -> default apply, allow reject
      applyField(item.path,item.value);
    }
    item._picked=picked;
    tbl.appendChild(el("tr",null,[ el("td",null,[prettyPath(item.path)]), mineTd, xmlTd, el("td",null,[item.reason||(item.conflict?"differs from your entry":"low confidence")]), el("td",null,[pick]) ]));
  });
  area.appendChild(el("div",{style:"font-weight:700;margin:var(--sp-2) 0 0;font-size:var(--fs-sm);"},["Review before applying"]));
  area.appendChild(tbl);
}

/* Diabetes medicines, so a metformin on the list reaches the DM registry. */
var EPIC_DMMEDS=[["metformin",/\b(metformin|glucophage)\b/i],
  ["empagliflozin",/\b(empagliflozin|jardiance)\b/i],["dapagliflozin",/\b(dapagliflozin|farxiga)\b/i],
  ["semaglutide",/\b(semaglutide|ozempic|wegovy)\b/i],["dulaglutide",/\b(dulaglutide|trulicity)\b/i],
  ["sitagliptin",/\b(sitagliptin|januvia)\b/i],["glipizide",/\b(glipizide|glucotrol)\b/i],
  ["insulinglargine",/\b(insulin glargine|lantus|basaglar|toujeo)\b/i],
  ["pioglitazone",/\b(pioglitazone|actos)\b/i]];

var EPIC_CANCER=[[/\bbreast\b/i,"Breast carcinoma"],[/\bhodgkin\b/i,"Hodgkin lymphoma"],
  [/\b(non-?hodgkin|dlbcl|lymphoma)\b/i,"Lymphoma"],[/\b(nsclc|lung (ca|cancer|carcinoma))\b/i,"Lung carcinoma"],
  [/\b(multiple myeloma|myeloma)\b/i,"Multiple myeloma"],[/\bsarcoma\b/i,"Sarcoma"],
  /* The abbreviations must be CAPITALS and are matched case-sensitively: "All"
     in "Expand All Collapse All" was being read as acute lymphoblastic
     leukemia, and it is the first cancer pattern that matches. */
  [/\bleukemia\b/i,"Leukemia"],[/\b(AML|CML|CLL|ALL)\b/,"Leukemia"],
  [/\besophag/i,"Esophageal carcinoma"],
  [/\bprostate\b/i,"Prostate carcinoma"],[/\bcolorectal|colon ca/i,"Colorectal carcinoma"]];
/* keys must match the HX registry above */
var EPIC_HX=[["htn",/\b(hypertension|htn)\b/i],["dm",/\b(diabetes mellitus|diabetes|dm2|t2dm)\b/i],
  ["hld",/\b(hyperlipidemia|dyslipidemia|hld)\b/i],["tobacco",/\b(smok\w*|tobacco)\b/i],
  /* "Denies any Hx of MI, CHF" \u2014 the abbreviation alone, which is how it is
     almost always written. Capitals only: "mi" is a fragment of other words. */
  ["priormi",/\b(myocardial infarction|stemi|nstemi|prior mi)\b/i,/\bMI\b/],
  ["pci",/\b(pci|stent|angioplasty)\b/i],["cabg",/\b(cabg|bypass graft)\b/i],
  ["chf",/\b(heart failure|chf|hfref|hfpef)\b/i],
  ["fhxcad",/\bfamily history[^.\n]{0,40}(cad|coronary)\b/i]];
/* keys must match the MEDS registry above */
/* Epic prints the generic with the brand in parentheses, and sometimes only
   the brand. Both are matched. */
var EPIC_MEDS=[["metoprolol",/\b(metoprolol|toprol|lopressor)\b/i],["atenolol",/\batenolol\b/i],["carvedilol",/\bcarvedilol\b/i],
  ["atorvastatin",/\b(atorvastatin|lipitor)\b/i],["rosuvastatin",/\b(rosuvastatin|crestor)\b/i],
  ["aspirin",/\b(aspirin|asa|ecotrin)\b/i],["clopidogrel",/\b(clopidogrel|plavix)\b/i],
  ["apixaban",/\b(apixaban|eliquis)\b/i],
  ["lisinopril",/\b(lisinopril|zestril|prinivil)\b/i],["losartan",/\b(losartan|cozaar)\b/i],
  ["amlodipine",/\b(amlodipine|norvasc)\b/i],
  ["nitroglycerin",/\b(nitroglycerin|ntg|nitrostat)\b/i],
  ["isosorbide",/\b(isosorbide|imdur|isordil|monoket)\b/i],
  ["theophylline",/\btheophylline\b/i],["dipyridamole",/\bdipyridamole\b/i],
  ["verapamil",/\b(verapamil|calan)\b/i],["diltiazem",/\b(diltiazem|cardizem|tiazac)\b/i]];

/* Clause-scoped parsing. Matching against the whole note treats "no hypertension",
   "allergic to aspirin" and "family history of breast cancer" as positive findings.
   For a research registry that is worse than not parsing at all, because it produces
   confident wrong data. Text is therefore split into clauses and each clause is
   classified before any match is applied. */
var NEG_CUE = /\b(no|not|non|never|denies|denied|denying|negative for|without|w\/o|declined|refused|refusing|held|stopped|discontinued|intolerant|intolerance|allergic|allergy|contraindicat\w*|rule out|r\/o|unlikely)\b/i;
var FAMHX_CUE = /\b(family (history|hx)|\bfhx?\b|mother|father|sister|brother|sibling|maternal|paternal|grandmother|grandfather)\b/i;
var ALLERGY_CUE = /\ballerg/i;

/* Epic notes are sections, and inside them TABLES FLATTENED to one cell per
   line. A clause therefore has to carry the section it came from: the line
   "Prostate cancer" means the patient's cancer under PAST MEDICAL HISTORY and
   the father's under FAMILY HISTORY, and nothing in the line itself says
   which. Reading these as bare strings is how a father's myocardial infarction
   became the patient's. */
var EPIC_SECTION_RE=/^\s*([A-Z][A-Z0-9 &'\/()-]{3,})\s*:\s*$/;
var SECTION_ALIAS=[
  [/FAMILY (HISTORY|HX)/, "famhx"],
  [/ALLERG/,              "allergy"],
  [/(ACTIVE |CURRENT )?(OUTPATIENT )?MEDICATION/, "meds"],
  [/PAST MEDICAL HISTORY|MEDICAL HISTORY|PROBLEM LIST/, "pmh"],
  [/SOCIAL (HISTORY|HX)/, "social"],
  [/ONCOLOG/,             "onco"],
  [/SURGICAL/,            "surgical"],
  [/PHYSICAL EXAM/,       "exam"],
  [/VITALS?/,             "vitals"],
  [/LABS?|DATA REVIEW/,   "labs"]
];
function epicSectionOf(head){
  for(var i=0;i<SECTION_ALIAS.length;i++) if(SECTION_ALIAS[i][0].test(head)) return SECTION_ALIAS[i][1];
  return "other";
}
/* Epic hard-wraps prose at the note's width, so one sentence arrives as
   several lines. Splitting on line breaks first therefore cuts sentences in
   half \u2014 "She completed doxorubicin and" / "cyclophosphamide (cumulative
   doxorubicin 240 mg/m2)" put the drug and its dose in different clauses, and
   the dose was never found. A line that does not end a sentence, followed by a
   line that starts in lower case, is a wrap and is rejoined. Table cells are
   safe: they start with a capital or a digit. */
function epicUnwrap(lines){
  var out=[];
  for(var i=0;i<lines.length;i++){
    var cur=lines[i];
    while(i+1<lines.length){
      var nx=lines[i+1];
      if(!/\S/.test(cur)||!/\S/.test(nx)) break;
      if(/[.!?:;\u2022]\s*$/.test(cur)) break;
      if(!/^\s*[a-z(]/.test(nx)) break;
      cur=cur.replace(/\s+$/,"")+" "+nx.replace(/^\s+/,"");
      i++;
    }
    out.push(cur);
  }
  return out;
}
function epicClauses(t){
  var lines=epicUnwrap(String(t||"").split(/\r?\n/));
  var out=[], sec="header";
  for(var i=0;i<lines.length;i++){
    var raw=lines[i], hm=raw.match(EPIC_SECTION_RE);
    if(hm){ sec=epicSectionOf(hm[1]); continue; }
    /* a lone bullet is a row marker, not content */
    var line=raw.replace(/^\s*[\u2022\u00b7*-]\s*/,"").trim();
    if(!line) continue;
    /* prose still splits into sentences and semicolon clauses; a table cell has
       neither and stays whole */
    line.split(/;+|(?<=[.!?])\s+/).map(function(x){return x.trim();}).filter(Boolean)
        .forEach(function(x){ out.push({text:x, sec:sec}); });
  }
  return out;
}
function clauseText(c){ return typeof c==="string"?c:c.text; }
function clauseFlags(c){
  var txt=clauseText(c), sec=(typeof c==="string")?"other":c.sec;
  return { famhx:  sec==="famhx"   || FAMHX_CUE.test(txt),
           allergy:sec==="allergy" || ALLERGY_CUE.test(txt),
           sec:sec };
}
/* A match is negated when a negation cue occurs earlier in the same clause.
   Handles "no hypertension, no diabetes" and "denies tobacco use"; leaves
   "hypertension but no diabetes" correctly split. */
/* Words that assert a finding is present. Their appearance in the term's own
   comma-segment overrides an earlier negation cue. */
var AFFIRM_CUE=/\b(present|positive|active|ongoing|documented|known|controlled|on treatment|dx'?d|diagnosed)\b/i;
/* Words that terminate a negation's scope outright. */
var NEG_STOP=/\b(but|however|although|though|except|aside from|other than)\b/i;

function negatedAt(clause, idx){
  var head=clause.slice(0, idx);

  /* A negation does not run to the end of a sentence. "Hypertension present, no
     diabetes, hyperlipidemia present" must not negate hyperlipidemia, while
     "no chest pain, dyspnea or palpitations" must negate all three. The
     difference is whether the term's own segment asserts presence. */
  var segStart=Math.max(head.lastIndexOf(','), head.lastIndexOf(';'));
  var segEnd=clause.indexOf(',', idx);
  if(segEnd<0) segEnd=clause.length;
  /* a contrast word also ends the term's own segment, so an affirmation after
     "but" cannot reach back and rescue a term that was negated before it */
  var tail=clause.slice(idx);
  var stopAfter=tail.search(NEG_STOP);
  if(stopAfter>=0) segEnd=Math.min(segEnd, idx+stopAfter);
  var ownSegment=clause.slice(segStart+1, segEnd);
  if(AFFIRM_CUE.test(ownSegment)) return false;

  /* an explicit contrast word ends the scope of anything before it */
  var stop=head.search(NEG_STOP);
  if(stop>=0) head=head.slice(stop);

  var re=new RegExp(NEG_CUE.source, 'gi');
  return re.exec(head)!==null;
}
function findIn(clause, re){
  var m=clause.match(re);
  if(!m) return -1;
  return clause.indexOf(m[0]);
}

function parseEpicNote(txt){
  var applied=[], t=String(txt||"");
  if(!t.trim()) return applied;
  S.onco.epicRaw=t;
  var clauses=epicClauses(t);

  function scan(re, onPositive, onNegated, opts){
    opts=opts||{};
    for(var i=0;i<clauses.length;i++){
      var c=clauses[i], fl=clauseFlags(c), ct=clauseText(c);
      var idx=findIn(ct,re);
      if(idx<0) continue;
      if(fl.allergy && !opts.allowAllergy) continue;          /* allergy list is not a med list */
      if(fl.famhx && !opts.allowFamhx) continue;              /* family history is not the patient */
      if(opts.sections && opts.sections.indexOf(fl.sec)<0) continue;
      if(negatedAt(ct,idx)){ if(onNegated) onNegated(ct); continue; }
      onPositive(ct); return true;
    }
    return false;
  }

  /* Age and sex are written two ways in the same note: the fellow's one-liner
     "80yoM" and Epic's own "is a 80 y.o. male". Both, and both before the name,
     because the name pattern hangs off the same sentence. */
  var demo=t.match(/\b(\d{1,3})\s*y\.?\s*o\.?\s*(?:year[- ]old\s*)?(male|female|man|woman|m|f)\b/i)
        || t.match(/\b(\d{1,3})\s*yo\s*([mf])\b/i)
        || t.match(/\b(\d{1,3})\s*(?:year|yr)s?[- ]old\s+(male|female|man|woman)\b/i);
  if(demo){
    if(!S.pt.age){ S.pt.age=demo[1]; applied.push({k:"Age",v:demo[1]}); }
    var g=demo[2].toLowerCase();
    var sex=(g==="m"||g==="male"||g==="man")?"male":"female";
    if(!S.pt.sex){ S.pt.sex=sex; applied.push({k:"Sex",v:sex}); }
  }
  /* "<name> is a 80 y.o. male" — Epic's own patient-ID line and the first line
     of most HPIs. The last token is taken as the surname, which is right for
     "First Last" and for a surname-first name written in full; either way the
     reader can correct it, and a name in the box beats an empty one. */
  if(!S.pt.lastName){
    var nl=t.match(/(?:^|\n|Patient ID:\s*)([\p{L}][\p{L}'\u2019\-]*(?:\s+[\p{L}][\p{L}'\u2019\-]*){0,3})\s+is\s+an?\s+\d{1,3}\s*y/u);
    if(nl){
      var parts=nl[1].trim().split(/\s+/);
      if(parts.length>=2){
        S.pt.lastName=parts[parts.length-1];
        S.pt.firstName=parts.slice(0,-1).join(" ");
        applied.push({k:"Name",v:S.pt.firstName+" "+S.pt.lastName});
      }
    }
  }

  /* Epic headers usually carry "Last, First" and a DOB near the top. */
  if(!S.pt.lastName){
    var nm=t.match(/(?:^|\n)\s*(?:Patient(?: Name)?|Name)\s*[:\-]\s*(\p{L}[\p{L}'\u2019\u02BC\-]*)\s*,\s*(\p{L}[\p{L}'\u2019\u02BC\-]*)/u);
    if(nm){ S.pt.lastName=nm[1]; S.pt.firstName=nm[2]; syncName();
      applied.push({k:"Name",v:nm[2]+" "+nm[1]}); }
  }
  if(!S.pt.dob){
    var db=t.match(/\b(?:DOB|D\.O\.B\.|Date of Birth|Born)\s*[:\-]?\s*(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/i);
    if(db){
      var iso=db[3]+"-"+String(db[1]).padStart(2,"0")+"-"+String(db[2]).padStart(2,"0");
      S.pt.dob=iso; syncAge(); applied.push({k:"Date of birth",v:iso});
    }
  }

  EPIC_RX.forEach(function(r){
    scan(r.re, function(){ r.set(); applied.push({k:"Therapy",v:r.label}); });
  });

  if(!S.onco.cancerType) for(var i=0;i<EPIC_CANCER.length;i++){
    (function(entry){
      if(S.onco.cancerType) return;
      scan(entry[0], function(){ S.onco.cancerType=entry[1]; applied.push({k:"Malignancy",v:entry[1]}); });
    })(EPIC_CANCER[i]);
  }

  var st=t.match(/\bstage\s+(IV|I{1,3}|[1-4])\s*([ABC])?\b/i);
  if(st&&!S.onco.stage){ S.onco.stage=(st[1]+(st[2]||"")).toUpperCase(); applied.push({k:"Stage",v:S.onco.stage}); }

  /* Cumulative anthracycline dose. The agent matters: dose is only interpretable
     once converted to a doxorubicin-equivalent, and the factor differs by drug. */
  var DRUGS=[[/\b(doxorubicin|adriamycin)\b/i,'doxorubicin'],[/\bepirubicin\b/i,'epirubicin'],
             [/\bdaunorubicin\b/i,'daunorubicin'],[/\bidarubicin\b/i,'idarubicin'],
             [/\bmitoxantrone\b/i,'mitoxantrone']];
  for(var di=0; di<DRUGS.length; di++){
    var dre=DRUGS[di];
    var found=false;
    for(var ci=0; ci<clauses.length; ci++){
      var cl=clauseText(clauses[ci]), flg=clauseFlags(clauses[ci]);
      if(flg.allergy||flg.famhx) continue;
      var at=findIn(cl,dre[0]); if(at<0) continue;
      if(negatedAt(cl,at)) continue;
      var dm=cl.match(/(\d{2,4})\s*mg\s*\/?\s*m\s*\^?2/i);
      if(dm&&!S.onco.anthraDose){
        S.onco.anthraDose=dm[1]; S.onco.anthra=true; S.onco.anthraDrug=dre[1];
        applied.push({k:"Anthracycline",v:dm[1]+" mg/m\u00b2 "+dre[1]});
      } else if(!S.onco.anthraDrug){ S.onco.anthraDrug=dre[1]; }
      found=true; break;
    }
    if(found) break;
  }

  /* Why the study was ordered. Epic states it in the first line of the HPI and
     again in the assessment, in the referrer's words rather than ours. */
  var IND=[
    ["preop",   /\b(pre-?op\w*|periprocedural|preprocedural|pre-?operative|surgical clearance|clearance for surgery)\b/i],
    ["cp",      /\b(chest pain|angina|chest tightness|chest pressure|chest discomfort)\b/i],
    ["dyspnea", /\b(dyspnea|shortness of breath|sob|exertional dyspnea)\b/i],
    ["arrhythmia", /\b(arrhythmia|pvcs?|premature ventricular|atrial fibrillation|afib|a-?fib|palpitations?|ventricular ectopy)\b/i],
    ["abnEKG",  /\b(abnormal (ekg|ecg)|(ekg|ecg) abnormalit\w*|t-?wave (inversion|change)|st (depression|elevation))\b/i],
    ["symptomaticCAD", /\b(known cad|known coronary|established coronary artery disease)\b/i]
  ];
  IND.forEach(function(pair){
    if(pair[0]==="preop" ? S.pt.preop : (S.pt.ind&&S.pt.ind[pair[0]])) return;
    scan(pair[1], function(){
      if(pair[0]==="preop"){ S.pt.preop=true; applied.push({k:"Indication",v:"preoperative evaluation"}); }
      else { S.pt.ind=S.pt.ind||{}; S.pt.ind[pair[0]]=true; applied.push({k:"Indication",v:pair[0]}); }
    }, null, {sections:["header","other","onco"]});
  });

  /* The symptom CHARACTER sets the pre-test probability, so defaulting chest
     pain to typical angina overstates the patient. This note says "atypical
     chest symptoms" and the read-out was calling it typical: 52% instead of
     the low-twenties. Read the word if the note gives it. */
  /* cpType DEFAULTS to "typical", so a "not yet set" guard never fires here —
     the note's word has to win over the default outright. */
  if(S.pt.ind&&S.pt.ind.cp){
    var atyp=/\b(atypical|non-?cardiac|non-?anginal|musculoskeletal)\b[^.\n]{0,40}\b(chest|pain|symptom)/i;
    var atyp2=/\b(chest|pain|symptom)\w*\b[^.\n]{0,40}\b(atypical|non-?cardiac|non-?anginal)\b/i;
    if(atyp.test(t)||atyp2.test(t)){
      S.pt.cpType="atypical"; applied.push({k:"Chest pain",v:"atypical"});
    }
  }

  /* radiotherapy + laterality */
  var RT_RE=/\b(radiation therapy|radiotherapy|radiation|xrt|irradiat\w*)\b/i;
  /* The worksheet's flag is CHEST radiotherapy, because that is the exposure
     that reaches the heart. Prostate and pelvic radiotherapy was setting it. */
  var RT_CHEST=/\b(chest|thora\w*|mediastin\w*|breast|axilla\w*|mantle|lung|supraclavicular|internal mammary)\b/i;
  scan(RT_RE, function(c){
    if(!RT_CHEST.test(c)) return;                 /* a site elsewhere is not this exposure */
    S.onco.rt=true;
    var side="";
    if(/\b(mediastinal|mantle)\b/i.test(c)) side="mediastinal";
    else if(/\bbilateral\b/i.test(c)) side="bilateral";
    else if(/\b(left|lt\.?)\b/i.test(c)) side="left";
    else if(/\b(right|rt\.?)\b/i.test(c)) side="right";
    if(side&&!S.onco.rtSide){ S.onco.rtSide=side; applied.push({k:"RT field",v:side}); }
    else applied.push({k:"Radiotherapy",v:"exposure detected"});
    var gy=c.match(/(\d{1,2}(?:\.\d)?)\s*Gy\b/i);
    if(gy&&!S.onco.rtDose){ S.onco.rtDose=gy[1]; applied.push({k:"RT dose",v:gy[1]+" Gy"}); }
    var yr=c.match(/((?:19|20)\d{2})/);
    if(yr&&!S.onco.rtDate){ S.onco.rtDate=yr[1]+"-01-01"; applied.push({k:"RT year",v:yr[1]}); }
  });

  /* History is tri-state: a negation is informative and is recorded as "denied". */
  EPIC_HX.forEach(function(h){
    if(!HX[h[0]]) return;
    if(S.hx[h[0]]||S.hxNeg[h[0]]) return;
    var yes=function(){ S.hx[h[0]]=true; applied.push({k:"History",v:HX[h[0]].chip}); };
    var no =function(){ S.hxNeg[h[0]]=true; applied.push({k:"History (denied)",v:HX[h[0]].chip}); };
    var opt={allowFamhx:(h[0]==="fhxcad")};
    /* a row may carry a second, stricter pattern (a bare capitalised
       abbreviation); it is tried when the first finds nothing */
    if(!scan(h[1], yes, no, opt) && h[2] && !S.hx[h[0]] && !S.hxNeg[h[0]])
      scan(h[2], yes, no, opt);
  });

  EPIC_DMMEDS.forEach(function(m){
    if(!DM_MEDS[m[0]]) return;
    if(S.dmMeds[m[0]]) return;
    scan(m[1], function(){ S.dmMeds[m[0]]=true; applied.push({k:"Medication",v:DM_MEDS[m[0]]}); });
  });
  EPIC_MEDS.forEach(function(m){
    if(!MEDS[m[0]]||S.meds[m[0]]) return;
    scan(m[1], function(){ S.meds[m[0]]=true; applied.push({k:"Medication",v:MEDS[m[0]]}); });
  });

  /* A parsed note constitutes a reviewed medication list. */
  if(applied.length){ S.medsReviewed=true; }
  return applied;
}

function openEpicModal(){
  var ta=el("textarea",{id:"epicPaste",placeholder:"Paste the Epic cardiology / oncology note here\u2026",
    style:"width:100%;min-height:220px;font-size:var(--fs-md);"});
  var modal=el("div",{class:"modal-bg",onclick:function(e){ if(e.target.className==="modal-bg")closeModal(); }},[
    el("div",{class:"modal"},[
      el("h3",null,["Paste Epic note"]),
      el("div",{class:"banner info"},["Parsed locally; nothing is transmitted. The raw note is kept in the study JSON but never reaches the signed report."]),
      ta,
      el("footer",null,[
        el("button",{class:"btn",onclick:closeModal},["Cancel"]),
        el("button",{class:"btn primary",onclick:function(){
          var applied=parseEpicNote($("#epicPaste").value);
          closeModal(); markDirty(); renderWorksheet(); scheduleReport(); refreshReadout();
          toast(applied.length?("Applied "+applied.length+" field"+(applied.length===1?"":"s")+" from the note."):"No recognized fields found in that note.");
        }},["Parse & apply"])
      ])
    ])
  ]);
  document.body.appendChild(modal);
}

/* ============ ISCHEMIC BURDEN vs REVASCULARIZATION BENEFIT ============
   Teaching component for the Extended tab. Reusable: call
   ischemiaBenefitChart({pct, scar, mode}) from anywhere; all arguments are
   optional and it falls back to the current study.

   It lives on the teaching tab and NOT in Comprehensive Assessment on purpose.
   Comprehensive is decision support, and its revascularization panel exists to
   say that burden alone does not identify benefit. A hazard-ratio-versus-burden
   curve placed there would read as the opposite recommendation.
   ====================================================================== */
var IB_STATE={mode:"spect", pct:null, scar:null, hover:null, openWhy:false, openHow:false};

function ibNum(v){ var n=Number(v); return isFinite(n)?n:null; }

function ischemiaBenefitChart(opts){
  opts=opts||{};
  var V=window.IschemiaBenefitViz;
  if(!V) return el("div",{class:"banner warn"},["Teaching module not loaded."]);
  var C=V.CONFIG;

  /* patient values: explicit argument, else reader entry, else this study */
  var studyPct=null, studyScar=null;
  try{
    var A=window.Comprehensive.assess(S);
    studyPct=A.axes.ischemicPct; studyScar=A.axes.scarPct;
  }catch(e){}
  var pct = opts.pct!=null ? opts.pct : (IB_STATE.pct!=null ? IB_STATE.pct : studyPct);
  var scar= opts.scar!=null? opts.scar: (IB_STATE.scar!=null? IB_STATE.scar: studyScar);
  var modeId=opts.mode||IB_STATE.mode;
  var mode=V.modeById(modeId);
  var R=(pct==null)?null:V.interpret(pct, scar, modeId);

  var wrap=el("div",{class:"ib"},[]);

  /* ---- caution first: the figure is the thing most likely to be misread ---- */
  wrap.appendChild(el("div",{class:"ib-caution"},[
    el("strong",null,["Read this before the graph. "]), C.headlineCaution]));

  /* ---- mode toggle ---- */
  var seg=el("div",{class:"seg",role:"tablist","aria-label":"Evidence view"},[]);
  C.modes.forEach(function(m){
    seg.appendChild(el("button",{type:"button",class:"segbtn"+(m.id===modeId?" on":""),

/* The chart. Hand-built SVG, as the polar map is \u2014 the app has no charting
   library and adding one for a single figure is not worth the weight.
   viewBox + preserveAspectRatio makes it responsive without JS resize work. */
function ibSvg(V,C,mode,pct,scar){
  /* the bottom band carries ticks, the axis label and, when present, the scar
     track — each on its own line so they cannot collide */
  var hasScar=(scar!=null&&scar>0);
  var W=760,H=hasScar?392:352,PAD={l:66,r:20,t:22,b:hasScar?106:66};
  var plotW=W-PAD.l-PAD.r, plotH=H-PAD.t-PAD.b;
  var xMax=C.xMax;
  var X=function(v){ return PAD.l + (Math.max(0,Math.min(xMax,v))/xMax)*plotW; };
  /* y domain is -1..1 in the module's arbitrary units; 0 is no difference */
  var Y=function(v){ return PAD.t + (1-((v+1)/2))*plotH; };

  var NS="http://www.w3.org/2000/svg";
  function sv(tag,attrs,kids){
    var e=document.createElementNS(NS,tag);
    if(attrs) for(var k in attrs){ if(attrs[k]!=null) e.setAttribute(k,attrs[k]); }
    (kids||[]).forEach(function(c){ if(c) e.appendChild(c); });
    return e;
  }
  function txt(x,y,s,cls,anchor){
    return sv("text",{x:x,y:y,class:cls||"",  "text-anchor":anchor||"middle"},[
      document.createTextNode(s)]);
  }

  var svg=sv("svg",{viewBox:"0 0 "+W+" "+H,class:"ib-svg",
    preserveAspectRatio:"xMidYMid meet",role:"img",
    "aria-label":"Ischemic myocardium on the horizontal axis against "+mode.axisY+
      " on the vertical axis. "+mode.headline});

  /* band shading */
  C.bands.forEach(function(b){
    svg.appendChild(sv("rect",{x:X(b.from),y:PAD.t,width:Math.max(0,X(Math.min(b.to,xMax))-X(b.from)),
      height:plotH,class:"ib-band ib-"+b.tone}));
  });

  /* crossover region, only where the literature describes one */
  if(mode.crossover){
    svg.appendChild(sv("rect",{x:X(mode.crossover.from),y:PAD.t,
      width:X(mode.crossover.to)-X(mode.crossover.from),height:plotH,class:"ib-cross"}));
    svg.appendChild(txt((X(mode.crossover.from)+X(mode.crossover.to))/2, PAD.t+13,
      "crossover "+mode.crossover.from+"\u2013"+mode.crossover.to+"%","ib-cross-t"));
  }

  /* axes */
  svg.appendChild(sv("line",{x1:PAD.l,y1:PAD.t,x2:PAD.l,y2:PAD.t+plotH,class:"ib-axis"}));
  svg.appendChild(sv("line",{x1:PAD.l,y1:PAD.t+plotH,x2:PAD.l+plotW,y2:PAD.t+plotH,class:"ib-axis"}));
  for(var t=0;t<=xMax;t+=5){
    svg.appendChild(sv("line",{x1:X(t),y1:PAD.t+plotH,x2:X(t),y2:PAD.t+plotH+5,class:"ib-tick"}));
    svg.appendChild(txt(X(t),PAD.t+plotH+19,String(t),"ib-tick-t"));
  }
  svg.appendChild(txt(PAD.l+plotW/2, PAD.t+plotH+40, C.xLabel, "ib-axis-t"));

  /* line of no difference \u2014 the only labeled y position, because it is the
     only one with a defined meaning on a conceptual axis */
  svg.appendChild(sv("line",{x1:PAD.l,y1:Y(0),x2:PAD.l+plotW,y2:Y(0),class:"ib-zero"}));
  svg.appendChild(sv("rect",{x:PAD.l+4,y:Y(0)-9,width:88,height:14,rx:3,class:"ib-zero-chip"}));
  svg.appendChild(txt(PAD.l+8, Y(0)+2, "no difference", "ib-zero-t", "start"));

  /* y-axis label and direction hints; deliberately no numeric ticks */
  svg.appendChild(sv("text",{x:16,y:PAD.t+plotH/2,class:"ib-yaxis-t",
    transform:"rotate(-90 16 "+(PAD.t+plotH/2)+")","text-anchor":"middle"},
    [document.createTextNode(mode.axisY)]));
  if(mode.kind==="crossing"){
    svg.appendChild(txt(PAD.l+plotW-4, Y(0.86), "favors medical therapy", "ib-dir", "end"));
    svg.appendChild(txt(PAD.l+plotW-4, Y(-0.86), "favors revascularization", "ib-dir", "end"));
  }

  /* the curve */
  var pts=V.curvePoints(mode.id, 140);
  var d=pts.map(function(p,i){ return (i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1); }).join(" ");
  if(mode.bandHalfWidth){
    var hw=mode.bandHalfWidth;
    var up=pts.map(function(p,i){ return (i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]+hw).toFixed(1); }).join(" ");
    var dn=pts.slice().reverse().map(function(p){ return "L"+X(p[0]).toFixed(1)+" "+Y(p[1]-hw).toFixed(1); }).join(" ");
    svg.appendChild(sv("path",{d:up+" "+dn+" Z",class:"ib-curve-band"}));
  }
  svg.appendChild(sv("path",{d:d,class:"ib-curve"+(mode.conceptual?" conceptual":"")}));

  /* patient marker */
  if(pct!=null){
    var px=X(pct), py=Y(V.valueAt(mode.id,pct));
    svg.appendChild(sv("line",{x1:px,y1:PAD.t,x2:px,y2:PAD.t+plotH,class:"ib-marker"}));
    svg.appendChild(sv("circle",{cx:px,cy:py,r:6,class:"ib-dot"}));
    svg.appendChild(txt(px, PAD.t-4, (Math.round(pct*10)/10)+"%", "ib-dot-t"));
  }
  /* scar marker \u2014 on its own baseline track, never on the curve, because it is
     not the same quantity as ischemia */
  if(hasScar){
    var sy=PAD.t+plotH+66;
    var sx=X(Math.min(scar,xMax));
    svg.appendChild(txt(PAD.l-8, sy+4, "scar", "ib-scar-t", "end"));
    svg.appendChild(sv("line",{x1:PAD.l,y1:sy,x2:PAD.l+plotW,y2:sy,class:"ib-scar-track"}));
    svg.appendChild(sv("rect",{x:PAD.l,y:sy-2.5,width:Math.max(1,sx-PAD.l),height:5,class:"ib-scar-bar"}));
    svg.appendChild(sv("circle",{cx:sx,cy:sy,r:5,class:"ib-scar-dot"}));
    svg.appendChild(txt(Math.min(sx+10,PAD.l+plotW-90), sy+22,
      (Math.round(scar*10)/10)+"% fixed defect \u2014 not ischemia","ib-scar-t","start"));
  }

  /* hover: an invisible hit strip per 0.5% so the readout is exact */
  var hover=sv("g",{class:"ib-hover"},[]);
  var hLine=sv("line",{x1:0,y1:PAD.t,x2:0,y2:PAD.t+plotH,class:"ib-hline",opacity:"0"});
  var hDot=sv("circle",{cx:0,cy:0,r:4,class:"ib-hdot",opacity:"0"});
  var hBox=sv("g",{opacity:"0"},[]);
  var hRect=sv("rect",{x:0,y:0,width:132,height:34,rx:5,class:"ib-hbox"});
  var hT1=sv("text",{x:0,y:0,class:"ib-ht1","text-anchor":"start"},[document.createTextNode("")]);
  var hT2=sv("text",{x:0,y:0,class:"ib-ht2","text-anchor":"start"},[document.createTextNode("")]);
  hBox.appendChild(hRect); hBox.appendChild(hT1); hBox.appendChild(hT2);
  hover.appendChild(hLine); hover.appendChild(hDot); hover.appendChild(hBox);

  var capture=sv("rect",{x:PAD.l,y:PAD.t,width:plotW,height:plotH,fill:"transparent",
    class:"ib-capture"});
  capture.addEventListener("mousemove",function(ev){
    var box=svg.getBoundingClientRect();
    var sx2=(ev.clientX-box.left)*(W/box.width);
    var v=Math.max(0,Math.min(xMax,(sx2-PAD.l)/plotW*xMax));
    var vy=V.valueAt(mode.id,v);
    hLine.setAttribute("x1",X(v)); hLine.setAttribute("x2",X(v)); hLine.setAttribute("opacity","1");
    hDot.setAttribute("cx",X(v)); hDot.setAttribute("cy",Y(vy)); hDot.setAttribute("opacity","1");
    var bx=Math.min(X(v)+10, PAD.l+plotW-136), by=Math.max(PAD.t+4, Y(vy)-42);
    hRect.setAttribute("x",bx); hRect.setAttribute("y",by);
    hT1.setAttribute("x",bx+8); hT1.setAttribute("y",by+14);
    hT2.setAttribute("x",bx+8); hT2.setAttribute("y",by+27);
    hT1.textContent=(Math.round(v*10)/10)+"% ischemic myocardium";
    hT2.textContent=V.bandFor(v).label+" \u00b7 illustrative only";
    hBox.setAttribute("opacity","1");
  });
  capture.addEventListener("mouseleave",function(){
    hLine.setAttribute("opacity","0"); hDot.setAttribute("opacity","0"); hBox.setAttribute("opacity","0");
  });
  svg.appendChild(capture);
  svg.appendChild(hover);

  return el("div",{class:"ib-chart"},[svg]);
}

function renderExtendedIfVisible(){ if(TAB==="extended")renderExtended(); }
function renderExtended(){
  var host=$("#extended"); if(!host)return; host.innerHTML="";
  var A=null;
  /* analyze() expects the parsed-XML shape, not app state. Project state into
     that shape first; previously this threw and the QC panel never rendered. */
  try{
    if(ANC && ANC.analyze && ANC.stateToAnalyzable){
      var anc = ANC.stateToAnalyzable(S);
      var ancCtx = ANC.contextFromAppState ? ANC.contextFromAppState(S) : {};
      A = ANC.analyze(anc, ancCtx);
    }
  }catch(e){
    A=null;
    host.appendChild(el("div",{class:"banner warn"},[
      "Extended analytics unavailable for this study ("+e.message+"). The teaching sections below are unaffected."]));
  }

  host.appendChild(el("div",{class:"banner info"},["Extended analysis is investigational and not part of the signed report. Institutional report thresholds (MFR 1.75 / stress MBF 1.8) are shown alongside published values (MFR 2.0 abnormal / 1.5 high-risk) for reference."]));

  // Evidence-tag legend + flagship teaching section (new template)
  if(window.ExtendedSections){
    var legend=el("div",{class:"xs-legend"},[
      el("span",{class:"xs-lbl"},["Evidence"]),
      el("span",{class:"k"},[el("span",{class:"swatch",style:"background:#f0f7f2;"}),"Guideline-backed"]),
      el("span",{class:"k"},[el("span",{class:"swatch",style:"background:#f1f5f9;"}),"Literature"]),
      el("span",{class:"k"},[el("span",{class:"swatch",style:"background:#f2ece2;"}),"Model-derived (formula + inputs shown; not for clinical use)"])
    ]);
    host.appendChild(legend);

    // QC panel (kept — real, data-driven)
    var qc = A&&A.qc||[];
    if(qc.length){
      host.appendChild(extSec("Data quality & QC","A",[
        el("ul",{class:"qc-list"},qc.map(function(q){
          if(typeof q==="string") return el("li",{class:"warn"},[q]);
          var sev=q.severity||q.level||"warn";
          var cls=(sev==="block")?"err":((sev==="info")?"info":"warn");
          var txt=q.message||q.msg||"";
          return el("li",{class:cls},[ q.code?el("b",null,[q.code+" \u00b7 "]):null, txt ]);
        }))
      ]));
    }
    // Per-territory table (kept — real)
    host.appendChild(extSec("Per-territory ischemia / scar / flow","A",[territoryTable()]));

    // All teaching sections (value + formula + inputs + citation)
    try{ window.ExtendedSections.render(buildXl(), host); }catch(e){ host.appendChild(el("div",{class:"banner warn"},["Some teaching sections could not render ("+e.message+")."])); }

    // Reviewer notes (kept — exported to JSON, never in report)
    host.appendChild(extSec("Ischemic burden and revascularization benefit","B",[ischemiaBenefitChart()]));
    host.appendChild(extSec("Reviewer notes","C",[
      el("textarea",{placeholder:"Notes (exported in JSON, never in the report)",style:"width:100%;min-height:60px;",
        value:S._reviewerNotes||"", oninput:function(e){ S._reviewerNotes=e.target.value; markDirty(); }})
    ]));
  }
  return;
}

/* The impression defaults to normal so a normal study needs no click, but that
   default must not survive onto an abnormal study. Until the reader chooses
   explicitly, the derived value is used and shown as derived. */
function effectiveImpression(){
  if(S.impression && S.impression.manual) return S.impression.category||"";
  try{
    var der=window.AutomationEngine.deriveImpression(S, window.Comprehensive.assess(S));
    if(der && der.category) return der.category;
  }catch(e){}
  return (S.impression&&S.impression.category)||"";
}
function effectiveVessels(){
  if(S.impression && S.impression.manual) return S.impression.vessels||{};
  try{
    var der=window.AutomationEngine.deriveImpression(S, window.Comprehensive.assess(S));
    if(der) return der.vessels||{};
  }catch(e){}
  return (S.impression&&S.impression.vessels)||{};
}
function impressionSeg(){
  var cur=effectiveImpression();
  var wrap=el("div",{class:"seg"},[]);
  IMP_CATEGORY.forEach(function(o){
    wrap.appendChild(el("button",{type:"button",class:"segbtn"+(cur===o[0]?" on":""),
      title:S.impression.manual?"":"Derived from the scores. Click to set it explicitly.",
      onclick:function(){ S.impression.category=o[0]; S.impression.manual=true;
        markDirty(); renderWorksheet(); scheduleReport(); refreshReadout(); }},[o[1]]));
  });
  var box=el("div",null,[wrap]);
  if(!S.impression.manual) box.appendChild(el("div",{class:"hint"},["Derived from the scores \u2014 click to override."]));
  return box;
}

function checklistCard(){
  /* Everything that describes the images, the chamber or the map now lives in
     the card that owns it. What remains here is the reader's conclusion, which
     belongs to no earlier card. */
  return card("Impression","derived from the scores \u2014 override any of it",[
    burdenVerdict(),
    field("Overall impression",impressionSeg()),
    field("Vessels",el("div",{class:"chipgrp"},IMP_VESSELS.map(function(v){
      var on=!!effectiveVessels()[v];
      return el("span",{class:"chip"+(on?" on":""),onclick:function(){
        if(!S.impression.vessels)S.impression.vessels={};
        S.impression.vessels=Object.assign({},effectiveVessels());
        S.impression.manual=true;
        if(on)delete S.impression.vessels[v]; else S.impression.vessels[v]=true;
        markDirty(); renderWorksheet(); scheduleReport(); refreshReadout(); }},[v]);
    })))
  ]);
}



/* ============ AUTOMATION SURFACE ============
   Derived values are applied and marked; suggested values are highlighted and
   explained but never set. See automation-engine.js for the distinction.
   ============================================= */
var AUTO_DISMISSED = {};   /* reasons the reader has explicitly waved off */

/* The engines read S.pt.age, which is written as a SIDE EFFECT of the age field
   rendering with a date of birth. A study whose age is derived therefore looked
   ageless to the signing check: "1 to complete \u2014 Age", with the age on screen
   two inches above the badge. Third time this shape of bug has appeared (\u00a755,
   \u00a765), so the resolved value is put into the state the engines are handed
   rather than into a copy each caller has to remember to make. */
function autoState(){
  if(!window.AutomationEngine||!window.Comprehensive) return null;
  try{
    var age=ageResolved();
    if(age!=null && !S.pt.age) S.pt.age=String(age);
    return window.AutomationEngine.analyze(S, window.Comprehensive.assess(S));
  }
  catch(e){ return null; }
}

/* --- one-click normal study --- */
function applyNormalStudy(){
  var p=window.AutomationEngine.normalStudyPatch();
  S.stress=p.stress; S.rest=p.rest; S.motion=p.motion; S.lvSize=p.lvSize;
  S.tid=p.tid; S.tech=p.tech; S.gradient=p.gradient; S.artifact=p.artifact;
  S.impression=p.impression;
  markDirty(); renderWorksheet(); scheduleReport(); refreshReadout();
  toast("Normal study applied. Demographics, doses, flow and calcium untouched.");
}

/* --- critical findings, auto-flagged --- */
function criticalCard(){
  var a=autoState();
  var kids=[];
  var crit=a?a.critical:{critical:false,reasons:[],suppressed:[]};

  /* If the findings are positive, MARK IT — do not ask the reader to confirm
     what the study already says. The flag is set automatically and the date,
     time and telephone are prefilled. Unticking it records a deliberate
     decision (comm.criticalManual), which is then respected. */
  if(crit.critical && !S.comm.criticalManual && !S.comm.critical){
    S.comm.critical=true;
    if(!S.comm.date) S.comm.date=new Date().toISOString().slice(0,10);
    if(!S.comm.time) S.comm.time=new Date().toTimeString().slice(0,5);
    if(!S.comm.method||S.comm.method==="epic") S.comm.method="phone";
  }
  kids.push(el("div",{class:"row",style:"gap:var(--sp-2);align-items:center;flex-wrap:wrap"},[
    chip(S.comm.critical?"Critical finding \u2713":"Mark as critical finding",!!S.comm.critical,function(){
      S.comm.criticalManual=true;
      S.comm.critical=!S.comm.critical;
      if(S.comm.critical){
        /* a critical result needs a timestamped record; prefill the mechanics */
        if(!S.comm.date) S.comm.date=new Date().toISOString().slice(0,10);
        if(!S.comm.time) S.comm.time=new Date().toTimeString().slice(0,5);
        if(!S.comm.method||S.comm.method==="epic") S.comm.method="phone";
      }
      markDirty(); renderWorksheet(); scheduleReport();
    }),
    (crit.critical&&S.comm.critical&&!S.comm.criticalManual)
      ? el("span",{class:"ready pending",title:"Set automatically because the findings meet criteria. Untick to override."},["marked from the findings"])
      : (crit.critical&&!S.comm.critical)
        ? el("span",{class:"ready pending",title:"You unticked this despite the findings meeting criteria."},["overridden"])
        : null
  ]));

  if(crit.critical&&!S.comm.critical){
    kids.push(el("div",{class:"banner err",style:"margin-top:var(--sp-2)"},[
      el("b",null,["This study meets criteria for direct communication:"]),
      el("ul",{class:"qc-list",style:"margin-top:var(--sp-1)"},crit.reasons.map(function(r){
        return el("li",{class:"err",title:r.why},[r.k+" \u2014 "+r.v]);
      }))
    ]));
  } else if(crit.critical&&S.comm.critical){
    kids.push(el("div",{class:"banner ok",style:"margin-top:var(--sp-2)"},[
      "Flagged. Date, time and telephone were prefilled \u2014 change them if the call happened otherwise."]));
  }

  if(crit.suppressed.length){
    kids.push(el("div",{class:"auto-sup"},[
      el("span",{class:"ca-lbl"},["Deliberately not flagged"]),
      el("ul",null,crit.suppressed.map(function(x){
        return el("li",{title:x.why},[x.k+" \u2014 "+x.v]);
      }))
    ]));
  }
  return kids;
}

/* --- derived values: applied, marked, one-click override --- */
function autoDerivePanel(){
  var a=autoState(); if(!a) return null;
  var rows=[];

  /* impression category */
  var imp=a.impression;
  if(imp && S.impression && S.impression.category!==imp.category && !AUTO_DISMISSED["impression"]){
    var lab=(IMP_CATEGORY.filter(function(o){return o[0]===imp.category;})[0]||["",""])[1];
    rows.push({label:"Overall impression",value:lab,why:imp.why,
      apply:function(){ S.impression.category=imp.category; S.impression.vessels=imp.vessels;
        markDirty(); renderWorksheet(); scheduleReport(); refreshReadout(); },
      dismiss:function(){ AUTO_DISMISSED["impression"]=true; renderWorksheet(); }});
  }
  /* small derived fields */
  a.derivations.forEach(function(d){
    if(AUTO_DISMISSED[d.path]) return;
    rows.push({label:d.path.replace(/\./g," \u203a "),value:String(d.value),why:d.why,
      apply:function(){ setPath(d.path,d.value); markDirty(); renderWorksheet(); scheduleReport(); refreshReadout(); },
      dismiss:function(){ AUTO_DISMISSED[d.path]=true; renderWorksheet(); }});
  });
  if(!rows.length) return null;

  return card("Suggested from what you have entered",
    "Each is already determined by data on this worksheet \u2014 apply or dismiss",
    rows.map(function(r){
      return el("div",{class:"auto-row"},[
        el("div",{class:"auto-txt"},[
          el("div",null,[el("strong",null,[r.label+": "]),r.value]),
          el("p",null,[r.why])]),
        el("div",{class:"row",style:"gap:var(--sp-1)"},[
          el("button",{class:"btn sm",onclick:r.apply},["Apply"]),
          el("button",{class:"btn sm",onclick:r.dismiss},["Dismiss"])
        ])
      ]);
    }).concat([
      el("div",{class:"row",style:"gap:var(--sp-1);margin-top:var(--sp-2)"},[
        el("button",{class:"btn sm primary",title:"Applies every suggestion above at once.",
          onclick:function(){ rows.forEach(function(r){ r.apply(); }); }},["Apply all"])
      ])
    ]));
}


/* --- critical communication draft, sitting directly above "Communicated to" --- */
var COMM_MSG_EDITED = null;   /* reader's own edits survive re-render */

function buildCommMessage(){
  if(!window.AutomationEngine||!window.Comprehensive) return null;
  try{
    var A=window.Comprehensive.assess(S);
    var rv=window.RevascEngine?window.RevascEngine.assess(S,A):null;
    return window.AutomationEngine.criticalMessage(S,A,{
      revasc:rv, names:{attending:ATTEND, cardiologist:CARDS}});
  }catch(e){ return null; }
}

function commMessageCard(){
  var a=autoState();
  var triggered=(a&&a.critical&&a.critical.critical)||!!S.comm.critical;
  if(!triggered) return null;

  var m=buildCommMessage(); if(!m) return null;
  var body=(COMM_MSG_EDITED!=null)?COMM_MSG_EDITED:m.text;

  var ta=el("textarea",{id:"commMsg",rows:"16",class:"comm-msg",
    title:"Editable. Regenerate discards your edits and rebuilds from current worksheet data.",
    oninput:function(e){ COMM_MSG_EDITED=e.target.value; }},[body]);
  ta.value=body;   /* property for live editing; child text keeps the DOM truthful */

  var kids=[
    el("div",{class:"row",style:"gap:var(--sp-1);align-items:center;flex-wrap:wrap;margin-bottom:var(--sp-1)"},[
      el("button",{class:"btn sm primary",title:"Copies as plain ASCII, ready to paste into Epic Chat, secure e-mail or a phone-note.",
        onclick:function(){ copyPlain($("#commMsg").value,"Critical communication"); }},["Copy message"]),
      el("button",{class:"btn sm",title:"Rebuilds from current worksheet data and discards your edits.",
        onclick:function(){ COMM_MSG_EDITED=null; renderWorksheet();
          toast("Message rebuilt from current findings."); }},["Regenerate"]),
      el("button",{class:"btn sm",title:"Records that the message was sent now, and to whom, so the report can document it.",
        onclick:function(){
          S.comm.critical=true;
          S.comm.date=new Date().toISOString().slice(0,10);
          S.comm.time=new Date().toTimeString().slice(0,5);
          if(!S.comm.method||S.comm.method==="epic") S.comm.method="phone";
          markDirty(); renderWorksheet(); scheduleReport();
          toast("Marked as communicated. Enter who acknowledged it below.");
        }},["Mark as sent now"]),
      m.complete
        ? el("span",{class:"ready ok"},["\u2713 all names filled"])
        : el("span",{class:"ready pending",title:m.note},[m.placeholders.length+" name"+(m.placeholders.length===1?"":"s")+" to fill"])
    ]),
    ta,
    el("p",{class:"ca-foot"},[
      "The report documents a communication only once someone acknowledges it. Record the acknowledgement below."])
  ];
  if(!m.complete) kids.splice(1,0,el("div",{class:"banner warn"},[
    "Placeholders remain in the draft: "+m.placeholders.join(", ")+
    ". Fill the referring physician, resident and attending fields so the message does not go out addressed to nobody."]));

  return card("Critical communication draft",
    "Generated from this study \u00b7 editable \u00b7 not part of the signed report",kids);
}

/* --- ready to sign --- */
function readinessBadge(){
  var a=autoState(); if(!a) return null;
  var r=a.readiness;
  return el("span",{class:"ready "+(r.ready?"ok":"pending"),
    title:r.ready?r.note:(r.note+" Missing: "+r.missing.join(", "))},
    [r.ready?"\u2713 ready to sign":(r.missing.length+" to complete")]);
}

/* ============ GLOSSARY LAYER ============
   Much of this vocabulary is opaque to anyone who has not spent a rotation in
   nuclear cardiology \u2014 rotating cardiology fellows, new residents, and the
   attendings who read here occasionally. Any element whose entire text is one
   of these terms gets a definition on hover, so the interface teaches itself
   rather than requiring a manual.

   Definitions state what the number IS and what it MEANS, in that order, and
   give the threshold where one exists.
   ========================================= */
var GLOSSARY = {
  "SSS":"Summed stress score \u2014 the 17 segment scores added together on the stress images. <4 normal, 4\u20138 mild, 9\u201313 moderate, >13 severe. Measures total perfusion abnormality, fixed and reversible combined.",
  "SRS":"Summed rest score \u2014 the same sum on the rest images. Represents the fixed (scarred) component, since scar does not improve at rest.",
  "SDS":"Summed difference score \u2014 SSS minus SRS. The reversible component, i.e. ischemia. 0\u20131 none, 2\u20134 mild, 5\u20136 moderate, \u22657 severe.",
  "MFR":"Myocardial flow reserve \u2014 stress blood flow divided by rest blood flow. \u22652.0 normal, 1.75\u20132.0 borderline, <1.75 reduced. Unlike the polar map it has no internal reference, so it detects disease that is uniform across all territories.",
  "MBF":"Myocardial blood flow in mL/min/g, measured absolutely rather than relative to the brightest segment. Stress MBF below about 1.8 is considered reduced.",
  "TID":"Transient ischemic dilatation \u2014 the left ventricle appearing larger on stress than rest. Above about 1.13 on PET it suggests extensive subendocardial ischemia or multivessel disease.",
  "CAC":"Coronary artery calcium, Agatston units, from the attenuation-correction CT. Measures accumulated atherosclerotic burden, not current ischemia. 0 none, 1\u201310 minimal, 11\u2013100 mild, 101\u2013400 moderate, >400 severe.",
  "LVEF":"Left ventricular ejection fraction. On gated PET it is count-based and makes no geometric assumption, which is why it is more reproducible than 2D echocardiography.",
  "EF":"Ejection fraction \u2014 the percentage of end-diastolic volume ejected each beat.",
  "ESV":"End-systolic volume. Above about 70 mL at rest marks elevated risk of cardiac death.",
  "EDV":"End-diastolic volume.",
  "RPP":"Rate-pressure product \u2014 heart rate \u00d7 systolic pressure, a proxy for myocardial work. Resting flow scales with it, so it must be accounted for before comparing flow reserve between patients.",
  "MCF":"Myocardial contraction fraction \u2014 stroke volume divided by myocardial volume. A volumetric measure of contractile efficiency, less load-dependent than ejection fraction.",
  "LAD":"Left anterior descending territory \u2014 segments 1, 2, 7, 8, 13, 14 and 17. Supplies the anterior wall, anterior septum and apex.",
  "LCX":"Left circumflex territory \u2014 segments 5, 6, 11, 12 and 16. Supplies the lateral wall.",
  "RCA":"Right coronary territory \u2014 segments 3, 4, 9, 10 and 15. Supplies the inferior wall and inferior septum.",
  "LM":"Left main coronary artery. Disease here carries an established survival benefit from revascularization and was excluded from the ISCHEMIA trial by protocol.",
  "AC":"Attenuation-corrected images \u2014 the primary images for interpretation. Correction removes soft-tissue attenuation, so true defects persist and artifacts normalize.",
  "Non-AC":"Uncorrected images. Reviewed first because attenuation artifacts are visible here and disappear after correction, which is how false positives are identified.",
  "CTRCD":"Cancer-therapy-related cardiac dysfunction \u2014 conventionally an LVEF fall of \u226510 points to below 50% during or after cardiotoxic therapy.",
  "GLS":"Global longitudinal strain, measured by echocardiography. Detects subclinical dysfunction earlier than ejection fraction and is the real comparator for any claim that PET could replace surveillance echo.",
  "NNT":"Number needed to treat \u2014 how many patients must receive a therapy for one to benefit. Meaningless without its trial, its enrolled population and its time horizon, all of which are shown alongside.",
  "INOCA":"Ischemia with no obstructive coronary arteries \u2014 reduced flow reserve without epicardial stenosis, usually reflecting microvascular dysfunction.",
  "eGFR":"Estimated glomerular filtration rate. Below 30, or dialysis, places a patient in the ISCHEMIA-CKD population, where a routine invasive strategy showed no benefit and more strokes.",
  "SGLT2":"Sodium-glucose cotransporter-2 inhibitor. Prescribed for glycemic control, but its cardiovascular indication is separate and stronger.",
  "ECOG":"Eastern Cooperative Oncology Group performance status \u2014 the dominant confounder in any oncologic cohort.",
  "BMI":"Body mass index. Raises soft-tissue attenuation and therefore the probability that an apparent defect is artifactual.",
  "BSA":"Body surface area, used to index volumes and dose."
};

/* ================= THE TEACHING LAYER =================
   Long-form explanation attached to terms that already have a one-line
   tooltip. It is never rendered into the page: a term with an entry gets a
   dotted underline, and the panel opens only on a click.

   Each entry is {title, lead, sections:[{h, p:[...]}], see:[...]}. Written to
   be read from the ground up — a medical student should be able to start at
   any term and end up understanding the study. ================= */
var TEACH = {
  "RPP": {
    title:"Rate-pressure product, and the correction that follows from it",
    lead:"Heart rate multiplied by systolic pressure. It is the cheapest available estimate of how hard the myocardium is working, and resting blood flow tracks it closely \u2014 which is why it cannot be ignored when flow reserve is a ratio with resting flow underneath.",
    sections:[
      {h:"Why the heart is different",
       p:["Most organs are perfused throughout the cardiac cycle. The left ventricle is not: during systole the contracting muscle squeezes its own intramural vessels shut, so roughly four fifths of left ventricular perfusion happens during diastole.",
          "That single fact drives everything below. Anything that shortens diastole shortens the window in which the left ventricle can be fed."]},
      {h:"What a fast heart does to resting flow",
       p:["As heart rate rises, the cardiac cycle shortens \u2014 and it shortens almost entirely at the expense of diastole. Systole is comparatively fixed.",
          "A healthy coronary circulation compensates. Autoregulation dilates the resistance vessels so that the same amount of blood is delivered in less time. Resting flow therefore RISES with heart rate. That is a normal response, not a disease."]},
      {h:"Why that breaks the ratio",
       p:["Myocardial flow reserve is stress flow divided by rest flow. Stress flow is capped by biology \u2014 maximal vasodilation is maximal.",
          "So if the resting number is inflated by an anxious, cold or uncomfortable patient at baseline, the denominator grows while the numerator cannot, and the ratio falls. A normal circulation can be made to look like microvascular disease or balanced three-vessel disease by nothing more than a stressful cannulation."]},
      {h:"What the correction does",
       p:["The software normalizes the resting scan to a standard workload of 10,000 \u2014 roughly a rate of 80 and a systolic pressure of 125:",
          "corrected rest flow = rest flow \u00d7 10,000 \u00f7 the patient's actual resting RPP",
          "A patient whose resting RPP was 14,000 gets a multiplier of about 0.71: the resting number is pushed down, the gap widens, and the reported reserve rises."]},
      {h:"The part that is genuinely uncomfortable",
       p:["The corrected reserve pairs an ADJUSTED resting value with an UNADJUSTED stress value.",
          "During pharmacological stress the agent itself drives rate and pressure up, so the stress RPP is high too \u2014 and nothing is done about it. The corrected ratio is therefore a hybrid: an idealized baseline over a real peak. It describes no single moment that occurred in the patient, and it tends to flatter the true reserve.",
          "This is worth saying out loud at read-out. It is not a reason to discard the number; it is a reason to know which number is answering which question."]},
      {h:"Which one to believe",
       p:["Prefer the UNCORRECTED value by default. In large outcome registries it is the better predictor, and for good reason: if the resting RPP is high because of chronic hypertension, deconditioning or structural disease, that is not an artifact \u2014 it is the load the myocardium actually carries every day. Correcting it away deletes the finding.",
          "Reach for the CORRECTED value as a tie-breaker, and only when the elevated baseline is clearly situational \u2014 the normotensive patient whose rate was 115 in the scanner from claustrophobia or a difficult IV. There the uncorrected reserve is falsely low, and the corrected value helps confirm the vessels can still dilate."]}
    ],
    see:["MFR","MBF"]
  },
  "MFR": {
    title:"Myocardial flow reserve",
    lead:"Stress flow divided by rest flow, per territory and globally. It asks one question: how much more blood can this myocardium receive when asked?",
    sections:[
      {h:"What it adds over the pictures",
       p:["Relative perfusion images compare one wall against the brightest wall in the same heart. If every vessel is narrowed by a similar amount, everything is equally dim and the images look normal \u2014 balanced ischemia.",
          "Absolute flow has no such blind spot, because it is measured in mL/min/g rather than as a percentage of the best-looking segment."]},
      {h:"Reading the number",
       p:["Above about 2.0 is generally reassuring. Below about 1.5 is abnormal and carries prognostic weight independent of the perfusion images. The band between is a judgement, made with the pictures, the flows and the patient in front of you.",
          "A reduced reserve confined to one territory points at that vessel. A globally reduced reserve with normal-looking images is the classic signature of microvascular dysfunction or of balanced disease \u2014 which of the two is a clinical question, not an imaging one."]},
      {h:"What can fake it",
       p:["Caffeine within twelve hours blunts the vasodilator response and truncates stress flow. A high resting RPP inflates the denominator. Both lower the reserve without any disease being present \u2014 see RPP.",
          "This is why a low reserve on a technically confounded study is reported as confounded rather than as a finding."]}
    ],
    see:["RPP","MBF"]
  },
  "MBF": {
    title:"Myocardial blood flow",
    lead:"Absolute perfusion in mL/min/g, measured from the first pass of tracer through the myocardium rather than from how bright one wall looks against another.",
    sections:[
      {h:"Why absolute matters",
       p:["A relative image can only ever say which wall is worst. Absolute flow says whether the worst wall is actually underperfused.",
          "Stress flow below roughly 1.8 mL/min/g is considered reduced whatever the images show, and a normal stress flow is strong evidence against flow-limiting disease in that territory."]},
      {h:"Rest flow is not a spare number",
       p:["Rest flow is the denominator of the reserve, and it moves with workload \u2014 which is the whole subject of the RPP entry. A resting flow that looks high is usually a patient who was tachycardic or hypertensive in the scanner, not a hyperemic myocardium."]}
    ],
    see:["MFR","RPP"]
  },
  "Regadenoson": {
    title:"Regadenoson, and what vasodilator stress actually tests",
    lead:"A selective A2A adenosine receptor agonist given as a fixed 0.4 mg bolus. It dilates the coronary resistance vessels directly; it does not make the heart work harder.",
    sections:[
      {h:"This is not an exercise test",
       p:["Exercise raises myocardial demand and looks for the point at which supply cannot keep up. A vasodilator does the opposite: it raises supply to its ceiling everywhere and looks for the territory that cannot follow.",
          "That is why a normal vasodilator study does not tell you about exercise capacity, and why symptoms during it are far less meaningful than symptoms during exercise."]},
      {h:"Why the blood pressure usually falls",
       p:["Systemic A2A receptors dilate more than the coronary bed alone, so peripheral resistance drops. A modest fall in systolic pressure with a reflex rise in heart rate is the expected response and is reassuring that the drug was delivered.",
          "A rising blood pressure during exercise is normal; a FALLING blood pressure during exercise is a high-risk finding. The two situations are not interchangeable."]},
      {h:"Caffeine, and reversal",
       p:["Caffeine and theophylline are competitive antagonists at the same receptor. Within twelve hours of caffeine the hyperemic response can be blunted enough to lower stress flow and, with it, the reserve \u2014 a technical confound, not a stenosis.",
          "Aminophylline reverses the effect and is given for persistent symptoms or ECG change. Recording the dose and what it resolved is part of the study: it explains the hemodynamics that follow it."]}
    ],
    see:["MFR","RPP"]
  },
  "TID": {
    title:"Transient ischemic dilatation",
    lead:"The left ventricular cavity appearing larger on the stress images than at rest.",
    sections:[
      {h:"What it usually is",
       p:["Rarely true dilatation. Far more often it is diffuse subendocardial hypoperfusion at stress: the inner layer of muscle drops below the threshold of detection, so the cavity is traced larger than it is.",
          "On PET a ratio above roughly 1.13 is the usual flag. It is a marker of extensive disease and carries weight even when the relative images look unremarkable."]}
    ],
    see:["MFR"]
  },
  "CAC": {
    title:"Coronary artery calcium",
    lead:"Agatston score from the attenuation-correction CT. It measures accumulated atherosclerosis, not current ischemia.",
    sections:[
      {h:"Two different questions",
       p:["Perfusion answers: is any territory flow-limited today. Calcium answers: how much atherosclerosis has this person accumulated over a lifetime. A patient can have a normal perfusion study and a very high calcium score, and both results are correct.",
          "The calcium score shifts prevention \u2014 statin intensity, risk conversation \u2014 rather than revascularization."]}
    ],
    see:[]
  }
};

function applyGlossary(root){
  if(!root) return;
  /* Anywhere a term is printed as a label is somewhere a reader can ask about
     it. Only text matching a glossary key is touched, so widening this list
     adds tooltips exactly where there is something to say. */
  var sel=".ca-k,.tl-k,.gl-k,.ca-lbl,.xs-title,th,.legend-lbl,.ca-item-h strong,.rd-stat .ca-lbl,"+
          ".cac-box label,.flow-lbl,.vit-head .vit-cell,.vit-lbl,.sb-lbl,"+
          "section.card > header > span.t,.fld > label,.fld-lbl";
  var nodes=root.querySelectorAll(sel);
  for(var i=0;i<nodes.length;i++){
    var e=nodes[i];
    if(e.getAttribute("title")) continue;
    var t=(e.textContent||"").trim().replace(/[:\u00b7]+$/,"").trim();
    var def=GLOSSARY[t];
    if(!def && TEACH_ALIAS[t] && GLOSSARY[TEACH_ALIAS[t]]) def=GLOSSARY[TEACH_ALIAS[t]];
    if(!def){
      for(var j=0;j<GLOSSARY_PREFIX.length;j++){
        var k=GLOSSARY_PREFIX[j];
        if(t===k||t.indexOf(k+" ")===0){ def=GLOSSARY[k]; break; }
      }
    }
    if(def) e.setAttribute("title",def);
    /* A term with a long-form entry says so, and opens it on click. The page
       gains a dotted underline and nothing else. */
    var lesson=def?teachFor(t):null;
    if(lesson && !e.classList.contains("teach")){
      e.classList.add("teach");
      e.setAttribute("title",def+"  \u2014 click to read more.");
      e.addEventListener("click",function(term){ return function(ev){ ev.stopPropagation(); openTeach(term); }; }(t));
    }
  }
}

function applyTooltips(root){
  if(!root) return;
  var nodes=root.querySelectorAll("button,.chip,input,select,textarea");
  for(var i=0;i<nodes.length;i++){
    var e=nodes[i];
    if(e.getAttribute("title")) continue;             /* call-site title always wins */
    var txt=(e.textContent||"").trim();
    var tip=TIPS[txt];
    if(!tip && e.placeholder) tip=TIPS_BY_PLACEHOLDER[e.placeholder];
    if(tip) e.setAttribute("title",tip);
  }
}

/* ================= POWERSCRIBE EXPORT ================= */
/* Dictation software mangles non-ASCII. The report is otherwise plain text,
   so normalizing a small set of characters is all that stands between it and
   a clean paste. */
var PS_MAP = [[/\u2022/g,'-'],[/\u2248/g,'~'],[/\u2265/g,'>='],[/\u2264/g,'<='],
  [/\u00d7/g,'x'],[/\u2192/g,'->'],[/[\u2018\u2019]/g,"'"],[/[\u201c\u201d]/g,'"'],
  [/[\u2013\u2014]/g,'-'],[/\u00b5/g,'u'],[/\u00b2/g,'2'],[/\u00b0/g,' degrees'],
  [/\u00a0/g,' ']];
function toPlainText(t){
  var out=String(t||"");
  PS_MAP.forEach(function(p){ out=out.replace(p[0],p[1]); });
  return out.replace(/[^\x00-\x7F]/g,"").replace(/[ \t]+$/gm,"");
}
function reportText(){ var e=$("#reportPre"); return e?e.textContent:""; }
function reportSection(name){
  var t=reportText(), lines=t.split("\n"), out=[], on=false;
  for(var i=0;i<lines.length;i++){
    var L=lines[i];
    var isHdr=/^[A-Z][A-Z \/&\-]{3,}:?\s*$/.test(L.trim());
    if(isHdr){ on=new RegExp(name,"i").test(L); if(on){ out.push(L); continue; } }
    if(on) out.push(L);
  }
  return out.join("\n").trim();
}
function copyPlain(text,label){
  var t=toPlainText(text);
  if(!t.trim()){ toast("Nothing to copy \u2014 the report is empty.",true); return; }
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(function(){ toast(label+" copied as plain text ("+t.length+" chars)."); },
      function(){ toast("Clipboard blocked by the browser.",true); });
  else toast("Clipboard unavailable in this browser.",true);
}

/* ================= PRELIM / FINAL READ CAPTURE ================= */
/* Every study is already read twice. Capturing the preliminary read before
   discussion turns existing workflow into an education loop and a
   reproducibility dataset at no marginal cost. The prelim must be captured
   BEFORE readout, or the measurement is worthless. */
function snapshotRead(by){
  var st={},rs={};
  for(var i=1;i<=17;i++){ st[i]=+(S.stress[i]||0); rs[i]=+(S.rest[i]||0); }
  return {by:by||"", at:new Date().toISOString(), stress:st, rest:rs,
          impression:(S.impression&&S.impression.category)||"",
          vessels:Object.keys((S.impression&&S.impression.vessels)||{}),
          ef:{rest:S.ef&&S.ef.rest, stress:S.ef&&S.ef.stress},
          mfr:(S.flow&&S.flow.Global&&S.flow.Global.stress&&S.flow.Global.rest)
              ? (Number(S.flow.Global.stress)/Number(S.flow.Global.rest)) : null};
}
function readDiff(a,b){
  if(!a||!b) return null;
  var segs=[], sssA=0,sssB=0,sdsA=0,sdsB=0;
  for(var i=1;i<=17;i++){
    var as=+(a.stress[i]||0), bs=+(b.stress[i]||0), ar=+(a.rest[i]||0), br=+(b.rest[i]||0);
    sssA+=as; sssB+=bs; sdsA+=Math.max(0,as-ar); sdsB+=Math.max(0,bs-br);
    if(as!==bs||ar!==br) segs.push({seg:i,name:SEG_NAME[i],terr:SEG_TERR[i],
      fromS:as,toS:bs,fromR:ar,toR:br});
  }
  function band(v){ return v<4?"normal":(v<=8?"mildly abnormal":(v<=13?"moderately abnormal":"severely abnormal")); }
  var isch=function(sds){ return sds>=2; };
  var impFrom=a.impression||"", impTo=b.impression||"";
  var vFrom=(a.vessels||[]).join(","), vTo=(b.vessels||[]).join(",");
  return {impFrom:impFrom, impTo:impTo, impChanged:(impFrom!==impTo),
    vesselsFrom:vFrom, vesselsTo:vTo, vesselsChanged:(vFrom!==vTo),
    segments:segs, sssFrom:sssA, sssTo:sssB, sdsFrom:sdsA, sdsTo:sdsB,
    bandFrom:band(sssA), bandTo:band(sssB), bandChanged:band(sssA)!==band(sssB),
    ischChanged:isch(sdsA)!==isch(sdsB),
    efFrom:a.ef&&a.ef.rest, efTo:b.ef&&b.ef.rest};
}

/* Panels remember their own open/closed state across re-renders. Reference

/* Compact decision strip: the four things a reader needs before anything else. */
function caGlance(A){
  function cell(label,value,sub,tone){
    return el("div",{class:"gl-cell t-"+(tone||"neutral")},[
      el("div",{class:"gl-k"},[label]),
      el("div",{class:"gl-v"},[value]),

  }
  var ph=A.axes.phenotype;
  var top=A.recs[0];

/* ---- the mark ----
   A polar map divides the myocardium into three vascular territories at 120
   degrees around the apex. The radiation trefoil is three blades at 120
   degrees around a central disc. Same geometry — one shape that says nuclear
   medicine and says three territories at once.

   The blades carry the map's own colors, in the map's own places: LAD
   anterior at the top, LCX lateral to the lower right, RCA inferior to the
   lower left. The center is the apex. Rounded ends and wide gaps keep it an
   emblem rather than the hazard placard the geometry is descended from.
   Generated by mark3_patch.py. */
var MARK_DOT_INK = "#86929c";
var MARK_PATHS = [
  {terr:"LAD",color:"#cc736d",d:"M14.64,11.32 A27.00,27.00 0 0 1 49.36,11.32 A5.75,5.75 0 0 1 41.96,20.13 A15.50,15.50 0 0 0 22.04,20.13 A5.75,5.75 0 0 1 14.64,11.32 Z"},
  {terr:"LCX",color:"#689c95",d:"M58.59,27.31 A27.00,27.00 0 0 1 41.23,57.37 A5.75,5.75 0 0 1 37.30,46.57 A15.50,15.50 0 0 0 47.26,29.31 A5.75,5.75 0 0 1 58.59,27.31 Z"},
  {terr:"RCA",color:"#7196b0",d:"M22.77,57.37 A27.00,27.00 0 0 1 5.41,27.31 A5.75,5.75 0 0 1 16.74,29.31 A15.50,15.50 0 0 0 26.70,46.57 A5.75,5.75 0 0 1 22.77,57.37 Z"}
];
var MARK_DOT = "M24.50,32.00 a7.50,7.50 0 1,0 15.00,0 a7.50,7.50 0 1,0 -15.00,0 Z";
function markSvg(px,small){
  var s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" '+
         'width="'+px+'" height="'+px+'" fill="none">';
  MARK_PATHS.forEach(function(p){ s+='<path d="'+p.d+'" fill="'+p.color+'"/>'; });
  s+='<path d="'+MARK_DOT+'" fill="'+MARK_DOT_INK+'"/>';
  return s+'</svg>';
}
function markNode(px){
  var host=document.createElement('span');
  host.className='mark'; host.setAttribute('aria-hidden','true');
  host.innerHTML=markSvg(px);

  catch(e){ toast("Save failed: "+e.message,true); }

/* Object.assign(emptyState(), obj) is a SHALLOW merge, so any nested object present
   in the restored payload replaces the default wholesale — and an explicit null
   (hand-edited JSON, or a payload from a build predating a field) survives and
   crashes the renderer. Re-seed nested defaults after any restore. */
function normalizeState(st){
  var d=emptyState();
  /* Object.assign(emptyState(), obj) replaces a whole branch, so a saved file
     carrying a partial pt ({firstName, age}) drops pt.ind, pt.echoFindings and
     the rest — and the first render then throws on S.pt.ind.cp. Fill missing
     sub-keys per branch rather than only replacing absent branches. */
  ['pt','hx','hxNeg','meds','dmMeds','rx','stressData','artifact','tid','stress','rest',
   'ef','motion','thickening','flow','calcium','comm','docs','comparison','ct',
   'defectOverrides','readout','_prov','opts','onco','bayes','reads',
   'tech','gradient','impression','renal'].forEach(function(k){
    if(st[k]==null||typeof st[k]!=='object'||Array.isArray(st[k])!==Array.isArray(d[k])){
      st[k]=d[k]; return;
    }
    if(d[k]&&typeof d[k]==='object'&&!Array.isArray(d[k])){
      Object.keys(d[k]).forEach(function(sub){
        if(st[k][sub]===undefined) st[k][sub]=d[k][sub];
        /* a nested object branch (pt.ind, onco.her2Agents) must itself be an object */
        else if(d[k][sub]&&typeof d[k][sub]==='object'&&!Array.isArray(d[k][sub])
                &&(st[k][sub]==null||typeof st[k][sub]!=='object')) st[k][sub]=d[k][sub];
      });
    }
  });
  /* segment scores arrive from arbitrary files; clamp to the 0-4 the UI allows */
  ['stress','rest'].forEach(function(m){
    for(var i=1;i<=17;i++){
      var v=Number(st[m][i]);
      st[m][i]=(isFinite(v)?Math.max(0,Math.min(4,Math.round(v))):0);
    }
  });
  ['LAD','LCX','RCA','Global'].forEach(function(t){ if(st.flow[t]==null||typeof st.flow[t]!=='object') st.flow[t]={stress:"",rest:""}; });
  ['her2Agents','iciAgents'].forEach(function(k){ if(st.onco[k]==null||typeof st.onco[k]!=='object') st.onco[k]={}; });
  if(!Array.isArray(st.correlation)) st.correlation=[];
  if(!Array.isArray(st.nonAC)) st.nonAC=[];
  for(var i=1;i<=17;i++){ if(st.stress[i]==null)st.stress[i]=0; if(st.rest[i]==null)st.rest[i]=0; }
  return st;
}
