function gaps(S,A){
  var G=[], R=riskProfile(S,A);
  var reviewed=medsReviewed(S);

  function gap(o){ o.trial=TRIALS[o.trialKey]; G.push(o); }

  if(!reviewed){
    G.push({id:'meds-unreviewed', priority:'moderate', trialKey:null, trial:null, noNnt:true,
      strength:'strong',
      title:'Medication list not recorded — therapy-gap analysis withheld',
      inputs:['No medications entered and no explicit confirmation that none are taken'],
      threshold:'Medication list reviewed',
      action:'Enter the medication list, or mark it explicitly as reviewed with none relevant, to enable therapy-gap analysis.',
      teach:'Absence of evidence is being distinguished from evidence of absence here deliberately. An empty medication list on a workstation almost always means "not yet entered", not "takes nothing". Reporting a statin gap from an unfilled field would generate a false high-priority alert on virtually every study, and for the registry it would record untreated patients who are in fact treated.'});
    return G;
  }

  /* ---- statin ---- */
  if(R.demonstratedAtheroma && !onClass(S,'statin')){
    var basis=[];
    if(R.cac!=null&&R.cac>0) basis.push('coronary calcium '+R.cac);
    if(R.ischemia) basis.push('inducible ischemia (SDS '+A.axes.sds+', '+A.axes.ischemicPct+'% of myocardium)');
    if(R.scar) basis.push('fixed defect involving '+A.axes.scarPct+'% of myocardium');
    if(R.knownCad) basis.push('known coronary disease by history');
    gap({id:'statin', priority:'high',
      title:'No statin recorded despite demonstrated atherosclerosis',
      inputs:basis,
      threshold:'Any objectively demonstrated coronary atherosclerosis or ischemia',
      trialKey:'ctt10',
      strength:'strong',
      action:'Confirm lipid-lowering therapy with the referring clinician; if genuinely untreated, this is the single highest-yield action arising from this study.',
      teach:'This is the most common actionable gap in cardiac imaging. The scan has just supplied something a risk calculator cannot: direct evidence of atherosclerosis in this specific patient. That converts an estimated risk into a demonstrated one, and the proportional benefit of LDL lowering is roughly constant across risk strata, so the absolute benefit scales with the risk you have just documented. The imaging finding is not merely descriptive; it changes the treatment threshold.',
      caveat:'The medication list captured here reflects what was entered at the workstation and may be incomplete. Treat this as a prompt to verify, not as a statement that the patient is untreated.'});
  }

  /* ---- intensification, not initiation ---- */
  if((R.establishedAscvd||R.subclinicalHighBurden) && onClass(S,'statin')){
    gap({id:'statin-intensity', priority:'moderate',
      title:'Confirm statin intensity is appropriate to demonstrated disease burden',
      inputs:['On statin therapy'].concat(R.ischemia?['inducible ischemia present']:[]).concat(R.cac>=400?['CAC '+R.cac]:[]),
      threshold:'Established ASCVD on any statin',
      trialKey:'ctt10', strength:'strong',
      action:'Verify high-intensity dosing and LDL-C attainment rather than presence of a statin alone.',
      teach:'Presence of a statin on the list is not the same as adequate lipid lowering. Benefit tracks the magnitude of LDL-C reduction achieved, not whether a statin appears in the chart. A patient on low-dose therapy with an unmeasured LDL is functionally an untreated patient with a reassuring-looking medication list.'});
  }

  /* ---- SGLT2 inhibitor ---- */
  if(R.dm && R.subclinicalHighBurden && !onDmClass(S,'sglt2') && !R.establishedAscvd){
    gap({id:'sglt2-subclinical', priority:'low',
      title:'Diabetes with subclinical atherosclerosis — SGLT2 inhibitor evidence does not directly apply',
      inputs:['Diabetes by history','CAC '+R.cac+' without inducible ischemia or infarction'],
      threshold:'Type 2 diabetes with subclinical atherosclerosis only',
      trialKey:'declare', strength:'weak',
      action:'Mention as risk-factor context. Do not present this as the EMPA-REG indication.',
      teach:'Deliberately separated from the established-disease recommendation. EMPA-REG enrolled patients with clinical cardiovascular disease; a calcium score, however high, would not have met that criterion. DECLARE included a multiple-risk-factor stratum and is the closer comparison, with a correspondingly smaller effect. Quoting the EMPA-REG number for this patient would overstate the expected benefit.',
      caveat:'Population mismatch. This patient does not match the trial that generated the strongest effect estimate.'});
  }
  if(R.dm && R.establishedAscvd && !onDmClass(S,'sglt2')){
    gap({id:'sglt2', priority:'high',
      title:'Diabetes with established cardiovascular disease and no SGLT2 inhibitor recorded',
      inputs:['Diabetes by history'].concat(R.knownCad?['known coronary disease']:[])
             .concat(R.ischemia?['inducible ischemia on this study']:[])
             .concat(R.cac>=400?['CAC '+R.cac]:[]),
      threshold:'Type 2 diabetes with established ASCVD',
      trialKey:'empareg', strength:'strong',
      action:'Flag to the referring clinician or endocrinologist as a cardiovascular indication, distinct from glycaemic control.',
      teach:'This class is prescribed for glycaemic control but its cardiovascular indication is separate and stronger. EMPA-REG enrolled patients with established cardiovascular disease, which is precisely what this scan may have just established. The mortality signal appeared early and was not explained by glucose lowering. If the scan converts a patient from "diabetes with risk factors" to "diabetes with established cardiovascular disease," the trial population now describes them.',
      caveat:'Enrolment required established cardiovascular disease. In diabetes without it, the evidence is weaker and this should not be presented as an equivalent indication.'});
  }

  /* ---- GLP-1 receptor agonist ---- */
  if(R.dm && R.establishedAscvd && !onDmClass(S,'glp1') && !onDmClass(S,'sglt2')){
    gap({id:'glp1', priority:'moderate',
      title:'Diabetes at high cardiovascular risk without an agent of demonstrated cardiovascular benefit',
      inputs:['Diabetes by history','demonstrated atherosclerosis or ischemia on this study'],
      threshold:'Type 2 diabetes at high cardiovascular risk',
      trialKey:'leader', strength:'moderate',
      action:'Consider raising with the treating team where an SGLT2 inhibitor is unsuitable or insufficient.',
      teach:'GLP-1 receptor agonists reduce atherosclerotic events, whereas SGLT2 inhibitors act most strongly on heart failure and cardiovascular death. The two classes are complementary rather than interchangeable, and the choice can be steered by which phenotype the imaging demonstrates.'});
  }

  /* ---- aspirin: both directions ---- */
  if(R.establishedAscvd && !onClass(S,'aspirin') && !onClass(S,'p2y12') && !onClass(S,'anticoag')){
    gap({id:'aspirin-secondary', priority:'moderate',
      title:'Established coronary disease without recorded antiplatelet therapy',
      inputs:(R.knownCad?['known coronary disease']:[]).concat(R.ischemia?['inducible ischemia']:[]).concat(R.scar?['fixed defect']:[]),
      threshold:'Secondary prevention',
      trialKey:'ctt10', strength:'strong',
      action:'Verify antiplatelet status with the referring clinician.',
      teach:'Note the asymmetry with primary prevention below: aspirin retains a clear role once disease is established, and lost its routine role where it is not. The scan is often what decides which side of that line the patient sits on.'});
  }
  if(!R.demonstratedAtheroma && R.cac===0 && onClass(S,'aspirin')){
    gap({id:'aspirin-deprescribe', priority:'moderate', deprescribe:true,
      title:'Aspirin without demonstrated atherosclerosis \u2014 consider whether it is still indicated',
      inputs:['Zero coronary calcium','no inducible ischemia','no fixed defect'],
      threshold:'Primary prevention with absent coronary calcium',
      trialKey:'aspree', strength:'strong',
      action:'Raise de-prescribing with the referring clinician. Bleeding risk continues without an offsetting ischemic benefit.',
      teach:'Decision support is usually framed as adding treatment, but stopping ineffective treatment is equally an intervention and here it is the better-evidenced one. Three large trials found no net benefit in primary prevention. A zero calcium score in an asymptomatic patient is about as clean a demonstration of absent atherosclerotic substrate as imaging provides.'});
  }

  /* ---- ACE inhibitor / ARB ---- */
  var efRest=num(S.ef&&S.ef.rest);
  if(efRest!=null&&efRest<40&&!onClass(S,'aceArb')){
    gap({id:'acearb', priority:'high',
      title:'Reduced ejection fraction without recorded ACE inhibitor or ARB',
      inputs:['Rest LVEF '+efRest+'%'],
      threshold:'LVEF <40%',
      trialKey:'ctt10', strength:'strong', noNnt:true,
      action:'Ensure guideline-directed heart-failure therapy is addressed by the treating team.',
      teach:'A perfusion study frequently produces the first quantitative ejection fraction a patient has had. When that number falls below 40%, the study has incidentally identified a heart-failure patient, and the therapeutic implications are larger than the perfusion findings that prompted the scan.'});
  }
  if(efRest!=null&&efRest<40&&!onClass(S,'betaBlocker')){
    gap({id:'bb-hfref', priority:'high',
      title:'Reduced ejection fraction without recorded beta-blocker',
      inputs:['Rest LVEF '+efRest+'%'],
      threshold:'LVEF <40%',
      trialKey:'ctt10', strength:'strong', noNnt:true,
      action:'Ensure guideline-directed heart-failure therapy is addressed.',
      teach:'Beta-blockade in reduced ejection fraction has among the largest mortality effects in cardiovascular medicine. Note the tension with imaging: beta-blockade blunts the vasodilator response and can depress measured flow reserve, so the drug that helps the patient complicates the next scan. That is a reason to record it, not to withhold it.'});
  }

  /* ---- blood pressure ---- */
  var pSBP=num(S.stressData&&S.stressData.restSBP);
  if(pSBP!=null&&pSBP>=140&&hx(S,'htn')){
    gap({id:'bp', priority:'moderate',
      title:'Resting systolic pressure '+pSBP+' mmHg at the time of imaging',
      inputs:['Rest SBP '+pSBP+' mmHg','hypertension by history'],
      threshold:'Systolic \u2265140 mmHg in a treated hypertensive',
      trialKey:'sprint', strength:'moderate',
      action:'A single reading is not a diagnosis, but it is worth communicating if substantially above target.',
      teach:'The rest blood pressure recorded for the rate-pressure product is real clinical data that is usually discarded after the calculation. It also matters mechanistically here: elevated resting pressure raises resting myocardial work, which raises rest flow and therefore lowers measured flow reserve independent of any coronary disease.',
      caveat:'One measurement in a stressful imaging environment is weak evidence of habitual control, and SPRINT used unattended automated measurement that reads lower than routine clinic readings.'});
  }

  /* ---- INOCA / microvascular ---- */
  if(A.axes.phenotype.id==='microvascular'||(A.axes.flow.abnormal===true&&!R.ischemia&&R.cac===0)){
    gap({id:'inoca', priority:'moderate',
      title:'Microvascular phenotype \u2014 consider stratified antianginal therapy rather than discharge',
      inputs:['Global MFR '+A.axes.flow.value,'no inducible ischemia','zero or absent calcium'],
      threshold:'Reduced flow reserve without obstructive disease',
      trialKey:'cormica', strength:'moderate',
      action:'Communicate that a normal-appearing perfusion study does not mean an absent explanation for symptoms.',
      teach:'These patients are routinely told their scan is normal and discharged without treatment. Flow quantification is what distinguishes a genuinely normal study from an abnormal one that relative imaging cannot see. CorMicA showed that identifying the endotype and treating accordingly improves symptoms \u2014 note carefully that the endpoint was angina, not events.',
      caveat:'The demonstrated benefit is symptomatic. No mortality or infarction benefit has been shown, and it should not be implied.'});
  }

  /* ---- cardio-oncology ---- */
  var o=S.onco||{};
  if(A.onco.ctrcd&&(A.onco.ctrcd.id==='definite')){
    gap({id:'ctrcd-tx', priority:'high',
      title:'CTRCD identified \u2014 cardioprotective therapy and oncology coordination',
      inputs:['Prior LVEF '+A.onco.ctrcd.efPrior+'%','current LVEF '+A.onco.ctrcd.efNow+'%'],
      threshold:'LVEF fall \u226510 points to below 50%',
      trialKey:'prada', strength:'weak',
      action:'Communicate promptly; decisions about interrupting cardiotoxic therapy are time-sensitive to the treatment schedule.',
      teach:'The urgency here is not the ejection fraction itself but the treatment calendar. A result that arrives after the next cycle has been given is a result that changed nothing. Evidence for cardioprotective drugs in this setting is considerably weaker than most guidelines\' confident tone suggests \u2014 PRADA showed only a small attenuation of ejection fraction decline on a surrogate endpoint.',
      caveat:'Prophylactic cardioprotection in unselected patients is not established. The strongest evidence-based action is communication and coordination, not a specific prescription.'});
  }
  if(o.anthra&&num(o.anthraDose)!=null&&num(o.anthraDose)>=400){
    gap({id:'dexrazoxane', priority:'low',
      title:'High cumulative anthracycline exposure',
      inputs:['Cumulative dose '+o.anthraDose+' mg/m\u00b2'],
      threshold:'\u2265400 mg/m\u00b2 doxorubicin-equivalent',
      trialKey:'dexraz', strength:'moderate',
      action:'For registry documentation and oncology awareness. Cardioprotective strategy is an oncology decision.',
      teach:'Cardiomyopathy incidence rises steeply beyond roughly 400 mg/m\u00b2. Recording the cumulative dose is what allows the dose-response relationship to be studied at all \u2014 it is the exposure variable, and without it the entire cardio-oncology arm of the registry is uninterpretable.'});
  }
  if(o.ici){
    gap({id:'ici-myocarditis', priority:'moderate',
      title:'Checkpoint inhibitor exposure \u2014 perfusion imaging does not exclude myocarditis',
      inputs:['Checkpoint inhibitor exposure recorded'],
      threshold:'Any ICI exposure',
      trialKey:'ctt10', strength:'moderate', noNnt:true,
      action:'If there is clinical suspicion, troponin and ECG are the appropriate tests; a normal perfusion study is not reassurance.',
      teach:'A dangerous false-reassurance trap. Checkpoint-inhibitor myocarditis is uncommon but has high case fatality, presents early after initiation, and does not produce a perfusion defect. Reporting "normal perfusion" without noting this can be read as excluding a diagnosis the test never addressed.'});
  }

  var order={high:0,moderate:1,low:2};
  G.sort(function(a,b){ return order[a.priority]-order[b.priority]; });
  return G;
}

/* ------------------------------------------------------------
   OVERUSE PREVENTION — the decisions worth NOT making
   ------------------------------------------------------------ */
function overuse(S,A){
  var O=[], R=riskProfile(S,A);

  if(A.axes.ischemicPct!=null&&A.axes.ischemicPct>=10){
    O.push({id:'ischemia-cath', title:'Moderate-to-severe ischemia does not by itself mandate catheterization',
      inputs:['Ischemic myocardium '+A.axes.ischemicPct+'%'],
      trial:TRIALS.ischemia20, strength:'strong',
      note:'ISCHEMIA randomized precisely this population and found no reduction in ischemic cardiovascular events from a routine invasive strategy. Angina relief favored invasive management in symptomatic patients.',
      teach:'This is the largest single gap between habit and evidence in stress imaging. For two decades a large ischemic burden was treated as an automatic referral for angiography. ISCHEMIA tested that directly and did not support it for event reduction. The finding should still be reported prominently \u2014 it identifies a high-risk patient who needs intensive medical therapy \u2014 but the reflex from burden to catheter is the thing the trial challenged. Symptom burden, not ischemic burden, is what favors an invasive approach.'});
  }
  if(A.axes.phenotype.id==='triple-normal'||(A.axes.calcium.value===0&&A.axes.perfusion.abnormal===false&&A.axes.flow.abnormal===false)){
    O.push({id:'warranty', title:'Warranty period \u2014 repeat testing is unlikely to add information',
      inputs:['Normal perfusion','preserved flow reserve','zero coronary calcium'],
      trial:TRIALS.valenti15b, strength:'moderate',
      note:'This combination carries the lowest event rate described for cardiac PET.',
      teach:'Stating the warranty explicitly in the report is one of the few things that reliably prevents a repeat scan in eighteen months. A report that simply says "normal" invites repetition when symptoms recur; one that says the finding predicts a prolonged low-risk period gives the next clinician something to act on.'});
  }
  if(A.validity.confidence==='low'){
    O.push({id:'repeat-not-escalate', title:'Repeat under controlled conditions before escalating on confounded flow data',
      inputs:A.validity.items.filter(function(i){return i.flag==='high';}).map(function(i){return i.k;}),
      trial:TRIALS.ischemia20, strength:'moderate',
      note:'A technically low flow reserve is indistinguishable from a physiologically low one on the data alone.',
      teach:'The costly error here is escalating to angiography on a number produced by unheld caffeine. A repeat study is inexpensive relative to an invasive procedure undertaken on invalid physiology.'});
  }
  return O;
}

/* ------------------------------------------------------------
   TEACHING POINTS — surfaced from what this study actually shows
   ------------------------------------------------------------ */
function teaching(S,A){
  var T=[];
  function t(title,body,cite){ T.push({title:title,body:body,cite:cite}); }

  if(A.axes.phenotype.id==='balanced')
    t('Why relative imaging misses balanced ischemia',
      'Relative perfusion imaging normalizes every segment to the brightest myocardium in the same heart. When all three territories are reduced together, the brightest region is itself abnormal, and the map is scaled against a diseased reference. The result looks uniform, which the eye reads as normal. Absolute flow has no internal reference and so is not fooled. This is the single strongest argument for quantifying flow rather than relying on the polar map.','ziadi12');

  if(A.axes.flow.value!=null&&A.axes.calcium.value!=null)
    t('Why flow and calcium disagree, and why that is informative',
      'Calcium measures accumulated atherosclerotic burden over a lifetime; flow reserve measures current physiologic consequence. They are different axes, not competing estimates of one thing. Heavy calcium with preserved flow is compensated disease that calls for prevention rather than intervention. Absent calcium with reduced flow points at the microvasculature. Concordance raises confidence; discordance is where the interesting patients are.','gould13');

  if(A.validity.rppRest!=null)
    t('Why resting hemodynamics change the flow reserve',
      'Flow reserve is a ratio, so anything that raises the denominator lowers it. Resting myocardial blood flow tracks cardiac work, approximated by the rate-pressure product. A patient anxious on the table with a rate-pressure product of 12,000 has genuinely elevated resting flow and will show a lower reserve than the same coronary anatomy would produce at 8,000. Correcting rest flow to a standard workload is what makes the number comparable between patients and across serial studies.','czernin93');

  if(A.axes.sds>=2)
    t('Ischemic burden and what it now does and does not imply',
      'Burden retains its prognostic meaning: more ischemia identifies higher risk. What changed after ISCHEMIA is the therapeutic inference. A large burden no longer implies that revascularization will reduce events, though it still implies a patient who needs aggressive medical therapy and close follow-up. Separating the prognostic claim from the therapeutic one is the discipline the trial demands.','ischemia20');

  var o=S.onco||{};
  if(o.rt&&(o.rtSide==='left'||o.rtSide==='mediastinal'))
    t('Why radiotherapy laterality is worth recording',
      'The left anterior descending artery lies within or adjacent to a left-sided breast or mediastinal treatment volume; a right-sided field generally spares it. That asymmetry creates a natural experiment: right-sided patients are matched for malignancy, chemotherapy, surveillance pathway and scanner, and differ principally in whether the LAD was irradiated. Radiation-associated disease favors ostial and proximal segments and can be fibrotic rather than calcified, so a normal calcium score does not exclude it.','darby13');

  if(o.anthra||o.her2)
    t('Why flow may fall before function in cardiotoxicity',
      'Ejection fraction is a late and insensitive marker of myocardial injury; substantial damage accumulates before it moves, and it is confounded by loading conditions. Microvascular injury is thought to precede contractile decline. A patient with reduced flow reserve and a preserved ejection fraction is therefore the phenotype an ejection-fraction-based surveillance programme cannot detect. This remains a hypothesis rather than an established criterion, and is exactly the kind of question this registry is positioned to answer.','taqueti18');

  if(A.axes.perfusion.abnormal&&A.territory.rows.some(function(r){return r.concordance.id==='defect-only';}))
    t('Distinguishing attenuation from disease',
      'Attenuation is a fixed, geometric phenomenon: it does not vary between stress and rest, and it does not reduce absolute flow. Three independent checks therefore separate it from disease \u2014 reversibility between stress and rest, behavior on the uncorrected images, and whether regional absolute flow is concordantly reduced. A defect that is fixed, matches the expected body-habitus pattern, and has preserved territorial flow is very unlikely to be a stenosis.','cerqueira02');

  t('What this tool can and cannot claim',
    'Every recommendation here shows its inputs, threshold, source and confidence so that the basis can be checked rather than taken on trust. Where a number needed to treat is quoted, it comes from a named trial with a stated population and time horizon, and it describes the therapy, not this software. Whether using this tool improves patient outcomes is an empirical question that only a comparative study can answer.','ischemia20');

  return T;
}

/* ------------------------------------------------------------
   MEASUREMENT SUBSTRATE
   What a future effectiveness study would need to record.
   ------------------------------------------------------------ */
function measurement(S,A,G,O){
  var actionable=G.filter(function(g){return g.priority==='high';}).length;
  return {
    gapsTotal:G.length,
    gapsHigh:actionable,
    overuseFlags:O.length,
    /* the fields a comparative study would need per study */
    record:{
      gapsFired:G.map(function(g){return g.id;}),
      overuseFired:O.map(function(o){return o.id;}),
      phenotype:A.axes.phenotype.id,
      validityConfidence:A.validity.confidence,
      /* filled by the reader, not the engine */
      gapsAccepted:null, gapsCommunicated:null, downstreamTesting:null
    },
    note:'This tool cannot have a number needed to treat of its own. NNT is a property of a comparative study, not of software. What is recorded here \u2014 which gaps fired, which the reader acted on, and what happened downstream \u2014 is the substrate such a study would need. Comparing gap-closure rates and downstream testing between studies read with and without this tool is the design that could eventually support an outcome claim.'
  };
}

function analyze(S,A){
  var G=gaps(S,A), O=overuse(S,A);
  return {gaps:G, overuse:O, teaching:teaching(S,A), measurement:measurement(S,A,G,O),
          profile:riskProfile(S,A), TRIALS:TRIALS};
}

return {analyze:analyze, TRIALS:TRIALS, riskProfile:riskProfile, medsReviewed:medsReviewed,
        CLASS:CLASS, DM_CLASS:DM_CLASS};
}));

   WHY THIS EXISTS
   A dataset that can answer twenty questions is also a dataset that can
   manufacture twenty false positives. The protection is not statistical
   cleverness after the fact; it is declaring the questions before looking.
   This module is therefore a PRE-REGISTRATION artifact, not a mining tool:
   every hypothesis states its design, exposure, comparator, outcome,
   required variables and known pitfalls up front.

   It answers three questions at the point of read-out:
     1. Which registered questions does THIS study contribute to?
     2. Which questions are blocked, and on which missing variable?
     3. Which unmeasured variable would unlock the most questions?

   These are categorically different from everything above. A prognostic
   finding says "this patient is high risk". A predictive finding says
   "this patient benefits from THIS therapy and that one does not". Only the
   second makes a test necessary rather than merely informative, and only the
   second survives the kind of challenge ISCHEMIA posed to risk stratification.

   NONE of these can be established by a registry. Effect modification requires
   randomization with the biomarker measured at baseline and a formal interaction
   test. A subgroup difference in an observational cohort is confounding until
   proven otherwise. What the registry CAN do is supply the three things a trial
   needs: prevalence of the candidate phenotype, its event rate, and therefore
   the enrichment factor that determines whether the trial is affordable at all.
   ------------------------------------------------------------ */

/* ------------------------------------------------------------
   Is a required variable present for THIS study?
   ------------------------------------------------------------ */
function varPresent(S,A,key){
  var v=VARS[key];
  if(!v) return false;
  if(v.status==='proposed') return false;          /* not capturable yet */
  switch(key){
    /* An all-zero map is a legitimate normal read, so presence cannot be inferred
       from non-zero scores. Whether the study was read at all is handled by the
       studyRead() gate below rather than here. */
    case 'segScores':  return true;
    case 'globalMFR':  return A.axes.flow.value!=null;
    case 'terrMFR':    return A.territory.rows.some(function(r){return r.mfr!=null;});
    case 'cac':        return A.axes.calcium.value!=null;
    /* Reviewed-with-none is data; not-yet-entered is not. See evidence-engine.medsReviewed. */
    case 'meds':       return !!S.medsReviewed
                           || Object.keys(S.meds||{}).some(function(k){return S.meds[k];})
                           || Object.keys(S.dmMeds||{}).some(function(k){return S.dmMeds[k];});
    case 'cardiacHx':  return Object.keys(S.hx||{}).length>0||Object.keys(S.hxNeg||{}).length>0;
    case 'rpp':        return num(S.stressData&&S.stressData.restSBP)!=null&&num(S.stressData&&S.stressData.restHR)!=null;
    case 'volumes':    return num(S.esvRest)!=null||num(S.edvRest)!=null;
    default:           return v.path?has(S,v.path):false;
  }
}

  if(A.axes.flow.value!=null) return true;
  if(num(S.ef&&S.ef.rest)!=null||num(S.ef&&S.ef.stress)!=null) return true;
  if(A.axes.calcium.value!=null) return true;
  for(var i=1;i<=17;i++){ if((num(S.stress[i])||0)>0||(num(S.rest[i])||0)>0) return true; }
  return false;
}

function evaluate(S,A){
  var contributes=[], blocked=[], notApplicable=[];
  if(!studyRead(S,A)){
    return {contributes:[],blocked:[],notApplicable:[],unread:true,
      note:'No imaging data entered yet. Registry contribution is evaluated once the study has been read.'};
  }

  HYPOTHESES.forEach(function(h){
    var missing=[], missingProposed=[];
    h.needs.forEach(function(k){
      if(!varPresent(S,A,k)){
        if(VARS[k]&&VARS[k].status==='proposed') missingProposed.push(k); else missing.push(k);
      }
    });
    /* applicability gates: some questions only concern certain patients */
    var applies=true, why='';
    if(h.id==='rt-laterality'){ applies=!!(S.onco&&S.onco.rt&&S.onco.rtSide); why='requires a recorded radiotherapy field'; }
    if(h.id==='anthra-dose-response'){ applies=!!(S.onco&&S.onco.anthra); why='requires anthracycline exposure'; }
    if(h.id==='ici-flow'){ applies=!!(S.onco&&S.onco.ici); why='requires checkpoint inhibitor exposure'; }
    if(h.id==='mfr-before-ef'){ applies=!!(S.onco&&(S.onco.anthra||S.onco.her2||S.onco.ici)); why='requires cardiotoxic therapy exposure'; }
    if(h.id==='cmd-oncology'||h.id==='statin-gap'){ applies=!!(S.onco&&S.onco.cancerType); why='requires a recorded malignancy'; }
    if(h.id==='aspirin-overuse'){ applies=(A.axes.calcium.value!=null); why='requires a calcium score'; }

    var rec={h:h,missing:missing,missingProposed:missingProposed,applies:applies,why:why};
    if(!applies) notApplicable.push(rec);
    else if(missing.length===0&&missingProposed.length===0) contributes.push(rec);
    else blocked.push(rec);
  });

  return {contributes:contributes,blocked:blocked,notApplicable:notApplicable,unread:false};

/* ------------------------------------------------------------
   REVERSE ENGINEERING
   Rank unmeasured variables by how many registered questions each unlocks.
   ------------------------------------------------------------ */
function variableGaps(){
  var tally={};
  HYPOTHESES.forEach(function(h){
    h.needs.forEach(function(k){
      if(VARS[k]&&VARS[k].status==='proposed'){
        tally[k]=tally[k]||{key:k,v:VARS[k],blocks:[],enables:[]};
        tally[k].blocks.push(h.id);
      }
    });
    (h.wants||[]).forEach(function(k){
      if(VARS[k]&&VARS[k].status==='proposed'){
        tally[k]=tally[k]||{key:k,v:VARS[k],blocks:[],enables:[]};
        tally[k].enables.push(h.id);
      }
    });
  });
  var out=Object.keys(tally).map(function(k){
    var t=tally[k];
    /* a question fully blocked counts double a question merely strengthened */
    t.score=t.blocks.length*2+t.enables.length;
    return t;
  });
  out.sort(function(a,b){ return b.score-a.score; });
  return out;
}


/* ------------------------------------------------------------
   ENRICHMENT CALCULATOR
   The concrete argument for a selection biomarker. If the marker-positive
   group has a higher event rate, the same relative risk reduction produces a
   larger ABSOLUTE difference, and required sample size falls roughly with the
   square of that difference. The cost is screening: you must scan
   1/prevalence patients to enrol one. That trade is exactly the case for the
   modality \u2014 and it is only worth making when the ratio favors it, which the
   calculator shows honestly in both directions.
   ------------------------------------------------------------ */
function zAlpha(a){ return a<=0.01?2.5758:(a<=0.025?2.2414:(a<=0.05?1.9600:1.6449)); }
function zBeta(p){ return p>=0.9?1.2816:(p>=0.85?1.0364:(p>=0.8?0.8416:0.6745)); }

/* two-arm superiority, binary outcome, per-arm n */
function armN(p1, rrr, alpha, power){
  var p2=p1*(1-rrr);
  var d=p1-p2;
  if(!(d>0)) return null;
  var za=zAlpha(alpha), zb=zBeta(power);
  var n=Math.pow(za+zb,2)*(p1*(1-p1)+p2*(1-p2))/(d*d);
  return Math.ceil(n);
}

/* Non-inferiority, binary outcome, per-arm n.
   De-escalation asks whether withholding therapy is not-worse-by-more-than-margin.
   Powering it as a superiority trial is simply the wrong model and produces
   meaningless numbers. Note the uncomfortable arithmetic this exposes: the very
   low event rate that makes de-escalation attractive clinically is what makes the
   trial large, because the margin must be small relative to that rate. */
function armNni(p, margin, alpha, power){
  if(!(margin>0)) return null;
  var za=zAlpha(alpha), zb=zBeta(power);
  var n=Math.pow(za+zb,2)*(2*p*(1-p))/(margin*margin);
  return Math.ceil(n);

function enrichment(h, override){
  var a=Object.assign({}, h.assumptions||{}, override||{});
  var prev=a.prevalence, pPos=a.eventRateMarkerPos, pNeg=a.eventRateMarkerNeg, rrr=a.rrr;
  var alpha=a.alpha||0.05, power=a.power||0.8;
  if(prev==null||pPos==null||pNeg==null||rrr==null) return null;

  /* unselected population event rate is the prevalence-weighted mix */
  var pAll=prev*pPos+(1-prev)*pNeg;

  if(h.direction==='de-escalation'){
    /* Here "marker positive" is the LOW-risk group being considered for withholding
       therapy. The question is non-inferiority against a margin, not superiority. */
    var margin=a.niMargin||0.01;
    var nSel=armNni(pPos, margin, alpha, power);
    var nAll=armNni(pAll, margin, alpha, power);
    if(nSel==null||nAll==null) return null;
    var enrolSel=nSel*2, screenSel=Math.ceil(enrolSel/prev);
    return {
      framing:'non-inferiority',
      assumptions:{prevalence:prev,eventRateSelected:pPos,eventRateUnselected:Math.round(pAll*1000)/10,
                   niMargin:margin,alpha:alpha,power:power},
      unselectedEventRate:Math.round(pAll*1000)/10,
      enrolledUnselected:nAll*2,
      enrolledEnriched:enrolSel,
      sampleSizeRatio:Math.round((nAll*2)/enrolSel*10)/10,
      screened:screenSel,
      numberNeededToScreen:Math.round(1/prev*10)/10,
      worthwhile:(enrolSel<nAll*2),
      note:'This is a de-escalation question and is therefore framed as non-inferiority against an absolute margin of '+
           (margin*100).toFixed(1)+' percentage points. Selecting the low-risk group reduces the event rate from '+
           (Math.round(pAll*1000)/10)+'% to '+(pPos*100).toFixed(1)+'%, which REDUCES the required sample under a '+
           'non-inferiority framing because variance falls with the event rate — but the trial remains large in absolute terms. '+
           'The low event rate that makes withholding therapy attractive is the same thing that makes proving it safe expensive.',
      caveat:'Powering a de-escalation question as a superiority trial is a category error and yields meaningless numbers. The margin is a clinical judgement about acceptable harm, not a statistical parameter, and it should be agreed before any of this arithmetic is used.'
    };
  }

  var nEnrichedArm=armN(pPos, rrr, alpha, power);
  var nUnselArm=armN(pAll, rrr, alpha, power);
  if(nEnrichedArm==null||nUnselArm==null) return null;

  var enrolledEnriched=nEnrichedArm*2, enrolledUnsel=nUnselArm*2;
  var screened=Math.ceil(enrolledEnriched/prev);

  return {
    framing:'superiority',
    assumptions:{prevalence:prev,eventRateMarkerPos:pPos,eventRateMarkerNeg:pNeg,
                 rrr:rrr,alpha:alpha,power:power},
    unselectedEventRate:Math.round(pAll*1000)/10,
    enrolledUnselected:enrolledUnsel,
    enrolledEnriched:enrolledEnriched,
    sampleSizeRatio:Math.round(enrolledUnsel/enrolledEnriched*10)/10,
    screened:screened,
    numberNeededToScreen:Math.round(1/prev*10)/10,
    screensPerEnrolmentAvoided:(enrolledUnsel>enrolledEnriched)
      ? Math.round(screened/(enrolledUnsel-enrolledEnriched)*100)/100 : null,
    worthwhile:(enrolledUnsel>enrolledEnriched),
    note:(enrolledUnsel>enrolledEnriched)
      ? 'Enrichment reduces required enrolment from '+enrolledUnsel+' to '+enrolledEnriched+
        ' ('+Math.round(enrolledUnsel/enrolledEnriched*10)/10+'-fold), at the cost of screening approximately '+
        screened+' patients to enrol '+enrolledEnriched+'. Whether that trade is worth making depends on the cost and availability of the screening test relative to the cost of enrolling and following a trial participant.'
      : 'Enrichment does not reduce required enrolment under these assumptions. The marker does not separate event rates enough to pay for the screening burden, and selecting on it would make the trial harder rather than easier.',
    caveat:'These are planning arithmetic on ASSUMED inputs, not results. Every number moves with the assumed event rates, which are the quantity the registry exists to measure. Treat this as a tool for deciding what to measure, never as evidence.'
  };
}

function predictiveProgram(override){
  return HYPOTHESES.filter(function(h){return h.cls==='predictive';})
    .map(function(h){ return {h:h, enrichment:enrichment(h, override&&override[h.id])}; });
}

/* ------------------------------------------------------------
   Program-level summary
   ------------------------------------------------------------ */
function program(){
  var answerableNow=0, blockedOnProposed=0;
  HYPOTHESES.forEach(function(h){
    var blocked=h.needs.some(function(k){ return VARS[k]&&VARS[k].status==='proposed'; });
    if(blocked) blockedOnProposed++; else answerableNow++;
  });
  return {
    total:HYPOTHESES.length,
    answerableNow:answerableNow,
    blockedOnProposed:blockedOnProposed,
    capturedVars:Object.keys(VARS).filter(function(k){return VARS[k].status==='captured';}).length,
    proposedVars:Object.keys(VARS).filter(function(k){return VARS[k].status==='proposed';}).length,
    governance:[
      'Nothing here may accrue before an IRB protocol is approved. A registry collecting identifiable data for future research requires a protocol and either HIPAA authorization or a waiver.',
      'Write outcome linkage into the original protocol even though it is unused today. Amending a protocol to add outcome ascertainment later is considerably harder than including it from the start.',
      'These hypotheses are pre-registered here deliberately. Analyses run on questions added after inspecting the data must be labeled exploratory and are hypothesis-generating only.',
      'A stable patient key across studies is the single most consequential schema decision, because every within-patient question depends on it and none can be recovered retrospectively without it.',
      'In an oncologic cohort, cancer death competes with cardiac death. Standard survival methods overstate cardiac risk; cumulative incidence and Fine-Gray models are required.',
      'Predictive claims — that a finding identifies who benefits from a therapy — cannot be established observationally. They require randomization with the biomarker measured at baseline and a pre-specified interaction test. A subgroup difference in registry data is confounding until a trial says otherwise.',
      'De-escalation claims are held to a higher standard than escalation claims, because withholding an effective therapy requires demonstrating absence of harm rather than presence of benefit. Expect to need a larger sample and longer follow-up, not a smaller one.',
      'Any biomarker threshold intended for a trial must be locked before the trial and not optimized within the registry, or the reported interaction will be overfitted.'
    ]
  };
}

function analyze(S,A){
  return {eval:evaluate(S,A), gaps:variableGaps(), program:program(),
          predictive:predictiveProgram(), hypotheses:HYPOTHESES, vars:VARS};
}

return {analyze:analyze, HYPOTHESES:HYPOTHESES, VARS:VARS, studyRead:studyRead,
        enrichment:enrichment, predictiveProgram:predictiveProgram, armN:armN, armNni:armNni,
        variableGaps:variableGaps, program:program, evaluate:evaluate};
}));

   A stress report states a result. It almost never states what that result
   does to this patient's probability of disease. That omission matters,
   because the same scan finding means completely different things at
   different pre-test probabilities: a "positive" study in a patient with a
   5% pre-test probability is more likely a false positive than a true
   positive. This is arithmetic, it has been known for fifty years, and it
   is routinely ignored at the workstation because nobody does the sum.

     1. Post-test probability, from stated pre-test probability and the
        likelihood ratio of the observed result.
     2. Whether the test actually changed management \u2014 did it move the
        patient across a decision threshold, or merely confirm where they
        already were?
     3. The incremental contribution of flow quantification over relative
        perfusion, applied sequentially rather than assumed.

   - Every likelihood ratio is shown, sourced and labeled by derivation.
   - Pre-test probability is an INPUT, not a hidden assumption. The default
     comes from a published table but is always visible and overridable.

   age, sex and symptom character. Contemporary tables give substantially
   LOWER values than the original Diamond-Forrester estimates, which is the
   single biggest reason historical stress imaging over-called disease.

   always displayed and can be overridden with an institutional or

var PTP_TABLE = {

  atypical:  {m:[[39,4],[49,10],[59,17],[69,26],[999,34]], f:[[39,3],[49,6],[59,6],[69,11],[999,19]]},
  nonanginal:{m:[[39,1],[49,3],[59,11],[69,22],[999,24]], f:[[39,1],[49,2],[59,3],[69,6],[999,10]]},

   note:'Weak positive evidence. A mildly abnormal study moves probability much less than most readers assume.'},
  {max:13,   id:'moderate', label:'Moderately abnormal (SSS 9\u201313)', lr:4.5,

   The intuitive final line is "this patient would benefit from

/* ---------- helpers ---------- */
function $(sel,root){return (root||document).querySelector(sel);}
function el(tag,attrs,kids){
  if(typeof document==="undefined"||!document.createElement) return null;
  var e=document.createElement(tag);
  if(attrs)for(var k in attrs){
    if(k==="class")e.className=attrs[k];
    else if(k==="html")e.innerHTML=attrs[k];
    else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2).toLowerCase(),attrs[k]);
    else if(attrs[k]!=null)e.setAttribute(k,attrs[k]);
  }
  (kids||[]).forEach(function(c){
    if(c==null)return;
    if(typeof c==="string"||typeof c==="number"){ e.appendChild(document.createTextNode(String(c))); return; }
    if(c&&c.nodeType){ e.appendChild(c); return; }
    /* Anything else is a programming error upstream. Render it as text rather
       than throwing, so one bad child cannot blank an entire tab. */
    try{ e.appendChild(document.createTextNode(JSON.stringify(c))); }catch(_){ }
  });
  return e;
}
function num(x){var v=parseFloat(x);return isNaN(v)?null:v;}
function markDirty(){dirty=true;savedFlag=false;updateSaveState();wlAutosave();}

/* ---------- build Xl for the report engine ---------- */
/* The UI uses concise chip keys; the certified engine expects its original keys.
   Translate here so the signed report wording stays exactly as certified. */
function engineHx(){
  var m={fhxcad:"fhx",priormi:"mi",pci:"pci",cabg:"cabg",chf:"chf",htn:"htn",hld:"hld",dm:"dm",tobacco:"smoker"};
  var out={}; Object.keys(S.hx||{}).forEach(function(k){ if(S.hx[k]&&m[k]) out[m[k]]=true; }); return out;
}
function engineInd(){
  var out={};
  var ind=S.pt.ind||{};
  if(ind.cp){ if(S.pt.cpType==="atypical") out.anginal=true; else out.chestPain=true; }
  if(ind.symptomaticCAD) out.knownCAD=true;
  if(ind.postMI) out.postMI=true;
  if(ind.postRevasc) out.postRevasc=true;
  if(ind.newLVSD) out.newLVSD=true;
  if(ind.arrhythmia) out.arrhythmia=true;
  if(ind.abnEKG) out.abnEKG=true;
  if(ind.priorTest) out.priorTest=true;
  if(ind.microvasc) out.microvasc=true;
  if(ind.dyspnea) out.dyspnea=true;
  return out;
}
/* The signed report recognizes only {secure, phone, person}. Epic Chat and
   e-mail are both secure electronic communication; keeping them distinct in the
   UI is useful for the draft, but they must be translated on the way out or the
   report renders "via undefined". */
var COMM_METHOD_TO_REPORT = {epic:"secure", email:"secure", secure:"secure",
                             phone:"phone", person:"person"};
function commForReport(){

}

function buildXl(){

  var ptOut = {}; for(var k in S.pt) ptOut[k]=S.pt[k];

    pt:ptOut, hx:engineHx(), meds:S.meds, rx:S.rx, stressData:S.stressData,

    tid:S.tid, stress:S.stress, rest:S.rest, defects:defects,

// thickening in state is 0..4 per wall; Zg expects "normal"/other per wall (non-normal => reduced)
function thickeningWords(){

/* ================= RESIDENT-ATTENDING READ-OUT ================= */
/* An unset sex must not read as male. Neutral until it is recorded. */
function pronoun(){
  if(S.pt.sex==="female") return {s:"She",o:"her",p:"her"};
  if(S.pt.sex==="male")   return {s:"He",o:"him",p:"his"};
  return {s:"The patient",o:"the patient",p:"the patient\u2019s"};
}
function fmtDate(iso){ if(!iso)return ""; var m=String(iso).match(/(\d{4})-(\d{2})-(\d{2})/); if(!m)return iso;
  var mo=["January","February","March","April","May","June","July","August","September","October","November","December"][+m[2]-1];
  return mo+" "+(+m[3])+", "+m[1]; }
function joinList(arr){ arr=arr.filter(Boolean); if(!arr.length)return ""; if(arr.length===1)return arr[0];
  if(arr.length===2)return arr[0]+" and "+arr[1]; return arr.slice(0,-1).join(", ")+", and "+arr[arr.length-1]; }

/* ---- the stress test, described ----
   What happened during stress belongs with the findings, not with the history:
   the agent, the hemodynamics at baseline and at peak, whether the patient
   became symptomatic, and — for vasodilator stress — the aminophylline dose
   and what it resolved. Anything not recorded is left out rather than filled
   with a placeholder; a read-out is spoken, and "blood pressure of __/__"
   cannot be spoken. */
function bp(sbp,dbp){
  var s=num(sbp), d=num(dbp);
  if(s==null&&d==null) return null;
  if(s!=null&&d!=null) return s+"/"+d+" mmHg";
  return (s!=null?s:d)+" mmHg";
}
function stressParagraph(){
  var sd=S.stressData||{}, p=pronoun();
  var isExercise = sd.type==="exercise";
  if(sd.type==="none") return null;
  var agent=(sd.agent||"").trim();
  var testName = isExercise ? "exercise stress test"
               : ("pharmacologic stress test"+(agent?(" with "+agent):""));
  var out=[];

  /* Hemodynamics, in the order they are read off the console: pressure, then
     rate. Each reports ITS OWN direction — the old text said "rising to" for
     both, so a study where the heart rate fell was described as a rise. A
     change of 5 or less is not a change worth a verb. */
  var restHR=num(sd.restHR), peakHR=num(sd.peakHR);
  var restSys=num(sd.restSBP), peakSys=num(sd.peakSBP);
  /* Spoken, a blood pressure carries no unit: "her BP was 107/63". */
  function bpBare(sbp,dbp){ var v=bp(sbp,dbp); return v?v.replace(/\s*mmHg$/,""):null; }
  var restBP=bpBare(sd.restSBP,sd.restDBP), peakBP=bpBare(sd.peakSBP,sd.peakDBP);
  function moved(from,to,down,up,flat){
    if(from==null||to==null) return null;
    var d=to-from;
    if(Math.abs(d)<=5) return flat;
    return d<0?down:up;
  }
  var lead="On our "+testName+", ";
  if(restBP||restHR!=null){
    var b0=[];
    if(restBP) b0.push(p.p.toLowerCase()+" BP was "+restBP);
    if(restHR!=null) b0.push((restBP?"with a HR of ":(p.p.toLowerCase()+" HR was "))+restHR);
    out.push(lead+"at baseline, "+b0.join(" ")+".");
  } else {
    out.push("Stress was performed as a "+testName+".");
  }
  if(peakBP||peakHR!=null){
    var b1=[];
    if(peakBP) b1.push(p.p.toLowerCase()+" BP "+
      (moved(restSys,peakSys,"dropped to","rose to","stayed about the same at")||"was")+" "+peakBP);
    if(peakHR!=null) b1.push((peakBP?"and "+p.p.toLowerCase()+" HR ":(p.p.toLowerCase()+" HR "))+
      (moved(restHR,peakHR,"dropped to","rose to","stayed about the same at")||"was")+" "+peakHR);
    out.push("At stress, "+b1.join(" ")+".");
  }

  /* symptoms */
  var sx=Object.keys(sd.symptoms||{}).filter(function(k){return k!=="none"&&sd.symptoms[k];})
          .map(function(k){return SYMPT[k]?SYMPT[k].toLowerCase():k;});
  if(sd.sxOther) sx.push(sd.sxOther);
  if(sx.length){
    /* Vasodilator side effects that pass without treatment are the common case,
       and saying so is the difference between a symptom and an event. */
    var untreated = !isExercise && sd.amino!=="given";
    out.push(p.s+" became symptomatic with "+(untreated?"self-limiting ":"")+joinList(sx)+
      (untreated?", which did not require aminophylline.":"."));
  }
  else out.push(p.s+" did not become symptomatic.");

  /* aminophylline: only meaningful after vasodilator stress */
  if(!isExercise && sd.amino==="given"){
    var forList=Object.keys(sd.aminoFor||{}).filter(function(k){return sd.aminoFor[k]&&AMINOFOR[k];})
                 .map(function(k){return AMINOFOR[k];});
    var what = forList.length ? joinList(forList) : (sx.length?"the symptoms":"the side effects");
    var dose = sd.aminoDose ? ("aminophylline "+sd.aminoDose+" mg") : "aminophylline";
    out.push(p.s+" was given "+dose+", which resolved the "+what+".");
  }
  return out.join(" ");
}

/* Creatinine, empty until it is given a value.
   A placeholder of "1.0" reads as a number already entered — grey text in a box
   is exactly what a derived value looks like elsewhere in this app — and a
   normal creatinine is the one value most likely to be accepted without being
   checked. So the box starts empty and the step control fills it: the first
   press writes 1.0, every press after moves 0.1.

   The arrows sit beside the field inside a shared border rather than stacked
   inside it: stacked, each arrow would be half a control tall, which is under
   the tap target the rest of the app holds to. */
function crStepper(){
  function set(v){
    if(!S.renal)S.renal={};
    /* one decimal always: "1" reads as a rounded lab value, "1.0" as a set one */
    S.renal.cr = v==null ? "" : (Math.round(v*10)/10).toFixed(1);
    S.renal.egfr=egfrFromCr();
    markDirty(); scheduleReport(); refreshReadout(); renderWorksheet();
  }
  function step(dir){
    var cur=num(S.renal&&S.renal.cr);
    if(cur==null) return set(1.0);          /* the first press starts at normal */
    set(Math.max(0.1, Math.min(25, cur+dir*0.1)));
  }
  var inp=el("input",{type:"text",inputmode:"decimal",value:(S.renal&&S.renal.cr)||"",
    title:"Serum creatinine. The eGFR beside it is derived with CKD-EPI 2021 and needs age and sex.",
    oninput:function(e){ if(!S.renal)S.renal={}; S.renal.cr=e.target.value;
      S.renal.egfr=egfrFromCr();
      markDirty(); scheduleReport(); refreshReadout(); renderWorksheet(); }});
  if(getProv("renal.cr")) inp.className="prov";
  return el("div",{class:"stepper"},[ inp,
    el("button",{type:"button",class:"stp",title:"Down 0.1 (starts at 1.0)",
      onclick:function(){ step(-1); }},["\u2212"]),
    el("button",{type:"button",class:"stp",title:"Up 0.1 (starts at 1.0)",
      onclick:function(){ step(1); }},["+"])
  ]);
}

/* ---- eGFR, derived from creatinine ----
   The box used to ask for "CR / eGFR" and take whichever the reader typed, so
   the stored number could be either. Creatinine is what the chart reports;
   eGFR is arithmetic, and arithmetic belongs to the app.

   CKD-EPI 2021 (Inker NEJM 2021) — the race-free equation, which is what most
   US labs report:
     eGFR = 142 x min(Scr/k,1)^a x max(Scr/k,1)^-1.200 x 0.9938^age x 1.012 [female]
     k = 0.7 (female) 0.9 (male);  a = -0.241 (female) -0.302 (male)
   Age and sex are required; without them the box says so rather than guessing. */
function egfrFromCr(){
  var scr=num(S.renal&&S.renal.cr);
  var age=num(S.pt.age!=null&&S.pt.age!=="" ? S.pt.age : ageFromDob(S.pt.dob, S.rx&&S.rx.studyDate));
  var sex=S.pt.sex;
  if(scr==null||scr<=0||age==null||!sex) return "";
  var female=(sex==="female");
  var k=female?0.7:0.9, al=female?-0.241:-0.302;
  var e=142*Math.pow(Math.min(scr/k,1),al)*Math.pow(Math.max(scr/k,1),-1.200)*
        Math.pow(0.9938,age)*(female?1.012:1);
  return String(Math.round(e));
}
function egfrDerived(){
  var v=S.renal&&S.renal.egfr;
  if(!v) v=egfrFromCr();
  if(!v){
    /* Empty and grey, exactly like the age box before a date of birth. The
       explanation belongs in the tooltip, not printed inside a 4-character box. */
    var why = !(S.renal&&S.renal.cr) ? "Enter a creatinine to derive the eGFR."
            : (!S.pt.sex ? "CKD-EPI 2021 also needs sex." : "CKD-EPI 2021 also needs age or a date of birth.");
    return el("div",{class:"age-derived",title:why},[]);
  }
  var n=num(v);
  return el("div",{class:"age-derived"+(n!=null&&n<30?" alarm":""),
    title:"CKD-EPI 2021, from the creatinine, age and sex."},[String(v)]);
}
/* The dialysis chip was a question the numbers can answer. Below 30 the
   ISCHEMIA-CKD population is in play, so the warning says so — and says the
   part that actually changes management, which a checkbox never did. */
function ckdWarning(){
  var e=num((S.renal&&S.renal.egfr)||egfrFromCr());
  if(e==null||e>=30) return null;
  return el("div",{class:"ckd-warn"},[
    el("strong",null,["eGFR "+Math.round(e)+" \u2014 ISCHEMIA-CKD population."]),
    " If this patient is on dialysis or the eGFR is under 30, a routine invasive strategy showed ",
    "no reduction in death or myocardial infarction and more strokes than medical therapy alone. ",
    "Ischemia on this study does not by itself argue for revascularization here."
  ]);
}

/* The published pre-test table, read live so the box shows the number rather
   than the instruction to go and find it. Returns "" when the inputs it needs
   are missing, which is honest: a blank box is not a probability of zero. */
/* The age a calculation should use, wherever it asks. S.pt.age is only written
   as a side effect of the age FIELD rendering with a date of birth, so any
   caller that runs before or without that render — the Bayes table, the read-out,
   an imported study — saw a blank and silently produced nothing. */
function ageResolved(){
  var typed=num(S.pt&&S.pt.age);
  if(typed!=null) return typed;
  return num(ageFromDob(S.pt&&S.pt.dob, S.rx&&S.rx.studyDate));
}
function ptpFromTable(){
  if(!window.BayesEngine) return "";
  try{
    /* The engine reads S.bayes.symptomEffective and S.pt.age. Both are written
       by render paths rather than derived, so this passes a copy with them
       filled in instead of depending on what happened to have been drawn. */
    var age=ageResolved();
    var S2=Object.assign({},S,{
      pt:Object.assign({},S.pt,{age:age==null?"":String(age)}),
      bayes:Object.assign({},S.bayes||{},{symptomEffective:effectiveSymptom()})
    });
    var A=window.Comprehensive ? window.Comprehensive.assess(S2) : null;
    var B=window.BayesEngine.analyze(S2,A);
    var v=(B && B.ptpFromTable!=null) ? B.ptpFromTable : (B ? B.ptp : null);
    return v==null ? "" : String(Math.round(v));
  }catch(e){ return ""; }
}

/* Two import surfaces, each placed where the information it carries begins:
   the Epic note above the patient fields it fills, the 4DM XML above the
   imaging fields it fills. Both accept a paste; the XML also takes a file. */
/* Both importers in one place, at the top, where filling the worksheet starts.

function studyDateMeta(){
