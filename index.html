/* ================= EXAMPLE (clean single-vessel LAD, intermediate) ================= */

/* ============ RANDOM EXAMPLE LIBRARY ============
   100 synthetic studies for testing. Deterministic: example N always produces
   the same study, so "example 42 is wrong" is a reproducible report rather than
   a story. The button cycles 1 -> 100 -> 1.

   All data is invented. Names are drawn from a fixed pool and are not real
   patients.
   ================================================= */
var EXAMPLE_COUNT=250;
var EXAMPLE_INDEX=0;

function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}

/* Name pools keyed by the recorded race/ethnicity and by sex. Drawing a first
   name and a surname from unrelated pools produced "Omar Novotny — Chinese"
   and "Wei Smith", which is distracting when reviewing generated output. */
var EX_NAMES={
  White:{f:["Rita","Elena","Ingrid","Chloe","Sofia","Hannah","Claire","Marta"],
         m:["John","Peter","Tomas","Viktor","Samuel","Andre","Lukas","Daniel"],
         l:["Vance","Smith","Kowalski","Petrov","Lindqvist","Novotny","Ricci","Novak"]},
  Black:{f:["Amara","Aisha","Grace","Naomi","Zola","Ayana"],
         m:["Kofi","Samuel","Marcus","Chike","Andre","Jelani"],
         l:["Mensah","Okafor","Bello","Achebe","Diallo","Nkomo"]},
  Chinese:{f:["Wei","Hana","Mei","Lin","Yuki","Jing"],
           m:["Wei","Jian","Hao","Feng","Chen","Ming"],
           l:["Li","Chen","Wang","Zhang","Tanaka","Liu"]},
  SouthAsian:{f:["Priya","Anika","Meera","Divya","Sana"],
              m:["Rahul","Arjun","Vikram","Sanjay","Imran"],
              l:["Nair","Patel","Rao","Singh","Chowdhury","Iyer"]},
  MENA:{f:["Fatima","Nadia","Layla","Yasmin","Amira"],
        m:["Ahmed","Omar","Karim","Hassan","Tariq"],
        l:["Haddad","Rashid","Farah","Khalil","Mansour","Aziz"]},
  multiracial:{f:["Maria","Lucia","Sofia","Amara","Nadia"],
               m:["Luis","Marco","Andre","Omar","Daniel"],
               l:["Duarte","Alvarez","Mensah","Ricci","Farah","Vance"]}
};

var EX_DX   =["","","lung adenocarcinoma","breast carcinoma","diffuse large B-cell lymphoma",
              "colorectal carcinoma","prostate carcinoma","multiple myeloma","melanoma","esophageal carcinoma"];
var EX_REF  =["Dr. Alvarez","Dr. Chen","Dr. Okonkwo","Dr. Rossi","Dr. Patel","Dr. Nguyen"];

/* Weighted to resemble a real reading list: normal is commonest, and the
   uncommon-but-important patterns each appear often enough to be met. */
var EX_PATTERNS=[
  "normal","normal","normal","normal","normal",
  "lad-reversible","lad-reversible","rca-fixed","rca-fixed","mixed","mixed",
  "small-ischemia","small-ischemia",
  "lcx-reversible","multivessel","subendocardial",
  "microvascular","balanced-lm","apical-thinning","reverse","severe-cm",
  "post-cabg","silent-infarct","confounded","nondiagnostic"
];

function makeExample(n){
  var rnd=mulberry32(n*2654435761);
  var pick=function(a){ return a[Math.floor(rnd()*a.length)]; };
  var chance=function(p){ return rnd()<p; };
  var st=emptyState();

  /* ---- who ---- */
  st.pt.mrn=String(1000000+Math.floor(rnd()*8999999));
  st.pt.sex=chance(0.5)?"female":"male";
  var birthYear=1935+Math.floor(rnd()*55);
  st.pt.dob=birthYear+"-"+String(1+Math.floor(rnd()*12)).padStart(2,"0")+"-"+String(1+Math.floor(rnd()*28)).padStart(2,"0");
  st.rx.studyDate=todayISO();   /* synthetic studies are same-day too */
  st.rx.accession="EX"+String(n).padStart(3,"0");
  st.pt.mesaRace=pick(["White","Black","Chinese","SouthAsian","MENA","multiracial"]);
  st.pt.hispanic=chance(0.18)?"yes":"no";
  var pool=EX_NAMES[st.pt.mesaRace]||EX_NAMES.White;
  st.pt.firstName=pick(st.pt.sex==="female"?pool.f:pool.m);
  st.pt.lastName=pick(pool.l);
  st.pt.dx=pick(EX_DX); st.pt.referrer=pick(EX_REF);
  st.pt.heightCm=String(150+Math.floor(rnd()*40));
  st.pt.weightKg=String(48+Math.floor(rnd()*70));
  st.pt.unitSys=chance(0.5)?"imperial":"metric";

  /* ---- why ---- */
  var ind=pick(["cp","dyspnea","preop","symptomaticCAD","priorAbn"]);
  if(ind==="cp"){ st.pt.ind.cp=true; st.pt.cpType=chance(0.5)?"typical":"atypical"; }
  else if(ind==="dyspnea") st.pt.ind.dyspnea=true;
  else if(ind==="preop") st.pt.preop=true;
  else if(ind==="symptomaticCAD") st.pt.ind.symptomaticCAD=true;
  else st.pt.ind.abnEKG=true;

  /* ---- history and meds ---- */
  ["htn","hld","dm","tobacco","priormi","pci","cabg","chf"].forEach(function(k){
    if(chance(k==="htn"?0.55:k==="hld"?0.5:k==="dm"?0.3:0.18)) st.hx[k]=true;
  });
  ["atorvastatin","aspirin","lisinopril","metoprolol","amlodipine","clopidogrel"].forEach(function(k){
    if(chance(0.35)) st.meds[k]=true;
  });
  if(st.hx.dm) ["metformin","empagliflozin","semaglutide","insulin_glargine"].forEach(function(k){
    if(chance(0.3)) st.dmMeds[k]=true; });
  st.medsReviewed=true;

  /* ---- acquisition ---- */
  st.stressData.type=chance(0.88)?"pharm":"exercise";
  if(st.stressData.type==="exercise"){ st.stressData.agent=""; st.stressData.agentDose=""; st.stressData.agentTime=""; }
  st.rx.restDose=String(28+Math.floor(rnd()*10));
  st.rx.stressDose=st.rx.restDose;
  st.rx.dlp=String(120+Math.floor(rnd()*180));
  /* Hemodynamics follow the physiology of the stress agent rather than a
     uniform random walk. Under vasodilator stress systemic resistance falls, so
     blood pressure usually DROPS and heart rate usually RISES; a minority show
     a blunted or paradoxical response, and that minority matters clinically.
     Exercise raises both. */
  var restHR=52+Math.floor(rnd()*40);
  var restSBP=105+Math.floor(rnd()*50);
  var restDBP=62+Math.floor(rnd()*26);
  var exercise=(st.stressData.type==="exercise");
  var dSBP, dHR;
  if(exercise){
    dSBP=15+Math.floor(rnd()*45);            /* rises with exercise */
    dHR =35+Math.floor(rnd()*55);
  } else {
    /* Vasodilator stress drops systemic pressure — every synthetic study now
       shows the fall, by 6-30 mmHg. The flat and rising variants were removed
       deliberately: they are real but they are not what these examples are for. */
    dSBP=-(6+Math.floor(rnd()*24));
    var hroll=rnd();
    if(hroll<0.75)      dHR= 12+Math.floor(rnd()*24);    /* the usual rise */
    else if(hroll<0.93) dHR=  3+Math.floor(rnd()*8);     /* blunted */
    else                dHR=-(1+Math.floor(rnd()*6));    /* paradoxical */
  }
  var peakSBP=Math.max(70,restSBP+dSBP);
  var peakHR =Math.max(38,restHR+dHR);
  /* diastolic tracks systolic in direction, with a smaller excursion */
  var peakDBP=Math.max(38,Math.round(restDBP+dSBP*0.45));
  st.stressData.restHR=String(restHR);   st.stressData.peakHR=String(peakHR);
  st.stressData.restSBP=String(restSBP); st.stressData.peakSBP=String(peakSBP);
  st.stressData.restDBP=String(restDBP); st.stressData.peakDBP=String(peakDBP);
  if(chance(0.3)){ st.stressData.symptoms={}; st.stressData.symptoms[pick(["chestPain","dyspnea","headache","flushing","dizziness"])]=true; }
  if(chance(0.08)) st.stressData.recentCaffeine=true;
  st.tech.quality=chance(0.85)?"adequate":pick(["suboptimal","poor"]);

  /* ---- the study itself ---- */
  var pat=EX_PATTERNS[Math.floor(rnd()*EX_PATTERNS.length)];
  var LADs=[1,2,7,8,13,14,17], LCXs=[5,6,11,12,16], RCAs=[3,4,9,10,15];
  var setSeg=function(list,sv,rv){ list.forEach(function(i){ st.stress[i]=sv; st.rest[i]=rv; }); };
  var efR=55+Math.floor(rnd()*12), efS=efR+2+Math.floor(rnd()*10);
  var gs=2.0+rnd()*0.9, lad=gs, lcx=gs, rca=gs;

  if(pat==="lad-reversible"){ setSeg([1,7,13],2+Math.floor(rnd()*3),0); lad=1.2+rnd()*0.5; }
  else if(pat==="rca-fixed"){ var v=3+Math.floor(rnd()*2); setSeg([4,10,15],v,v); rca=1.4+rnd()*0.5;
    if(chance(0.5)) st.hx.priormi=true; }
  else if(pat==="mixed"){ setSeg([1,7],3,0); setSeg([4,10],3,3); lad=1.3+rnd()*0.4; }
  else if(pat==="microvascular"){ gs=1.2+rnd()*0.4; lad=gs; lcx=gs; rca=gs; }
  else if(pat==="balanced-lm"){ setSeg(LADs,2,0); setSeg(LCXs,2,0); setSeg(RCAs,2,0);
    gs=1.0+rnd()*0.3; lad=gs; lcx=gs; rca=gs;
    st.tid={present:true,ratio:(1.15+rnd()*0.25).toFixed(2)}; efS=efR-3-Math.floor(rnd()*6); }
  else if(pat==="small-ischemia"){ st.stress[pick(LADs)]=2; }
  else if(pat==="apical-thinning"){ st.stress[17]=1; st.rest[17]=1; st.artifact.apical=true; }
  else if(pat==="reverse"){ setSeg([3,9,15],1,3); }
  else if(pat==="severe-cm"){ setSeg([1,7,13],3,0); setSeg([4,10],3,3);
    efR=22+Math.floor(rnd()*12); efS=efR-2; st.lvSize=pick(["moderate","severe"]);
    st.motion.inferior="hypokinetic"; st.thickening.inferior=2;
    st.esvRest=String(120+Math.floor(rnd()*80)); st.edvRest=String(190+Math.floor(rnd()*90)); }
  else if(pat==="lcx-reversible"){ setSeg([5,11,16],2+Math.floor(rnd()*2),0); lcx=1.2+rnd()*0.5; }
  else if(pat==="multivessel"){ setSeg([1,7],3,0); setSeg([5,11],3,0); setSeg([4,10],2,0);
    lad=1.2+rnd()*0.3; lcx=1.3+rnd()*0.3; rca=1.5+rnd()*0.3;
    if(chance(0.5)) st.tid={present:true,ratio:(1.14+rnd()*0.2).toFixed(2)}; }
  else if(pat==="subendocardial"){ [1,2,3,4,5,6].forEach(function(i){ st.stress[i]=1; });
    gs=1.5+rnd()*0.3; lad=gs; lcx=gs; rca=gs; }
  else if(pat==="post-cabg"){ st.hx.cabg=true; st.hx.priormi=true;
    setSeg([1,7],2,2); setSeg([5,11],2,0); }
  else if(pat==="silent-infarct"){ var sv=3+Math.floor(rnd()*2); setSeg([4,10,15],sv,sv);
    st.hx.priormi=false; st.hx.pci=false; st.hx.cabg=false; }
  else if(pat==="confounded"){ st.stressData.recentCaffeine=true;
    gs=1.1+rnd()*0.3; lad=gs; lcx=gs; rca=gs;
    if(chance(0.4)) st.meds.theophylline=true; }
  else if(pat==="nondiagnostic"){ st.tech.quality="poor";
    st.tech.motionArtifact=chance(0.6); st.tech.poorCounts=chance(0.6);
    if(chance(0.5)) st.stress[pick(LADs)]=2; }

  st.ef={rest:String(efR),stress:String(efS)};
  if(!st.esvRest){ st.esvRest=String(35+Math.floor(rnd()*45)); st.edvRest=String(95+Math.floor(rnd()*60)); }
  st.massRest=String(110+Math.floor(rnd()*90));
  var rmb=(0.75+rnd()*0.4);
  var f=function(sv){ return {stress:sv.toFixed(2),rest:rmb.toFixed(2)}; };
  st.flow={LAD:f(lad),LCX:f(lcx),RCA:f(rca),Global:f((lad+lcx+rca)/3)};

  /* attenuation pattern follows habitus and sex, as it does in life */
  if(st.pt.sex==="male"&&chance(0.5)) st.artifact.diaphragm=true;
  if(st.pt.sex==="female"&&chance(0.4)) st.artifact.breast=true;

  st.calcium={LM:String(Math.floor(rnd()*rnd()*220)),LAD:String(Math.floor(rnd()*rnd()*900)),
              LCX:String(Math.floor(rnd()*rnd()*200)),RCA:String(Math.floor(rnd()*rnd()*260))};

  /* ---- oncology, on the cases that warrant it ---- */
  if(st.pt.dx){
    st.onco.cancerType=st.pt.dx;
    st.onco.scanContext=pick(["baseline","surveillance","symptomatic"]);
    if(chance(0.4)){ st.onco.anthra=true; st.onco.anthraDrug=pick(["doxorubicin","epirubicin"]);
      st.onco.anthraDose=String(120+Math.floor(rnd()*220)); }
    if(/breast/.test(st.pt.dx)&&chance(0.5)){ st.onco.her2=true; st.onco.her2Agents.trastuzumab=true; }
    if(chance(0.3)){ st.onco.rt=true; st.onco.rtSide=pick(["left","right","mediastinal"]);
      st.onco.rtDose=String(30+Math.floor(rnd()*20)); }
  }

  if(chance(0.25)) st.renal.egfr=String(18+Math.floor(rnd()*70));
  if(chance(0.3)) st.correlation.push({mod:pick(["cta","ct","ctcap","cxr","cath","cmr"]),date:"2026-01-"+String(1+Math.floor(rnd()*28)).padStart(2,"0"),outside:false});
  if(chance(0.3)) st.correlation.push({mod:"echo",date:"2026-02-"+String(1+Math.floor(rnd()*28)).padStart(2,"0"),
    outside:false,echoType:chance(0.8)?"tte":"tee",echoFindings:{diastolic:true},otherName:""});

  st.docs={resident:DEFAULT_RESIDENT,nmAttending:pick(["Fox","Grewal","Schoder","Razmaria"]),
           readingCardiologist:pick(["Weinstein","Johnson","Baum","Chan"])};
  st.opts=st.opts||{}; st.opts.riskCategory=true;
  st.pt.name=(st.pt.lastName+", "+st.pt.firstName);
  return st;
}

function loadRandomExample(){
  /* Actually random, not the next one along — reading the same five studies in
     the same order teaches you the order. makeExample(N) stays deterministic,
     so "example 42 is wrong" is still reproducible. */
  var next;
  do { next = 1 + Math.floor(Math.random()*EXAMPLE_COUNT); }
  while (EXAMPLE_COUNT > 1 && next === EXAMPLE_INDEX);
  EXAMPLE_INDEX = next;
  S = normalizeState(makeExample(EXAMPLE_INDEX));
  dirty=true; savedFlag=false;
  renderAll();
  toast("Random example "+EXAMPLE_INDEX+" of "+EXAMPLE_COUNT+".");
}

function toast(msg,isErr){
  /* Toasts fire from resolved clipboard promises, which can land after the
     document has gone away (tab closed, page navigated). Fail quietly rather
     than throwing out of a promise nobody is watching. */
  if(typeof document==="undefined"||!document.body) return;
  var t=el("div",{style:"position:fixed;bottom:var(--sp-4);left:50%;transform:translateX(-50%);z-index:200;"+
    "background:"+(isErr?"#8f0d18":"#263540")+";color:#fff;padding:var(--sp-2) var(--sp-3);border-radius:var(--r-md);font-size:var(--fs-base);box-shadow:0 4px 16px rgba(0,0,0,.3);"},[msg]);
  document.body.appendChild(t); setTimeout(function(){ t.style.transition="opacity .4s"; t.style.opacity="0"; setTimeout(function(){t.remove();},400); },2200);
}

/* ================= RENDER ================= */
function renderTab(){
  var main=$("#main"); if(!main)return; main.innerHTML="";
  if(TAB==="worksheet"){
    var left=el("div",{id:"worksheet"},[]);
    var splitter=el("div",{id:"splitter",class:"splitter no-print",title:"Drag to resize"},[el("div",{class:"splitter-grip"})]);
    main.className="ps-main"; main.appendChild(left); main.appendChild(splitter); main.appendChild(reportPane());
    /* The split is a two-column concept. Below 900px the stylesheet collapses
       to a single column and hides the splitter, but an INLINE
       grid-template-columns beats every media query — so on iPad the report
       pane was being forced into the 16px splitter track and rendered 16px
       wide, clipping every control inside it. Only apply (and only persist) the
       split while the two-column layout is actually in effect. */
    function splitActive(){
      return typeof window.matchMedia!=="function" || window.matchMedia("(min-width:901px)").matches;
    }
    function applySplit(){
      if(!splitActive()){ main.style.gridTemplateColumns=""; return; }
      if(S._splitPx){ main.style.gridTemplateColumns="minmax(0,1fr) 16px "+S._splitPx+"px"; return; }
      var rect=main.getBoundingClientRect(); var half=Math.round((rect.width-14)/2);
      /* A quarter of the window makes four columns of worksheet beside it,
         which is how the layout is meant to read on a desktop. */
      var quarter=Math.round(window.innerWidth*0.25);
      if(quarter>320){ main.style.gridTemplateColumns="minmax(0,1fr) 16px "+quarter+"px"; S._splitPx=quarter; }
      else if(half>320){ main.style.gridTemplateColumns="minmax(0,1fr) 16px "+half+"px"; S._splitPx=half; }
    }
    applySplit();
    setTimeout(applySplit,0);
    if(!window.__splitResizeBound && typeof window.addEventListener==="function"){
      window.__splitResizeBound=true;
      window.addEventListener("resize",function(){
        var m=document.querySelector(".ps-main"); if(!m) return;
        if(!splitActive()) m.style.gridTemplateColumns="";
        else if(S._splitPx) m.style.gridTemplateColumns="minmax(0,1fr) 16px "+S._splitPx+"px";
      });
    }
    wireSplitter(main, splitter);
    renderWorksheet(); renderReport();
  } else if(TAB==="research"){
    main.className=""; main.style.padding="var(--sp-2)"; main.style.maxWidth="1180px"; main.style.margin="0 auto";
    var rp=el("div",{id:"research"},[]); main.appendChild(rp); renderResearch();
  } else if(TAB==="comprehensive"){
    main.className=""; main.style.padding="var(--sp-2)"; main.style.maxWidth="1180px"; main.style.margin="0 auto";
    var ca=el("div",{id:"comprehensive"},[]); main.appendChild(ca); renderComprehensive();
  } else {
    main.className=""; main.style.padding="var(--sp-2)"; main.style.maxWidth="1100px"; main.style.margin="0 auto";
    var ext=el("div",{id:"extended"},[]); main.appendChild(ext); renderExtended();
  }
}
function wireSplitter(main, splitter){
  var dragging=false;
  splitter.addEventListener("mousedown",function(e){ dragging=true; document.body.style.userSelect="none"; document.body.style.cursor="col-resize"; e.preventDefault(); });
  document.addEventListener("mousemove",function(e){
    if(!dragging)return;
    var rect=main.getBoundingClientRect();
    var rightPx=rect.right - e.clientX;
    rightPx=Math.max(320, Math.min(rect.width-360, rightPx)); // clamp: report 320..(width-360)
    if(typeof window.matchMedia==="function" && !window.matchMedia("(min-width:901px)").matches) return;
    main.style.gridTemplateColumns="minmax(0,1fr) 16px "+Math.round(rightPx)+"px";
    S._splitPx=Math.round(rightPx);
  });
  document.addEventListener("mouseup",function(){ if(dragging){ dragging=false; document.body.style.userSelect=""; document.body.style.cursor=""; markDirty(); } });
}

/* ============ WORKLIST: several patients in one session ============
   Four to six cardiac studies a day. The live study is S; every other case
   lives in WL_STORE as an independent state object.

   The ordering rule that keeps cases from mixing: on any switch the OUTGOING
   case is snapshotted first, then the incoming one is loaded, then the whole
   view is re-rendered from scratch. Never patch the existing view \u2014 a stale
   node showing the previous patient's name is exactly the failure to avoid.
   =================================================================== */
var WL_KEY="cardiacPET.worklist";
var WL_STORE=null;
var WL_SHOW_ALL=false;
var WL_AUTOSAVE=null;

function wlEngine(){ return window.WorklistEngine; }

function wlLoad(){
  var E=wlEngine(); if(!E) return;
  var raw=null;
  try{ raw=localStorage.getItem(WL_KEY); }catch(e){}
  var parsed=null;
  if(raw){ try{ parsed=JSON.parse(raw); }catch(e){ parsed=null; } }
  WL_STORE=E.normalizeStore(parsed);
  if(!WL_STORE.cases.length){
    /* first run, or a store from before this feature: adopt whatever the
       single-case key holds so nothing in progress is lost */
    var legacy=null;
    try{ var lr=localStorage.getItem(LS_KEY); if(lr) legacy=JSON.parse(lr); }catch(e){}
    var seed = legacy ? normalizeState(Object.assign(emptyState(),legacy)) : emptyState();
    var r=E.addCase(WL_STORE, seed);
    WL_STORE=r.store;
    S=normalizeState(seed);
  } else {
    var active=E.getCase(WL_STORE, WL_STORE.activeId);
    if(active) S=normalizeState(JSON.parse(JSON.stringify(active.state)));
  }
  wlPersist();
}
function wlPersist(){
  try{ localStorage.setItem(WL_KEY, JSON.stringify(WL_STORE)); }catch(e){}
}
/* Autosave the live study into its own slot. Debounced so typing does not
   serialise the whole store on every keystroke. */
function wlAutosave(){
  var E=wlEngine(); if(!E||!WL_STORE) return;
  if(WL_AUTOSAVE) clearTimeout(WL_AUTOSAVE);
  WL_AUTOSAVE=setTimeout(function(){
    WL_STORE=E.snapshot(WL_STORE, WL_STORE.activeId, S);
    wlPersist();
  },400);
}
/* Commit immediately, without waiting for the debounce. Used before any
   switch, add or remove \u2014 the moments where a lost edit would be silent. */
function wlCommit(){
  var E=wlEngine(); if(!E||!WL_STORE) return;
  if(WL_AUTOSAVE){ clearTimeout(WL_AUTOSAVE); WL_AUTOSAVE=null; }
  WL_STORE=E.snapshot(WL_STORE, WL_STORE.activeId, S);
  wlPersist();
}

function wlSwitchTo(id){
  var E=wlEngine(); if(!E) return;
  if(id===WL_STORE.activeId) return;
  var r=E.switchTo(WL_STORE, WL_STORE.activeId, S, id);
  if(!r.ok){ toast("That case is no longer in the list.",true); return; }
  WL_STORE=r.store;
  S=normalizeState(r.state);
  wlPersist();
  dirty=false; savedFlag=true;
  /* full re-render: never patch a view that was showing another patient */
  IB_STATE.pct=null; IB_STATE.scar=null;
  COMM_MSG_EDITED=null;
  renderAll();
  toast("Now reading "+E.labelFor(S)+".");
}
function wlAddCase(){
  var E=wlEngine(); if(!E) return;
  wlCommit();
  var r=E.addCase(WL_STORE, emptyState());
  if(r.rejected==="limit"){ toast("The worklist holds at most "+E.MAX_CASES+" cases.",true); return; }
  WL_STORE=r.store;
  S=normalizeState(emptyState());
  wlPersist();
  dirty=false; savedFlag=true;
  IB_STATE.pct=null; IB_STATE.scar=null; COMM_MSG_EDITED=null;
  renderAll();
  toast("New study added \u2014 case "+WL_STORE.cases.length+".");
}
function wlRemove(id){
  var E=wlEngine(); if(!E) return;
  var c=E.getCase(WL_STORE,id); if(!c) return;
  var label=E.labelFor(c.state);
  function doRemove(){
    var r=E.removeCase(WL_STORE,id);
    WL_STORE=r.store;
    if(r.state) S=normalizeState(r.state);
    else { var a=E.addCase(WL_STORE, emptyState()); WL_STORE=a.store; S=normalizeState(emptyState()); }
    wlPersist(); dirty=false; savedFlag=true;
    IB_STATE.pct=null; IB_STATE.scar=null; COMM_MSG_EDITED=null;
    renderAll(); toast("Removed "+label+".");
  }
  if(E.isEmptyCase(c.state)){ doRemove(); return; }
  /* a case with data is never removed on a single click */
  var m=el("div",{class:"modal-bg"},[ el("div",{class:"modal",style:"max-width:420px;"},[
    el("header",null,[el("span",{class:"t"},["Remove "+label+"?"])]),
    el("div",{class:"body"},["This study has data entered. Removing it discards that data from this browser. It cannot be undone."]),
    /* a <footer>, which the stylesheet actually styles — the old
       class="modal-foot" matched nothing, so these two buttons had no padding,
       no rule above them and no alignment */
    el("footer",null,[
      el("button",{class:"btn",onclick:function(){ closeModal(); }},["Keep it"]),
      el("button",{class:"btn danger",onclick:function(){ closeModal(); doRemove(); }},["Remove"])
    ])
  ])]);
  document.body.appendChild(m);
}

/* The strip. One row of cases, the active one marked, each showing its own
   identity and sign-out readiness. */
function worklistBar(){
  var E=wlEngine(); if(!E||!WL_STORE) return null;
  var readyFn=function(st){
    try{
      var saved=S; S=st;
      var r=window.AutomationEngine.readiness(st,null);
      S=saved; return r.ready;
    }catch(e){ return null; }
  };
  /* The ACTIVE chip must describe what is on screen, not the last snapshot —
     autosave is debounced, so a name typed a moment ago is not in the store
     yet and the chip would read "Unnamed study" while the worksheet shows it. */
  var live=E.snapshot(WL_STORE, WL_STORE.activeId, S);
  var all=E.summarize(live, readyFn);
  var today=(S.rx&&S.rx.studyDate)||"";
  var shown = WL_SHOW_ALL ? all : all.filter(function(c){ return !today||c.day===today||c.active; });
  if(!shown.length) shown=all;

  var strip=el("div",{class:"wl-strip",role:"tablist","aria-label":"Patient worklist"},[]);
  shown.forEach(function(c){
    var chip=el("button",{type:"button",class:"wl-case"+(c.active?" on":""),
      role:"tab","aria-selected":c.active?"true":"false",
      title:(c.sub||"no identifiers yet")+(c.ready===true?" \u00b7 ready to sign":(c.ready===false?" \u00b7 incomplete":"")),
      onclick:function(){ wlSwitchTo(c.id); }},[
      el("span",{class:"wl-n"},[String(c.index)]),
      el("span",{class:"wl-lab"},[c.label]),
      el("span",{class:"wl-dot "+(c.ready===true?"ok":(c.empty?"empty":"pending"))},[])
    ]);
    var wrap=el("span",{class:"wl-slot"},[chip,
      el("button",{type:"button",class:"wl-x",title:"Remove this study from the worklist.",
        "aria-label":"Remove "+c.label,
        onclick:function(ev){ ev.stopPropagation(); wlRemove(c.id); }},["\u00d7"])]);
    strip.appendChild(wrap);
  });
  strip.appendChild(el("button",{type:"button",class:"wl-add",
    title:"Start another study. The current one is saved first.",
    onclick:wlAddCase},["+ Add patient"]));

  var hiddenCount=all.length-shown.length;
  if(hiddenCount>0 || WL_SHOW_ALL){
    strip.appendChild(el("button",{type:"button",class:"wl-more",
      onclick:function(){ WL_SHOW_ALL=!WL_SHOW_ALL; renderAll(); }},
      [WL_SHOW_ALL?"Today only":("Show all ("+all.length+")")]));
  }
  return el("div",{class:"wl-bar no-print"},[
    el("span",{class:"wl-title"},["Worklist"]),
    strip
  ]);
}

/* Provenance, stated once at the foot of every tab and carried into print.
   A tool used on real studies should say who wrote it and what it is for. */
function colophon(){
  return el("div",{class:"colophon"},[
    el("strong",null,[APP_NAME]), " \u2014 "+APP_SUB+".",
    " \u2014 built by John Solomon, Nuclear Medicine resident. ",
    "This tool does not interpret images and does not diagnose: it assists a qualified reader in ",
    "composing a report, every generated sentence is editable, and the signed report is the record. ",
    "Everything stays in this browser \u2014 nothing is transmitted."
  ]);
}

function renderAll(){
  try{ normalizeState(S); }catch(e){}
  var root=$("#root"); root.innerHTML="";
  root.appendChild(header());
  /* The worklist comes first: you pick the patient, THEN what you are doing to
     that patient. Below the tabs it read as a property of the current tab. */
  var wb=worklistBar(); if(wb) root.appendChild(wb);
  root.appendChild(tabs());
  root.appendChild(el("div",{id:"main"}));
  root.appendChild(colophon());
  renderTab(); updateSaveState(); updateReadiness(); applyTooltipsAll();
}

/* The worklist owns persistence now. wlLoad() adopts an older single-case
   save on first run so nothing in progress is lost across the upgrade. */
wlLoad();
if(!S.rx.studyDate) S.rx.studyDate=todayISO();
if(!S.comm.date) S.comm.date=todayISO();
if(!S.comm.time) S.comm.time=nowET();
renderAll();
window.__app={getState:function(){return S;},setTab:function(t){TAB=t;renderAll();},
  refreshMaps:function(){return refreshMaps();},
  getMode:function(){return MAPMODE;},
  setMode:function(m){MAPMODE=m;refreshMaps();},
  getBrush:function(){return BRUSH;},
  snapshotRead:function(by){return snapshotRead(by);},
  readDiff:function(a,b){return readDiff(a,b);},
  toPlainText:function(t){return toPlainText(t);},
  commForReport:function(){return commForReport();},
  reportText:function(){return reportText();},
  reportSection:function(n){return reportSection(n);},
  ssBand:ssBand, sdsBand:sdsBand, cacBand:cacBand,
  revasc:function(){ return window.RevascEngine.assess(S, window.Comprehensive.assess(S)); },
  refreshReadout:function(){return refreshReadout();},
  ageFromDob:function(d,o){return ageFromDob(d,o);},
  effectiveAge:function(){return effectiveAge();},
  effectiveSymptom:function(){return effectiveSymptom();},
  normalizeState:function(st){return normalizeState(st||S);},
  parseXml:function(t){ return window.Parse4DM ? window.Parse4DM.parse(t) : parseXml(t); },
  processXml:function(t){ return processXml(t); },
  applyField:function(p,v){ return applyField(p,v); },
  parseEpic:function(t){ return parseEpicNote(t); },
  makeExample:function(n){ return makeExample(n); },
  namePools:function(){ return EX_NAMES; },
  wlStore:function(){ return WL_STORE; },
  wlAdd:function(){ return wlAddCase(); },
  wlSwitch:function(id){ return wlSwitchTo(id); },
  wlRemove:function(id){ return wlRemove(id); },
  wlCommit:function(){ return wlCommit(); },
  wlReload:function(){ return wlLoad(); },
  /* the canonical worked demonstration case; tests depend on its exact values */
  loadExample:function(){ return loadExample(); },
  loadExampleN:function(n){ S=normalizeState(makeExample(n)); renderAll(); return S; },
  exampleCount:function(){ return EXAMPLE_COUNT; },
  loadJsonObject:function(obj){ S=normalizeState(Object.assign(emptyState(),obj)); dirty=true; savedFlag=false; renderAll(); return S; },
  exportObject:function(){ return JSON.parse(JSON.stringify(S)); },
  toPlain:function(t){ return toPlainText(t); },
  WALLS:WALLS,
  generateReadout:function(){return generateReadout();},
  setBrush:function(b){BRUSH=b;refreshMaps();},
  buildXl:function(){return buildXl();},
  polarMap:function(w){return polarMap(w);},
  parseEpicNote:function(t){var a=parseEpicNote(t);renderWorksheet();scheduleReport();return a;},
  researchRecord:function(){return window.Comprehensive.researchRecord(S);},
  researchRecordJson:researchRecordJson,
  assess:function(){return window.Comprehensive.assess(S);}};

/* ---- tips ----
   A tip must never outlive the gesture that produced it.

   Pointer devices get the fast hover tip (the native one waits ~500 ms).
   Touch devices have no hover: a tap fires a synthetic mouseover and never a
   mouseout, which is why the tip used to stick to the screen until something
   else was tapped. There the tip is a deliberate gesture instead —
     · tap an annotation (a badge, a glossary key, a table head): it explains
       nothing else, so a tap can mean "explain";
     · long-press a control: its tap belongs to the control, so the tip waits
       450 ms and the click that follows is swallowed.
   Both close on the next tap, a scroll, Escape, or after 6 s. */
(function(){
  var tip=null, showTimer=null, autoHide=null, anchor=null, pressTimer=null, swallow=false;
  var canHover = typeof window.matchMedia==="function" &&
                 window.matchMedia("(hover:hover) and (pointer:fine)").matches;
  function ensure(){ if(!tip){ tip=document.createElement("div"); tip.className="fast-tip"; document.body.appendChild(tip); } return tip; }
  function tipTextOf(t){ return t.getAttribute("data-tip")||t.getAttribute("title")||""; }
  function place(el,x,y){
    var w=el.offsetWidth,h=el.offsetHeight;
    var left=Math.max(8,Math.min(x,window.innerWidth-w-8));
    var top=y+h+8>window.innerHeight ? y-h-10 : y;
    el.style.left=left+"px"; el.style.top=Math.max(8,top)+"px";
  }
  function hide(){
    if(showTimer){clearTimeout(showTimer);showTimer=null;}
    if(autoHide){clearTimeout(autoHide);autoHide=null;}
    if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}
    if(tip)tip.style.display="none";
    if(anchor){ anchor.classList.remove("tip-open"); anchor=null; }
  }
  function show(t,x,y,ttl){
    var txt=tipTextOf(t); if(!txt) return;
    var el=ensure(); el.textContent=txt; el.style.display="block";
    place(el,x,y);
    anchor=t; t.classList.add("tip-open");
    if(autoHide)clearTimeout(autoHide);
    if(ttl) autoHide=setTimeout(hide,ttl);
  }
  /* dismissal that cannot fail — every way a gesture can end */
  ["scroll","wheel","touchmove","resize","orientationchange","pagehide"].forEach(function(ev){
    window.addEventListener(ev,hide,true);
  });
  document.addEventListener("visibilitychange",hide);
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") hide(); });

  if(canHover){
    document.addEventListener("mouseover",function(e){
      var t=e.target.closest&&e.target.closest("[title]"); if(!t)return;
      var txt=t.getAttribute("title"); if(!txt)return;
      /* stash and strip the native title so the slow browser tooltip stays quiet */
      t.setAttribute("data-tip",txt); t.removeAttribute("title");
    });
    document.addEventListener("mouseout",function(e){
      var t=e.target.closest&&e.target.closest("[data-tip]");
      if(t && t.getAttribute("data-tip")) t.setAttribute("title",t.getAttribute("data-tip"));
      hide();
    });
    document.addEventListener("mousemove",function(e){
      var t=e.target.closest&&e.target.closest("[data-tip]");
      if(!t){ hide(); return; }
      if(!tipTextOf(t)) return;
      if(showTimer)clearTimeout(showTimer);
      var x=e.clientX+12, y=e.clientY+16;
      showTimer=setTimeout(function(){ show(t,x,y,0); },140);
    });
  }

  /* ---- touch ---- */
  function annotated(el){ return el&&el.closest?el.closest("[title],[data-tip]"):null; }
  function isControl(t){
    return !!t.closest("button,summary,a,input,select,textarea,.chip,.segbtn,.wl-case,.card-head-toggle,.pmseg");
  }
  function atElement(t,ttl){
    var r=t.getBoundingClientRect();
    show(t,r.left,r.bottom+8,ttl||6000);
  }
  document.addEventListener("touchstart",function(e){
    var t=annotated(e.target);
    /* the next tap closes an open tip — except on its own anchor, where the
       click handler below does the closing, so the two do not cancel out */
    if(anchor && t!==anchor){ hide(); }
    if(!t||!tipTextOf(t))return;
    if(!isControl(t)) return;                   /* a plain annotation is handled on click */
    if(pressTimer)clearTimeout(pressTimer);
    pressTimer=setTimeout(function(){ pressTimer=null; atElement(t);
      /* the click that follows the press belongs to the tip, not the control —
         but if no click arrives (the finger lifted elsewhere) the flag must not
         survive to eat the next one */
      swallow=true; setTimeout(function(){ swallow=false; },700);
    },450);
  },{passive:true});
  ["touchend","touchcancel"].forEach(function(ev){
    document.addEventListener(ev,function(){ if(pressTimer){clearTimeout(pressTimer);pressTimer=null;} },{passive:true});
  });
  document.addEventListener("click",function(e){
    if(swallow){ swallow=false; e.preventDefault(); e.stopPropagation(); return; }
    if(canHover) return;
    var t=annotated(e.target);
    if(!t||isControl(t)||!tipTextOf(t)){ hide(); return; }
    if(anchor===t){ hide(); return; }           /* tap again to close */
    atElement(t);
  },true);
})();
})();

</script>
