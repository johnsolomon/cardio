    coef[i]=(b[i]-s2)/A[i][i];
  }
  fit=[]; for(r=0;r<n;r++){ var q2=0; for(i=0;i<m;i++) q2+=coef[i]*cols[i][r]; fit.push(q2); rms+=Math.pow(v[r]-q2,2); }
  return {coef:coef, fit:fit, rms:Math.sqrt(rms/n), K:K};
}

function curveEval(coef,K,t){
  var s=coef[0],k;
  for(k=1;k<=K;k++) s+=coef[2*k-1]*Math.cos(2*Math.PI*k*t)+coef[2*k]*Math.sin(2*Math.PI*k*t);
  return s;
}
function curveDeriv(coef,K,t){
  var s=0,k;
  for(k=1;k<=K;k++) s+= -coef[2*k-1]*2*Math.PI*k*Math.sin(2*Math.PI*k*t)+coef[2*k]*2*Math.PI*k*Math.cos(2*Math.PI*k*t);
  return s;
}

function chenEes(sbp,dbp,efFrac,sv,tNd){
  var a=[0.35695,-7.2266,74.249,-307.39,684.54,-856.92,571.95,-159.1], eAvg=0,i;
  for(i=0;i<8;i++) eAvg+=a[i]*Math.pow(tNd,i);
  var eNd=0.0275-0.165*efFrac+0.3656*(dbp/(0.9*sbp))+0.515*eAvg;
  return {ees:(dbp-eNd*sbp*0.9)/(sv*eNd), eNd:eNd};
}

function linreg(x,y){
  var n=x.length,mx=0,my=0,i,sxx=0,sxy=0,res=0;
  for(i=0;i<n;i++){mx+=x[i];my+=y[i];} mx/=n; my/=n;
  for(i=0;i<n;i++){sxx+=Math.pow(x[i]-mx,2); sxy+=(x[i]-mx)*(y[i]-my);}
  var slope=sxx?sxy/sxx:0, inter=my-slope*mx;
  for(i=0;i<n;i++) res+=Math.pow(y[i]-(slope*x[i]+inter),2);
  var se = (n>2&&sxx)? Math.sqrt(res/(n-2))/Math.sqrt(sxx) : NaN;
  return {slope:slope, intercept:inter, se:se};
}

function median(v){ var s=v.slice().sort(function(a,b){return a-b;}), n=s.length;
  return n%2 ? s[(n-1)/2] : (s[n/2-1]+s[n/2])/2; }

function r1(x){ return x==null?null:Math.round(x*10)/10; }
function r2(x){ return x==null?null:Math.round(x*100)/100; }

/* ------------------------------------------------------------------ *
 *  XML PARSING (schema-tolerant)                                      *
 * ------------------------------------------------------------------ */
function num(el,attr){
  if(!el) return null;
  var raw=el.getAttribute(attr);
  if(raw==null||raw==='') return null;
  var v=parseFloat(raw);
  if(isNaN(v)) return null;
  for(var i=0;i<SENTINEL.length;i++) if(v===SENTINEL[i]) return null;
  return v;
}

function normalizeTracer(raw){
  if(!raw) return 'UNKNOWN';
  var s=String(raw).toUpperCase().replace(/[^A-Z0-9]/g,'');
  var map={RB82:['RB82','RUBIDIUM','82RB'],NH3:['NH3','AMMONIA','N13'],H2O:['H2O','WATER','O15'],
    FLURPIRIDAZ:['FLURPIRIDAZ'],SESTAMIBI:['SESTAMIBI','MIBI','CARDIOLITE'],
    TETROFOSMIN:['TETROFOSMIN','MYOVIEW'],THALLIUM:['THALLIUM','TL201','201TL']};
  for(var k in map) for(var i=0;i<map[k].length;i++) if(s.indexOf(map[k][i])>=0) return k;
  return 'UNKNOWN';
}

function parseXML(text){
  var doc;
  if(typeof DOMParser!=='undefined'){
    doc=new DOMParser().parseFromString(text,'application/xml');
    if(doc.getElementsByTagName('parsererror').length)
      throw new Error('XML could not be parsed. Check that the whole 4DM export was supplied.');
  } else {
    throw new Error('DOMParser unavailable');
  }
  var root=doc.documentElement;
  var warnings=[];

  function all(tag,within){ return Array.prototype.slice.call((within||root).getElementsByTagName(tag)); }
  function first(tag,within){ var a=all(tag,within); return a.length?a[0]:null; }
  function block(name){ return first(name); }

  var d=first('DEMOGRAPHIC_DATA'), p=first('PROCEDURE_DATA');
  var wUnit=(d&&d.getAttribute('wgtUnit'))||'lbs', hUnit=(d&&d.getAttribute('hgtUnit'))||'in';
  var wRaw=num(d,'weight'), hRaw=num(d,'height');
  var weightKg = wRaw==null?null:(/lb/i.test(wUnit)? wRaw*0.45359237 : wRaw);
  var heightCm = hRaw==null?null:(/^in/i.test(hUnit)? hRaw*2.54 : hRaw);
  var bsa=num(d,'bodySurf');
  if(bsa==null&&weightKg&&heightCm){ bsa=Math.sqrt(heightCm*weightKg/3600); warnings.push('BSA absent from XML; Mosteller formula substituted.'); }

  function scores(blockName,tag){
    var b=block(blockName); if(!b) return null;
    var t=first(tag,b); if(!t) return null;
    var out={}, regs=all('REGION',t);
    regs.forEach(function(r){ var v=r.getAttribute('value'); if(v!=null) out[r.getAttribute('segment')]=parseInt(v,10); });
    return Object.keys(out).length?out:null;
  }
  function suv(blockName){
    var b=block(blockName); if(!b) return null;
    var t=first('REGIONAL_SUV_DATA',b); if(!t) return null;
    var out={};
    all('REGION',t).forEach(function(r){
      out[r.getAttribute('segment')]={mean:num(r,'mean'),stdev:num(r,'stdev'),min:num(r,'min'),max:num(r,'max')};
    });
    return Object.keys(out).length?out:null;
  }
  function vascular(blockName){
    var b=block(blockName); if(!b) return null;
    var t=first('LV_PERFUSION_DATA',b); if(!t) return null;
    var out={}; all('REGION',t).forEach(function(r){ out[r.getAttribute('segment')]=num(r,'value'); });
    return out;
  }
  function fn(blockName){
    var b=block(blockName); if(!b) return {};
    var e=first('LV_FUNCTION_DATA',b); if(!e) return {};
    var keys=['ef','edv','esv','edvi','esvi','dilation','myomass','cardiacOutput','cardiacIndex',
      'peakFillingRate','peakEmptyingRate','oneThirdMeanFillingRate','timePeakFilling','timePeakEmptying'];
    var o={}; keys.forEach(function(k){ o[k]=num(e,k); }); return o;
  }
  function curve(blockName){
    var b=block(blockName); if(!b) return [];
    var c=first('VOLUME_CURVE',b); if(!c) return [];
    return all('BIN',c).map(function(x){ return parseFloat(x.getAttribute('volume')); });
  }
  function injection(blockName){
    var b=block(blockName); if(!b) return null;
    var e=first('INJECTION_DATA',b); if(!e) return null;
    return {dose:num(e,'injectionDose'), time:e.getAttribute('injectionTime'),
      effectiveDose:num(e,'radiationDose'), pharma:e.getAttribute('pharma'), residual:num(e,'residualDose')};
  }
  function acqTime(blockName){
    var b=block(blockName); if(!b) return null;
    var perf=first('PERFUSION',b); if(!perf) return null;
    var di=first('DATASET_INFO',perf); return di?di.getAttribute('dateTime'):null;
  }

  var proto=first('IMAGING_PROTOCOL');
  var inj={stress:injection('NM_STRESS_FINDINGS'), rest:injection('NM_REST_FINDINGS')};
  var pharma=(inj.stress&&inj.stress.pharma)||(inj.rest&&inj.rest.pharma)||'';
  var tracer=normalizeTracer(pharma|| (proto?proto.textContent:''));
  var tp=TRACERS[tracer]||null;
  var modality = tp?tp.modality:(/PET/i.test(proto?proto.textContent:'')?'PET':'SPECT');

  /* vendor from series UID roots */
  var vendor='unknown';
  all('DATASET_INFO').forEach(function(e){
    var u=e.getAttribute('series_instance_uid')||'';
    if(u.indexOf('1.2.840.113619')===0) vendor='GE';
    else if(u.indexOf('1.3.12.2.1107')===0) vendor='Siemens';
    else if(u.indexOf('1.2.840.113704')===0) vendor='Philips';
  });

  /* segment model */
  var names={}; all('REGION').forEach(function(r){ names[r.getAttribute('segment')]=1; });
  var segments=SEG17.filter(function(s){ return names[s]; });
  if(segments.length && segments.length!==17)
    warnings.push('Non-17-segment model detected ('+segments.length+' named segments); AHA mass weights and territory maps assume 17 segments.');

  return {
    warnings:warnings,
    accession:(p&&p.getAttribute('accession')||'').trim(),
    dataState:(p&&p.getAttribute('data_state'))||'',
    interpretationDate:p&&p.getAttribute('interpretationDate'),
    studyUID:p&&p.getAttribute('study_instance_uid'),
    protocol:proto?proto.textContent.trim():'',
    vendor:vendor, tracer:tracer, tracerProps:tp, modality:modality,
    thresholds:THRESHOLDS[modality],
    age:num(d,'age'), sex:(d&&d.getAttribute('sex'))||'',
    weightKg:weightKg, heightCm:heightCm, bsa:bsa, bmi:num(d,'bodyMassIndex'),
    segments:segments.length?segments:SEG17,
    injections:inj,
    acq:{stress:acqTime('NM_STRESS_FINDINGS'), rest:acqTime('NM_REST_FINDINGS')},
    perfStress:scores('NM_STRESS_FINDINGS','REGIONAL_PERFUSION_SCORES'),
    perfRest:scores('NM_REST_FINDINGS','REGIONAL_PERFUSION_SCORES'),
    reversibility:scores('NM_ISCHEMIA_FINDINGS','REGIONAL_REVERSIBILITY_SCORES'),
    motionStress:scores('NM_STRESS_FINDINGS','REGIONAL_MOTION_SCORES'),
    motionRest:scores('NM_REST_FINDINGS','REGIONAL_MOTION_SCORES'),
    thickStress:scores('NM_STRESS_FINDINGS','REGIONAL_THICKENING_SCORES'),
    thickRest:scores('NM_REST_FINDINGS','REGIONAL_THICKENING_SCORES'),
    suvStress:suv('NM_STRESS_FINDINGS'), suvRest:suv('NM_REST_FINDINGS'),
    vascStress:vascular('NM_STRESS_FINDINGS'), vascRest:vascular('NM_REST_FINDINGS'),
    fnStress:fn('NM_STRESS_FINDINGS'), fnRest:fn('NM_REST_FINDINGS'),
    curveStress:curve('NM_STRESS_FINDINGS'), curveRest:curve('NM_REST_FINDINGS'),
    hasFlowBlock:!!first('FLOW'), hasPhase:!!first('PHASE_ANALYSIS'), hasRV:!!first('RV_FUNCTION_DATA')
  };
}


/* ------------------------------------------------------------
   stateToAnalyzable(appState)
   analyze() was written against the parsed-XML structure. The Extended tab
   was calling analyze(buildXl()) \u2014 app state \u2014 so `s.fnStress` was undefined
   and the whole QC panel threw before rendering. This adapter projects app
   state into the shape analyze() expects, so the tab works whether the study
   was imported from 4DM or entered by hand.
   ------------------------------------------------------------ */
function stateToAnalyzable(st){
  st = st || {};
  function n(x){ if(x===''||x==null)return null; var v=Number(x); return isNaN(v)?null:v; }
  /* app state keys segments 1..17; the engine keys them by 4DM segment name */
  function segMap(src){
    if(!src) return null;
    var out={}, any=false;
    for(var i=1;i<=17;i++){
      var v=n(src[i]);
      if(v!=null){ out[SEG17[i-1]]=v; any=true; }
    }
    return any?out:null;
  }
  var stress=segMap(st.stress), rest=segMap(st.rest), rev=null;
  if(stress&&rest){
    rev={};
    for(var i=1;i<=17;i++){
      var a=n(st.stress[i])||0, b=n(st.rest[i])||0;
      rev[SEG17[i-1]]=Math.max(0,a-b);
    }
  }
  var agentKey=(st.rx&&st.rx.agent)||'rb82';
  var TRACER_KEY={rb82:'RB82', nh3:'NH3', h2o:'H2O', flur:'FLURPIRIDAZ', fdg:'RB82',
                  mibi:'SESTAMIBI', tetro:'TETROFOSMIN', tl201:'THALLIUM'};
  var tracer=TRACER_KEY[agentKey]||'RB82';
  var tp=TRACERS[tracer]||TRACERS.RB82;
  var modality=tp.modality||'PET';

  var wt=n(st.pt&&st.pt.weightKg), ht=n(st.pt&&st.pt.heightCm);
  var bsa=(wt!=null&&ht!=null&&wt>0&&ht>0)?Math.sqrt(wt*ht/3600):null;
  var bmi=(wt!=null&&ht!=null&&ht>0)?wt/Math.pow(ht/100,2):null;

  var tidRatio=n(st.tid&&st.tid.ratio);

  /* wall-level motion/thickening in app state -> per-segment, via territory walls */
  var WALL_SEG={anterior:[1,7,13],septal:[2,3,8,9,14],inferior:[4,10,15],lateral:[5,6,11,12,16],apical:[17]};
  var MOTION_NUM={normal:0,hypokinetic:1,akinetic:2,dyskinetic:3};
  function wallMap(src,conv){
    if(!src) return null;
    var out={}, any=false;
    Object.keys(WALL_SEG).forEach(function(w){
      var raw=src[w]; if(raw==null||raw==='') return;
      var v=conv?conv(raw):n(raw); if(v==null) return;
      WALL_SEG[w].forEach(function(i){ out[SEG17[i-1]]=v; any=true; });
    });
    return any?out:null;
  }

  return {
    /* fields analyze()/manifest() dereference unguarded must all be present */
    warnings:[],
    accession:(st.rx&&st.rx.accession)||'',
    dataState:'',            /* blank: not a 4DM export, so the NOT_FINAL check is inert */
    interpretationDate:null,
    studyUID:null,
    protocol:'',
    vendor:'app', tracer:tracer, tracerProps:tp, modality:modality,
    thresholds:THRESHOLDS[modality]||THRESHOLDS.PET,
    age:n(st.pt&&st.pt.age), sex:(st.pt&&st.pt.sex)||'',
    weightKg:wt, heightCm:ht, bsa:bsa, bmi:bmi,
    segments:SEG17,
    injections:{stress:null, rest:null},
    acq:{stress:null, rest:null},
    perfStress:stress, perfRest:rest, reversibility:rev,
    motionStress:wallMap(st.motion,function(v){ return MOTION_NUM[v]!=null?MOTION_NUM[v]:null; }),
    motionRest:null,
    thickStress:wallMap(st.thickening), thickRest:null,
    suvStress:null, suvRest:null,
    vascStress:null, vascRest:null,
    fnStress:{ef:n(st.ef&&st.ef.stress), edv:null, esv:null, edvi:null, esvi:null,
              dilation:tidRatio, myomass:null, cardiacOutput:null, cardiacIndex:null,
              peakFillingRate:null, peakEmptyingRate:null, oneThirdMeanFillingRate:null,
              timePeakFilling:null, timePeakEmptying:null},
    fnRest:{ef:n(st.ef&&st.ef.rest), edv:n(st.edvRest), esv:n(st.esvRest), edvi:null, esvi:null,
            dilation:null, myomass:n(st.massRest), cardiacOutput:null, cardiacIndex:null,
            peakFillingRate:null, peakEmptyingRate:null, oneThirdMeanFillingRate:null,
            timePeakFilling:null, timePeakEmptying:null},
    curveStress:[], curveRest:[],
    hasFlowBlock:!!(st.flow&&st.flow.Global&&(st.flow.Global.stress!==''&&st.flow.Global.stress!=null)),
    hasPhase:false, hasRV:false
  };
}

function manifest(s){
  var m={
    stressPerfusion:!!s.perfStress, restPerfusion:!!s.perfRest, reversibility:!!s.reversibility,
    stressFunction:s.fnStress.ef!=null, restFunction:s.fnRest.ef!=null,
    stressCurve:s.curveStress.length>=8, restCurve:s.curveRest.length>=8,
    countsStress:!!s.suvStress, countsRest:!!s.suvRest,
    motion:!!s.motionStress, thickening:!!s.thickStress,
    vascularExtent:!!s.vascStress, flowBlock:s.hasFlowBlock, phaseBlock:s.hasPhase, rvBlock:s.hasRV,
    tracerKnown:s.tracer!=='UNKNOWN', segmentModel17:s.segments.length===17
  };
  m.studyType = (m.stressPerfusion&&m.restPerfusion)?'stress+rest':
                m.stressPerfusion?'stress-only':m.restPerfusion?'rest-only':'incomplete';
  return m;
}

function normalizedUptake(suvBlock,segs){
  if(!suvBlock) return null;
  var means={},mx=0;
  segs.forEach(function(sg){ if(suvBlock[sg]&&suvBlock[sg].mean){ means[sg]=suvBlock[sg].mean; if(means[sg]>mx) mx=means[sg]; }});
  if(!mx) return null;
  var out={}; for(var k in means) out[k]=means[k]/mx;
  return out;
}

/* ------------------------------------------------------------------ *
 *  MEDICATION / CLINICAL CONTEXT LAYER                                *
 * ------------------------------------------------------------------ */
function medProfile(ctx){
  var meds=ctx.meds||{}, on={}, list=[];
  Object.keys(meds).forEach(function(k){
    if(!meds[k]) return;
    var mc=MED_CLASS[k];
    var cls = mc?mc.cls:'other';
    on[cls]=(on[cls]||[]).concat(mc?mc.label:k);
    list.push(mc?mc.label:k);
  });
  var antianginalCount=0;
  ANTIANGINAL.forEach(function(c){ if(on[c]) antianginalCount++; });
  return {classes:on, list:list, antianginalCount:antianginalCount,
    onBB:!!on.betaBlocker, onNdhpCCB:!!on.ndhpCCB, onNitrate:!!on.nitrate,
    onStatin:!!on.statin, onAntiplatelet:!!on.antiplatelet, onP2Y12:!!on.p2y12,
    onAnticoag:!!(on.doac||on.vka), onRaas:!!on.raas,
    onMethylxanthine:!!(on.methylxanthine||on.dipyridamole),
    onSglt2:!!on.sglt2, onGlp1:!!on.glp1, onMetformin:!!on.metformin};
}

/* ------------------------------------------------------------------ *
 *  ENGINE                                                             *
 * ------------------------------------------------------------------ */
function analyze(s, ctx){
  ctx = ctx||{};
  var M=[], QC=[], man=manifest(s), segs=s.segments, th=s.thresholds;
  var mp=medProfile(ctx);

  function add(o){ o.tier=o.tier||'D'; o.cites=o.cites||[]; M.push(o); }
  function flag(code,sev,msg,cites){ QC.push({code:code,severity:sev,message:msg,cites:cites||[]}); }
  function blocked(){ return QC.some(function(q){return q.severity==='block';}); }
  function get(name){ return M.filter(function(m){return m.name===name;})[0]; }

  /* ---------------- QC gate (runs first) ---------------- */
  (function runQC(){
    if(s.perfStress&&s.perfRest){
      var para=segs.filter(function(sg){ return (s.perfRest[sg]||0)>(s.perfStress[sg]||0); });
      var signed=segs.reduce(function(a,sg){ return a+((s.perfStress[sg]||0)-(s.perfRest[sg]||0)); },0);
      if(para.length>=3 && signed<=-5)
        flag('REST_WORSE_THAN_STRESS','block',
          para.length+' segments score worse at rest than at stress (signed stress-rest sum '+signed+
          '). 4DM floors per-segment reversibility at zero, so this is reported as absent ischemia. '+
          'For a tracer with no redistribution this pattern is not physiologic and indicates rest '+
          'contour error, emission-CT misregistration, or motion.',['lortie07']);
      var basal=segs.slice(0,6).map(function(sg){return s.perfRest[sg]||0;});
      var mid=segs.slice(6,12).map(function(sg){return s.perfRest[sg]||0;});
      if(basal.length===6 && Math.min.apply(null,basal)>=2 && Math.max.apply(null,mid)===0)
        flag('REST_BASAL_RING','block',
          'All six basal segments are abnormal at rest with a normal mid ring. This is the signature '+
          'of valve-plane / basal contour misplacement rather than a coronary distribution.',['cerqueira02']);
    }
    [['suvStress','stress'],['suvRest','rest']].forEach(function(pair){
      var b=s[pair[0]]; if(!b||!b.Global||!b.Global.mean) return;
      var g=b.Global.mean;
      if(!(g>0.3&&g<25))
        flag('SUV_SCALE_'+pair[1].toUpperCase(),'warn',
          pair[1]+' global SUV '+g.toExponential(2)+' lies far outside any physiologic range. This is a '+
          'decay-correction reference-time error, not a measurement. Absolute SUV is suppressed; '+
          'ratios within a single dataset remain valid because the erroneous factor is common to all segments.',['lortie07']);
    });
    [['curveStress','stress'],['curveRest','rest']].forEach(function(pair){
      var v=s[pair[0]]; if(!v.length) return;
      var mx=v.indexOf(Math.max.apply(null,v));
      if(mx!==0)
        flag('ED_FRAME_'+pair[1].toUpperCase(),'warn',
          pair[1]+' peak volume falls at bin '+(mx+1)+' of '+v.length+' rather than bin 1. End-diastole is '+
          'not at the R-wave frame, indicating trigger jitter or beat rejection; EDV and EF may be underestimated.',[]);
    });
    var tid=s.fnStress.dilation;
    if(tid!=null&&tid<th.tidLow)
      flag('TID_LOW','warn','TID '+tid.toFixed(2)+' is below '+th.tidLow+
        '. Values this low are not physiologic and indicate inconsistent static contours between the '+
        'stress and rest datasets rather than a finding.',[th.tidCite]);
    if(tid!=null&&tid>th.tidHigh)
      flag('TID_HIGH','warn','TID '+tid.toFixed(2)+' exceeds the '+s.modality+' threshold of '+th.tidHigh+
        ', a marker of severe or extensive disease.',[th.tidCite]);
    if(s.fnStress.myomass&&s.fnRest.myomass){
      var dm=Math.abs(s.fnStress.myomass-s.fnRest.myomass)/((s.fnStress.myomass+s.fnRest.myomass)/2)*100;
      if(dm>10) flag('MASS_DISCORDANCE','warn','LV mass differs '+dm.toFixed(0)+
        '% between stress and rest. Myocardial mass is physiologically constant, so the difference '+
        'reflects contour instability between the two datasets.',[]);
    }
    if(s.injections.stress&&s.injections.rest&&s.injections.stress.time===s.injections.rest.time)
      flag('INJECTION_TIME_CARRYOVER','info','Stress and rest injection times are identical in the XML — '+
        'a metadata carry-over. Neither timestamp can be trusted for kinetic or decay calculations.',[]);
    if(s.dataState && s.dataState.toLowerCase()!=='final')
      flag('NOT_FINAL','info','4DM data_state is "'+s.dataState+'" — this is not a finalized dataset.',[]);
    s.warnings.forEach(function(w){ flag('PARSE','info',w,[]); });
  })();

  var gate=blocked();

  /* ---------------- anthropometrics ---------------- */
  if(s.weightKg&&s.heightCm){
    var bmi=s.bmi||s.weightKg/Math.pow(s.heightCm/100,2);
    var lbm=1.1*s.weightKg-128*Math.pow(s.weightKg/s.heightCm,2);
    add({name:'anthro', label:'Body habitus', section:'context', tier:'V',
      value:{bmi:r1(bmi), bsa:r2(s.bsa), leanMassKg:r1(lbm),
             bmiClass: bmi<25?'normal':bmi<30?'overweight':bmi<35?'class I obesity':bmi<40?'class II obesity':'class III obesity'},
      interpretation:'BSA drives every indexed volume and mass below; 4DM uses the DuBois formula.',
      cites:['lang15']});
  }

  /* ---------------- summed scores + burden ---------------- */
  var sss=null, srs=null, sdsReported=null, sdsSigned=null;
  if(s.perfStress){
    sss=segs.reduce(function(a,sg){return a+(s.perfStress[sg]||0);},0);
    if(s.perfRest) srs=segs.reduce(function(a,sg){return a+(s.perfRest[sg]||0);},0);
    if(s.reversibility) sdsReported=segs.reduce(function(a,sg){return a+(s.reversibility[sg]||0);},0);
    if(s.perfRest) sdsSigned=sss-srs;

    var mass=s.fnStress.myomass||s.fnRest.myomass;
    var isch={}, ischTotal=0;
    if(s.perfRest) segs.forEach(function(sg){
      isch[sg]=Math.max(0,(s.perfStress[sg]||0)-(s.perfRest[sg]||0));
      ischTotal+=MASS_W[AHA_NUM[sg]]*isch[sg]/4;
    });

  else if(sss<=8) pAxis={level:'mild',label:'Mildly abnormal',band:'SSS 4-8'};
  else if(sss<=13) pAxis={level:'moderate',label:'Moderately abnormal',band:'SSS 9-13'};
  else pAxis={level:'severe',label:'Severely abnormal',band:'SSS >13'};
  pAxis.value=sss; pAxis.sds=sds; pAxis.srs=srs;
  pAxis.cite='hacha98'; pAxis.abnormal=(sss>=4);

  /* flow axis — global MFR */
  var gf=(S.flow&&S.flow.Global)||{}, gs=num(gf.stress), gr=num(gf.rest);
  var mfr=(gs!=null&&gr!=null&&gr>0)?gs/gr:null;
  var fAxis;
  if(mfr==null) fAxis={level:'unknown',label:'Flow not available',value:null,abnormal:null};
  else if(mfr<1.5) fAxis={level:'severe',label:'Severely reduced MFR',value:r2(mfr),abnormal:true,band:'MFR <1.5'};
  else if(mfr<2.0) fAxis={level:'reduced',label:'Reduced MFR',value:r2(mfr),abnormal:true,band:'MFR 1.5-2.0'};
  else fAxis={level:'normal',label:'Preserved MFR',value:r2(mfr),abnormal:false,band:'MFR >=2.0'};
  fAxis.stressMBF=r2(gs); fAxis.restMBF=r2(gr); fAxis.cite='murthy11';
  fAxis.instNote='Institutional report thresholds are MFR 1.75 / stress MBF 1.8; published bands shown here.';

  /* calcium axis */
  var cal=S.calcium||{}, cacTot=0, cacAny=false, vessels=[];
  ['LM','LAD','LCX','RCA'].forEach(function(k){
    var v=num(cal[k]); if(v!=null){ cacAny=true; cacTot+=v; if(v>0)vessels.push(k); }
  });
  var cAxis;
  if(!cacAny) cAxis={level:'unknown',label:'Calcium not scored',value:null,abnormal:null};
  else if(cacTot===0) cAxis={level:'zero',label:'Zero calcium',value:0,abnormal:false,band:'CAC 0'};
  else if(cacTot<100) cAxis={level:'mild',label:'Mild calcification',value:cacTot,abnormal:true,band:'CAC 1-99'};
  else if(cacTot<400) cAxis={level:'moderate',label:'Moderate calcification',value:cacTot,abnormal:true,band:'CAC 100-399'};
  else cAxis={level:'severe',label:'Extensive calcification',value:cacTot,abnormal:true,band:'CAC >=400'};
  cAxis.vessels=vessels; cAxis.cite='valenti15';

  /* ---- phenotype cell ---- */
  var ph=phenotype(pAxis,fAxis,cAxis,ischPct);

  return {sss:sss,srs:srs,sds:sds,
          ischemicPct:pct(ischPct), scarPct:pct(scarPct), abnormalPct:pct(abnPct),
          mixedPct:pct(mixedPct), ischemicSeverityPct:pct(ischSeverityPct),
          perfusion:pAxis, flow:fAxis, calcium:cAxis, phenotype:ph};
}

/* The eight-cell tri-axial classification. This is the analytic core:
   the combination is far more informative than any single axis. */
function phenotype(p,f,c){
  var P=p.abnormal, F=f.abnormal, C=c.abnormal;
  var unk=(F==null?1:0)+(C==null?1:0);

  if(F==null&&C==null) return {id:'perfusion-only',name:'Relative perfusion only',
    conf:CONF.LOW, cite:'dorbala13',
    text:'Neither absolute flow nor calcium is available, so only the relative perfusion axis can be interpreted. '+
         'The principal blind spot is balanced ischemia, which relative perfusion alone cannot exclude.'};

  if(P===false&&F===true&&C===false) return {id:'microvascular',name:'Microvascular dysfunction (INOCA phenotype)',
    conf:CONF.MOD, flag:'attention', cite:'taqueti18',
    text:'Reduced flow reserve with normal relative perfusion and absent coronary calcium. The combination points '+
         'away from epicardial obstruction and toward coronary microvascular dysfunction. Relative imaging alone '+
         'would have called this study normal, and the absence of calcium is what separates it from balanced '+
         'obstructive disease.'};

  if(P===false&&F===true) return {id:'balanced',name:'Balanced ischemia / diffuse disease',
    conf:(unk?CONF.MOD:CONF.HIGH), flag:'critical', cite:'ziadi12',
    text:'Relative perfusion is normal while global flow reserve is reduced. This is the pattern that relative '+
         'imaging alone cannot detect: uniform reduction across all territories leaves no reference segment, so '+
         'the polar map appears normal. It is the classic signature of balanced multivessel or left main disease, '+
         'and it is also produced by diffuse non-obstructive atherosclerosis and by microvascular dysfunction. '+
         'The distinction between these rests on the calcium axis.'};

  if(P===false&&F===false&&C===true) return {id:'compensated',name:'Compensated atherosclerosis',
    conf:CONF.HIGH, cite:'valenti15',
    text:'Calcified atherosclerosis is present but neither relative perfusion nor flow reserve is impaired. '+
         'Anatomic disease without demonstrable physiologic consequence — a preventive-therapy phenotype '+
         'rather than an ischemia phenotype.'};

  if(P===false&&F===false&&C===false) return {id:'triple-normal',name:'Triple-normal study',
    conf:CONF.HIGH, cite:'yoshinaga06',
    text:'Normal relative perfusion, preserved flow reserve, and absent calcium. This combination carries the '+
         'lowest event rate described for cardiac PET and constitutes a genuine warranty period.'};

  if(P===true&&F===true) return {id:'concordant-abnormal',name:'Concordant obstructive physiology',
    conf:CONF.HIGH, cite:'dorbala13',
    text:'Relative perfusion abnormality with concordantly reduced flow reserve. The two axes agree, which '+
         'raises confidence that the defect is physiologically real rather than artifactual.'};

  if(P===true&&F===false) return {id:'discordant-perfusion',name:'Perfusion defect with preserved flow',
    conf:CONF.MOD, flag:'attention', cite:'ziadi12',
    text:'A relative perfusion abnormality is present but global flow reserve is preserved. Consider soft-tissue '+
         'attenuation, a small fixed scar in a limited mass of myocardium, or a regionally confined lesion that '+
         'does not depress the global average. Territorial flow should be inspected before the defect is accepted.'};

  if(P===false&&F===false) return {id:'physiologic-normal',name:'Physiologically normal',
    conf:CONF.HIGH, cite:'yoshinaga06',
    text:'Normal relative perfusion with preserved flow reserve. Balanced ischemia is excluded by the flow axis.'};

  return {id:'mixed',name:'Mixed pattern',conf:CONF.MOD,cite:'dorbala13',
    text:'The axes do not fall into a canonical pattern; interpret each axis on its own terms.'};
}

/* ============================================================
   DOMAIN 2 — TERRITORIAL ANALYSIS
   focal vs diffuse; defect/flow concordance per vessel
   ============================================================ */
function territoryDomain(S){
  var rows=[], mfrs=[];
  ['LAD','LCX','RCA'].forEach(function(t){
    var ss=0,rr=0,isch=0,segs=[];
    for(var s=1;s<=17;s++){
      if(TERR[s]!==t) continue;
      var a=num(S.stress[s])||0, b=num(S.rest[s])||0;
      ss+=a; rr+=b; if(a>b)isch++; if(a>0)segs.push(s);
    }
    var f=(S.flow&&S.flow[t])||{}, fs=num(f.stress), fr=num(f.rest);
    var mfr=(fs!=null&&fr!=null&&fr>0)?fs/fr:null;
    if(mfr!=null) mfrs.push(mfr);
    var defect=(ss>=2), flowLow=(mfr!=null&&mfr<2.0);
    var concord;
    if(mfr==null) concord={id:'noflow',label:'No flow data',note:'Territorial flow not entered.'};
    else if(defect&&flowLow) concord={id:'concordant',label:'Concordant',
      note:'Defect and reduced territorial flow agree — physiologically corroborated.'};
    else if(defect&&!flowLow) concord={id:'defect-only',label:'Defect, flow preserved',
      note:'Raises attenuation artifact or small fixed scar; flow does not corroborate the defect.'};
    else if(!defect&&flowLow) concord={id:'flow-only',label:'Flow reduced, no defect',
      note:'Occult territorial disease invisible to relative imaging — the territory-level analogue of balanced ischemia.'};
    else concord={id:'both-normal',label:'Both normal',note:'No defect, flow preserved.'};
    rows.push({terr:t,stress:ss,rest:rr,ischSeg:isch,segs:segs,
               stressMBF:r2(fs),restMBF:r2(fr),mfr:r2(mfr),
               defect:defect,flowLow:flowLow,concordance:concord});
  });

  /* dispersion: focal disease produces spread across territories; diffuse does not */
  var disp=null,pattern=null;
  if(mfrs.length>=2){
    var m=mean(mfrs), s2=sd(mfrs);
    disp=(m&&s2!=null)?r2(s2/m):null;
    if(disp!=null){
      if(disp<0.10) pattern={id:'diffuse',label:'Uniform across territories',
        note:'Low between-territory dispersion. If flow reserve is globally reduced this favors diffuse '+
             'atherosclerosis or microvascular disease over focal epicardial stenosis.'};
      else if(disp<0.20) pattern={id:'intermediate',label:'Mild territorial variation',
        note:'Modest dispersion; focal and diffuse contributions may coexist.'};
      else pattern={id:'focal',label:'Marked territorial variation',
        note:'High dispersion favors focal epicardial disease in the lowest-flow territory.'};
      pattern.value=disp;
    }
  }
  return {rows:rows,dispersion:disp,pattern:pattern,cite:'gould13'};
}

/* ============================================================
   DOMAIN 3 — FUNCTION
   ============================================================ */
function functionDomain(S){
  var er=num(S.ef&&S.ef.rest), es=num(S.ef&&S.ef.stress);
  var reserve=(er!=null&&es!=null)?(es-er):null;
  var out={efRest:er,efStress:es,reserve:reserve==null?null:r1(reserve),items:[],highRisk:[]};

  if(reserve!=null){
    if(reserve<0) out.items.push({k:'LVEF reserve',v:r1(reserve)+' points',flag:'high',cite:'dorbala07',
      note:'A fall in LVEF with vasodilator stress is abnormal and is associated with left main or three-vessel disease, '+
           'even when relative perfusion is unimpressive.'});
    else if(reserve<5) out.items.push({k:'LVEF reserve',v:'+'+r1(reserve)+' points',flag:'attention',cite:'dorbala07',
      note:'Blunted augmentation (<5 points) is a soft marker of extensive disease.'});
    else out.items.push({k:'LVEF reserve',v:'+'+r1(reserve)+' points',flag:'ok',cite:'dorbala07',
      note:'Normal augmentation with vasodilator stress.'});
    if(reserve<0) out.highRisk.push('Negative LVEF reserve');
  }
  if(er!=null&&er<45){ out.highRisk.push('Rest LVEF <45%'); }
  var esv=num(S.esvRest);
  if(esv!=null&&esv>70){ out.highRisk.push('Rest ESV >70 mL'); }
  if(esv!=null||er!=null) out.items.push({k:'Rest LVEF / ESV',
    v:(er!=null?er+'%':'\u2014')+' / '+(esv!=null?esv+' mL':'\u2014'),
    flag:((er!=null&&er<45)||(esv!=null&&esv>70))?'high':'ok', cite:'sharir99',
    note:'Post-stress LVEF <45% and ESV >70 mL identify elevated risk of cardiac death.'});

  var tid=S.tid||{}, tr=num(tid.ratio);
  if(tid.present||tr!=null){
    var tHigh=(tr!=null&&tr>=1.13);
    out.items.push({k:'TID ratio',v:tr!=null?r2(tr):'present',flag:tHigh?'high':'ok',cite:'abidov03',
      note:'Transient ischemic dilatation above ~1.13 on PET suggests extensive subendocardial ischemia or multivessel disease.'});
    if(tHigh) out.highRisk.push('TID present');
  }

  /* myocardial contraction fraction = SV / myocardial volume */
  var edv=num(S.edvRest), mass=num(S.massRest);
  if(edv!=null&&esv!=null&&mass!=null&&mass>0&&edv>esv){
    var sv=edv-esv, myoVol=mass/1.05;
    var mcf=(myoVol>0)?(sv/myoVol*100):null;
    if(mcf!=null) out.items.push({k:'Myocardial contraction fraction',v:r1(mcf)+'%',
      flag:mcf<30?'attention':'ok',cite:'king02',
      note:'Volumetric measure of contractile efficiency; less load-dependent than LVEF. Model-derived.'});
  } else if(edv!=null&&esv!=null&&edv<=esv){
    out.items.push({k:'Volume data inconsistent',v:'EDV '+edv+' \u2264 ESV '+esv+' mL',flag:'high',cite:'sharir99',
      note:'End-diastolic volume cannot be less than or equal to end-systolic volume. Derived volumetric indices are suppressed until this is corrected \u2014 a negative contraction fraction would otherwise be reported as a finding.'});
  }
  return out;
}

/* ============================================================
   DOMAIN 4 — STUDY VALIDITY
   How much should these numbers be trusted?
   ============================================================ */
function validityDomain(S){
  var sd0=S.stressData||{}, items=[], penalty=0;

  var rHR=num(sd0.restHR), rSBP=num(sd0.restSBP), pHR=num(sd0.peakHR), pSBP=num(sd0.peakSBP);
  var rppRest=(rHR!=null&&rSBP!=null)?rHR*rSBP:null;
  var rppPeak=(pHR!=null&&pSBP!=null)?pHR*pSBP:null;

  /* Resting flow scales with cardiac work; correcting rest MBF to a standard RPP
     of 10,000 makes MFR comparable across patients and across serial studies. */
  var gf=(S.flow&&S.flow.Global)||{}, gs=num(gf.stress), gr=num(gf.rest);
  var mfr=(gs!=null&&gr!=null&&gr>0)?gs/gr:null, mfrC=null;
  if(mfr!=null&&rppRest!=null&&rppRest>0){
    var grC=gr/(rppRest/10000);
    mfrC=(grC>0)?gs/grC:null;
  }
  if(rppRest!=null) items.push({k:'Rest rate-pressure product',v:Math.round(rppRest),
    flag:(rppRest>12000||rppRest<6000)?'attention':'ok',cite:'czernin93',
    note:rppRest>12000?'Elevated resting work inflates rest MBF and therefore deflates uncorrected MFR.'
        :(rppRest<6000?'Low resting work deflates rest MBF and inflates uncorrected MFR.'
        :'Resting workload is in the usual range; uncorrected MFR is interpretable.')});
  function mfrBand(v){ return v==null?null:(v<1.5?'severe':(v<2.0?'reduced':'normal')); }
  var crosses=(mfrC!=null&&mfr!=null&&mfrBand(mfrC)!==mfrBand(mfr));
  if(mfrC!=null) items.push({k:'RPP-corrected global MFR',v:r2(mfrC),
    flag:crosses?'attention':'ok',cite:'czernin93',
    note:'Rest MBF normalized to RPP 10,000. Uncorrected '+r2(mfr)+' vs corrected '+r2(mfrC)+
         (crosses?' \u2014 correction moves this study across a classification boundary, so the category is a statement about resting workload as much as coronary physiology.'
                 :'. Correction does not change the category.')});
  if(crosses) penalty+=1;

  /* vasodilator adequacy */
  if(rHR!=null&&pHR!=null){
    var dHR=pHR-rHR, pctHR=rHR>0?(dHR/rHR*100):null;
    var inadequate=(pctHR!=null&&pctHR<10);
    items.push({k:'Heart-rate response',v:'+'+dHR+' bpm'+(pctHR!=null?' ('+r1(pctHR)+'%)':''),
      flag:inadequate?'high':'ok',cite:'asnc16',
      note:inadequate?'A heart-rate rise under 10% suggests inadequate vasodilator effect. Stress MBF and MFR may be falsely low across all territories \u2014 which mimics balanced ischemia.'
                     :'Chronotropic response consistent with adequate vasodilator effect.'});
    if(inadequate) penalty+=2;
  }
  if(rSBP!=null&&pSBP!=null){
    var dS=pSBP-rSBP;
    if(dS<=-30) { items.push({k:'Blood-pressure response',v:dS+' mmHg',flag:'attention',cite:'asnc16',
      note:'Marked systolic fall with vasodilator; can reduce coronary driving pressure and depress measured stress MBF.'}); penalty+=1; }
  }

  /* confounders */
  if(sd0.recentCaffeine){ items.push({k:'Recent caffeine',v:'reported',flag:'high',cite:'asnc16',
    note:'Caffeine is a competitive adenosine-receptor antagonist. Stress MBF and MFR may be substantially underestimated; a reduced MFR cannot be attributed to disease with confidence.'}); penalty+=3; }
  var meds=S.meds||{};
  if(meds.theophylline){ items.push({k:'Theophylline',v:'on medication',flag:'high',cite:'asnc16',
    note:'Methylxanthine blocks the vasodilator response; flow quantification is unreliable.'}); penalty+=3; }
  if(meds.dipyridamole){ items.push({k:'Dipyridamole',v:'on medication',flag:'attention',cite:'asnc16',
    note:'Chronic dipyridamole alters baseline adenosine tone and may blunt the flow response.'}); penalty+=1; }
  if(sd0.amino){ items.push({k:'Aminophylline given',v:String(sd0.amino),flag:'attention',cite:'asnc16',
    note:'If administered before completion of flow acquisition, stress MBF is truncated.'}); penalty+=1; }

  /* artifacts */
  var art=S.artifact||{}, artKeys=Object.keys(art).filter(function(k){return art[k];});
  if(artKeys.length) items.push({k:'Artifacts noted',v:artKeys.join(', '),flag:'attention',cite:'cerqueira02',
    note:'Documented artifacts bear directly on whether relative defects are anatomic.'});

  var score, label;
  if(mfr==null){ score=CONF.NONE; label='Not applicable \u2014 no flow quantification to assess';
    return {items:items,penalty:0,confidence:score,label:label,
            rppRest:rppRest?Math.round(rppRest):null,rppPeak:rppPeak?Math.round(rppPeak):null,
            mfr:null,mfrCorrected:null}; }
  if(penalty===0){ score=CONF.HIGH; label='High \u2014 no identified threat to quantitative validity'; }
  else if(penalty<=2){ score=CONF.MOD; label='Moderate \u2014 minor confounders present'; }
  else { score=CONF.LOW; label='Low \u2014 flow quantification is materially confounded'; }

  return {items:items,penalty:penalty,confidence:score,label:label,
          rppRest:rppRest?Math.round(rppRest):null,rppPeak:rppPeak?Math.round(rppPeak):null,
          mfr:r2(mfr),mfrCorrected:r2(mfrC)};
}

/* ============================================================
   DOMAIN 5 — CARDIO-ONCOLOGY
   exposure, CTRCD, RT-territory concordance
   ============================================================ */
/* Cumulative dose is only interpretable as a doxorubicin-EQUIVALENT. Conversion
   factors differ substantially between sources, so the factor used is stated
   rather than silently applied. Recording epirubicin mg/m2 as if it were
   doxorubicin overstates exposure roughly two-fold and would corrupt any
   dose-response analysis. */
var ANTHRA_EQUIV={
  doxorubicin:{f:1.0,label:'Doxorubicin'},
  epirubicin:{f:0.67,label:'Epirubicin'},
  daunorubicin:{f:0.6,label:'Daunorubicin'},
  idarubicin:{f:3.0,label:'Idarubicin'},
  mitoxantrone:{f:4.0,label:'Mitoxantrone'}
};
var ANTHRA_EQUIV_NOTE='Conversion factors to doxorubicin-equivalent dose vary between published sources; the factor applied is shown so the raw dose can be recovered.';

var ANTHRA_TIER=[
  {max:100,  id:'low',      label:'<100 mg/m\u00b2',      note:'Below the range usually associated with measurable cardiotoxicity.'},
  {max:250,  id:'moderate', label:'100-250 mg/m\u00b2',   note:'Intermediate cumulative exposure.'},
  {max:400,  id:'high',     label:'250-400 mg/m\u00b2',   note:'Approaching the threshold at which cardiomyopathy incidence rises steeply.'},
  {max:1e9,  id:'veryhigh', label:'>=400 mg/m\u00b2',     note:'Cumulative doxorubicin-equivalent dose at which incidence of cardiomyopathy rises sharply.'}
];
/* Left-sided and mediastinal fields place the LAD in or near the treatment volume;
   right-sided fields generally do not. This asymmetry is the basis of the
   left-vs-right natural experiment. */
var RT_TERRITORY={left:['LAD'],mediastinal:['LAD','RCA'],bilateral:['LAD','RCA'],right:[],none:[]};

function oncoDomain(S,axes,terr,fx){
  var o=S.onco||{}, items=[], flags=[], exposures=[];
  var anyExposure=false;

  if(o.cancerType) exposures.push({k:'Malignancy',v:o.cancerType+(o.stage?(' \u2014 stage '+o.stage):'')});

  var adRaw=num(o.anthraDose);
  var drug=(o.anthraDrug&&ANTHRA_EQUIV[o.anthraDrug])?o.anthraDrug:null;
  var eq=drug?ANTHRA_EQUIV[drug]:null;
  var ad=(adRaw!=null&&eq)?adRaw*eq.f:adRaw;   /* doxorubicin-equivalent */
  if(o.anthra){
    anyExposure=true;
    var tier=null; if(ad!=null){ for(var i=0;i<ANTHRA_TIER.length;i++){ if(ad<ANTHRA_TIER[i].max){tier=ANTHRA_TIER[i];break;} } }
    var doseStr = adRaw==null ? 'exposed, dose not recorded'
      : (eq ? (adRaw+' mg/m\u00b2 '+eq.label+' \u2192 '+Math.round(ad)+' mg/m\u00b2 doxorubicin-equivalent (\u00d7'+eq.f+')')
            : (adRaw+' mg/m\u00b2 \u2014 agent not specified'));
    exposures.push({k:'Anthracycline',v:doseStr+(tier?(' \u2014 '+tier.label):'')});
    items.push({k:'Anthracycline exposure',v:tier?tier.label:(adRaw!=null?'agent not specified':'dose not recorded'),
      flag:(tier&&(tier.id==='high'||tier.id==='veryhigh'))?'high':((adRaw!=null&&!eq)?'attention':'ok'),cite:'swain03',
      note:(adRaw!=null&&!eq)
        ? 'A cumulative dose is recorded but the agent is not. Dose is only interpretable once converted to a doxorubicin-equivalent, and the conversion factor differs by agent \u2014 recording epirubicin as doxorubicin overstates exposure by roughly a third to a half. Specify the agent before this value is used for dose-response analysis.'
        : (tier ? tier.note+(eq&&eq.f!==1?(' '+ANTHRA_EQUIV_NOTE):'')
                : 'Cumulative dose is the principal determinant of anthracycline cardiotoxicity risk; recording it is what makes dose-response analysis possible.')});
    if(tier&&(tier.id==='high'||tier.id==='veryhigh')) flags.push('High cumulative anthracycline dose');
  }
  if(o.her2){ anyExposure=true; var ha=Object.keys(o.her2Agents||{}).filter(function(k){return o.her2Agents[k];});
    exposures.push({k:'HER2-directed therapy',v:ha.length?ha.join(', '):'exposed'});
    items.push({k:'HER2-directed therapy',v:ha.length?ha.join(', '):'exposed',flag:'attention',cite:'ewer05',
      note:'HER2 blockade causes type II cardiotoxicity \u2014 typically dose-independent and substantially reversible, in contrast to anthracycline injury. Sequential or concurrent anthracycline exposure is additive.'}); }
  if(o.ici){ anyExposure=true; var ia=Object.keys(o.iciAgents||{}).filter(function(k){return o.iciAgents[k];});
    exposures.push({k:'Immune checkpoint inhibitor',v:ia.length?ia.join(', '):'exposed'});
    items.push({k:'Checkpoint inhibitor',v:ia.length?ia.join(', '):'exposed',flag:'attention',cite:'mahmood18',
      note:'Associated with myocarditis \u2014 uncommon but with high case fatality, and typically early after initiation. Perfusion PET does not exclude it; clinical correlation and troponin are required.'}); }
  if(o.vegf){ anyExposure=true; exposures.push({k:'VEGF inhibitor / TKI',v:'exposed'});
    items.push({k:'VEGF/TKI therapy',v:'exposed',flag:'attention',cite:'moslehi16',
      note:'Associated with hypertension, and with microvascular and endothelial dysfunction that may depress flow reserve independent of epicardial disease.'}); }
  if(o.fiveFU){ anyExposure=true; exposures.push({k:'Fluoropyrimidine',v:'exposed'});
    items.push({k:'5-FU / capecitabine',v:'exposed',flag:'attention',cite:'moslehi16',
      note:'Coronary vasospasm is the characteristic toxicity; ischemia may be intermittent and absent at the time of imaging.'}); }
  if(o.carfilzomib){ anyExposure=true; exposures.push({k:'Carfilzomib',v:'exposed'});
    items.push({k:'Carfilzomib',v:'exposed',flag:'attention',cite:'moslehi16',note:'Proteasome inhibitor associated with heart failure and hypertension.'}); }
  if(o.hsct){ anyExposure=true; exposures.push({k:'HSCT',v:'yes'}); }

  /* ---- radiotherapy and territorial concordance ---- */
  var rtC=null;
  if(o.rt&&o.rtSide){
    anyExposure=true;
    var side=o.rtSide, inField=RT_TERRITORY[side]||[];
    exposures.push({k:'Chest radiotherapy',v:side+(o.rtDose?(', ~'+o.rtDose+' Gy'):'')+(o.rtDate?(', '+o.rtDate):'')});
    var latency=null;
    var latencyInvalid=false;
    if(o.rtDate&&S.rx&&S.rx.studyDate){
      var d1=new Date(o.rtDate), d2=new Date(S.rx.studyDate);
      if(!isNaN(d1)&&!isNaN(d2)){
        var yrs=r1((d2-d1)/(365.25*24*3600*1000));
        /* radiotherapy dated after the study is a data-entry error, not a finding */
        if(yrs<0){ latencyInvalid=true; latency=null;
          items.push({k:'Radiotherapy date inconsistent',v:o.rtDate+' is after the study date',flag:'high',cite:'darby13',
            note:'The recorded radiotherapy date follows the study date, which cannot be correct. Latency is suppressed until this is resolved; a negative interval would otherwise propagate into the registry.'});
        } else latency=yrs;
      }
    }
    if(inField.length){
      var affected=terr.rows.filter(function(r){ return inField.indexOf(r.terr)>=0 && (r.defect||r.flowLow); })
                            .map(function(r){return r.terr;});
      var outField=terr.rows.filter(function(r){ return inField.indexOf(r.terr)<0 && (r.defect||r.flowLow); })
                            .map(function(r){return r.terr;});
      if(affected.length&&!outField.length) rtC={id:'concordant',label:'Abnormality confined to the irradiated territory',
        terr:affected,flag:'high',
        note:'Perfusion or flow abnormality is limited to '+affected.join(', ')+', which lay within a '+side+
             ' radiation field'+(latency!=null?(' delivered approximately '+latency+' years before this study'):'')+
             '. Radiation-associated coronary disease characteristically involves ostial and proximal segments of vessels within the treatment volume. '+
             'This is the pattern the left-versus-right comparison is designed to detect.'};
      else if(affected.length) rtC={id:'partial',label:'Abnormality involves the irradiated territory and beyond',
        terr:affected,flag:'attention',
        note:'Territories '+affected.join(', ')+' were in field, but '+outField.join(', ')+' is also abnormal. '+
             'Radiation exposure may be contributory rather than sufficient.'};
      else rtC={id:'discordant',label:'Irradiated territory is unaffected',terr:inField,flag:'ok',
        note:'No abnormality in the in-field territory ('+inField.join(', ')+').'};
    } else if(side==='right'){
      rtC={id:'control',label:'Right-sided field \u2014 control exposure',terr:[],flag:'ok',
        note:'A right-sided field generally spares the LAD. For the registry these patients are the natural control arm: '+
             'matched for malignancy, chemotherapy and surveillance pathway, differing only in whether the LAD lay within the treatment volume.'};
    }
    if(rtC){ rtC.latencyYears=latency; rtC.cite='darby13';
      items.push({k:'RT-territory concordance',v:rtC.label,flag:rtC.flag,cite:'darby13',note:rtC.note}); }
    if(latency!=null&&latency<5) items.push({k:'Time since radiotherapy',v:latency+' years',flag:'ok',cite:'darby13',
      note:'Radiation-associated coronary disease typically becomes manifest beyond 5-10 years, though excess risk begins within the first 5.'});
  }

  /* ---- CTRCD assessment ---- */
  var ctrcd=null;
  var efNow=num(S.ef&&S.ef.rest), efPrior=num(S.pt&&S.pt.echoEF);
  var priorDate=(S.pt&&S.pt.echoDate)||'';
  if(efNow!=null&&efPrior!=null){
    var drop=efPrior-efNow;
    if(efNow<50&&drop>=10) ctrcd={id:'definite',label:'Meets CTRCD criteria',flag:'high',
      note:'LVEF has fallen '+r1(drop)+' points from a prior of '+efPrior+'% to '+efNow+'%, crossing below 50%. '+
           'This satisfies the conventional definition of cancer-therapy-related cardiac dysfunction.'};
    else if(drop>=10) ctrcd={id:'decline',label:'\u226510-point decline, LVEF still \u226550%',flag:'attention',
      note:'A fall of '+r1(drop)+' points from '+efPrior+'% without crossing 50%. Below the formal threshold but a meaningful trajectory that warrants a shortened surveillance interval.'};
    else if(drop>=5) ctrcd={id:'minor',label:'Minor decline',flag:'ok',
      note:'A '+r1(drop)+'-point fall is within the range of measurement variability between modalities.'};
    else ctrcd={id:'stable',label:'LVEF stable',flag:'ok',note:'No meaningful interval decline in LVEF.'};
    ctrcd.cite='plana14'; ctrcd.efNow=efNow; ctrcd.efPrior=efPrior; ctrcd.drop=r1(drop);
    ctrcd.priorDate=priorDate||null;
    ctrcd.undated=!priorDate;
    if(!priorDate){
      /* CTRCD is a statement about change over an interval. Without a date on the
         comparator there is no interval, and cross-modality bias is unquantifiable. */
      ctrcd.note += ' The prior ejection fraction carries no recorded date, so the interval over which this change occurred is unknown and the comparison rests on an undated value obtained by a different modality. Record the date before treating this as a formal CTRCD determination.';
      if(ctrcd.id==='definite'){ ctrcd.id='definite-undated'; ctrcd.label='Meets CTRCD threshold \u2014 comparator undated'; ctrcd.flag='attention'; }
    }
    items.push({k:'CTRCD assessment',v:ctrcd.label,flag:ctrcd.flag,cite:'plana14',
      note:ctrcd.note+(priorDate?(' Prior study dated '+priorDate+'.'):'')});
  }

  /* ---- the early-toxicity hypothesis: flow falls before function ---- */
  var early=null;
  if(anyExposure&&axes.flow.abnormal===true&&efNow!=null&&efNow>=50){
    early={flag:'high',cite:'taqueti18',
      note:'Flow reserve is reduced while LVEF remains preserved at '+efNow+'%. Microvascular injury is thought to precede '+
           'contractile decline in cancer-therapy cardiotoxicity, so this combination is the phenotype of interest for '+
           'early detection \u2014 and the one an EF-based surveillance programme would miss entirely. It is a hypothesis, '+
           'not an established surveillance criterion.'};
    items.push({k:'Reduced MFR with preserved LVEF',v:'MFR '+axes.flow.value+', LVEF '+efNow+'%',flag:'high',cite:'taqueti18',note:early.note});
    flags.push('Reduced flow reserve with preserved LVEF');
  }

  return {present:anyExposure,exposures:exposures,items:items,flags:flags,
          rtConcordance:rtC,ctrcd:ctrcd,earlyToxicity:early,
          context:o.scanContext||null};
}


/* ============================================================
   MODALITY COMPARISON
   What this study answered, what it cannot answer, and where a
   substitution claim against echocardiography is actually defensible.

   The broad claim ("PET replaces echo") is false and would be dismissed
   immediately: echo assesses valves, diastology, pericardium, RV and
   intracardiac masses, none of which perfusion PET can see at all. The
   narrow claim is strong, and narrow claims are the ones that win.
   ============================================================ */
var MODALITY_DOMAINS = [
  {k:'lvef', label:'Left ventricular ejection fraction', pet:'yes', echo:'yes', edge:'pet',
   note:'Gated PET derives ejection fraction from counts without a geometric model. Two-dimensional echo relies on geometric assumptions and endocardial border definition, and its temporal variability in serial cancer-therapy surveillance is of the order of 10 percentage points \u2014 the same magnitude as the 10-point decline that defines cardiotoxicity. Three-dimensional echo narrows this gap considerably where it is available and well performed.',
   cite:'thaven13'},
  {k:'volumes', label:'LV volumes and mass', pet:'yes', echo:'yes', edge:'pet',
   note:'Same geometric-assumption argument as ejection fraction, with the same caveat regarding three-dimensional echo.', cite:'thaven13'},
  {k:'rwma', label:'Regional wall motion', pet:'yes', echo:'yes', edge:'even',
   note:'Both assess regional function. Echo has superior temporal resolution; PET adds concurrent perfusion at the same regions.', cite:'cerqueira02'},
  {k:'perfusion', label:'Myocardial perfusion', pet:'yes', echo:'no', edge:'pet-only',
   note:'Not assessable by standard echocardiography. Contrast echo perfusion exists but is not in routine use.', cite:'dorbala13'},
  {k:'flow', label:'Absolute myocardial blood flow and flow reserve', pet:'yes', echo:'no', edge:'pet-only',
   note:'The quantity with no echocardiographic equivalent in routine practice, and the basis of every balanced-ischemia and microvascular question in this program.', cite:'gould13'},
  {k:'cac', label:'Coronary calcium', pet:'yes', echo:'no', edge:'pet-only',
   note:'Available at no additional dose from the attenuation-correction CT already acquired.', cite:'valenti15'},
  {k:'gls', label:'Global longitudinal strain', pet:'no', echo:'yes', edge:'echo-only',
   note:'The single strongest argument against substituting PET for echo in cardio-oncology. Strain detects subclinical dysfunction earlier than ejection fraction by either modality and is guideline-endorsed for surveillance. Any substitution claim must be tested against strain, not against echo ejection fraction alone.',
   cite:'thaven14'},
  {k:'valves', label:'Valvular structure and severity', pet:'no', echo:'yes', edge:'echo-only',
   note:'No perfusion PET capability whatsoever. Radiation-associated valve disease is common in irradiated survivors, which makes this a live clinical issue in precisely the population this program studies.', cite:'darby13'},
  {k:'diastole', label:'Diastolic function', pet:'limited', echo:'yes', edge:'echo-only',
   note:'Echo tissue Doppler and filling indices have no routine PET equivalent. Diastolic dysfunction often precedes systolic decline after cardiotoxic therapy.', cite:'plana14'},
  {k:'pericardium', label:'Pericardial disease and effusion', pet:'limited', echo:'yes', edge:'echo-only',
   note:'The attenuation CT may show an effusion incidentally, but tamponade physiology and constriction are echocardiographic diagnoses. Also a recognized late effect of mediastinal radiotherapy.', cite:'darby13'},
  {k:'rv', label:'Right ventricular function', pet:'limited', echo:'yes', edge:'echo-only',
   note:'Right ventricular assessment on perfusion PET is qualitative at best.', cite:'plana14'},
  {k:'masses', label:'Intracardiac masses and thrombus', pet:'no', echo:'yes', edge:'echo-only',
   note:'A frequent and specifically oncologic clinical question that perfusion PET does not address.', cite:'plana14'},
  {k:'dose', label:'Ionizing radiation', pet:'no', echo:'yes', edge:'echo-only',
   note:'Echo involves no ionizing radiation. In a population already carrying substantial cumulative imaging dose this is a material consideration, not a formality.', cite:'asnc16'},
  {k:'access', label:'Cost, availability, portability', pet:'no', echo:'yes', edge:'echo-only',
   note:'Echo is cheaper, portable, repeatable at the bedside and far more widely available. Any substitution argument has to clear this bar, and for most indications it does not.', cite:'plana14'}
];

function modalityDomain(S,axes,fx){
  var answered=[], notAnswered=[], petOnly=[], echoOnly=[];
  MODALITY_DOMAINS.forEach(function(d){
    if(d.edge==='pet-only') petOnly.push(d);
    if(d.edge==='echo-only') echoOnly.push(d);
  });
  /* what THIS study actually delivered */
  if(fx.efRest!=null) answered.push('Rest ejection fraction'); else notAnswered.push('Ejection fraction (not entered)');
  if(fx.efStress!=null) answered.push('Stress ejection fraction and reserve');
  if(axes.perfusion) answered.push('Regional perfusion, 17 segments');
  if(axes.flow.value!=null) answered.push('Absolute flow and flow reserve'); else notAnswered.push('Absolute flow (not entered)');
  if(axes.calcium.value!=null) answered.push('Coronary calcium'); else notAnswered.push('Coronary calcium (not scored)');

  /* is the narrow substitution claim in play for this patient? */
  var o=S.onco||{}, onTherapy=!!(o.anthra||o.her2||o.ici);
  var substitution=null;
  if(onTherapy&&fx.efRest!=null){
    substitution={
      applies:true,
      claim:'Serial LV function surveillance during cardiotoxic therapy',
      text:'This patient is on cardiotoxic therapy and has a quantitative ejection fraction from this study. '+
           'That is the one indication where substituting PET for surveillance echocardiography is arguable: '+
           'the decision threshold is a 10-point decline, and the temporal variability of two-dimensional echo '+
           'in this setting is of comparable magnitude, so the test is being asked to resolve a change the size '+
           'of its own noise. A count-based gated ejection fraction makes no geometric assumption.',
      against:'Strain imaging is the real comparator, not echo ejection fraction. It detects subclinical dysfunction '+
              'earlier than ejection fraction by any modality and is already guideline-endorsed for this exact purpose. '+
              'Echo also remains necessary for valvular, pericardial and right-ventricular assessment, all of which are '+
              'common late effects in irradiated survivors, and it carries no radiation.',
      verdict:'Defensible as a substitution for surveillance echocardiography ONLY where perfusion or flow is independently '+
              'indicated, so the ejection fraction is obtained at no additional dose or cost. As a stand-alone replacement '+
              'for surveillance echo it is not supportable on current evidence.',
      cite:'thaven13'
    };
  } else {
    substitution={applies:false,
      text:'The substitution question applies to patients on cardiotoxic therapy undergoing serial LV function surveillance. '+
           'It is not engaged by this study.'};
  }

  return {domains:MODALITY_DOMAINS, answered:answered, notAnswered:notAnswered,
          petOnly:petOnly, echoOnly:echoOnly, substitution:substitution,
          summary:'This study answered '+answered.length+' of the domains it can address. '+
                  echoOnly.length+' clinically important domains remain outside its reach entirely and still require echocardiography.'};
}

/* ============================================================
   DOMAIN 6 — RISK SYNTHESIS
   ============================================================ */
function riskDomain(S,axes,fx,val){
  var out={items:[],tier:null,annualEvent:null};
  var sss=axes.sss, isch=axes.ischemicPct, mfr=axes.flow.value;

  /* annualized hard-event estimate by perfusion category (Yoshinaga/Dorbala registries) */
  var band;
  if(sss<4) band={tier:'low',rate:'<1%/yr'};
  else if(sss<=8) band={tier:'intermediate',rate:'~1-3%/yr'};
  else if(sss<=13) band={tier:'high',rate:'~3-5%/yr'};
  else band={tier:'very high',rate:'>5%/yr'};

  /* flow reserve modifies the estimate independently of relative perfusion */
  var mod=null;
  var RATE={'low':'<1%/yr','intermediate':'~1-3%/yr','high':'~3-5%/yr','very high':'>5%/yr'};
  var ORDER=['low','intermediate','high','very high'];
  function bump(t,n){ var i=ORDER.indexOf(t); return ORDER[Math.min(ORDER.length-1,i+n)]; }
  var flowTrusted=(val&&val.confidence!==CONF.LOW&&val.confidence!==CONF.NONE);
  if(mfr!=null&&!flowTrusted){
    out.items.push({k:'Flow-based risk adjustment',v:'withheld',flag:'attention',cite:'asnc16',
      note:'Global MFR is '+mfr+', but the validity assessment judged flow quantification materially confounded. '+
           'The risk category is therefore based on relative perfusion alone and is deliberately not escalated on '+
           'a flow value that may be technically rather than physiologically low.'});
  }
  if(mfr!=null&&flowTrusted){
    /* Flow reserve carries prognostic weight independent of relative perfusion,
       so it moves the category rather than merely annotating it. */
    if(mfr<1.5){ mod='upgraded'; band={tier:bump(band.tier,2),rate:null}; }
    else if(mfr<2.0){ mod='upgraded'; band={tier:bump(band.tier,1),rate:null}; }
    else if(band.tier==='low'){ mod='confirmed'; }
    if(band.rate==null) band.rate=RATE[band.tier]+' (category raised for MFR '+mfr+')';
  }
  out.tier=band.tier; out.annualEvent=band.rate;
  out.items.push({k:'Estimated annual hard-event rate',v:band.rate,flag:(band.tier==='low'?'ok':(band.tier==='intermediate'?'attention':'high')),
    cite:'yoshinaga06',
    note:'Derived from published PET registry event rates by scan category'+
         (mod==='upgraded'?', raised because reduced global flow reserve carries prognostic weight independent of relative perfusion.'
         :(mod==='confirmed'?', with preserved flow reserve corroborating the low-risk category.':'.'))+
         ' Registry-derived and observational; it is not an individualized prediction.'});

  if(isch!=null){
    var thr=(isch>=10);
    out.items.push({k:'Ischemic myocardium',v:isch+'%',flag:thr?'high':'ok',cite:'hacha03',
      note:thr?'At or above the ~10% mass threshold above which observational data associated revascularization with survival benefit. ISCHEMIA subsequently found no reduction in ischemic cardiovascular events from a routine invasive strategy in stable disease, though angina relief favored it. The threshold identifies patients for discussion, not for automatic referral.'
             :'Below the ~10% mass threshold conventionally used to identify potential revascularization benefit.'});
  }
  if(fx.highRisk&&fx.highRisk.length) out.items.push({k:'High-risk functional markers',v:fx.highRisk.join('; '),
    flag:'high',cite:'sharir99',note:'Functional high-risk markers add prognostic information beyond perfusion extent.'});
  return out;
}

/* ============================================================
   DOMAIN 7 — DIFFERENTIAL REASONING
   Ranked, with for/against drawn from THIS patient's own data.
   ============================================================ */
function differentialDomain(S,axes,terr,val){
  var dx=[], bmi=null;
  var kg=num(S.pt&&S.pt.weightKg), cm=num(S.pt&&S.pt.heightCm);
  if(kg!=null&&cm!=null&&cm>0) bmi=kg/Math.pow(cm/100,2);
  var female=(S.pt&&S.pt.sex==='female');
  var art=S.artifact||{};

  var anyDefect=terr.rows.some(function(r){return r.defect;});
  var infDefect=terr.rows.some(function(r){return r.terr==='RCA'&&r.defect;});
  var antDefect=terr.rows.some(function(r){return r.terr==='LAD'&&r.defect;});

  if(anyDefect){
    var defectOnly=terr.rows.filter(function(r){return r.concordance.id==='defect-only';});
    /* obstructive CAD */
    var forO=[],agO=[];
    terr.rows.forEach(function(r){ if(r.defect&&r.flowLow) forO.push(r.terr+' defect with MFR '+r.mfr); });
    if(axes.sds>=2) forO.push('Reversibility present (SDS '+axes.sds+')');
    if(defectOnly.length) agO.push(defectOnly.map(function(r){return r.terr;}).join(', ')+' defect without corresponding flow reduction');
    if(axes.calcium.abnormal===false) agO.push('Zero coronary calcium argues against obstructive epicardial disease');
    dx.push({dx:'Obstructive epicardial coronary disease',
      rank:(forO.length&&!agO.length)?1:(forO.length?2:3),
      forE:forO,againstE:agO,cite:'dorbala13'});

    /* attenuation artifact */
    var forA=[],agA=[];
    if(infDefect&&!female) forA.push('Inferior defect in a male \u2014 the classic diaphragmatic attenuation pattern');
    if(antDefect&&female) forA.push('Anterior defect in a female \u2014 the classic breast attenuation pattern');
    if(bmi!=null&&bmi>=30) forA.push('BMI '+r1(bmi)+' increases soft-tissue attenuation');
    if(Object.keys(art).filter(function(k){return art[k];}).length) forA.push('Artifact explicitly documented at read');
    if(defectOnly.length) forA.push('Defect without concordant flow reduction');
    terr.rows.forEach(function(r){ if(r.defect&&r.flowLow) agA.push(r.terr+' flow reserve is concordantly reduced, which attenuation does not cause'); });
    if(axes.sds>=2) agA.push('Reversibility between stress and rest is not an attenuation behavior');
    if(forA.length) dx.push({dx:'Soft-tissue attenuation artifact',
      rank:(forA.length>agA.length)?1:2,forE:forA,againstE:agA,cite:'cerqueira02'});
  }

  if(axes.phenotype.id==='balanced'||axes.phenotype.id==='microvascular'){
    var forB=[],agB=[];
    forB.push('Global MFR '+axes.flow.value+' with normal relative perfusion');
    if(terr.pattern&&terr.pattern.id==='diffuse') forB.push('Uniform reduction across territories (dispersion '+terr.dispersion+')');
    if(axes.calcium.value>=100) forB.push('CAC '+axes.calcium.value+' confirms an atherosclerotic substrate');
    if(val.penalty>=3) agB.push('Flow quantification is materially confounded \u2014 the reduced MFR may be technical rather than physiologic');
    dx.push({dx:'Balanced ischemia / diffuse atherosclerosis',rank:1,forE:forB,againstE:agB,cite:'ziadi12'});

    var forM=[],agM=[];
    if(axes.calcium.abnormal===false) forM.push('Zero calcium argues against epicardial obstruction');
    if(female) forM.push('Female sex \u2014 higher prevalence of microvascular dysfunction');
    if(!forM.length) agM.push('No positive discriminator for a microvascular over an epicardial mechanism in this dataset');
    if(axes.calcium.value>=400) agM.push('Extensive calcium favors epicardial disease');
    dx.push({dx:'Coronary microvascular dysfunction (INOCA)',rank:2,forE:forM,againstE:agM,cite:'taqueti18'});
  }

  if(val.penalty>=3){
    dx.push({dx:'Technically invalid flow quantification',rank:1,
      forE:val.items.filter(function(i){return i.flag==='high';}).map(function(i){return i.k+': '+i.v;}),
      againstE:[],cite:'asnc16'});
  }

  var o=S.onco||{};
  if(o.rt&&(o.rtSide==='left'||o.rtSide==='mediastinal')&&anyDefect){
    var forR=[],agR=[];
    if(antDefect) forR.push('LAD-territory abnormality with the LAD within a '+o.rtSide+' treatment field');
    if(o.rtDate) forR.push('Radiotherapy dated '+o.rtDate);
    if(axes.calcium.abnormal===false) forR.push('Absent calcium despite defect \u2014 radiation-associated disease can be fibrotic rather than calcified');
    if(!antDefect) agR.push('Abnormality does not involve the in-field territory');
    dx.push({dx:'Radiation-associated coronary disease',rank:antDefect?1:3,forE:forR,againstE:agR,cite:'darby13'});
  }
  if(o.anthra||o.her2){
    var efNow=num(S.ef&&S.ef.rest);
    if(efNow!=null&&efNow<50&&!anyDefect) dx.push({dx:'Cancer-therapy-related cardiac dysfunction',rank:1,
      forE:['Reduced LVEF '+efNow+'% without regional perfusion abnormality','Documented cardiotoxic exposure'],
      againstE:[],cite:'plana14'});
  }

  dx.sort(function(a,b){ return a.rank-b.rank; });
  return dx;
}

/* ============================================================
   DOMAIN 8 — SENSITIVITY / COUNTERFACTUAL
   Which input drives the conclusion, and what value flips it.
   ============================================================ */
function sensitivityDomain(S,axes,val){
  var out=[];
  var mfr=axes.flow.value;
  if(mfr!=null){
    var dist=null,target=null;
    if(mfr<1.5){ target=1.5; dist=r2(1.5-mfr); }
    else if(mfr<2.0){ target=2.0; dist=r2(2.0-mfr); }
    else { target=2.0; dist=r2(mfr-2.0); }
    out.push({driver:'Global MFR',value:mfr,
      note:'The flow-axis classification rests on a global MFR of '+mfr+'. It would change at '+target+
           ' \u2014 a difference of '+dist+'. '+
           (dist<0.2?'That margin is within the test-retest repeatability of PET flow quantification, so this classification should be treated as provisional.'
                    :'That margin exceeds typical test-retest variability, so the classification is reasonably robust.'),
      fragile:(dist<0.2),cite:'kitkungvan17'});
    function band(v){ return v==null?null:(v<1.5?'severe':(v<2.0?'reduced':'normal')); }
    if(val.mfrCorrected!=null&&band(val.mfrCorrected)!==band(mfr))
      out.push({driver:'Resting hemodynamics',value:val.mfrCorrected,
        note:'RPP correction moves global MFR from '+mfr+' to '+val.mfrCorrected+
             ', which crosses a classification boundary. The category is partly a statement about resting workload rather than coronary physiology.',
        fragile:true,cite:'czernin93'});
  }
  var sss=axes.sss, bounds=[[4,'normal/mild'],[9,'mild/moderate'],[14,'moderate/severe']];
  bounds.forEach(function(b){ if(Math.abs(sss-b[0])<=1)
    out.push({driver:'Summed stress score',value:sss,
      note:'SSS of '+sss+' sits within one point of the '+b[1]+' boundary at '+b[0]+
           '. A single segment scored one level differently would move the category.',
      fragile:true,cite:'hacha98'}); });
  var isch=axes.ischemicPct;
  if(isch!=null&&Math.abs(isch-10)<=3)
    out.push({driver:'Ischemic myocardium',value:isch+'%',
      note:'At '+isch+'% the burden sits close to the 10% threshold used to frame revascularization discussions. '+
           'Given the mass weighting, one or two segments determine which side of the threshold this falls on.',
      fragile:true,cite:'hacha03'});
  var er=num(S.ef&&S.ef.rest);
  if(er!=null&&Math.abs(er-50)<=3)
    out.push({driver:'Rest LVEF',value:er+'%',
      note:'LVEF of '+er+'% is adjacent to the 50% threshold used in CTRCD definitions; inter-modality variability alone spans this margin.',
      fragile:true,cite:'plana14'});
  return out;
}

/* ============================================================
   DOMAIN 9 — RECOMMENDATIONS (decision support)
   verdict + inputs + threshold + citation + confidence, always.
   ============================================================ */
function recsDomain(S,axes,terr,fx,val,onc,risk){
  var R=[];
  function rec(o){ R.push(o); }

  if(val.confidence===CONF.LOW)
    rec({verdict:'Interpret flow quantification with caution; consider repeat under controlled conditions',
      priority:'high',
      inputs:val.items.filter(function(i){return i.flag==='high';}).map(function(i){return i.k+': '+i.v;}),
      threshold:'Any identified vasodilator-response confounder',
      cite:'asnc16',confidence:CONF.HIGH,
      rationale:'Reduced MFR cannot be attributed to coronary physiology when the vasodilator response itself is compromised. A falsely low MFR is indistinguishable from disease on the data alone.'});

  if(axes.phenotype.id==='balanced')
    rec({verdict:'Do not report this study as normal on relative perfusion alone',
      priority:'high',
      inputs:['Relative perfusion normal (SSS '+axes.sss+')','Global MFR '+axes.flow.value],
      threshold:'Global MFR <2.0 with normal relative perfusion',
      cite:'ziadi12',confidence:(val.confidence===CONF.LOW?CONF.LOW:CONF.HIGH),
      rationale:'Balanced reduction leaves no normal reference territory, so the polar map appears normal while flow reserve is globally impaired. This is the specific failure mode that absolute flow quantification exists to prevent.'});

  if(axes.flow.value!=null&&axes.flow.value<1.5&&val.confidence!==CONF.LOW)
    rec({verdict:'Consider evaluation for left main or three-vessel disease',
      priority:'high',
      inputs:['Global MFR '+axes.flow.value].concat(fx.highRisk||[]),
      threshold:'Global MFR <1.5',
      cite:'murthy11',confidence:CONF.MOD,
      rationale:'Global MFR below 1.5 carries the highest event rates in PET flow cohorts and is associated with severe multivessel or left main disease even where relative perfusion understates it.'});

  if(axes.ischemicPct!=null&&axes.ischemicPct>=10)
    rec({verdict:'Ischemic burden meets the threshold for a revascularization discussion',
      priority:'high',
      inputs:['Ischemic myocardium '+axes.ischemicPct+'%','SDS '+axes.sds],
      threshold:'>=10% ischemic myocardium',
      cite:'hacha03',confidence:CONF.MOD,
      rationale:'Observational data associated revascularization with survival benefit above roughly 10% ischemic mass. ISCHEMIA subsequently found no reduction in ischemic cardiovascular events from a routine invasive strategy in stable disease, with angina relief favoring it. The threshold identifies a patient for shared decision-making, not for automatic referral.'});

  var defectOnly=terr.rows.filter(function(r){return r.concordance.id==='defect-only';});
  if(defectOnly.length)
    rec({verdict:'Review '+defectOnly.map(function(r){return r.terr;}).join(', ')+' defect against the uncorrected images before accepting it as anatomic',
      priority:'moderate',
      inputs:defectOnly.map(function(r){return r.terr+': defect present, MFR '+(r.mfr||'\u2014');}),
      threshold:'Relative defect without concordant territorial flow reduction',
      cite:'cerqueira02',confidence:CONF.MOD,
      rationale:'A defect unsupported by regional flow is more likely attenuation or a small fixed scar than flow-limiting stenosis.'});

  if(axes.phenotype.territorialCaveat)
    rec({verdict:'Do not rely on the global flow average alone \u2014 inspect territorial flow',
      priority:'high',
      inputs:['Global MFR '+axes.flow.value].concat(terr.rows.filter(function(r){return r.mfr!=null;})
