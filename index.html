/* qualitative BMI descriptor (professional wording) */
function bmiInfo(){
  var kg=num(S.pt.weightKg), cm=num(S.pt.heightCm);
  if(kg==null||cm==null||cm<=0) return null;
  var bmi=kg/Math.pow(cm/100,2);
  var word = bmi<18.5?"underweight body habitus"
           : bmi<25?"normal body habitus"
           : bmi<30?"overweight body habitus"
           : bmi<35?"class I obesity"
           : bmi<40?"class II obesity"
           : "class III (severe) obesity";
  return {bmi:bmi, word:word};
}

/* Predict the non-AC (uncorrected) appearance from the AC (true) findings + habitus + artifacts. */
/* Non-AC reading perspective: what you SEE on the uncorrected images before looking at AC.
   Returns {apparent:[{wall,region,text,artifact:bool}], hasArtifact, hasTrue}.
   True defects (present on AC) AND attenuation artifacts both appear as apparent defects here. */
function readNonAC(defects){
  var b=bmiInfo(); var highBMI=b && b.bmi>=30;
  var female=S.pt.sex==="female";
  var trueWalls={};
  (defects||[]).forEach(function(df){ (df.walls||[]).forEach(function(w){ trueWalls[w]=(df.severity||"a"); }); });
  // only predict attenuation artifacts once the study has real data (any segment scored,
  // any explicit artifact flagged, or a true defect present) — not on a blank worksheet
  var anyScored=false; for(var seg=1;seg<=17;seg++){ if((S.stress[seg]||0)>0||(S.rest[seg]||0)>0){anyScored=true;break;} }
  var anyArtifact=Object.keys(S.artifact||{}).some(function(k){return S.artifact[k];});
  var predict = anyScored || anyArtifact || (defects&&defects.length>0);
  var apparent=[]; var artifactWalls={};
  if(predict){
    if(S.artifact.diaphragm || (!female) || highBMI){
      if(!trueWalls.inferior){ apparent.push({wall:"inferior",region:"inferior wall",artifact:true,
        extent:"large",severity:"moderate",   /* characteristic appearance, not measured */
        cause:"diaphragmatic attenuation"}); artifactWalls.inferior=1; }
    }
    if(S.artifact.breast || female){
      if(!trueWalls.anterior && !trueWalls.septal){ apparent.push({wall:"anterior",region:"anterior/anteroseptal wall",artifact:true,
        extent:"medium",severity:"mild",
        cause:"breast/soft-tissue attenuation"}); artifactWalls.anterior=1; }
    }
    if(highBMI && !S.artifact.diaphragm && female && !apparent.length){
      apparent.push({wall:"inferolateral",region:"inferolateral wall",artifact:true,
        extent:"medium",severity:"mild",cause:"soft-tissue attenuation"});
    }
    if(S.artifact.subdia && !trueWalls.inferior){
      apparent.push({wall:"inferior",region:"inferior wall",artifact:true,
        extent:"medium",severity:"moderate",cause:"subdiaphragmatic tracer activity"});
    }
  }
  // true defects always show on non-AC
  (defects||[]).forEach(function(df){
    /* Apical thinning is a normal variant, not a scar. When the reader has
       flagged it and the finding is a mild fixed apical one, report it as
       thinning rather than letting it read as an infarct. */
    if(S.artifact&&S.artifact.apical&&(df.maxScore||0)<=1&&
       (df.segs||[]).every(function(x){ return x===17; })){
      apparent.push({wall:"apical",region:"apex",artifact:true,
        extent:df.extent,severity:df.severity,cause:"apical thinning, a normal variant"});
      return;
    }
    var region=(df.region||df.terr||"").replace(/^the\s+/i,"");
    apparent.push({wall:(df.walls&&df.walls[0])||"",region:region,artifact:false,segs:df.segs,
      extent:df.extent,severity:df.severity,reversibility:df.reversibility,terr:df.terr,pct:df.pct});
  });
  return {apparent:apparent, hasArtifact:apparent.some(function(a){return a.artifact;}), hasTrue:apparent.some(function(a){return !a.artifact;}), hasData:predict};
}

/* ============ READ-OUT CHECKLIST (NUC CARD worksheet) ============
   The department's read-out walks 14 categories in 4DM display order.
   The read-out summary below follows that order and that vocabulary so the
   generated text maps one-to-one onto the paper worksheet. Non-AC before AC
   is preserved exactly as previously specified \u2014 it is category 2, AC is 3.
   The signed report body is unaffected by anything here.
   ================================================================ */
var RO_CATEGORIES = [
  [1,"Technical quality"],[2,"Non-AC images"],[3,"AC images"],[4,"LV size"],
  [5,"Wall motion"],[6,"LV function / EF"],[7,"Perfusion pattern"],[8,"Polar map gradient"],
  [9,"Summed scores"],[10,"MBF"],[11,"MFR"],[12,"Coronary calcium"],
  [13,"Overall impression"],[14,"Artifact considerations"]
];
var TECH_QUALITY=[["","\u2014"],["adequate","Adequate"],["suboptimal","Suboptimal"],["poor","Poor"]];
var LV_SIZE=[["","\u2014"],["normal","Normal"],["mild","Mildly enlarged"],
             ["moderate","Moderately enlarged"],["severe","Severely enlarged"]];
var IMP_CATEGORY=[["","\u2014"],["normal","Normal"],["essNormal","Essentially normal"],
  ["mildAbn","Mild abnormality"],["ischemia","Ischemia"],["infarction","Infarction"],
  ["mixed","Mixed"],["microvascular","Microvascular"]];
var IMP_VESSELS=["LAD","LCX","RCA","LM"];
var CONCORDANCE=[["","\u2014"],["concur","Concur \u2014 no change"],
                 ["minor","Minor amendment"],["major","Major amendment"]];

/* worksheet scoring reference */
function ssBand(v){ return v<4?"normal":(v<=8?"mild":(v<=13?"moderate":"severe")); }
function sdsBand(v){ return v<=1?"none":(v<=4?"mild":(v<=6?"moderate":"severe")); }
function cacBand(v){ return v===0?"none":(v<=10?"minimal":(v<=100?"mild":(v<=400?"moderate":"severe"))); }
function cap(t){ t=String(t||""); return t.charAt(0).toUpperCase()+t.slice(1); }



/* The indication already states the symptom; making the reader restate it in a
   second control is redundant. Derived until they choose explicitly. */
function derivedSymptom(){
  var ind=(S.pt&&S.pt.ind)||{};
  if(ind.cp) return (S.pt.cpType==="atypical")?"atypical":"typical";
  if(ind.dyspnea) return "dyspnea";
  if(ind.symptomaticCAD) return "typical";
  if(ind.arrhythmia||ind.abnEKG||S.pt.preop) return "nonanginal";
  return "";
}
function effectiveSymptom(){
  if(S.bayes && S.bayes.symptomManual) return S.bayes.symptom||"";
  return derivedSymptom();
}

function nameInput(path){
  var inp=el("input",{type:"text",value:getPath(path)||"",
    oninput:function(e){ setPath(path,e.target.value); syncName(); clearProv(path);
      scheduleReport(); refreshReadout(); }});
  if(getProv(path)) inp.className="prov";
  return inp;
}
function dobInput(){
  var inp=el("input",{type:"date",value:S.pt.dob||"",
    title:"Age is derived from this and the study date, so the read-out reports the age at the time of imaging.",
    onchange:function(e){ S.pt.dob=e.target.value; syncAge(); clearProv("pt.dob");
      markDirty(); renderWorksheet(); scheduleReport(); refreshReadout(); }});
  if(getProv("pt.dob")) inp.className="prov";
  return inp;
}
/* Age is shown, not typed, whenever a date of birth exists \u2014 two fields that
   can disagree is a defect waiting to happen. */
function ageDerived(){
  var derived=ageFromDob(S.pt.dob, S.rx&&S.rx.studyDate);
  if(derived!=null){
    return el("div",{class:"age-derived",title:"Derived from date of birth and study date."},[String(derived)]);
  }
  return ageField();
}

/* ---------- name and age derivation ----------
   pt.name is kept as the composed "Last, First" because the export, the
   communication draft and any saved study reference it. First/last are the
   source of truth; name is derived, never typed. */
function composeName(){
  var f=(S.pt.firstName||"").trim(), l=(S.pt.lastName||"").trim();
  if(f&&l) return l+", "+f;
  return l||f||"";
}
function displayName(){
  var f=(S.pt.firstName||"").trim(), l=(S.pt.lastName||"").trim();
  if(f&&l) return f+" "+l;
  return f||l||"";
}
function syncName(){ S.pt.name=composeName(); }

/* Age from date of birth, relative to the study date where one exists so a
   study read months later still reports the age at the time of imaging. */
/* ageFromDob is defined once, below, alongside the other patient-field helpers. */
function effectiveAge(){
  var d=ageFromDob(S.pt.dob, S.rx&&S.rx.studyDate);
  if(d!=null) return String(d);
  return S.pt.age||"";
}
function syncAge(){
  var d=ageFromDob(S.pt.dob, S.rx&&S.rx.studyDate);
  if(d!=null) S.pt.age=String(d);
}


function generateReadout(){
  var p=pronoun(), L=[];
  var age=effectiveAge();
  var sexWord=S.pt.sex==="female"?"female":(S.pt.sex==="male"?"male":"patient");
  /* Full prose rather than "64M White": the read-out is spoken aloud. */
  var raceLabel="";
  if(S.pt.mesaRace){ var ro=RACE_OPTS.filter(function(o){return o[0]===S.pt.mesaRace;})[0]; if(ro) raceLabel=ro[1].split(" / ")[0]; }
  /* "Multiracial" is a descriptor rather than a proper noun, so it is not
     capitalized mid-sentence the way White or Chinese are. */
  if(/^multiracial$/i.test(raceLabel)) raceLabel="multiracial";
  var descBits=[];
  if(age) descBits.push(age+" y.o.");
  if(S.pt.hispanic==="yes") descBits.push("Hispanic/Latino");
  if(raceLabel) descBits.push(raceLabel);
  descBits.push(sexWord);
  var who=displayName();
  var hasDesc = !!(age||raceLabel||S.pt.sex);
  var lead = who ? (who+" is a "+descBits.join(" "))
                 : (hasDesc ? ("A "+descBits.join(" ")) : "");
  if(S.pt.dx) lead+=" with "+S.pt.dx;
  var refr = S.pt.referrer ? (" referred by "+S.pt.referrer) : "";
  var indPhrases=[];
  var ind=S.pt.ind||{};
  if(ind.cp) indPhrases.push((S.pt.cpType==="atypical"?"atypical":"typical")+" chest pain");
  if(ind.symptomaticCAD) indPhrases.push("known symptomatic CAD");
  if(ind.dyspnea) indPhrases.push("dyspnea on exertion");
  if(ind.postMI) indPhrases.push("post-MI evaluation");
  if(ind.postRevasc) indPhrases.push("post-revascularization symptoms");
  if(ind.newLVSD) indPhrases.push("new LV systolic dysfunction");
  if(ind.arrhythmia) indPhrases.push("arrhythmia/syncope");
  if(ind.abnEKG) indPhrases.push("an abnormal resting ECG");
  if(ind.priorTest) indPhrases.push("equivocal prior testing");
  if(ind.microvasc) indPhrases.push("suspected microvascular disease");
  var indP = indPhrases.length? (" for "+joinList(indPhrases)) : "";
  var preop = S.pt.preop ? (indPhrases.length?", also for preoperative risk assessment":" for preoperative risk assessment") : "";
  var b=bmiInfo();
  var bmiP="";
  if(b){
    var noArticle=/obesity/.test(b.word); // "class II obesity" takes no article
    var art = noArticle ? "" : (/^[aeiou]/i.test(b.word)?"an ":"a ");
    var bmiShown = (b.bmi>=10 && b.bmi<=100) ? " with a BMI of "+b.bmi.toFixed(1) : "";
    bmiP = " "+p.s+" has "+art+b.word+bmiShown+".";
  }
  /* One paragraph: who the patient is, their habitus, their history and the
     probability that follows from all of it. Four separate lines read as a
     database record; spoken, this is a single breath. */
  var opening=[];
  var leadLine=(lead+refr+indP+preop).trim();
  /* the habitus belongs with the history, not with the referral */
  if(leadLine) opening.push(leadLine+".");
  if(bmiP) opening.push(bmiP.trim());


  /* An unknown key in S.hx (legacy save, hand-edited JSON, or a key added by
     another module) previously threw here and took the entire read-out down. */
  var hxList=Object.keys(S.hx).filter(function(k){return S.hx[k]&&HX[k];}).map(function(k){return HX[k].sent||HX[k].chip;});
  /* S.meds also carries "_other" (free text), which is not a MEDS key. Filtering
     on the registry rather than on truthiness keeps any future non-drug key from
     taking the whole read-out down. */
  var medList=Object.keys(S.meds).filter(function(k){return S.meds[k]&&MEDS[k];}).map(function(k){return MEDS[k].toLowerCase();});
  var dmList=Object.keys(S.dmMeds||{}).filter(function(k){return S.dmMeds[k]&&DM_MEDS[k];}).map(function(k){return DM_MEDS[k].toLowerCase();});
  var otherMeds = (S.meds._other||"").trim();
  var allMeds=medList.concat(dmList); if(otherMeds) allMeds.push(otherMeds);
  if(hxList.length||allMeds.length){
    var hxSentence = p.s+" has a history of "+(hxList.length?joinList(hxList):"no significant cardiac history");
    if(allMeds.length) hxSentence += ", for which "+p.s.toLowerCase()+" is on "+joinList(allMeds);
    opening.push(hxSentence+".");
  }

  /* The cardiologist wants to know what kind of patient this is before hearing
     what the images showed, and this is the one number that says it. It follows
     the history because it summarises the patient the history just described.
     The symptom word is the table's own category, not a paraphrase. */
  var ptpNow=S.bayes&&S.bayes.ptpOverride ? String(S.bayes.ptpOverride).trim() : ptpFromTable();
  if(ptpNow){
    var symWord={typical:"typical angina",atypical:"atypical angina",
                 nonanginal:"non-anginal symptoms",dyspnea:"dyspnea"}[effectiveSymptom()]||"";
    opening.push(p.p.charAt(0).toUpperCase()+p.p.slice(1)+" pre-test probability of coronary disease is "+ptpNow+"%"+
      (S.bayes&&S.bayes.ptpOverride ? " (entered)" :
        (symWord? " based on age, sex and "+symWord : " based on age and sex"))+".");
  }
  /* Who the patient is and why they were sent stands on its own; the habitus,
     the history and the probability that follows from them are a second breath. */
  if(opening.length){
    L.push(opening[0]);
    if(opening.length>1){ L.push(""); L.push(opening.slice(1).join(" ")); }
  }

  /* The stress response is described in its own paragraph immediately before
     the findings — see stressParagraph(). It used to be a symptom sentence up
     here, which said nothing about how the patient actually responded. */

  /* Non-echo priors read as one sentence with their dates, not a list of
     "He had a X." sentences. Echo keeps its own sentence because it carries
     findings and an EF. */
  /* One sentence for every prior study, not one sentence each. The echo carries
     more (a date, an EF, findings) so it goes last, where the extra clause has
     somewhere to sit. */
  var PRIORS=[];
  var otherPriors=(S.correlation||[]).filter(function(c){ return c.mod!=="echo"; });
  if(otherPriors.length){
    var bits=otherPriors.map(function(c){
      var base=CORREL[c.mod];
      if(!base) return null;                       /* unknown modality: skip, never print "undefined" */
      var nm=base+(c.mod==="other"&&c.otherName?(" ("+c.otherName+")"):"");
      /* a prior that found something says what it found */
      var CF=CORREL_FINDINGS[c.mod]||{};
      var fnd=Object.keys(c.findings||{}).filter(function(k){return c.findings[k]&&CF[k];})
               .map(function(k){return CF[k];});
      return nm+(c.date?(" on "+fmtDate(c.date)):"")+(fnd.length?(" showing "+joinList(fnd)):"");
    }).filter(Boolean);
    if(bits.length) PRIORS.push(joinList(bits));
  }
  (S.correlation||[]).filter(function(c){ return c.mod==="echo"; }).forEach(function(c){
    if(c.mod==="echo"){
      var et=(c.echoType==="tee"?"TEE":"TTE");
      var ef=S.ef.rest?(" with an EF of "+S.ef.rest+"%"):"";
      var findings=Object.keys(c.echoFindings||{}).filter(function(f){return c.echoFindings[f];}).map(function(f){return ECHO_FINDINGS[f];});
      var fnd=findings.length?(" showing "+joinList(findings)):"";
      PRIORS.push(et+(c.date?(" on "+fmtDate(c.date)):"")+ef+fnd);
    }
  });
  if(PRIORS.length){ L.push(""); L.push(p.s+" had a "+joinList(PRIORS)+"."); }

  L.push("");

  var xl=buildXl();
  var nac=readNonAC(xl.defects||[]);

  /* ---------- FINDINGS AS NARRATIVE ----------
     Spoken at read-out, so it is written as prose rather than labeled lines.
     Order: technical quality, LV size, non-AC, AC, gated, flow, calcium.
     Non-AC before AC is preserved as previously specified.
     Deliberately omitted per department: percent of LV, EF reserve. ---------- */
  /* A blank worksheet must not read as a normal study. The defaults exist to
     save clicks on a real study, not to assert findings on an empty one, so the
     findings narrative is withheld until something has actually been entered. */
  var hasImaging=(function(){
    for(var i=1;i<=17;i++){ if((num(S.stress[i])||0)>0||(num(S.rest[i])||0)>0) return true; }
    if(num(S.ef&&S.ef.rest)!=null||num(S.ef&&S.ef.stress)!=null) return true;
    if(["LM","LAD","LCX","RCA"].some(function(k){ return num(S.calcium[k])!=null; })) return true;
    if(["LAD","LCX","RCA","Global"].some(function(t){
      var f=S.flow[t]||{}; return num(f.stress)!=null||num(f.rest)!=null; })) return true;
    if(num(S.esvRest)!=null||num(S.edvRest)!=null||num(S.massRest)!=null) return true;
    return false;
  })();
  if(!hasImaging){
    L.push("");
    L.push("No imaging data entered yet.");
    return L.join("\n").replace(/\n{3,}/g,"\n\n").trim();
  }

  var para=[];
  function sizeSev(a){
    var bits=[];
    if(a.extent)  bits.push(a.extent);
    if(a.severity)bits.push(a.severity);
    return bits.join(", ");
  }
  function defectPhrase(a,withArticle){
    var ss=sizeSev(a);
    var core=(ss?ss+" ":"")+"defect in the "+a.region;
    if(!withArticle) return core;
    return (/^[aeiou]/i.test(ss||"defect")?"an ":"a ")+core;
  }

  /* the stress test comes before the images: it is what the images are of */
  var stressPara=stressParagraph();
  if(stressPara){ para.push(stressPara); para.push(""); }

  /* technical quality */
  var techFlags=[];
  if(S.tech.motionArtifact) techFlags.push("motion artifact");
  if(S.tech.poorCounts) techFlags.push("poor counts");
  /* Said as one line, in the tense of someone describing what came up. */
  var head="On our study, the technical quality was "+(S.tech.quality||"adequate")+
    (techFlags.length?(" with "+joinList(techFlags)):"")+".";
  if(S.lvSize){
    var szw=(LV_SIZE.filter(function(o){return o[0]===S.lvSize;})[0]||["",""])[1].toLowerCase();
    head+=" LV size appears "+szw+".";
  }
  para.push(head);

  /* ---------- THE PERFUSION READ-OUT ----------
     Spoken while the images are on the screen, in the order they appear.

     Non-AC is displayed first, stress and rest together. What can be concluded
     from that pair alone is real and worth saying out loud:
       · a defect that FILLS IN at rest is not attenuation — attenuation does
         not move between stress and rest;
       · a defect present at BOTH stress and rest is scar or attenuation, and
         which one is the question attenuation correction exists to answer.
     AC is displayed second. There the artifact resolves, the true defect
     persists, and only then does rest decide ischemia against infarct.

     The two comparisons are never merged: non-AC -> AC asks "was it real?",
     stress -> rest asks "is it viable?". A sentence that answers both at once
     ("on AC the defect corrects, consistent with ischemia") is wrong twice. */

  /* The polar map's segment list is not what a reader says while looking at the
     images. viewRegion() turns it into the anatomy of the projections, and the
     segments stay underneath for the report and the engines. */
  function rgn(a2){
    var v=a2.segs?viewRegion(a2.segs):null;
    return v?v.region:a2.region.replace(/^the\s+/i,"");
  }
  function bestView(a2){
    var v=a2.segs?viewRegion(a2.segs):null;
    if(v) return v.view;
    /* predicted artifacts carry a wall name rather than segments */
    if(/inferior|anterior/i.test(a2.wall||a2.region)) return "the VLA";
    if(/septal|lateral/i.test(a2.wall||a2.region)) return "the HLA";
    return "the short axis";
  }
  function dPhrase(a2, withArticle, withView){
    var ss=sizeSev(a2);
    var r=rgn(a2);
    var core=(ss?ss+" ":"")+"defect "+(r==="apex"?"at the apex":("in the "+r))+
             (withView?(" (best seen on "+bestView(a2)+")"):"");
    if(!withArticle) return core;
    return (/^[aeiou]/i.test(ss||"defect")?"an ":"a ")+core;
  }
  function shortRef(a2){
    var r=rgn(a2);
    if(r==="apex") return "the defect at the apex";
    /* "the inferior wall defect" reads; "the basal to mid anterior and
       anteroseptal walls defect" is a noun pile — a compound region takes
       "the defect in the ...". */
    if(/(and|through|to)/.test(r) || !/wall$/i.test(r)) return "the defect in the "+r;
    return "the "+r+" defect";
  }
  function terrOf(a2){ return a2.terr ? (" in the "+a2.terr+" territory") : ""; }

  var artifacts = nac.apparent.filter(function(x){ return x.artifact; });
  var real      = nac.apparent.filter(function(x){ return !x.artifact; });

  /* A true defect is graded from the AC stress map, so every one of them is
     visible on the non-AC stress images too — brighter, if anything, because
     the attenuation is still there. */
  var restPersist = real.filter(function(x){ return x.reversibility==="fixed" || x.reversibility==="partial" || x.reversibility==="reverse"; });
  var restClears  = real.filter(function(x){ return x.reversibility==="full"; });

  /* Walls where attenuation is the competing explanation for a fixed defect. */
  function attenuationProne(w){ return /inferior|anterior|septal|lateral|apical/i.test(w||""); }

  /* ---------- THE TWO IMAGE SETS, AS HEADED SECTIONS ----------
     A read-out walks the views in a fixed order: short axis first, because it
     shows every wall at a level, then the horizontal long axis, then the
     vertical long axis. The defects are listed in that order, one per line, so
     the reader can put each one on the screen as it is spoken. */
  var VIEW_ORDER={"the short axis":0,"the HLA":1,"both long-axis views":2,"the VLA":3};
  function viewRank(x){ var v=VIEW_ORDER[bestView(x)]; return v==null?9:v; }
  function byView(x,y){ return viewRank(x)-viewRank(y); }
  function bullets(list, fn){ return list.map(function(x){ return "  "+fn(x); }).join("\n"); }
  /* Which frames a defect appears on, said the way it is called out. */
  function frames(x){
    if(x.artifact) return "rest + stress";
    if(x.reversibility==="full") return "stress only";
    if(x.reversibility==="partial") return "stress, partly at rest";
    if(x.reversibility==="reverse") return "rest > stress";
    return "rest + stress";
  }
  /* "large, moderate defect, inferior wall, best on VLA, rest + stress" */
  function callOut(x){
    var r=rgn(x), ss=sizeSev(x);
    return [(ss?ss+" defect":"defect"), (r==="apex"?"apex":r), "best on "+bestView(x).replace(/^the /,""), frames(x)]
      .join(", ");
  }
  function plural(n,one,many){ return n===1?one:many; }

  var stressAll = artifacts.concat(real).sort(byView);
  var realV     = real.slice().sort(byView);

  /* ---------- non-AC: what is on the screen ----------
     Called out, not narrated: grade, region, the view that shows it, and which
     frames it appears on. The frames belong on the line because that is the
     fact the next sentence turns on. */
  if(!nac.hasData){
    para.push("On non-AC images: no perfusion defect on stress or rest.");
  } else if(!stressAll.length){
    para.push("On non-AC images: no perfusion defect.");
  } else {
    para.push("On non-AC images, there is\u2026\n"+bullets(stressAll,callOut));

    /* What the pair alone already settles. A defect that fills in at rest is
       not attenuation; one on both frames is the question AC answers. */
    /* Every call-out line above already ends in "stress only" or "rest + stress",
       so naming the defects again here bought nothing and cost 85 words on a
       three-defect study. The conclusion states the rule the frames imply. */
    var both=artifacts.concat(restPersist), clears=restClears, note=[];
    if(clears.length)
      note.push("Anything reversing at rest is not attenuation.");
    if(both.length)
      /* "What is on both ..., which could be" is a relative clause with nothing
         to attach to. It also ended by announcing the answer; it should end by
         saying where the answer comes from. */
      note.push((clears.length?"What is on both stress and rest":"These are on both stress and rest and")+
        " could be scar or attenuation, so we will move on to the AC images.");
    if(note.length) para.push(note.join(" "));
  }

  /* ---------- AC: what changed ---------- */
  var acLines=[];
  if(artifacts.length){
    var byCause={};
    artifacts.forEach(function(x){ (byCause[x.cause]=byCause[x.cause]||[]).push(x); });
    Object.keys(byCause).forEach(function(cz){
      byCause[cz].forEach(function(x){
        acLines.push("resolution of "+shortRef(x)+", consistent with "+cz);
      });
    });
  }
  if(realV.length){
    /* adjectival, so the line stays a call-out rather than becoming a sentence:
       "persistence of the ... defect, anterior wall, reversible at rest" */
    var VERB2={full:"reversible at rest",fixed:"fixed at rest",
               partial:"partly reversible at rest",reverse:"reverse redistribution"};
    var SENSE2={full:"ischemia",fixed:"an infarct",partial:"a mixed defect",reverse:null};
    realV.forEach(function(x){
      var k = x.reversibility==="full" ? "full"
            : x.reversibility==="fixed" ? "fixed"
            : x.reversibility==="reverse" ? "reverse" : "partial";
      var tail = SENSE2[k] ? (", consistent with "+SENSE2[k]+(x.terr?(" in the "+x.terr):"")) : "";
      acLines.push("persistence of the "+(sizeSev(x)?sizeSev(x)+" defect":"defect")+", "+
        (rgn(x)==="apex"?"apex":rgn(x))+", "+VERB2[k]+tail);
    });
  } else {
    acLines.push("no remaining perfusion defects on rest + stress");
  }
  para.push("On AC images, there is\u2026\n"+bullets(acLines,function(x){ return x; }));

  /* summed scores */
  var sssV=0, srsV=0;
  for(var q=1;q<=17;q++){ sssV+=(num(S.stress[q])||0); srsV+=(num(S.rest[q])||0); }
  /* The summed scores are in the report and on the worksheet tally. Nobody says
     "SSS 8, SRS 4, SDS 4" out loud, and the defects have just been described in
     the terms those numbers stand for. */

  /* polar map gradient, only when flagged */
  var gr=S.gradient||{}, grBits=[];
  if(gr.inferiorDip)  grBits.push("an inferior wall dip");
  if(gr.apicalBasal)  grBits.push("an apical-basal gradient");
  if(gr.septal)       grBits.push("a septal defect");
  if(grBits.length) para.push("The polar map shows "+joinList(grBits)+".");

  /* gated imaging */
  var gat=[];
  var mo=S.motion||{}, moAbn=[];
  Object.keys(mo).forEach(function(w){ if(mo[w]&&mo[w]!=="normal") moAbn.push(w+" "+mo[w]); });
  if(Object.keys(mo).filter(function(w){return mo[w];}).length)
    gat.push(moAbn.length ? ("wall motion shows "+joinList(moAbn)) : "wall motion is normal");
  var th=S.thickening||{}, thAbn=[];
  Object.keys(th).forEach(function(w){ if((th[w]||0)>0) thAbn.push(w); });
  if(Object.keys(th).length)
    gat.push(thAbn.length ? ("thickening is reduced in the "+joinList(thAbn))
                          : "thickening is normal in all segments");
  /* function joins the gated paragraph rather than standing alone */
  var efR=num(S.ef.rest), efS=num(S.ef.stress);
  var efValid=function(v){ return v!=null && v>=0 && v<=100; };
  if(efValid(efR)){
    var fw = efR>=50?"normal":(efR>=40?"mildly reduced":(efR>=30?"moderately reduced":"severely reduced"));
    var fs="Function is "+fw+" with an EF of "+efR+" at rest";
    if(efValid(efS)){
      var d=efS-efR;
      var aug = d>=5?"normal augmentation"
              : d>=1?"a slightly blunted augmentation"
              : d>=0?"blunted augmentation"
              : "a fall in EF with stress";
      fs+=" and "+efS+" at stress showing "+aug;
    }
    gat.push(fs.charAt(0).toLowerCase()+fs.slice(1)+(S.tid.present?", with transient ischemic dilatation":""));
  }
  if(gat.length){
    var gtxt=gat.map(function(x,i){ return i===0?x:cap(x); }).join(". ");
    para.push("On gated imaging, "+gtxt+".");
  }

  /* blood flow */
  var g=S.flow.Global||{}, gs=num(g.stress), gmr=(num(g.stress)!=null&&num(g.rest)!=null&&num(g.rest)>0)?(num(g.stress)/num(g.rest)):null;
  var lowT=[];
  ["LAD","LCX","RCA"].forEach(function(t){
    var f=S.flow[t]||{}, fs2=num(f.stress), fr2=num(f.rest);
    var m2=(fs2!=null&&fr2!=null&&fr2>0)?(fs2/fr2):null;
    if(m2!=null&&m2<1.75) lowT.push({t:t,m:m2});
  });
  /* "preserved in all territories" is a statement about absolute flow, not
     reserve — a territory can have normal MBF and reduced reserve. */
  var lowMBF=[];
  ["LAD","LCX","RCA"].forEach(function(t){
    var f=S.flow[t]||{}, v=num(f.stress);
    if(v!=null&&v<1.8) lowMBF.push(t);
  });
  var flowSent=[];
  if(gs!=null){
    if(lowMBF.length){
      var okT=["LAD","LCX","RCA"].filter(function(t){ return lowMBF.indexOf(t)<0; });
      flowSent.push("Blood flow is reduced in the "+joinList(lowMBF)+
        (okT.length?(" and preserved in the "+joinList(okT)):"")+
        ", with a global blood flow of "+gs.toFixed(2)+".");
    } else {
      flowSent.push("Blood flow is "+(gs<1.8?"reduced":"preserved")+
        " in all territories with a global blood flow of "+gs.toFixed(2)+".");
    }
  }
  if(lowT.length){
    flowSent.push("Flow reserve is relatively reduced in the "+
      joinList(lowT.map(function(x){ return x.t+" territory at "+x.m.toFixed(2); }))+".");
  } else if(gmr!=null&&gmr<1.75){
    flowSent.push("Global flow reserve is reduced at "+gmr.toFixed(2)+".");
  }
  if(flowSent.length) para.push(flowSent.join(" "));

  /* calcium */
  var CVES=["LM","LAD","LCX","RCA"];
  var hasCac=CVES.some(function(k){ return S.calcium[k]!==""&&S.calcium[k]!=null; });
  if(hasCac){
    var cacTot=CVES.reduce(function(a,k){var v=num(S.calcium[k]);return a+(v||0);},0);
    if(cacTot===0){ para.push("There is no coronary calcium."); }
    else {
      var vals=CVES.map(function(k){ return {k:k,v:num(S.calcium[k])||0}; })
                   .filter(function(x){ return x.v>0; })
                   .sort(function(a,b){ return b.v-a.v; });
      var dist="";
      if(vals.length===1) dist=", all of which is in the "+vals[0].k;
      else if(vals.length>1 && vals[0].v/cacTot>=0.5)
        dist=", most of which is in the "+vals[0].k+" ("+vals[0].v+")";
      else if(vals.length>1)
        dist=", distributed as "+joinList(vals.map(function(x){ return x.v+" in the "+x.k; }));
      /* MESA percentile needs a number to mean anything; the Extended tab
         computes it properly, so it is not asserted here. */
      para.push("There is "+cacBand(cacTot)+" calcium with a total Agatston score of "+cacTot+dist+".");
    }
  }

  L.push("");
  para.forEach(function(x){ L.push(x); L.push(""); });

  /* CT findings and artifact considerations are report content, not read-out
     content — the artifact cause is already stated inline in the AC sentence. */

  try{
    var rep=V2.build(xl,{riskCategory:S.opts.riskCategory}).text;
    var impIdx=rep.indexOf("IMPRESSION");
    if(impIdx>=0){
      var imp=rep.slice(impIdx).split("\n").filter(function(l){return /^\d+\./.test(l.trim());});
      if(imp.length){ L.push("");
        /* the "\u2014" placeholder option is a real entry; treat an unset
           category as absent rather than as a label */
        var _ic=effectiveImpression();
        var impCat=_ic?((IMP_CATEGORY.filter(function(o){return o[0]===_ic;})[0]||["",""])[1]):"";
        var _ev=effectiveVessels();
        /* A vessel in parentheses qualifies an ABNORMALITY. On a normal study it
           reads as a contradiction — "Normal (RCA)" — so it is withheld. */
        var _normalCat=(_ic==="normal"||_ic==="essNormal");
        var vess=_normalCat?[]:IMP_VESSELS.filter(function(v){return _ev[v];});
        /* The category and the vessel list restate in a label what the points
           below say properly, and "Mixed (LAD, RCA)" is read twice. */
        L.push("The overall impression is\u2026");
        /* Point 6 (risk category) is rewritten here for the read-out only.
           The certified report body is unchanged — see the handoff note. */
        var _rv=null;
        try{
          if(window.RevascEngine&&window.Comprehensive){
            var _A=window.Comprehensive.assess(S);
            var m=(rep.match(/Overall\s+(\S+(?:-\S+)?)\s+risk\s+study/i)||[])[1]||null;
            _rv=window.RevascEngine.impressionLine(S,_A,m?(m.toLowerCase()+" risk"):null);
          }
        }catch(e){ _rv=null; }
        /* ---- the read-out's order, not the report's ----
           The certified report numbers: 1 LV size, 2 perfusion, 3 function,
           4 flow, 5 calcium, 6 risk. Spoken, size belongs WITH function, the
           calcium score has already been said, and the management line is a
           suggestion made with cardiology rather than a conclusion reached
           here. So the points are collected, reshaped and re-emitted. */
        var P={};
        imp.forEach(function(l){ var m=l.trim().match(/^(\d)\.\s*(.*)$/); if(m) P[m[1]]=m[2]; });

        function tidy(x){ return (x||"").replace(/\s{2,}/g," ").trim(); }
        function lower1(x){ return x?x.charAt(0).toLowerCase()+x.slice(1):x; }

        /* 1 — perfusion. A defect that fills in is REVERSIBILITY and one that
           does not is IRREVERSIBILITY: at read-out the images are described by
           what they do, and the interpretation follows. Only applied where a
           defect is actually described — "no evidence for stress-induced
           reversibility" would be nonsense. */
        var perf=tidy(P["2"]).replace(/flow reserve below/i,"flow reserve above");
        if(/area of|infarct/i.test(perf)){
          perf=perf.replace(/\bischemia\b/g,"reversibility")
                   .replace(/\binfarct\b/g,"area of irreversibility");
          /* Peri-infarct ischemia is reversible tissue AROUND a scar. It is only
             true when the two sit in the same territory, or when one defect is
             itself partly reversible — said of an infarct in one vessel and
             ischemia in another it would be wrong. */
          var peri=false;
          try{
            var dl=buildXl().defects||[], byT={};
            dl.forEach(function(dd){ (byT[dd.terr]=byT[dd.terr]||[]).push(dd.reversibility); });
            peri=dl.some(function(dd){ return dd.reversibility==="partial"; }) ||
                 Object.keys(byT).some(function(k){
                   return byT[k].indexOf("fixed")>-1 &&
                          (byT[k].indexOf("full")>-1||byT[k].indexOf("partial")>-1); });
          }catch(e){}
          if(peri && !/peri-infarct/i.test(perf))
            perf=perf.replace(/\.$/,"")+", consistent with peri-infarct ischemia.";
        }

        /* 2 — function and size in one line. The ejection fractions are dropped:
           they were said in the gated sentence a few lines above. */
        var fn=tidy(P["3"]).replace(/\s*Stress LVEF[^.]*\.\s*/i,"").replace(/\s*Rest LVEF[^.]*\.\s*/i,"")
                 .replace(/\bglobal LV function\b/i,"global function").replace(/\.$/,"");
        var szRaw=tidy(P["1"]);
        var tid=(szRaw.match(/Transient ischemic dilatation[^.]*\./i)||[])[0]||"";
        var sz=(szRaw.match(/^(.*?)left ventricular size/i)||[])[1]||"";
        sz=lower1(sz.trim());
        if(sz==="normal") sz="normal-sized";
        var fnLine = fn ? (fn+(sz?(" in the "+sz+" LV"):"")+".") : (szRaw||"");
        if(tid) fnLine+=" "+tid;

        /* 4 — calcium, qualitative. The score is in the calcium sentence above. */
        var cac=null; try{ cac=window.Comprehensive.assess(S).axes.calcium.value; }catch(e){}
        var cacLine = cac==null ? tidy(P["5"])
                    : (cac===0 ? "No coronary calcium." : cap(cacBand(cac))+" coronary calcium.");

        /* 5 — management. Offered, not decided: the referring cardiologist owns
           this call, and the read-out should sound like it knows that. */
        var mg = _rv ? _rv.text : tidy(P["6"]);
        if(mg) mg = mg.replace(/^Overall\s+\S+\s+risk study for a hard cardiac event;\s*/i,"");
        /* The hedge belongs on a SUGGESTION. Prefixing a negative statement
           gives "In conjunction with cardiology, no inducible ischemia", which
           is not English and not a recommendation. */
        /* The hedge belongs on anything that RECOMMENDS \u2014 by verdict or by
           wording. Keying it to the verdict alone left "anatomic evaluation is
           warranted" standing as this app's own decision. */
        var suggests=false;
        try{ var _b=(_rv&&_rv.assessment&&_rv.assessment.benefit)||null;
             suggests=(_b==="likely"||_b==="symptomatic-only"); }catch(e){}
        if(/(warranted|evaluation|consider|referral)/i.test(mg||"")) suggests=true;
        /* The no-benefit branch says its own thing, in the same collaborative
           voice. "Burden ALONE would not identify a benefit" is kept word for
           word: ISCHEMIA showed that burden does not select patients, not that
           no benefit exists. */
        if(/does not identify benefit from revascularization/i.test(mg||""))
          mg = "The ischemic burden alone would not identify a benefit from revascularization; "+
               "in conjunction with cardiology, guideline-directed medical therapy is the evidence-based approach.";
        if(mg && suggests && !/^In conjunction/i.test(mg)){
          /* "is warranted" decides; "may be warranted" offers. The read-out
             suggests and the treating cardiologist decides. */
          mg = mg.replace(/\bis warranted\b/g,"may be warranted")
                 .replace(/\bis indicated\b/g,"may be indicated");
          mg = "In conjunction with cardiology, "+lower1(mg);
        }

        [perf, fnLine, tidy(P["4"]), cacLine, mg].filter(Boolean).forEach(function(x,ix){
          L.push("  "+(ix+1)+". "+x);
        });
      }
    }
  }catch(e){}

  return L.join("\n").replace(/\n{3,}/g,"\n\n").trim();
}

function autoGrow(ta){ if(!ta)return; ta.style.height="auto"; ta.style.height=(ta.scrollHeight+4)+"px"; }
function refreshReadout(){
  applyTooltipsAll();
  if(S.readout.edited){ autoGrow($("#readoutText")); return; }
  S.readout.text = generateReadout();
  var ta=$("#readoutText"); if(ta){ ta.value=S.readout.text; autoGrow(ta); }
}

/* ---------- render report ---------- */
function renderReport(){
  var out;
  try{ out = V2.build(buildXl(), {riskCategory:S.opts.riskCategory, recentCaffeine:S.stressData.recentCaffeine}); }
  catch(e){ out = {text:"[report error] "+e.message, v2:{}}; }
  var text = out.text;
  if(S.opts.supplement){ text += "\n\n" + buildSupplement(out); }
  // accession as the very first line (display/copy layer; certified body unchanged)
  if(S.rx.accession){ text = "Accession: "+S.rx.accession+"\n\n" + text; }
  var pre = $("#reportPre"); if(pre) pre.textContent = text;
  window.__lastReport = text;
  renderValidationBanner();
}

function renderValidationBanner(){
  var host = $("#valBanner"); if(!host) return;
  host.innerHTML="";
  var v; try{ v = window.Validation ? window.Validation.validate(S) : {block:[],warn:[]}; }catch(e){ v={block:[],warn:[]}; }
  if(v.block.length){
    host.appendChild(el("div",{class:"banner err"},[
      el("b",null,["\u26a0 "+v.block.length+" impossible value"+(v.block.length>1?"s":"")+" \u2014 the report will read incorrectly until fixed:"]),
      el("ul",{class:"qc-list",style:"margin-top:var(--sp-1);"}, v.block.map(function(b){ return el("li",{class:"err"},[b.msg]); }))
    ]));
  }
  if(v.warn.length){
    host.appendChild(el("div",{class:"banner warn"},[
      el("b",null,[v.warn.length+" value"+(v.warn.length>1?"s":"")+" to verify:"]),
      el("ul",{class:"qc-list",style:"margin-top:var(--sp-1);"}, v.warn.map(function(w){ return el("li",{class:"warn"},[w.msg]); }))
    ]));
  }
}

function buildSupplement(out){
  // tier-labeled quantitative supplement from the ancillary engine
  var lines = ["QUANTITATIVE SUPPLEMENT (not part of the signed report)",""];
  try{
    var a = ANC.analyze ? ANC.analyze(buildXl()) : null;
    if(a && a.supplementLines){ lines = lines.concat(a.supplementLines); }
    else { lines.push("Ischemic myocardium \u2248"+ (out.v2.ischemicMassPct||0).toFixed(1)+"% of LV mass."); }
  }catch(e){ lines.push("[supplement unavailable: "+e.message+"]"); }
  return lines.join("\n");
}

function card(title,hint,bodyKids){

/* ---------- optional cards ----------
   Sections that are needed on every study stay open. Sections that are used on
   SOME studies collapse to their header with a one-line summary of what is
   inside, so the worksheet is short by default and long only where the study
   actually needs it.

   Two rules, both non-negotiable:
     - a card that HAS data is always open, whatever the stored toggle says;
       a collapsed card must never hide a recorded finding.
     - the header states what is inside when collapsed, so the reader can see
       there is nothing to open without opening it.
   ------------------------------------ */
var CARD_OPEN = {};
function optionalCard(key,title,hint,bodyKidsFn,opts){
  opts=opts||{};
  var hasData = !!opts.hasData;
  var open = hasData || CARD_OPEN[key]===true;
  var summary = hasData ? (opts.summary||"") : (opts.emptyText||"none recorded");

  var head=el("header",{class:"card-head-toggle",
      title: open ? "Collapse this section." : "Open this section.",
      onclick:function(){ CARD_OPEN[key]=!open; renderWorksheet(); }},[
    el("span",{class:"card-caret"+(open?" open":"")},[open?"\u2212":"+"]),
    el("span",{class:"t"},[title]),
    hint?el("span",{class:"h"},[hint]):null,
    el("span",{class:"card-summary"+(hasData?" has":"")},[summary])
  ]);
  var kids=[head];
  if(open) kids.push(el("div",{class:"body"},bodyKidsFn()));
  return el("section",{class:"card"+(open?"":" collapsed")},kids);
}
function field(label,inputEl,wcls){ return el("div",{class:"fld"+(wcls?(" "+wcls):"")},[ el("label",null,[label]), inputEl ]); }
function textInput(path,ph){
  var v=getPath(path);
  var inp=el("input",{type:"text",value:v==null?"":v,placeholder:ph||"",
    oninput:function(e){ setPath(path,e.target.value); clearProv(path); scheduleReport(); }});
  if(getProv(path)) inp.className="prov";
  return inp;
}
function numInput(path,ph){ var i=textInput(path,ph); i.setAttribute("inputmode","decimal"); return i; }
/* Integer input bounded to a real-world range. Minutes and seconds above 59 are
   not a value the reader meant to enter. */
function clampInput(path,lo,hi){
  var inp=el("input",{type:"text",inputmode:"numeric",value:getPath(path)||"",
    oninput:function(e){
      var t=String(e.target.value).replace(/[^0-9]/g,"");
      if(t!==""){ var n=parseInt(t,10); if(n>hi)n=hi; if(n<lo)n=lo; t=String(n); }
      e.target.value=t; setPath(path,t); clearProv(path); scheduleReport(); refreshReadout(); }});
  if(getProv(path)) inp.className="prov";
  return inp;
}
function num3(path,ph){
  var v=getPath(path);
  var inp=el("input",{type:"text",value:v==null?"":v,placeholder:ph||"",maxlength:"3",inputmode:"numeric",
    oninput:function(e){ e.target.value=e.target.value.replace(/[^0-9]/g,"").slice(0,3); setPath(path,e.target.value); clearProv(path); scheduleReport(); refreshReadout(); }});

function selectInput(path,opts,onchange){
  var v=getPath(path);
  var s=el("select",{onchange:function(e){ setPath(path,e.target.value); clearProv(path); if(onchange)onchange(e.target.value); scheduleReport(); }});

    s.appendChild(op);
  });
  if(getProv(path)) s.className="prov";
  return s;
}
function getPath(p){ var a=p.split("."),o=S; for(var i=0;i<a.length;i++){ if(o==null)return null; o=o[a[i]]; } return o; }

/* age: auto from DOB when present (greyed, read-only); else editable 3-char */
function ageField(){
  if(S.pt.dob){
    var a=ageFromDob(S.pt.dob);
    if(a!=null){ S.pt.age=a;
      var ro=el("input",{type:"text",value:String(a),maxlength:"3",readonly:"readonly",title:"computed from DOB "+S.pt.dob,class:"ro"});
      return ro;
    }
  }
  var inp=el("input",{type:"text",value:S.pt.age==null?"":S.pt.age,maxlength:"3",inputmode:"numeric",
    oninput:function(e){ setPath("pt.age",e.target.value.replace(/[^0-9]/g,"").slice(0,3)); clearProv("pt.age"); scheduleReport(); refreshReadout(); }});
  if(getProv("pt.age")) inp.className="prov";
  return inp;
}
/* Age relative to the STUDY date when one is supplied, so a study read months
   later still reports the age at the time of imaging. Falls back to today. */
function ageFromDob(dobStr, onDate){
  var m=String(dobStr).match(/(\d{4})-(\d{2})-(\d{2})/); if(!m) return null;
  var dob=new Date(+m[1],+m[2]-1,+m[3]); if(isNaN(dob))return null;
  var ref=new Date();
  if(onDate){
    var r=String(onDate).match(/(\d{4})-(\d{2})-(\d{2})/);
    if(r){ var rd=new Date(+r[1],+r[2]-1,+r[3]); if(!isNaN(rd)) ref=rd; }
  }
  var a=ref.getFullYear()-dob.getFullYear(),md=ref.getMonth()-dob.getMonth();
  if(md<0||(md===0&&ref.getDate()<dob.getDate()))a--; return (a>=0&&a<=120)?a:null;
}

/* compact segmented control (mutually exclusive tabs) */
function segControl(path,opts,onchange){

    return el("button",{class:"segbtn"+(String(v)===String(val)?" on":""),type:"button",
      onclick:function(){ setPath(path,val); clearProv(path); if(onchange)onchange(val); markDirty(); renderWorksheet(); scheduleReport(); refreshReadout(); }},[lab]);
  }));
  return wrap;
}

/* height/weight with unit-system toggle (imperial <-> metric display) */
function heightWeightRow(){
  var imp = S.pt.unitSys!=="metric";
  function hDisplay(){ var cm=num(S.pt.heightCm); if(cm==null)return ""; if(imp){ var ins=cm/2.54; var ft=Math.floor(ins/12); var inch=Math.round(ins-ft*12); return ft+"'"+inch+'"'; } return String(Math.round(cm)); }
  function wDisplay(){ var kg=num(S.pt.weightKg); if(kg==null)return ""; return imp?String(Math.round(kg/0.45359237)):String(Math.round(kg)); }
  var hInp=el("input",{type:"text",value:hDisplay(),placeholder:imp?"5'10\"":"cm",inputmode:"decimal",
    oninput:function(e){ var t=e.target.value.trim();
      if(imp){ var m=t.match(/(\d+)\s*'\s*(\d+)?/); if(m){ var cm=((+m[1])*12+(+(m[2]||0)))*2.54; S.pt.heightCm=Math.round(cm*10)/10; } else { var n=num(t); if(n!=null) S.pt.heightCm=Math.round(n*2.54*10)/10; } }
      else { var n2=num(t); if(n2!=null) S.pt.heightCm=n2; else if(t==="") S.pt.heightCm=""; }
      clearProv("pt.heightCm"); markDirty(); scheduleReport(); }});
  var wInp=el("input",{type:"text",value:wDisplay(),placeholder:imp?"lbs":"kg",inputmode:"decimal",
    oninput:function(e){ var n=num(e.target.value); if(n==null){ if(e.target.value==="")S.pt.weightKg=""; return; }
      S.pt.weightKg = imp? Math.round(n*0.45359237*10)/10 : n; clearProv("pt.weightKg"); markDirty(); scheduleReport(); }});
  if(getProv("pt.heightCm"))hInp.className="prov"; if(getProv("pt.weightKg"))wInp.className="prov";
  /* Units belong on the field, not only in a placeholder that disappears as
     soon as a value is entered. */
  return el("div",{class:"grid-auto",style:"margin-top:var(--sp-2);align-items:end"},[
    /* the unit is on the box, so the label does not repeat it */
    field("Height", withUnit(hInp, imp?"ft \u00b7 in":"cm"), "w-ht"),
    field("Weight", withUnit(wInp, imp?"lbs":"kg"),          "w-wt"),
    field("Units",segControl("pt.unitSys",[["imperial","US"],["metric","Metric"]],
      function(){ renderWorksheet(); }),"w-unit")
  ]);
}
function setPath(p,v){ var a=p.split("."),o=S; for(var i=0;i<a.length-1;i++){ if(o[a[i]]==null)o[a[i]]={}; o=o[a[i]]; } o[a[a.length-1]]=v; markDirty(); }
function getProv(p){ return S._prov && S._prov[p]; }
function clearProv(p){ if(S._prov&&S._prov[p]){ delete S._prov[p]; } }

var _reportTimer=null;
function applyTooltipsAll(){
  try{
    var r=document.getElementById("root")||document.body;
    applyTooltips(r); applyGlossary(r);
  }catch(e){}
}
function scheduleReport(){ if(_reportTimer)clearTimeout(_reportTimer); _reportTimer=setTimeout(function(){ renderReport(); renderExtendedIfVisible(); renderComprehensiveIfVisible(); renderResearchIfVisible(); },120); }

/* ---- chip deck: the common few, then the rest on request ----
   Most cardiac PET studies are captured with a handful of each vocabulary. The
   full list is still one tap away, and three things are never hidden:
   anything already selected, anything imported, and the count of what is left.

   COMMON lists the keys that lead. Order is clinical frequency for this
   service, not alphabetical — edit these lists, not the call sites.
   Open/closed state is UI state: it lives here, not in the study, so it never
   dirties a case or reaches an export. */
var COMMON = {
  /* Correlation: an echo, a cath and a coronary CTA account for nearly every
     comparison a cardiac PET is read against. */
  correl:   ["echo","cath","cta","cmr"],
  /* the findings each modality is usually asked about */
  "corr-cta":  ["obstructive","nonobstructive","highrisk","lm"],
  "corr-cath": ["obstructive","lm","pci","nonobstructive"],
  "corr-cmr":  ["lge","nolge","lvsd","rwma"],
  "corr-ct":   ["calcium","effusion","pleural","aorta"],
  "corr-ctcap":["calcium","effusion","pleural","mets"],
  "corr-cxr":  ["cardiomegaly","edema","pleural","device"],
  "corr-petct":["fdg","sarcoid","nodal"],
  /* Echo: a TTE and a TEE are ordered for different questions, so each leads
     with its own answers. The other modality's findings sort to the tail and
     fall behind the toggle — offered, not hidden, because an unusual study may
     have reported one. */
  "echo-tte": ["lvsd","rwma","diastolic","lvh","mr","as"],
  "echo-tee": ["laa","vegetation","prosthetic","pfo","mr"],
  ind:      ["cp","dyspnea","symptomaticCAD","priorTest","preop"],
  hx:       ["htn","hld","dm","tobacco","fhxcad"],
  meds:     ["aspirin","atorvastatin","metoprolol","lisinopril","amlodipine"],
  dmMeds:   ["metformin","empagliflozin","semaglutide","insulinglargine","glipizide"],
  artifact: ["diaphragm","breast","motion","apical"],
  sympt:    ["chestPain","dyspnea","headache","flushing","dizziness"],
  cardiotox:["anthra","her2","ici","vegf"]
};
var DECK_OPEN = {};
/* A deck only earns a toggle if it actually hides something worth a tap. */
var DECK_MIN_HIDDEN = 3;

function deckOrder(name, keys){
  var lead = COMMON[name] || [];
  var head = lead.filter(function(k){ return keys.indexOf(k) >= 0; });
  return head.concat(keys.filter(function(k){ return head.indexOf(k) < 0; }));
}
/* keys: vocabulary order · isOn(key) · build(key) -> chip node */
function chipDeck(name, keys, isOn, build, opts){
  opts = opts || {};
  var ordered = deckOrder(name, keys);
  var lead = (COMMON[name] || []).filter(function(k){ return keys.indexOf(k) >= 0; }).length
             || opts.lead || 5;
  var open = !!DECK_OPEN[name];
  var shown = [], hidden = [];
  ordered.forEach(function(k, i){
    if(i < lead || isOn(k) || open) shown.push(k); else hidden.push(k);
  });
  var wrap = el("div", {class:"chipgrp"}, shown.map(build));
  if(hidden.length >= DECK_MIN_HIDDEN || (open && ordered.length > lead)){
    var n = hidden.length;
    var btn = el("button", {type:"button", class:"btn sm quiet deck-more",
      "aria-expanded": open ? "true" : "false",
      title: open ? "Hide the less common options" : (opts.moreTip || ("Show the remaining " + n + " options")),
      onclick:function(){ DECK_OPEN[name] = !DECK_OPEN[name]; renderWorksheet(); }},
      [open ? "Show fewer" : ("+" + n + " more")]);
    wrap.appendChild(btn);
  }
  return wrap;
}

function chip(label,on,onclick,cls){

/* ---- menu: one summary, many options ----
   A native <details> gives keyboard (Enter/Space) and touch behavior for free;
   only outside-click and Escape closing are added. Items stay real <button>s
   in the DOM whether the menu is open or not, so tests and the fuzzers reach
   them. An item may carry a hint line, which replaces the hover tooltip on
   touch devices where there is no hover. */
function menu(label,items,opts){
  opts=opts||{};
  var list=el("div",{class:"menu-list",role:"menu"},[]);
  items.forEach(function(it){
    if(it==="sep"){ list.appendChild(el("div",{class:"menu-sep",role:"separator"},[])); return; }
    if(it.head){ list.appendChild(el("div",{class:"menu-head"},[it.head])); return; }
    var b=el("button",{type:"button",class:"menu-item"+(it.cls?" "+it.cls:""),role:"menuitem",
      onclick:function(ev){ var d=b.closest("details"); if(d) d.open=false; it.onclick(ev); }},
      [el("span",{class:"mi-label"},[it.label]), it.hint?el("span",{class:"mi-hint"},[it.hint]):null]);

if(typeof document!=="undefined"&&typeof window!=="undefined"&&!window.__menuWired){
  window.__menuWired=true;

/* ---------- polar map (17-seg bullseye) ---------- */
/* ============ SEGMENT SCORING MODES ============
   Increment (legacy): click = +1. A segment scored 3 costs three clicks, and
   the rest map is scored independently — up to ~35 clicks on a mixed study.
   Paint:  choose a score once, then one click per segment regardless of value.
   Reversibility: score stress, then answer one question per abnormal segment
   — reversible / partial / fixed — and the rest map derives itself. This
   matches how the map is actually read; nobody looks at a rest map and thinks
   "that is a 2", they think "that fills in".
   =============================================== */
var MAPMODE="increment";      // 'increment' | 'paint' | 'reversibility'
var PAINT_LAST=null;      // segment the drag is already on (see mouseenter)
/* A rebuilt map puts a NEW element under a cursor that never moved, and the
   browser fires mouseenter for it. Comparing segment identity catches that only
   when the new element is the same segment — at a wedge boundary, or on a
   platform whose synthetic events arrive in another order, it is the neighbour
   and the study gains a defect nobody drew. So the drag requires evidence of
   an actual pointer movement, which no rebuild can manufacture. */
var PAINT_MOVED=false;
var BRUSH=2;              // value armed by a number key
var BRUSH_ARMED=false;
var PAINTING=false;
var REV_CYCLE=["reversible","partial","fixed"];

function revStateOf(seg){
  var st=+(S.stress[seg]||0), re=+(S.rest[seg]||0);
  if(st<=0) return null;
  if(re<=0) return "reversible";
  if(re>=st) return "fixed";
  return "partial";
}
function applyRev(seg,state){
  var st=+(S.stress[seg]||0);
  if(st<=0){ S.rest[seg]=0; return; }
  if(state==="reversible") S.rest[seg]=0;
  else if(state==="fixed") S.rest[seg]=st;
  else S.rest[seg]=Math.max(1,Math.round(st/2));
}
function cycleRev(seg){
  var cur=revStateOf(seg);
  if(cur==null) return;
  var i=REV_CYCLE.indexOf(cur);
  applyRev(seg, REV_CYCLE[(i+1)%REV_CYCLE.length]);
}
function segCommit(){ markDirty(); refreshMaps(); scheduleReport(); refreshReadout(); }
/* During a drag, rebuilding the whole SVG per segment is wasteful and makes the
   element under the cursor disappear mid-gesture. Repaint the one shape in place
   and defer the full refresh to mouseup. */
function segPaintLive(node,segNo,score){
  node.setAttribute("fill", score===0 ? (TERR_TINT[SEG_TERR[segNo]]||"#f3f5f7") : SCORE_COLORS[score]);
  node.setAttribute("stroke-width", score>0?"2.5":"1.5");
  node.setAttribute("class","pmseg"+(score>0?" defect":""));
  markDirty();
}
function segDragEnd(){ if(!PAINTING)return; PAINTING=false; PAINT_LAST=null; PAINT_MOVED=false; segCommit(); }
if(typeof document!=="undefined"&&!window.__paintMoveWired){
  window.__paintMoveWired=true;
  /* the only source of truth for "the pointer moved" is a movement event */
  document.addEventListener("mousemove",function(){ if(PAINTING) PAINT_MOVED=true; },{passive:true});
  document.addEventListener("touchmove",function(){ if(PAINTING) PAINT_MOVED=true; },{passive:true});
}

function applyToSeg(which,data,segNo){
  if(which==="rest" && MAPMODE==="reversibility"){ cycleRev(segNo); return; }
  if(BRUSH_ARMED){ data[segNo]=BRUSH; BRUSH_ARMED=false; return; }
  /* A phone has no right-click, so the only way back down is round the top:
     0 -> 1 -> 2 -> 3 -> 4 -> 0. On a pointer, right-click still steps down. */
  data[segNo]=((data[segNo]||0)+1)%5;
}

/* One label per map, in the corner the diagram does not use. Written directly
   on mouseenter, so there is no delay: a tooltip that waits is useless when the
   cursor is moving from segment to segment. */
function setSegName(host,txt,terr){
  var el2=host&&host.querySelector(".seg-name");
  if(!el2) return;
  el2.textContent=txt||"";
  /* the name is said in the color of the vessel that feeds it */
  el2.style.color = txt ? (TERR_COLORS[terr]||"var(--accent)") : "";
}

function polarMap(which){ // which = 'stress' | 'rest'
  var data = which==="stress"?S.stress:S.rest;
  var size=300,cx=150,cy=150; // margin for the wall labels and the territory names
  var radii=[0,26,58,90,116];
  var svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 "+size+" "+size); svg.setAttribute("width","100%"); svg.setAttribute("height","100%");
  svg.style.maxWidth="260px";
  function polar(cxx,cyy,r,a){ return [cxx+r*Math.cos(a),cyy+r*Math.sin(a)]; }
  function fillFor(segNo){ var sc=data[segNo]||0; var terr=SEG_TERR[segNo];
    return sc===0 ? (TERR_TINT[terr]||"#f3f5f7") : SCORE_COLORS[sc]; }
  function addSeg(segNo,inner,outer,a0,a1){
    var terr=SEG_TERR[segNo]; var sc=data[segNo]||0;
    var p0=polar(cx,cy,inner,a0),p1=polar(cx,cy,outer,a0),p2=polar(cx,cy,outer,a1),p3=polar(cx,cy,inner,a1);
    var large=(a1-a0)>Math.PI?1:0;
    var d="M"+p0[0]+","+p0[1]+" L"+p1[0]+","+p1[1]+
           " A"+outer+","+outer+" 0 "+large+" 1 "+p2[0]+","+p2[1]+
           " L"+p3[0]+","+p3[1]+
           " A"+inner+","+inner+" 0 "+large+" 0 "+p0[0]+","+p0[1]+" Z";
    var p=document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d",d); p.setAttribute("class","pmseg"+(sc>0?" defect":""));
    p.setAttribute("fill",fillFor(segNo));
    /* Outlines are drawn once each, by the edge layer below, because an edge
       belongs to TWO segments and only the edge knows what it separates. */
    p.setAttribute("stroke","none");
    p.addEventListener("mousedown",function(e){ if(e.button!==0)return; e.preventDefault();
      PAINTING=true; PAINT_LAST=segNo; PAINT_MOVED=false;
      applyToSeg(which,data,segNo); segCommit(); });
    p.addEventListener("mouseenter",function(){ if(!PAINTING)return;
      /* Two conditions, both required: the pointer has moved since the press,
         and this is not the segment the drag is already on. */
      if(!PAINT_MOVED) return;
      if(PAINT_LAST===segNo) return;
      PAINT_LAST=segNo;
      var nv=((data[segNo]||0)+1)%5;
      if(data[segNo]===nv)return;
      data[segNo]=nv; segPaintLive(p,segNo,nv); });
    p.addEventListener("contextmenu",function(e){ e.preventDefault();
      if(which==="rest"&&MAPMODE==="reversibility"){ applyRev(segNo,"reversible"); }
      else data[segNo]=Math.max(0,(data[segNo]||0)-1);
      segCommit(); });
    /* The name is the only thing worth reading on hover — the score is already
       printed inside the segment and the territory is already its color. The
       SVG <title> is gone with the native tooltip that came with it; the
       accessible name stays on the element itself. */
    p.setAttribute("aria-label","Segment "+segNo+", "+SEG_NAME[segNo]+", "+terr);
    p.addEventListener("mouseenter",function(){ setSegName(wrap,SEG_NAME[segNo],terr); });
    p.addEventListener("touchstart",function(){ setSegName(wrap,SEG_NAME[segNo],terr); },{passive:true});
    svg.appendChild(p);
    var mid=(a0+a1)/2, rr=(inner+outer)/2, lp=polar(cx,cy,rr,mid);
    var tl=document.createElementNS("http://www.w3.org/2000/svg","text");
    tl.setAttribute("x",lp[0]);tl.setAttribute("y",lp[1]);tl.setAttribute("class","seglbl");
    tl.style.fill=SCORE_TXT[sc]||"#303437";   /* .seglbl sets fill in CSS, which beats the attribute */
    tl.textContent=segNo;svg.appendChild(tl);
  }
  var TOP=-Math.PI/2;
  var basalOrder=[1,2,3,4,5,6], midOrder=[7,8,9,10,11,12];
  var step6=Math.PI/3;
  for(var i=0;i<6;i++){
    var a0=TOP + step6/2 - i*step6, a1=a0-step6;
    addSeg(basalOrder[i], radii[3], radii[4], Math.min(a0,a1), Math.max(a0,a1));
    addSeg(midOrder[i],  radii[2], radii[3], Math.min(a0,a1), Math.max(a0,a1));
  }
  var apicalOrder=[13,14,15,16], step4=Math.PI/2;
  for(var j=0;j<4;j++){
    var b0=TOP + step4/2 - j*step4, b1=b0-step4;
    addSeg(apicalOrder[j], radii[1], radii[2], Math.min(b0,b1), Math.max(b0,b1));
  }
  var apex=document.createElementNS("http://www.w3.org/2000/svg","circle");
  apex.setAttribute("cx",cx);apex.setAttribute("cy",cy);apex.setAttribute("r",radii[1]);
  apex.setAttribute("class","pmseg"+((data[17]||0)>0?" defect":""));apex.setAttribute("fill",fillFor(17));
  apex.setAttribute("stroke","none");
  apex.addEventListener("mousedown",function(e){ if(e.button!==0)return; e.preventDefault();
    PAINTING=true; applyToSeg(which,data,17); segCommit(); });
  apex.addEventListener("mouseenter",function(){ if(!PAINTING)return;
    var nv2=((data[17]||0)+1)%5;
    if(data[17]===nv2)return;
    data[17]=nv2; segPaintLive(apex,17,nv2); });
  apex.addEventListener("contextmenu",function(e){ e.preventDefault();
    if(which==="rest"&&MAPMODE==="reversibility"){ applyRev(17,"reversible"); }
    else data[17]=Math.max(0,(data[17]||0)-1);
    segCommit(); });
  apex.setAttribute("aria-label","Segment 17, apex, LAD");
  apex.addEventListener("mouseenter",function(){ setSegName(wrap,SEG_NAME[17],SEG_TERR[17]); });
  apex.addEventListener("touchstart",function(){ setSegName(wrap,SEG_NAME[17],SEG_TERR[17]); },{passive:true});
  svg.appendChild(apex);
  var lt=document.createElementNS("http://www.w3.org/2000/svg","text");
  lt.setAttribute("x",cx);lt.setAttribute("y",cy);lt.setAttribute("class","seglbl");
  lt.style.fill=SCORE_TXT[data[17]||0]||"#303437";lt.textContent="17";svg.appendChild(lt);

  /* ---------- THE EDGE LAYER ----------
     Drawn after the wedges so it sits on top of the shading, and with
     pointer-events off so it never intercepts a click meant for a segment.

       both sides same territory  -> one hairline, faint: it divides segments,
                                     not territories, and should not compete
       sides differ               -> two strokes, each offset into its own side,
                                     so a boundary carries both colors
       one side only (outer rim)  -> that territory's color, full weight
     Offsets are perpendicular to the edge: +-delta along the radius for an arc,
     +-delta along the angular normal for a radial line. */
  var EDGE=document.createElementNS("http://www.w3.org/2000/svg","g");
  EDGE.setAttribute("class","pm-edges");
  var W_BOUND=1.3, W_RIM=1.7, W_INNER=0.5, INNER_OP=0.35;
  /* Half a stroke width, so the two halves of a boundary share an edge instead
     of leaving a gap between them: each is centered W_BOUND/2 from the true line,
     which puts their inner edges exactly on it. */
  var EDGE_D=W_BOUND/2;

  function stroke(d,color,width,opacity){
    var e=document.createElementNS("http://www.w3.org/2000/svg","path");
    e.setAttribute("d",d); e.setAttribute("fill","none");
    e.setAttribute("stroke",color); e.setAttribute("stroke-width",String(width));
    e.setAttribute("stroke-linecap","butt");
    if(opacity!=null) e.setAttribute("stroke-opacity",String(opacity));
    EDGE.appendChild(e);
  }
  /* An offset stroke no longer ends where the edge ends, so both ends are
     extended by the offset to close the corner against the edge it meets.
     Without this every junction shows a notch. */
  function arcD(r,a0,a1,ext){
    var e=(ext||0)/Math.max(r,1);
    var p0=polar(cx,cy,r,a0-e), p1=polar(cx,cy,r,a1+e);
    var large=((a1+e)-(a0-e))>Math.PI?1:0;
    return "M"+p0[0]+","+p0[1]+" A"+r+","+r+" 0 "+large+" 1 "+p1[0]+","+p1[1];
  }
  function radialD(a,r0,r1,off,ext){
    /* off shifts the line perpendicular to itself, i.e. along increasing angle */
    var nx=-Math.sin(a)*off, ny=Math.cos(a)*off, e=ext||0;
    var p0=polar(cx,cy,r0-e,a), p1=polar(cx,cy,r1+e,a);
    return "M"+(p0[0]+nx)+","+(p0[1]+ny)+" L"+(p1[0]+nx)+","+(p1[1]+ny);
  }
  /* inner = the segment on the smaller radius / the larger angle side */
  function arcEdge(r,a0,a1,segIn,segOut){
    var tIn=SEG_TERR[segIn], tOut=segOut?SEG_TERR[segOut]:null;
    if(!segOut){ stroke(arcD(r,a0,a1,0),TERR_COLORS[tIn]||"#9da6ad",W_RIM); return; }
    if(tIn===tOut){ stroke(arcD(r,a0,a1,0),TERR_COLORS[tIn]||"#9da6ad",W_INNER,INNER_OP); return; }
    stroke(arcD(r-EDGE_D,a0,a1,EDGE_D),TERR_COLORS[tIn]||"#9da6ad",W_BOUND);
    stroke(arcD(r+EDGE_D,a0,a1,EDGE_D),TERR_COLORS[tOut]||"#9da6ad",W_BOUND);
  }
  function radialEdge(ang,r0,r1,segHi,segLo){
    var tHi=SEG_TERR[segHi], tLo=SEG_TERR[segLo];
    if(tHi===tLo){ stroke(radialD(ang,r0,r1,0,0),TERR_COLORS[tHi]||"#9da6ad",W_INNER,INNER_OP); return; }
    stroke(radialD(ang,r0,r1, EDGE_D,EDGE_D),TERR_COLORS[tHi]||"#9da6ad",W_BOUND);
    stroke(radialD(ang,r0,r1,-EDGE_D,EDGE_D),TERR_COLORS[tLo]||"#9da6ad",W_BOUND);
  }

  /* boundary angles, and which segment sits on each side of them */
  var thetas=[], phis=[];
  for(var bi=0;bi<=6;bi++) thetas.push(TOP + step6/2 - bi*step6);
  for(var pj=0;pj<=4;pj++) phis.push(TOP + step4/2 - pj*step4);

  /* radial edges: 6 in the basal ring, 6 in the mid ring, 4 in the apical */
  for(var k=0;k<6;k++){
    var ang=thetas[k+1];                       /* between segment k and k+1 */
    var hi=basalOrder[k], lo=basalOrder[(k+1)%6];
    radialEdge(ang,radii[3],radii[4],hi,lo);
    radialEdge(ang,radii[2],radii[3],midOrder[k],midOrder[(k+1)%6]);

  for(var m=0;m<4;m++){
    radialEdge(phis[m+1],radii[1],radii[2],apicalOrder[m],apicalOrder[(m+1)%4]);
  }

  /* arc edges */
  for(var q=0;q<6;q++){
    var qa0=Math.min(thetas[q],thetas[q+1]), qa1=Math.max(thetas[q],thetas[q+1]);
    arcEdge(radii[4],qa0,qa1,basalOrder[q],null);          /* the rim */
    arcEdge(radii[3],qa0,qa1,midOrder[q],basalOrder[q]);   /* mid | basal */
  }
  for(var n2=0;n2<4;n2++){
    var na0=Math.min(phis[n2],phis[n2+1]), na1=Math.max(phis[n2],phis[n2+1]);
    arcEdge(radii[1],na0,na1,17,apicalOrder[n2]);          /* apex | apical */
  }
  /* the mid-to-apical arc: six wedges outside, four inside, so it is split at
     every breakpoint of BOTH rings and each piece asks its own two segments */
  (function(){
    /* Six wedges outside, four inside, and the two rings do not start at the
       same angle — so this arc is cut at the union of BOTH rings' breakpoints
       and every piece asks its own two segments what it separates.

       Doing this over a raw angle range silently dropped the piece that fell
       outside the basal ring's span: the short arc between 13 and 12. The work
       is done in a normalized 0..2pi space so the full circle is covered once,
       wrap included. */
    var TWO=Math.PI*2, base=thetas[0];
    function norm(x){ var v=(x-base)%TWO; if(v<0)v+=TWO; return v; }
    function inWedge(m,x0,x1){
      var n0=norm(x0), n1=norm(x1);
      if(n1<=n0+1e-9) return (m>=n0-1e-9)||(m<=n1+1e-9);   /* the wedge wraps */
      return m>n0-1e-9 && m<n1+1e-9;
    }
    var cuts=[0,TWO];
    thetas.concat(phis).forEach(function(t){ cuts.push(norm(t)); });
    cuts=cuts.sort(function(x,y){ return x-y; })
             .filter(function(v,i,arr){ return i===0||v-arr[i-1]>1e-6; });
    for(var i2=0;i2<cuts.length-1;i2++){
      var s0=cuts[i2], s1=cuts[i2+1];
      if(s1-s0<1e-6) continue;
      var mid=(s0+s1)/2, outer=null, inner=null;
      for(var g=0;g<6;g++){
        if(inWedge(mid, Math.min(thetas[g],thetas[g+1]), Math.max(thetas[g],thetas[g+1]))){ outer=midOrder[g]; break; }
      }
      for(var h=0;h<4;h++){
        if(inWedge(mid, Math.min(phis[h],phis[h+1]), Math.max(phis[h],phis[h+1]))){ inner=apicalOrder[h]; break; }
      }
      if(outer&&inner) arcEdge(radii[2], base+s0, base+s1, inner, outer);
    }
  })();
  svg.appendChild(EDGE);
  // directional labels (AHA orientation: anterior top, septal left, inferior bottom, lateral right)
  var dirs=[["ANTERIOR",cx,18],["INFERIOR",cx,size-8],["SEPTAL",16,cy],["LATERAL",size-30,cy]];
  dirs.forEach(function(dd){
    var tx=document.createElementNS("http://www.w3.org/2000/svg","text");
    tx.setAttribute("x",dd[1]);tx.setAttribute("y",dd[2]);tx.setAttribute("class","dirlbl");
    if(dd[0]==="SEPTAL")tx.setAttribute("transform","rotate(-90 "+dd[1]+" "+dd[2]+")");
    if(dd[0]==="LATERAL")tx.setAttribute("transform","rotate(90 "+dd[1]+" "+dd[2]+")");
    tx.textContent=dd[0];svg.appendChild(tx);
  });
  /* The territory names replace the raise-by-territory buttons: the map already
     carries the colors, and a label beside the region it names is read once
     instead of being hunted for in a row of buttons. Each sits outside its own
     territory — LAD upper-left, RCA lower-left, LCX to the right of LATERAL. */
  [["LAD",57,57,-45],["RCA",57,size-57,45],["LCX",size-12,cy,90]].forEach(function(tt){
    var tx=document.createElementNS("http://www.w3.org/2000/svg","text");
    tx.setAttribute("x",tt[1]); tx.setAttribute("y",tt[2]);
    tx.setAttribute("class","terrlbl"); tx.setAttribute("fill",TERR_COLORS[tt[0]]);
    tx.setAttribute("transform","rotate("+tt[3]+" "+tt[1]+" "+tt[2]+")");
    tx.textContent=tt[0]; svg.appendChild(tx);
  });
  var wrap=el("div",{class:"bull"},[]);
  wrap.appendChild(el("div",{class:"seg-name"},[]));
  wrap.appendChild(el("div",{class:"mapttl"},[which==="stress"?"Stress":"Rest"]));
  /* leaving the diagram clears it, so a stale name never sits over a map the
     cursor has left */
  svg.addEventListener("mouseleave",function(){ setSegName(wrap,""); });
  wrap.appendChild(svg);
  /* One quiet row: a labeled raise-by-territory group, and the map's own
     clear at the far end. The rest map also owns "Mirror to rest" — it acts
     on rest, so it sits under rest, not in a bar above both maps. */
  /* raise-by-territory removed in increment 56: the map names its territories
     now, and a bulk raise was a shortcut nobody could undo in one press */
  var ctl=el("div",{class:"mapctl"},[]);
  ctl.appendChild(el("button",{class:"btn sm quiet muted",title:"Zero this map.",onclick:function(){
    for(var s=1;s<=17;s++)data[s]=0; markDirty(); refreshMaps(); scheduleReport(); refreshReadout();
  }},["Clear"]));
  wrap.appendChild(ctl);
  return wrap;
}

/* live tally so the reader can see the study take shape without leaving the map */
/* Pre-test probability, presented like the SSS tile.
   Bands follow ESC 2019 chronic coronary syndromes, where the probability is
   used to decide whether to test at all: at or below 5% testing may be
   deferred, 5-15% is the band where testing is considered, and above 15%
   testing is recommended. The wording stays descriptive — the number is an
   estimate from a table, not a measurement of this patient. */
/* Ischemic burden as a percentage of the left ventricle, with the
   revascularization verdict beside it.

   The verdict is NOT computed here: RevascEngine already decides it, against
   the trials, and its own line respects the invariant that burden alone never
   asserts benefit. This surfaces that decision where the impression is written
   instead of leaving it two tabs away. */
function burdenVerdict(){
  if(!window.Comprehensive||!window.RevascEngine) return null;
  var A,r;
  try{ A=window.Comprehensive.assess(S); r=window.RevascEngine.assess(S,A); }catch(e){ return null; }
  var pct=A&&A.axes?A.axes.ischemicPct:null;
  if(pct==null) return null;
  var scar=A.axes.scarPct;
  var benefit=(r&&r.benefit)||"";
  /* the engine's ids are keys, not English */
  var WORD={likely:"Likely", unlikely:"Unlikely", "symptomatic-only":"Symptom relief only",
            uncertain:"Uncertain"};
  var tone = benefit==="likely" ? "good" : (benefit==="unlikely" ? "muted" : "warn");
  return el("div",{class:"burden-box"},[
    el("div",{class:"score-tally"},[
      el("div",{class:"tl-cell",title:"Percent of the left ventricle that is ischemic, from the summed difference score."},[
        el("div",{class:"tl-k"},["Ischemic burden"]),
        el("div",{class:"tl-v"},[pct+"%"]),
        el("div",{class:"tl-t"},["of the LV"])
      ]),
      (scar!=null?el("div",{class:"tl-cell",title:"Percent of the left ventricle that is scarred, from the summed rest score."},[
        el("div",{class:"tl-k"},["Scar"]),
        el("div",{class:"tl-v"},[scar+"%"]),
        el("div",{class:"tl-t"},["of the LV"])
      ]):null),
    ]),
    /* the verdict is a sentence, so it gets a row rather than a column */
    el("div",{class:"verdict-cell "+tone,title:r&&r.basis?r.basis:""},[
      el("span",{class:"tl-k"},["Revascularization benefit"]),
      el("span",{class:"tl-word"},[WORD[benefit]||benefit||"\u2014"]),
      el("span",{class:"vd-line"},[r&&r.line?r.line:""])
    ])
  ]);
}

function ptpBand(v){
  if(v==null) return "";
  if(v<=5)  return "very low";
  if(v<=15) return "low";
  if(v<=50) return "intermediate";
  return "high";
}
function ptpTile(){
  var derived=ptpFromTable();
  var shown=(S.bayes&&S.bayes.ptpOverride) ? String(S.bayes.ptpOverride).trim() : derived;
  var n=num(shown);
  var basis = (S.bayes&&S.bayes.ptpOverride) ? "entered by the reader"
            : (derived ? "from the age, sex and symptom character (ESC 2019 table)"
                       : "needs age, sex and a symptom character");
  var tile=el("div",{class:"score-tally ptp-tally"},[
    el("div",{class:"tl-cell",title:"Pre-test probability of obstructive coronary disease \u2014 "+basis},[
      el("div",{class:"tl-k"},["Pre-test probability"]),
      el("div",{class:"tl-v"},[n==null?"\u2014":(n+"%")]),
      el("div",{class:"tl-t"},[n==null?"not yet derivable":ptpBand(n)])
    ])
  ]);
  /* No override. The number is a table lookup from age, sex and symptom
     character; disagreeing with it means changing one of those three, which is
     a field away and leaves the read-out honest about where the figure came
     from. An override box invited a number with no basis behind it. */
  return el("div",{class:"ptp-row"},[ tile ]);
}

function scoringTally(){
  var sss=0,srs=0,n=0;
  for(var i=1;i<=17;i++){ var a=+(S.stress[i]||0), b=+(S.rest[i]||0); sss+=a; srs+=b; if(a>0)n++; }
  var sds=sss-srs;
  function cell(k,v,t){ return el("div",{class:"tl-cell"},[el("div",{class:"tl-k"},[k]),
    el("div",{class:"tl-v"},[String(v)]),t?el("div",{class:"tl-t"},[t]):null]); }
  var band = sss<4?"normal":(sss<=8?"mildly abnormal":(sss<=13?"moderately abnormal":"severely abnormal"));
  return el("div",{class:"score-tally"},[
    cell("SSS",sss,band), cell("SRS",srs,null), cell("SDS",sds,sds>=2?"reversible":"no reversibility"),
    cell("Abnormal segments",n+" / 17",null)
  ]);
}

/* Units belong beside the field, never inside it. Shared by height/weight and
   by any value stored with its unit. */
function withUnit(inp,unit){
  return el("div",{class:"unit-wrap"},[inp,el("span",{class:"unit-suffix"},[unit])]);
}
/* value + unit stored as one string, shown as a number with the unit beside it */
function splitUnit(v,fallback){
  var m=String(v==null?"":v).trim().match(/^([0-9.]+)\s*(.*)$/);
  if(!m) return {n:"", u:fallback};
  return {n:m[1], u:(m[2]||fallback)};
}
function unitField(path,fallback){
  var cur=splitUnit(getPath(path),fallback);
  var inp=el("input",{type:"text",inputmode:"decimal",value:cur.n,
    oninput:function(e){
      var n=e.target.value.replace(/[^0-9.]/g,"");
      setPath(path, n? (n+" "+cur.u) : "");
      clearProv(path); scheduleReport(); refreshReadout();
    }});
  if(getProv(path)) inp.className="prov";
  return withUnit(inp, cur.u);
}

function correlChips(){
  var wrap=el("div",null,[]);
  wrap.appendChild(chipDeck("correl",Object.keys(CORREL),
    function(k){ return (S.correlation||[]).some(function(c){return c.mod===k;}); },
    function(k){
    var on=(S.correlation||[]).some(function(c){return c.mod===k;});
    return chip(CORREL[k],on,function(){
      S.correlation=S.correlation||[];
      if(on)S.correlation=S.correlation.filter(function(c){return c.mod!==k;});
      else S.correlation.push({mod:k,date:"",outside:false,echoType:"tte",echoFindings:{},otherName:""});
      markDirty(); renderWorksheet(); scheduleReport(); refreshReadout();
    });
  }));

  // per-selected-study detail rows (date + echo specifics)
  (S.correlation||[]).forEach(function(c){
    var idx=S.correlation.indexOf(c);
    var rows=[ field(CORREL[c.mod]+" date", dateInputObj(c,"date"), "w-date") ];
    if(c.mod==="echo"){
      rows.push(field("Echo type", segControlObj(c,"echoType",[["tte","TTE"],["tee","TEE"]]), "w-echo"));
    }
    if(c.mod==="other"){
      rows.push(field("Study name", textInputObj(c,"otherName"), "w-dx"));
    }
    var detail=el("div",{class:"correl-detail"},[ el("div",{class:"grid-auto"},rows) ]);
    /* Every non-echo modality gets the same deck the echo has: the few findings
       it is usually asked about, and the rest behind "+N more". Recorded
       findings reach the read-out, so a positive prior is spoken. */
    var CF=CORREL_FINDINGS[c.mod];
    if(CF){
      c.findings = c.findings || {};
      detail.appendChild(chipDeck("corr-"+c.mod, Object.keys(CF),
        function(k){ return !!c.findings[k]; },
        function(k){
          return chip(CF[k], !!c.findings[k], function(){
            if(c.findings[k]) delete c.findings[k]; else c.findings[k]=true;
            markDirty(); renderWorksheet(); scheduleReport(); refreshReadout();
          });
        }));
    }
    if(c.mod==="echo"){
      /* Order by what this modality actually answers well. Findings the other
         modality owns are still offered — an unusual study may have reported
         one — but are visually secondary and say so on hover. */
      var mode=(c.echoType==="tee")?"tee":"tte";
      var other=(mode==="tee")?"tte":"tee";
      /* This modality's findings first, then the shared ones, then the other
         modality's — so the deck's tail is exactly what this study would not
         normally report. */
      var keys=Object.keys(ECHO_FINDINGS).sort(function(x,y){
        var rank=function(k){ var o=ECHO_ONLY[k]; return o===mode?0:(o?2:1); };
        return rank(x)-rank(y);
      });
      var offCount=keys.filter(function(k){ return ECHO_ONLY[k]===other; }).length;
      var deck=chipDeck("echo-"+mode, keys,
        function(f){ return !!(c.echoFindings&&c.echoFindings[f]); },
        function(f){
          var on=c.echoFindings&&c.echoFindings[f];
          var owner=ECHO_ONLY[f];
          var ch=chip(ECHO_FINDINGS[f],!!on,function(){ c.echoFindings=c.echoFindings||{}; if(on)delete c.echoFindings[f]; else c.echoFindings[f]=true; markDirty(); renderWorksheet(); scheduleReport(); refreshReadout(); });
          if(owner&&owner!==mode){ ch.className+=" sub"; ch.setAttribute("title",ECHO_NOTE[owner]); }
          else if(owner) ch.setAttribute("title",ECHO_NOTE[owner]);
          return ch;
        },
        {moreTip:"The remaining findings, including the "+other.toUpperCase()+" ones this study would not normally report"});
      deck.style.marginTop="var(--sp-1)";
      detail.appendChild(deck);
      /* the deck's own "+N more" already says there is more; naming the
         modality's job was explaining the obvious */
      if(offCount) detail.appendChild(el("div",{class:"hint"},[
        other.toUpperCase()+" findings are behind the toggle, shown dashed."]));
    }
    wrap.appendChild(detail);
  });
  return wrap;
}

        }
